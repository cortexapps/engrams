# TS codegen for the application and dedicated internal MCP control contracts.
# host_service.proto remains coordinator-to-host transport, generated by tonic.
# Input paths are cwd-relative and include the input-directory prefix (buf v2).
version: v2
# Wipe the `out` dirs before generating so deleted/renamed protos don't
# leave stale bindings behind for the drift check to miss.
clean: true
inputs:
  - directory: crates/engram-protocol/proto
    paths:
      - crates/engram-protocol/proto/engram/app
      - crates/engram-protocol/proto/engram/mcp # Dedicated internal mTLS control
# Asymmetry is deliberate: query-es (TanStack Query hooks) is web-only —
# the orchestrator is a server and needs plain messages/clients only.
plugins:
  - remote: buf.build/bufbuild/es:v2.2.5
    out: web/src/gen
    opt: target=ts
  - remote: buf.build/bufbuild/es:v2.2.5
    out: orchestrator/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/query-es:v2.1.0
    out: web/src/gen
    opt: target=ts
