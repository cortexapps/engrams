name: Bake Claude harness pack

# Builds the `claude` harness pack (engram-harness-claude binary +
# the matching bundled Claude Code CLI) and pushes it to
# `ghcr.io/cortexapps/engrams/harness-claude` as a chunked OCI
# artifact. Mirrors `just bake-harness claude` locally, with two
# differences: targets only `x86_64-unknown-linux-musl` (FC guests;
# arm64 covered by the local Mac flow), and pushes to GHCR with
# auth from `docker/login-action`.
#
# Only the `claude` harness is published from CI — the `noop`
# harness exists for tests and dev smoke; operators don't need it
# in a registry.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/engram-harness-claude/**'
      - 'crates/engram-harness-proto/**'
      - 'crates/engram-oci/**'
      - 'crates/engram-cli/**'
      - '.github/workflows/bake-harness-claude.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override ref to build (defaults to the dispatching ref).'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: bake-harness-claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # ADR 0013: engram-protocol/build.rs needs protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build engram-harness-claude (musl) + engram-cli (host)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p engram-harness-claude
          cargo build --release -p engram-cli

      # The Claude harness bundles Anthropic's `claude` CLI alongside
      # the engram-harness-claude binary. `just bake-harness claude`
      # downloads the matching version from
      # `downloads.claude.ai/claude-code-releases`; we mirror that.
      - name: Download Claude Code CLI (Linux x64)
        id: claude_cli
        run: |
          CLAUDE_VERSION=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          curl -fsSL --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude" \
            -o /tmp/claude
          chmod +x /tmp/claude
          /tmp/claude --version || true
          echo "version=$CLAUDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage harness pack contents
        id: stage
        run: |
          STAGE=$(mktemp -d)
          cp -p target/x86_64-unknown-linux-musl/release/engram-harness-claude "$STAGE/harness"
          cp -p /tmp/claude "$STAGE/claude"
          ls -la "$STAGE"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          SHA: ${{ github.sha }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/harness-claude"
          SHORT="${SHA:0:7}"
          # engram-cli harness push pushes to a single URI per call,
          # so we push once at the SHA tag and then alias `:latest`
          # and `:main` (on push to main) via a docker pull/tag/push
          # afterwards. The chunked manifest is identical; only the
          # tag references change.
          echo "primary=$BASE:$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$BASE:$SHORT" >> "$GITHUB_OUTPUT"
          {
            echo "extra_tags<<EOF"
            echo "$BASE:$SHORT"
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "$BASE:main"
              echo "$BASE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push harness pack to GHCR
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          # DockerConfigResolver picks up the creds docker/login-action
          # wrote into ~/.docker/config.json.
          ./target/release/engram-cli harness push \
            --from "$STAGE" \
            --to "$PRIMARY"

      - name: Mirror primary tag to alias tags
        if: steps.tags.outputs.extra_tags != ''
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
          EXTRA_TAGS: ${{ steps.tags.outputs.extra_tags }}
        run: |
          # crane is the cleanest tool for cross-tag aliasing without
          # pulling layers locally. `docker pull && tag && push`
          # would also work but transfers chunks unnecessarily.
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin crane
          crane auth login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Mirroring $PRIMARY -> $tag"
            crane copy "$PRIMARY" "$tag"
          done <<< "$EXTRA_TAGS"
