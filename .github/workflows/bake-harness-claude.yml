name: Bake Claude harness pack

# ADR 0021: this workflow publishes the *built-in claude harness
# artifact* the image baker pulls during `engram image build` when an
# image's `engram.toml` carries `[harness] builtin = "claude"`. The
# artifact is a single-layer OCI blob — its layer is the contents of
# `/opt/engram/harness/` (binary + bundled `claude` CLI +
# `artifact.toml` descriptor) — that the baker extracts directly into
# the image's rootfs. There is no host-side "harness pack" anymore.
#
# Versioning model: one explicit tag per (version, platform), no
# rolling aliases. Authors pin `version = "..."` in `engram.toml`;
# the baker records the resolved sha256 digest in `manifest.toml`,
# so a bake is reproducible even if the tag itself ever mutates.
#
# Today: x86_64-linux only (FC guests). arm64 lands once we publish
# those tags + extend `engram_image_builder::harness::Platform`.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/engram-harness-claude/**'
      - 'crates/engram-harness-proto/**'
      - 'crates/engram-oci/**'
      - 'crates/engram-cli/**'
      - '.github/workflows/bake-harness-claude.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override ref to build (defaults to the dispatching ref).'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: bake-harness-claude-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the published artifact version. Bump
  # when shipping a new built-in claude harness build. Image authors
  # must update `[harness] version = "..."` in `engram.toml` to
  # match (the baker enforces the pin).
  HARNESS_VERSION: v0.1.0
  HARNESS_PLATFORM: linux-x86_64

jobs:
  bake:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # ADR 0013: engram-protocol/build.rs needs protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build engram-harness-claude (musl) + engram-publish-builtin-harness (host)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p engram-harness-claude
          cargo build --release -p engram-publish-builtin-harness

      - name: Download Claude Code CLI (Linux x64)
        id: claude_cli
        run: |
          CLAUDE_VERSION=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          curl -fsSL --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude" \
            -o /tmp/claude
          chmod +x /tmp/claude
          /tmp/claude --version || true
          echo "version=$CLAUDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage built-in harness artifact contents
        id: stage
        env:
          HARNESS_VERSION: ${{ env.HARNESS_VERSION }}
          CLAUDE_VERSION: ${{ steps.claude_cli.outputs.version }}
        run: |
          # The staged directory IS the contents of /opt/engram/harness/
          # the baker will extract on the image side: the entry-point
          # binary at `harness`, the bundled `claude` CLI alongside,
          # and an `artifact.toml` descriptor the baker reads to fill
          # the rendered HarnessManifest. No nested directories — the
          # tarball extracts straight into the rootfs subdir.
          STAGE=$(mktemp -d)
          cp -p target/x86_64-unknown-linux-musl/release/engram-harness-claude "$STAGE/harness"
          cp -p /tmp/claude "$STAGE/claude"
          cat > "$STAGE/artifact.toml" <<EOF
          name = "claude"
          version = "${HARNESS_VERSION}"
          entry = "harness"
          description = "Anthropic Claude Code, bundled with engram-harness-claude ${HARNESS_VERSION}. Built on top of claude CLI ${CLAUDE_VERSION}."
          EOF
          ls -la "$STAGE"
          echo "--- artifact.toml ---"
          cat "$STAGE/artifact.toml"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push built-in harness artifact to GHCR
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          TAG: ghcr.io/${{ github.repository }}/harness-claude:${{ env.HARNESS_VERSION }}-${{ env.HARNESS_PLATFORM }}
        run: |
          # ADR 0021 P1.7: `engram-publish-builtin-harness` is the
          # CI-only replacement for the retired `engram-cli harness
          # push` subcommand. Both call the same underlying
          # `engram_oci::OciClient::push_harness` primitive, so the
          # wire shape (one tar.gz layer at our media type) is
          # identical — only the front-end retires.
          #
          # Tag shape is the catalog's expected format:
          # `<repo>:<version>-<platform-suffix>`. No `:latest` /
          # `:main` / SHA aliases — the ADR's reproducibility rule
          # is "one explicit version, baker records the digest."
          ./target/release/engram-publish-builtin-harness \
            --from "$STAGE" \
            --to "$TAG"
          echo "Published $TAG"
