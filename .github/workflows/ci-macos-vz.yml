name: CI (macOS arm64 / VZ)

# macOS / Apple-Silicon coverage. Two jobs:
#
#   - vz: codesigns the engram-sandbox-vz test binaries with the
#     com.apple.security.virtualization entitlement and runs the
#     crate's tests, including the `#[ignore]`'d live smoke that
#     exercises VZVirtualMachineConfiguration validation against a
#     real Kata kernel. Catches regressions in:
#       - the objc2 / objc2-virtualization bindings
#       - the dispatch + Sendable plumbing in vm.rs
#       - the vsock UDS bridge structure (path helpers, error mapping)
#       - the codesign script + entitlement file
#
#   - test-macos: runs the cross-platform Rust workspace tests on
#     macOS arm64 (excluding engram-sandbox-vz, which `vz` covers
#     under codesigning). Catches regressions in workspace crates
#     that compile differently on macOS (e.g. tokio-vsock /
#     userfaultfd are Linux-only target deps; the rest needs to
#     stay portable).
#
# What this workflow does NOT yet exercise:
#   - actual VZ boot (`start()` on a built VM). Requires a rootfs
#     baked for arm64-virtio + a vsock-capable kernel. The smoke
#     test only goes through `validateWithError:`.
#
# Linux/FC remains the canonical production gate; this workflow
# protects the macOS dev-loop surface.
#
# Both jobs run on Blacksmith's Apple Silicon M4 runners (see
# https://docs.blacksmith.sh/blacksmith-runners/overview) — faster
# than the GitHub-hosted `macos-15` SKU and lets us run the workspace
# tests on macOS without bleeding minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# See ci.yml for rationale (cancel PR-only, keep main runs serial).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

jobs:
  vz:
    name: engram-sandbox-vz unit tests
    runs-on: blacksmith-6vcpu-macos-15  # arm64, has Xcode CLT pre-installed
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install entitlements (verify file is well-formed plist)
        run: plutil -lint crates/engram-sandbox-vz/entitlements.plist

      - name: Build coord + sandbox-vz tests
        # `cargo build --tests` produces the test binaries under
        # target/debug/deps/ that vz-codesign signs.
        run: cargo build -p engram-coordinator -p engram-sandbox-vz --tests

      - name: Codesign with virtualization entitlement
        run: bash crates/engram-sandbox-vz/scripts/codesign.sh debug

      # `if: always()` from this point on so a failure in one VZ-test
      # step doesn't hide failures in the steps that follow — same
      # pattern as the `lint` and `test-linux` jobs in ci.yml.
      - name: Run engram-sandbox-vz unit tests (default)
        if: always()
        # Default test set runs without any external artifacts — the
        # smoke test in vm.rs uses tempfiles and exercises VZ
        # config-build through validateWithError; other tests are
        # pure-Rust unit tests.
        run: cargo nextest run -p engram-sandbox-vz --no-fail-fast

      # Pull the Kata Containers arm64 kernel into the cache path
      # the `#[ignore]`'d live smoke reads (`ENGRAM_VZ_KERNEL_PATH`,
      # default `~/.cache/engram-vz-test/vmlinux-arm64`). Same script
      # `just vz-pull-kernel` invokes locally — pinned URL, ~290 MB
      # tarball, ~25 MB extracted kernel.
      - name: Pull VZ kernel (Kata arm64)
        if: always()
        run: bash crates/engram-sandbox-vz/scripts/pull-kernel.sh

      # The live smoke also wants `/tmp/engram-vz-rootfs.ext4` on
      # disk. We don't boot the VM — `validateWithError:` only
      # records the URL — so an empty file at the expected path is
      # enough to clear the file-existence guard. The test accepts
      # both Ok and ConfigInvalid, so a degenerate rootfs is fine.
      - name: Stage rootfs placeholder
        if: always()
        run: touch /tmp/engram-vz-rootfs.ext4

      - name: Run live VZ smoke (--ignored)
        if: always()
        # Reuses the codesigned test binaries cargo built earlier;
        # nextest is idempotent against the cached build artifacts.
        run: cargo nextest run -p engram-sandbox-vz --run-ignored ignored-only --no-fail-fast

      - name: Workspace check (catches downstream-of-VZ regressions)
        if: always()
        # cargo check on the rest of the workspace ensures the
        # `--sandbox-backend=vz` wiring in engram-coordinator stays
        # green.
        run: cargo check --workspace --all-targets

  test-macos:
    name: workspace tests (macOS arm64, excl. sandbox-vz)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Run the same default test set as Linux, minus engram-sandbox-vz
      # (the `vz` job above runs that crate codesigned). This catches
      # macOS-only regressions in cross-platform crates — places where
      # tokio-vsock / userfaultfd platform-gated deps would otherwise
      # surprise us in production on macOS dev loops.
      # `--no-fail-fast` + `if: always()` so we see every failing test
      # in one CI run rather than stopping at the first.
      - name: cargo nextest run --workspace --exclude engram-sandbox-vz
        if: always()
        run: cargo nextest run --workspace --exclude engram-sandbox-vz --no-fail-fast

      - name: cargo test --workspace --exclude engram-sandbox-vz --doc
        if: always()
        run: cargo test --workspace --exclude engram-sandbox-vz --doc --no-fail-fast
