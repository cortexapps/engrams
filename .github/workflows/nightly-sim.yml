# Nightly long-run simulation swarm (ADR 0098 D7 follow-up).
#
# The PR lane (ci.yml `test-sim`) runs a fixed window — seeds 0..200 chaos +
# 0..100 calm at 1500 steps — so every PR replays the same territory. This
# workflow is the exploration arm: each night it runs ~10x the PR-lane volume
# at deeper horizons over a *fresh* date-derived seed window, so rare
# interleavings (long recovery ladders, multi-fault pileups, quiescence
# stragglers) keep getting new dice.
#
# On failure the sim binary prints the violated invariant, the trace tail, and
# a ready-to-run replay command (`just sim SEED=<n> STEPS=<s> PROFILE=<p>`) —
# reproduce locally from the job log, fix, then pin the seed in
# crates/engram-dst/tests/regression_seeds.rs (the ADR 0098 rule: every fixed
# failure becomes a pinned regression).
#
# The `host-swarm` job is the same exploration arm for the HOST-INTERNAL
# simulator (ADR 0098 P9, engram-dst-host / ci.yml `test-host-sim`): fresh
# date-derived windows at deep horizons, failures pinned into
# crates/engram-dst-host/tests/regression_seeds.rs via `just sim-host <n>`.
#
# Not a PR check: this never appears in ci.yml's `CI Gate` and must never be
# made a required status (AGENTS.md — only the gate aggregator is required).

name: Nightly sim swarm

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC, after the US-evening merge tail
  workflow_dispatch: {} # explicit admin trigger for ad-hoc long runs

permissions:
  contents: read
  issues: write # failure auto-filing (the step below)

concurrency:
  group: nightly-sim
  cancel-in-progress: false

jobs:
  swarm:
    name: nightly swarm (engram-dst, deep horizon)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Same key as ci.yml's test-sim lane so the nightly reuses the PR
          # lane's release build cache instead of maintaining its own.
          shared-key: workspace-release-sim
      - name: Pick tonight's seed window
        id: seeds
        # Day-derived, non-overlapping windows: each day advances the base by
        # 1600 seeds (1200 chaos + 400 calm), so no night ever replays a prior
        # night's seeds and the two profiles never overlap. The window is a
        # pure function of the UTC date — logged here so any failure is
        # reproducible even without the job's env.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          base=$(( day * 1600 ))
          chaos_start=$base
          chaos_end=$(( base + 1200 ))
          calm_start=$chaos_end
          calm_end=$(( base + 1600 ))
          echo "chaos=${chaos_start}..${chaos_end}" >> "$GITHUB_OUTPUT"
          echo "calm=${calm_start}..${calm_end}" >> "$GITHUB_OUTPUT"
          echo "UTC day ${day}: chaos seeds ${chaos_start}..${chaos_end}, calm seeds ${calm_start}..${calm_end}, 5000 steps"
      - name: chaos swarm (1200 seeds x 5000 steps)
        run: cargo run -p engram-dst --release --bin sim -- --seeds ${{ steps.seeds.outputs.chaos }} --steps 5000 --profile chaos --failure-report "$RUNNER_TEMP/chaos-report.md"
      - name: calm swarm (400 seeds x 5000 steps)
        # always() (minus cancellation): a chaos failure shouldn't hide
        # whatever the calm window would have found the same night.
        if: ${{ !cancelled() }}
        run: cargo run -p engram-dst --release --bin sim -- --seeds ${{ steps.seeds.outputs.calm }} --steps 5000 --profile calm --failure-report "$RUNNER_TEMP/calm-report.md"
      - name: File a failure issue with repro steps
        # Turns the sim's --failure-report artifact (violation, pinned
        # replay command, trace tail per failed seed) into a GitHub
        # issue. Dedup: one open issue per invariant slug — repeat
        # failures of the same invariant become comments on it, so a
        # recurring bug accumulates seeds instead of spamming issues.
        # A job failure WITHOUT a report file is an infra error (build
        # break, runner death, or timeout), so file or update a dedicated
        # deduplicated issue rather than treating it as a sim invariant.
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports=""
          for f in "$RUNNER_TEMP/chaos-report.md" "$RUNNER_TEMP/calm-report.md"; do
            if [ -s "$f" ]; then
              reports="${reports}$(cat "$f")"$'\n'
            fi
          done
          if [ -z "$reports" ]; then
            title="nightly sim: infra failure (no failure report)"
            body=$(printf '%s\n\n**Run:** %s\n**Commit:** `%s`\n' \
              "The nightly job failed without producing a failure report, so this is an infra error — build break, runner death, or timeout — not a sim invariant." \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "${GITHUB_SHA}")
            existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "commenting on existing issue #$existing"
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label sim-failure --body "$body"
            fi
            exit 0
          fi
          slug=$(printf '%s' "$reports" | sed -n 's/^<!-- sim-failure-slug: \(.*\) -->$/\1/p' | head -1)
          slug=${slug:-invariant-violation}
          title="nightly sim: \`${slug}\` violated"
          body=$(printf '%s\n\n%s\n\n---\n_Run: %s • commit %s • fix flow: replay locally at this commit, fix, then pin the seed in `crates/engram-dst/tests/regression_seeds.rs` (ADR 0098)._\n' \
            "**Commit:** \`${GITHUB_SHA}\` — replay commands below assume \`git checkout ${GITHUB_SHA}\`." \
            "$reports" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${GITHUB_SHA}")
          existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "commenting on existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label sim-failure --body "$body"
          fi

  host-swarm:
    name: nightly host swarm (engram-dst-host, deep horizon)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Same key as ci.yml's test-host-sim lane — reuse its release cache.
          shared-key: workspace-release-host-sim
      - name: Pick tonight's seed window
        id: seeds
        # Day-derived, non-overlapping windows (the same discipline as the
        # coordinator swarm above; the two sims' seed spaces are independent,
        # so sharing the day formula is fine). 480 seeds/night: 360 chaos +
        # 120 calm at 4000 steps — the host sim's steps run real tempdir fs +
        # chunk-store I/O, so the nightly volume sits below the coordinator
        # sim's at a comparable wall budget.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          base=$(( day * 480 ))
          chaos_start=$base
          chaos_end=$(( base + 360 ))
          calm_start=$chaos_end
          calm_end=$(( base + 480 ))
          echo "chaos=${chaos_start}..${chaos_end}" >> "$GITHUB_OUTPUT"
          echo "calm=${calm_start}..${calm_end}" >> "$GITHUB_OUTPUT"
          echo "UTC day ${day}: host chaos seeds ${chaos_start}..${chaos_end}, calm seeds ${calm_start}..${calm_end}, 4000 steps"
      - name: chaos swarm (360 seeds x 4000 steps)
        run: cargo run -p engram-dst-host --release --bin sim-host -- --seeds ${{ steps.seeds.outputs.chaos }} --steps 4000 --profile chaos --failure-report "$RUNNER_TEMP/host-chaos-report.md"
      - name: calm swarm (120 seeds x 4000 steps)
        if: ${{ !cancelled() }}
        run: cargo run -p engram-dst-host --release --bin sim-host -- --seeds ${{ steps.seeds.outputs.calm }} --steps 4000 --profile calm --failure-report "$RUNNER_TEMP/host-calm-report.md"
      - name: File a failure issue with repro steps
        # Same dedup discipline as the coordinator swarm: one open issue per
        # invariant slug, repeats accumulate as comments. The title prefix
        # keeps host-sim slugs from colliding with same-named coordinator
        # invariants. A failure without a report is filed or updated as a
        # dedicated infra-error issue instead.
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports=""
          for f in "$RUNNER_TEMP/host-chaos-report.md" "$RUNNER_TEMP/host-calm-report.md"; do
            if [ -s "$f" ]; then
              reports="${reports}$(cat "$f")"$'\n'
            fi
          done
          if [ -z "$reports" ]; then
            title="nightly host sim: infra failure (no failure report)"
            body=$(printf '%s\n\n**Run:** %s\n**Commit:** `%s`\n' \
              "The nightly job failed without producing a failure report, so this is an infra error — build break, runner death, or timeout — not a sim invariant." \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "${GITHUB_SHA}")
            existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "commenting on existing issue #$existing"
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label sim-failure --body "$body"
            fi
            exit 0
          fi
          slug=$(printf '%s' "$reports" | sed -n 's/^<!-- sim-failure-slug: \(.*\) -->$/\1/p' | head -1)
          slug=${slug:-invariant-violation}
          title="nightly host sim: \`${slug}\` violated"
          body=$(printf '%s\n\n%s\n\n---\n_Run: %s • commit %s • fix flow: replay locally at this commit (`just sim-host <seed> <steps> <profile>`), fix, then pin the seed in `crates/engram-dst-host/tests/regression_seeds.rs` (ADR 0098)._\n' \
            "**Commit:** \`${GITHUB_SHA}\` — replay commands below assume \`git checkout ${GITHUB_SHA}\`." \
            "$reports" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${GITHUB_SHA}")
          existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "commenting on existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label sim-failure --body "$body"
          fi

  cosim-swarm:
    name: nightly boundary swarm (engram-dst-cosim, deep horizon)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-release-cosim
      - name: Pick tonight's seed window
        id: seeds
        # Day-derived, non-overlapping windows (the same discipline as the two
        # swarms above; the three sims' seed spaces are independent, so sharing
        # the day formula is fine). 280 seeds/night: 200 chaos + 80 calm at 1500
        # steps — sized BELOW the host swarm's 480-seed volume (the co-sim runs
        # BOTH the coordinator and the host per step, a heavier per-step cost),
        # at a comparable wall budget.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          base=$(( day * 280 ))
          chaos_start=$base
          chaos_end=$(( base + 200 ))
          calm_start=$chaos_end
          calm_end=$(( base + 280 ))
          echo "chaos=${chaos_start}..${chaos_end}" >> "$GITHUB_OUTPUT"
          echo "calm=${calm_start}..${calm_end}" >> "$GITHUB_OUTPUT"
          echo "UTC day ${day}: cosim chaos seeds ${chaos_start}..${chaos_end}, calm seeds ${calm_start}..${calm_end}, 1500 steps"
      - name: chaos swarm (200 seeds x 1500 steps)
        run: cargo run -p engram-dst-cosim --release --bin sim-cosim -- --seeds ${{ steps.seeds.outputs.chaos }} --steps 1500 --profile chaos --failure-report "$RUNNER_TEMP/cosim-chaos-report.md"
      - name: calm swarm (80 seeds x 1500 steps)
        if: ${{ !cancelled() }}
        run: cargo run -p engram-dst-cosim --release --bin sim-cosim -- --seeds ${{ steps.seeds.outputs.calm }} --steps 1500 --profile calm --failure-report "$RUNNER_TEMP/cosim-calm-report.md"
      - name: File a failure issue with repro steps
        # Same dedup discipline as the sibling swarms: one open issue per oracle
        # slug, repeats accumulate as comments. The "nightly cosim:" title prefix
        # keeps boundary-swarm slugs from colliding with same-named coordinator/
        # host invariants. A failure without a report is filed as a dedicated
        # infra-error issue instead.
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports=""
          for f in "$RUNNER_TEMP/cosim-chaos-report.md" "$RUNNER_TEMP/cosim-calm-report.md"; do
            if [ -s "$f" ]; then
              reports="${reports}$(cat "$f")"$'\n'
            fi
          done
          if [ -z "$reports" ]; then
            title="nightly cosim: infra failure (no failure report)"
            body=$(printf '%s\n\n**Run:** %s\n**Commit:** `%s`\n' \
              "The nightly job failed without producing a failure report, so this is an infra error — build break, runner death, or timeout — not an oracle violation." \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "${GITHUB_SHA}")
            existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "commenting on existing issue #$existing"
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label sim-failure --body "$body"
            fi
            exit 0
          fi
          slug=$(printf '%s' "$reports" | sed -n 's/^<!-- sim-failure-slug: \(.*\) -->$/\1/p' | head -1)
          slug=${slug:-oracle-violation}
          title="nightly cosim: \`${slug}\` violated"
          body=$(printf '%s\n\n%s\n\n---\n_Run: %s • commit %s • fix flow: replay locally at this commit (the printed `sim-cosim` replay line), fix, then pin the seed in a crates/engram-dst-cosim/tests regression (ADR 0098)._\n' \
            "**Commit:** \`${GITHUB_SHA}\` — replay commands below assume \`git checkout ${GITHUB_SHA}\`." \
            "$reports" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${GITHUB_SHA}")
          existing=$(gh issue list --state open --label sim-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "commenting on existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label sim-failure --body "$body"
          fi
