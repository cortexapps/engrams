name: Bake dev image (reusable)

# Reusable workflow: bake a project's engrams dev image and push it to GHCR.
#
# A consuming repo (e.g. cortexapps/engineering-blog) calls this with its image
# source path + target GHCR repo. It pulls the golden engram-cli + engram-agentd
# from THIS repo's `cli-tools` GHCR artifact (publish-cli-tools in
# bake-images.yml), then runs `engram-cli image build --inject-agent ... --push`.
# No Rust toolchain and no engrams source checkout — the binaries are pre-built,
# CI-tested, and version-matched to the deployed coordinator at the `main` tag
# (same contract the FC-host bakes get from host-binaries:main).
#
# Caller requirements:
#   - secrets.GH_TOKEN: a token with GHCR READ on ghcr.io/cortexapps/engrams/*
#     (cli-tools + the built-in harness, both private) and GHCR WRITE on the
#     target image namespace. With golden binaries it needs NO private-source
#     repo read.
#   - org Actions access on cortexapps/engrams so a private-repo caller can
#     `uses:` this workflow (automatic once engrams is public).

on:
  workflow_call:
    inputs:
      image_source_path:
        description: 'Path in the CALLER repo to the dir holding engram.toml + Dockerfile (e.g. images/engineering-blog).'
        required: true
        type: string
      image_repo:
        description: 'GHCR path under ghcr.io for the produced image (e.g. cortexapps/engineering-blog/engineering-blog).'
        required: true
        type: string
      engrams_ref:
        description: 'cli-tools tag to pull (full SHA / short SHA / main). Default main = track the deployed coordinator.'
        required: false
        type: string
        default: main
      format:
        description: 'Image format: ext4 (Firecracker, prod) or directory (dev backend).'
        required: false
        type: string
        default: ext4
      runner:
        description: 'Runner label for the bake job.'
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  bake:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      # Default checkout = the CALLER repo: the image source (engram.toml +
      # Dockerfile) lives there, not in engrams.
      - name: Checkout image source
        uses: actions/checkout@v6
        with:
          # A dogfood Dockerfile may COPY the caller repo (including .git) into
          # the image so a session does an incremental `git pull` instead of a
          # full clone. actions/checkout's default persists the CI token in
          # .git/config (http.extraheader) — that would bake the token into an
          # image layer. The bake pushes via oras + docker login, never via git,
          # so it needs no git credentials: drop them so .git rides token-free.
          persist-credentials: false

      - name: Log in to GHCR
        # engram-cli reads ~/.docker/config.json to PULL the built-in harness
        # (ghcr.io/cortexapps/engrams/harness-claude:<ver>) and to PUSH the
        # produced image; oras reads the same config to pull cli-tools and
        # re-tag. One login covers all three.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Pull golden cli-tools (engram-cli + engram-agentd)
        env:
          REF: ${{ inputs.engrams_ref }}
        run: |
          set -euo pipefail
          # Drops engram-cli + engram-agentd into the cwd verbatim.
          oras pull "ghcr.io/cortexapps/engrams/cli-tools:${REF}"
          chmod +x engram-cli engram-agentd
          file engram-cli engram-agentd

      # ADR 0036: put the flake-pinned e2fsprogs (>= 1.47.1) mke2fs ahead of the
      # runner's apt <= 1.47.0 one so the bake is byte-deterministic (cross-bake
      # chunk dedup). Same composite action engrams CI uses; this workflow checks
      # out the caller (not engrams), so reference the flake remotely at
      # `engrams_ref` — works once engrams is public, the same assumption the
      # previous raw.githubusercontent fetch made. (`uses:` can't take an
      # expression ref, so the action code is pinned `@main`; the engrams REV is
      # pinned via the flake-ref input.)
      - name: Reproducible mke2fs (e2fsprogs >= 1.47.1, pinned via flake)
        uses: cortexapps/engrams/.github/actions/setup-reproducible-mke2fs@main
        with:
          flake-ref: github:cortexapps/engrams/${{ inputs.engrams_ref }}

      - name: Bake + push image
        env:
          SOURCE: ${{ inputs.image_source_path }}
          IMAGE_REPO: ${{ inputs.image_repo }}
          FORMAT: ${{ inputs.format }}
          ENGRAMS_REF: ${{ inputs.engrams_ref }}
          SHA: ${{ github.sha }}
          # Surface the chunked-rootfs push progress (default is warn).
          RUST_LOG: info,engram_image_builder=info
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          PUSH_URI="ghcr.io/${IMAGE_REPO}:warm-${SHORT}"
          echo "Baking ${PUSH_URI} from ${SOURCE} (cli-tools @ ${ENGRAMS_REF})"
          mkdir -p ./var/engram/images
          ./engram-cli image build \
            --repo "${IMAGE_REPO}" \
            --tag "warm-${SHORT}" \
            --source "${SOURCE}" \
            --format "${FORMAT}" \
            --images-dir ./var/engram/images \
            --inject-agent ./engram-agentd \
            --push "${PUSH_URI}"
          # Hand the URI to later steps.
          echo "PUSH_URI=${PUSH_URI}" >> "$GITHUB_ENV"
          echo "SHORT=${SHORT}" >> "$GITHUB_ENV"

      - name: Tag :latest
        # A re-tag is a pure manifest PUT — the per-chunk blobs are
        # content-addressed and already pushed above. `:latest` is a name, not a
        # consume: the coordinator pins content at enable/refresh time.
        run: |
          set -euo pipefail
          oras tag "${PUSH_URI}" latest
          echo "Tagged ghcr.io/${{ inputs.image_repo }}:latest -> warm-${SHORT}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## ${{ inputs.image_repo }} image bake"
            echo ""
            echo "- cli-tools ref: \`${{ inputs.engrams_ref }}\`"
            echo "- source: \`${{ inputs.image_source_path }}\`"
            echo "- pushed: \`${PUSH_URI:-<bake failed>}\`"
            if [ -n "${PUSH_URI:-}" ]; then
              echo "- also tagged: \`ghcr.io/${{ inputs.image_repo }}:latest\`"
            fi
            echo ""
            echo "Enable with \`engram image enable --uri ${PUSH_URI:-<uri>}\` (or refresh \`:latest\` if already enabled)."
          } >> "$GITHUB_STEP_SUMMARY"
