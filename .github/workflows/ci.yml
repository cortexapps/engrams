name: CI

# Linux Rust + web/pnpm gate. The macOS / Apple-Silicon coverage
# lives in ci-macos-vz.yml; together they form the full CI surface.
#
# Surfaces this workflow exercises:
#   - lint:             cargo fmt --check, cargo clippy -D warnings,
#                       cargo check workspace
#   - test-linux:       cargo nextest workspace tests, plus
#                       Postgres-gated ignored tests (ha_listener,
#                       snapshot_disk_manifest_persistence,
#                       admin_gc_chunks_live_pg) against the postgres
#                       service container, plus the GCS-emulator round-
#                       trip via fake-gcs-server
#   - cross-musl:       cross-compile engram-agentd / engram-bootstrap
#                       / the harness wrappers to
#                       x86_64-unknown-linux-musl (catches breakage of
#                       the FC image bake chain)
#   - test-firecracker: every `#[ignore]`'d FC integration test under
#                       nested virt. Unprivileged set: boot, lifecycle,
#                       snapshot, snapshot_uffd, exec_real_vm,
#                       harness_loopback, multi_restore,
#                       option_d_latency_bench, cross_host_restore.
#                       ADR 0007 set:
#                       canonical_capture (bake-time memory capture)
#                       and nbd_chunked_disk (Linux + nbd, gated — see
#                       the step). Root set under sudo for iptables +
#                       TAP + loop mounts: host_startup, proxy_e2e,
#                       snapshot_net, patch_drive_swap,
#                       option_d_warm_lease.
#   - web:              pnpm install + tsc + vite build + vitest
#
# All jobs run on Blacksmith Linux runners
# (https://docs.blacksmith.sh/blacksmith-runners/overview) — faster
# CPUs + nested-virt support across the whole matrix, not just the FC
# job. Tier sizing is per-job (2vcpu for cheap stuff, 4vcpu for
# Postgres/test runs and KVM workloads).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub Merge Queue fires `merge_group` events for the temporary
  # ref it builds out of (current main + queued PRs combined). Branch
  # protection blocks the queue from completing until every required
  # check passes against THIS ref, which is what guarantees main's
  # HEAD was CI'd against the exact tree being merged.
  merge_group:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-progress PR run when a new push lands on the same
# branch — saves runner minutes during fix-and-rerun cycles. Pushes
# to `main` are *not* cancelled (we want a CI record per merged
# commit, even on rapid back-to-back merges).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only repo access. No job here writes to the repo
# (no GH releases, no commit-back, no PR comments), so least
# privilege.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy + check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ADR 0013: `engram-protocol/build.rs` invokes `protoc` to
      # compile `proto/host_service.proto` into Rust bindings.
      # `arduino/setup-protoc` pulls a recent protoc release from
      # https://github.com/protocolbuffers/protobuf/releases and
      # puts it on PATH. Cross-platform (Linux + macOS) so every
      # workflow that touches Rust uses the same step.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2

      # `if: always()` so each gate runs regardless of which earlier
      # step failed — surfaces fmt + clippy + check failures together
      # in one CI run instead of forcing a fix-and-rerun loop. The job
      # still ends red if any step fails (the workflow conclusion is
      # the worst step's conclusion).
      - name: cargo fmt --all -- --check
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check --workspace --all-targets
        if: always()
        run: cargo check --workspace --all-targets

  test-linux:
    name: tests (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # Used by the `#[ignore]`'d ha_listener tests in
      # crates/engram-coordinator/tests/ha_listener.rs. The tests run
      # `store.migrate()` themselves before exercising NOTIFY/LISTEN,
      # so a bare Postgres without engram migrations is fine.
      ENGRAM_TEST_DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # ADR 0007: the GCS round-trip test in engram-storage-gcs is
      # gated on these env vars (so it no-ops on hosts without the
      # emulator). Setting them at the job level so every nextest
      # invocation in this job exercises the real SDK→emulator path.
      # The chunk store backs onto the same BlobStorage impl, so
      # this also covers the chunked-storage primitive end-to-end.
      STORAGE_EMULATOR_HOST: http://localhost:4443
      ENGRAM_TEST_GCS_BUCKET: engram-snapshots-test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # GCS emulator for the cold-tier round-trip test. We can't use
      # `services:` here because github actions service containers
      # don't let us override the image's CMD — fake-gcs-server's
      # default uses HTTPS + a host we can't reach. Plain `docker run`
      # gives us the full CLI surface; mirrors what
      # `deploy/docker-compose.dev.yml` runs locally.
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs-server \
            -p 4443:4443 \
            fsouza/fake-gcs-server:1.54.0 \
            -scheme http -host 0.0.0.0 -port 4443 \
            -public-host localhost:4443

      # Wait for the emulator to come up + seed the test bucket.
      # Mirrors `deploy/dev/seed-buckets.sh` exactly so the local +
      # CI paths share one source of truth.
      - name: Seed GCS test bucket
        run: bash deploy/dev/seed-buckets.sh

      # Default (non-ignored) tests across the entire workspace. Mirrors
      # `just check`'s nextest pass — same speedup, same coverage. The
      # engram-image-builder e2e bake test skips itself if `docker` is
      # not on PATH; ubuntu-latest ships Docker, so it runs. The
      # GCS-emulator round-trip uses STORAGE_EMULATOR_HOST set above.
      #
      # `--no-fail-fast` reports every failing test instead of stopping
      # at the first; `if: always()` keeps the ha_listener steps below
      # running even if this one fails.
      - name: cargo nextest run --workspace
        if: always()
        run: cargo nextest run --workspace --no-fail-fast

      # Postgres-gated ignored tests — the FC `#[ignore]` set needs KVM
      # so we don't try to run them here. Scoping by `--test` keeps us
      # from accidentally tripping firecracker tests that share the
      # `#[ignore]` bucket.
      #
      # `--test-threads=1` is load-bearing: the two ha_listener tests
      # both LISTEN on the `session_events` channel of the same
      # Postgres database. Run in parallel they cross-talk — test B's
      # listener catches test A's NOTIFY, the session_id assertion
      # fires on the wrong row. Production has one listener per
      # coordinator, so this is purely a test-harness artifact.
      - name: Postgres-gated ignored tests
        if: always()
        run: |
          cargo nextest run \
            -p engram-coordinator \
            --test ha_listener \
            --test snapshot_disk_manifest_persistence \
            --test admin_gc_chunks_live_pg \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

  cross-musl-linux:
    name: cross-compile linux-musl artifacts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Mirrors what `just install-harnesses` and `just fc-bake-demo`
      # produce on Linux. If any of these stop building the demo bake
      # path is broken even when the host-target workspace check is
      # green.
      - name: build agentd + bootstrap (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-agentd \
            -p engram-bootstrap

      - name: build harness wrappers (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-harness-noop \
            -p engram-harness-claude

      # The FC host image bake (private deploy repo's
      # bake-fc-host-image workflow) ships this binary into the GCE
      # image. Without this lane, musl regressions in host-agent
      # only surface during a bake, which is too late. `libc::Ioctl`
      # has a different width on musl (`c_int`) vs glibc (`c_ulong`)
      # so anything passing raw `u64` ioctl numbers won't catch this
      # on the gnu workspace check.
      - name: build engram-host-agent (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-host-agent

  web:
    name: web (pnpm)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc -b && vite build` — gives us typecheck
      # AND production bundle validation in one step.
      - name: pnpm build (tsc -b + vite build)
        run: pnpm build

      # Vitest. Currently exercises TerminalPane mount/unmount/remount
      # ordering against a mocked ghostty-web; expand as more components
      # gain regression tests.
      - name: pnpm test (vitest)
        run: pnpm test

  test-firecracker:
    name: tests (firecracker, Linux + KVM)
    # Blacksmith exposes `/dev/kvm` via nested virtualization (see
    # https://docs.blacksmith.sh/blacksmith-runners/overview). Mirrors
    # the dev-vm bootstrap (engram-dev) — the canonical Linux + KVM
    # env for Firecracker development. 4vCPU gives boot+lifecycle
    # tests enough headroom to run microVMs without queuing.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # /dev/kvm is mode 0660 root:kvm by default on hosted runners;
      # relax to 0666 so the runner user can boot microVMs without
      # sudo. /dev/userfaultfd is the same story (FC 1.10+ opens it
      # directly for UFFD-backed restore), with the additional
      # `vm.unprivileged_userfaultfd=1` sysctl required so the
      # non-root process can call userfaultfd(2).
      - name: Relax KVM + UFFD permissions
        run: |
          sudo chmod 0666 /dev/kvm
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo chmod 0666 /dev/userfaultfd

      # `mke2fs` (e2fsprogs) is needed by the exec_real_vm test for
      # ext4 packing. `musl-tools` is for the static agentd build that
      # the same test bakes into the rootfs.
      - name: Install build deps (musl-tools, e2fsprogs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools e2fsprogs

      # Pin to v1.10 to match the `firecracker-ci/v1.10` artifact
      # bucket that fetch-fc-test-artifacts.sh pulls from. Bumping
      # both pins should be a coordinated change — kernel ABI between
      # the host firecracker binary and the kernel image needs to
      # match.
      - name: Install firecracker (v1.10.1)
        env:
          FC_VER: v1.10.1
        run: |
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      # Cache the kernel + ubuntu rootfs in GH Actions cache. Both
      # artifacts are version-pinned via fetch-fc-test-artifacts.sh
      # (currently vmlinux-5.10.223 + ubuntu-22.04.ext4, ~1.9 GB
      # total). Without the cache, every CI run pays a ~19 min
      # download from `spec.ccfc.min` (Firecracker's S3 bucket).
      #
      # On Blacksmith runners, actions/cache@v4 transparently uses
      # Blacksmith's colocated cache — see
      # https://docs.blacksmith.sh/github-actions-runners/blacksmith-cache.
      # No useblacksmith/* fork needed (those are archived). The
      # cache key hashes the fetch script content, so bumping
      # either URL (kernel or rootfs version) invalidates cleanly.
      - name: Cache FC kernel + rootfs artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-fc-test
          key: fc-test-artifacts-${{ hashFiles('crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh') }}

      # Drop the cached kernel + ubuntu rootfs into ~/.cache/engram-fc-test
      # and emit the `FC_TEST_KERNEL` / `FC_TEST_ROOTFS` env vars that
      # `common::fc_preflight()` reads. Idempotent: on a cache hit
      # this just re-emits the env exports without re-downloading.
      - name: Fetch FC kernel + rootfs artifacts
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            | sed 's/^export //' >> "$GITHUB_ENV"

      # snapshot_uffd needs the host-side handler binary in
      # `target/debug/` (the test resolves it relative to
      # CARGO_MANIFEST_DIR).
      - name: Build engram-uffd-handler
        run: cargo build -p engram-uffd-handler

      # exec_real_vm + harness_loopback bake static binaries into a
      # rootfs at runtime and boot it; the binaries must be musl-static
      # so they run against whatever libc the rootfs ships. proxy_e2e
      # additionally needs engram-bootstrap and engram-harness-noop
      # statically linked for the harness path it shares with
      # harness_loopback.
      - name: Build static musl binaries (agentd / bootstrap / noop)
        run: |
          cargo build \
            -p engram-agentd \
            -p engram-bootstrap \
            -p engram-harness-noop \
            --target x86_64-unknown-linux-musl \
            --release

      # Run the `#[ignore]`'d FC integration tests that don't need
      # root: boot, lifecycle, snapshot, snapshot_uffd, exec_real_vm,
      # harness_loopback. `--no-fail-fast` so a regression in one test
      # doesn't hide regressions in others.
      #
      # `--test-threads=1` is load-bearing: each test creates its own
      # `FirecrackerBackend`, whose vsock CID allocator restarts at 3
      # (CIDs are host-global, so concurrent tests collide and the
      # second VM hits "connect firecracker.sock: Connection refused"
      # when it can't bind a CID). Production runs one backend per
      # host so this isn't an issue there. Booting real microVMs is
      # heavy enough that serial execution is fine.
      #
      # We name the test binaries explicitly (rather than
      # `--run-ignored ignored-only`) because the root-required
      # tests (host_startup, proxy_e2e) live in the same crate and
      # would otherwise be invoked here only to short-circuit via
      # their `require_root()` SKIP path — leaving the gap silent.
      - name: Firecracker `#[ignore]` tests (unprivileged)
        run: |
          cargo nextest run \
            -p engram-sandbox-firecracker \
            --test boot \
            --test lifecycle \
            --test snapshot \
            --test snapshot_uffd \
            --test exec_real_vm \
            --test harness_loopback \
            --test multi_restore \
            --test option_d_latency_bench \
            --test cross_host_restore \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # ADR 0007 Phase 4: NBD daemon serves chunked disks. The
      # `nbd_chunked_disk` integration test boots a real FC microVM
      # with `/dev/nbd0` as the rootfs; the kernel's NBD client
      # talks to our daemon, which serves chunk-store reads on
      # demand. Validates the kernel-userspace NBD boundary that
      # the unit tests can't exercise.
      #
      # Blacksmith caveat: each runner job runs inside a Firecracker
      # microVM with Blacksmith's own bespoke guest kernel (uname
      # reports a bare `6.5.13` with no Ubuntu variant suffix), and
      # `nbd.ko` isn't compiled in or shipped via any apt package.
      # We can't `apt-get install linux-modules-extra-$(uname -r)`
      # — that package only exists for Ubuntu's stock kernels.
      # See https://docs.blacksmith.sh/blacksmith-runners/overview.
      #
      # Result: this test currently does not run in CI. It runs
      # locally on the dev VM (which uses the standard Ubuntu cloud
      # kernel) and is covered by the dev-vm test runbook
      # (`bash crates/engram-sandbox-firecracker/scripts/run-boot-test.sh`).
      # Wiring the dev VM as a GH self-hosted runner specifically
      # for this test is tracked as a follow-up — see
      # `docs/chunked-storage-rollout.md` Tier 4.
      - name: Detect NBD kernel module
        id: nbd_setup
        run: |
          if sudo modprobe nbd nbds_max=4 2>/dev/null \
             && sudo chmod 666 /dev/nbd0 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -la /dev/nbd0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NBD test skipped on Blacksmith::nbd.ko unavailable in the runner kernel; nbd_chunked_disk runs locally via the dev VM. Tracking a self-hosted-runner follow-up to close the CI gap."
          fi

      - name: NBD chunked-disk integration test (Linux + KVM + nbd)
        if: steps.nbd_setup.outputs.available == 'true'
        env:
          ENGRAM_TEST_NBD_DEVICE: /dev/nbd0
        run: |
          cargo nextest run \
            -p engram-host-agent \
            --test nbd_chunked_disk \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # ADR 0007 Phase 5 (slice 2): the image-builder boots the
      # just-built rootfs once at bake time + chunks `memory.bin`
      # into the chunk store, producing the canonical-base memory
      # manifest that lets sessions of this image share canonical
      # pages via the host page cache (MAP_PRIVATE + UFFD).
      # Requires the same KVM + FC setup as the rest of this lane.
      - name: Bake-time canonical memory capture (Linux + KVM + FC)
        run: |
          cargo nextest run \
            -p engram-image-builder \
            --test canonical_capture \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # Root-required tests: host_startup applies real iptables rules,
      # proxy_e2e provisions a TAP device and runs the full
      # guest→TAP→REDIRECT→proxy→upstream chain, snapshot_net asserts
      # that snapshot/restore re-provisions the per-VM TAP + /30
      # under the original name (Gap 1 of the FC parity work). All
      # three need CAP_NET_ADMIN, which on Blacksmith runners means
      # sudo. We `-E` to keep the cargo / rustc env (CARGO_HOME,
      # RUSTUP_HOME, PATH) so the binary can be found, and chown back
      # at the end so the rust-cache action can read /target without
      # permission errors. Docker buildx scratchpad (~/.docker/buildx)
      # also gets touched by proxy_e2e's image bake; cleanup includes
      # it.
      - name: Firecracker `#[ignore]` tests (root — host_startup, proxy_e2e, snapshot_net, patch_drive_swap, option_d_warm_lease, netns_isolation, warm_proxy_chain)
        run: |
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-sandbox-firecracker \
            --test host_startup \
            --test proxy_e2e \
            --test snapshot_net \
            --test patch_drive_swap \
            --test option_d_warm_lease \
            --test netns_isolation \
            --test warm_proxy_chain \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1
        # Run after either success or failure so cache write doesn't
        # trip on root-owned files.
      - name: Restore ownership after sudo tests
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" target/ ~/.cargo ~/.docker 2>/dev/null || true
