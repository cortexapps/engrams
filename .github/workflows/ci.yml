name: CI

# Linux Rust + web/pnpm gate. The macOS / Apple-Silicon coverage
# lives in ci-macos-vz.yml; together they form the full CI surface.
#
# Surfaces this workflow exercises:
#   - lint:             cargo fmt --check, cargo clippy -D warnings,
#                       cargo check workspace
#   - test-linux:       cargo nextest workspace tests, plus
#                       Postgres-gated ignored tests (ha_listener,
#                       snapshot_disk_manifest_persistence) against
#                       the postgres service container, plus the
#                       GCS-emulator round-trip via fake-gcs-server
#   - cross-musl:       cross-compile engram-agentd + the harness
#                       wrappers to x86_64-unknown-linux-musl
#                       (catches breakage of the FC image bake chain).
#                       engram-bootstrap was collapsed into
#                       engram-agentd by ADR 0015 M1 (`75ba2df`).
#   - test-firecracker: every `#[ignore]`'d FC integration test under
#                       nested virt. Unprivileged set: boot, lifecycle,
#                       snapshot, snapshot_uffd, exec_real_vm,
#                       harness_loopback, multi_restore, restore_chain,
#                       option_d_latency_bench, cross_host_restore.
#                       ADR 0007 set: nbd_chunked_disk (Linux + nbd,
#                       gated — see the step). (canonical_capture was
#                       retired by ADR 0015 M5, `18be1ad`, when the
#                       bake-time memory-snapshot path was removed.)
#                       Root set under sudo for iptables + TAP + loop
#                       mounts: host_startup, proxy_e2e, snapshot_net,
#                       patch_drive_swap, option_d_warm_lease.
#   - web:              pnpm install + oxlint + tsc + vite build +
#                       vitest
#   - bake-demo-image:  push-to-main only. Bakes the canonical
#                       deploy/demo rootfs as a chunked-OCI artifact
#                       and pushes to
#                       `ghcr.io/cortexapps/engrams/demo:warm-<sha>`
#                       (+ :main / :latest aliases). Relocated from
#                       engrams-internal/bake-demo-image.yml so the
#                       prod demo image and the test image come from
#                       one publish path.
#   - artifacts-e2e-stack: release-builds engram-coordinator +
#                       engram-host-agent + engram-cli + musl
#                       engram-agentd ONCE and uploads as a workflow
#                       artifact. Consumed by `test-e2e-stack` so
#                       the e2e lane doesn't pay the compile cost
#                       again.
#   - test-e2e-stack:   true end-to-end against the prod-shape
#                       stack: real coord HTTP API + real gRPC + real
#                       host-agent + real Firecracker + real chunked
#                       OCI via fake-gcs + real local registry +
#                       published Claude harness pack. Runs three
#                       flows: cold session with harness=none + exec
#                       ls; cold session with harness=claude + exec
#                       ls; cold session with harness=claude + bogus
#                       API key + prompt → assert auth failure event.
#                       Closes the gap that let prod session
#                       8725648d's empty-Binary-frame bug ship (all
#                       existing FC tests bypass the coord HTTP path).
#
# All jobs run on Blacksmith Linux runners
# (https://docs.blacksmith.sh/blacksmith-runners/overview) — faster
# CPUs + nested-virt support across the whole matrix, not just the FC
# job. Tier sizing is per-job (2vcpu for cheap stuff, 4vcpu for
# Postgres/test runs and KVM workloads).

on:
  push:
    branches: [main]
  # No base-branch filter: STACKED PRs (base = another feature branch)
  # must run the same checks — with the old `branches: [main]` filter
  # they triggered no run at all, leaving the ruleset's required
  # contexts "waiting for status to be reported" until a base retarget
  # (whose late-fired run then built a racy stale merge ref).
  pull_request:
  # GitHub Merge Queue fires `merge_group` events for the temporary
  # ref it builds out of (current main + queued PRs combined). Branch
  # protection blocks the queue from completing until every required
  # check passes against THIS ref, which is what guarantees main's
  # HEAD was CI'd against the exact tree being merged.
  merge_group:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-progress PR run when a new push lands on the same
# branch — saves runner minutes during fix-and-rerun cycles. Pushes
# to `main` are *not* cancelled (we want a CI record per merged
# commit, even on rapid back-to-back merges).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only repo access. No job here writes to the repo
# (no GH releases, no commit-back, no PR comments), so least
# privilege. `packages: read` is load-bearing: the test-firecracker
# job oras-pulls the forked firecracker artifact from GHCR — without
# it the pull is DENIED and every fork-gated FC test (the ADR 0045 R2
# stock<->fork compat gate, the substrate suites, vmstate_only)
# silently green-by-skips.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

  # ADR 0021 P0: single source of truth for the built-in claude
  # harness artifact's tag. Used by:
  #   - `bake-harness-claude-artifact` (publishes to GHCR on
  #     push-to-main; uploads as workflow artifact on every run)
  #   - `test-e2e-stack` (downloads the artifact, re-publishes to
  #     localhost:5001, points the baker at it via env)
  # Bump in lockstep with `[harness] version = "..."` in
  # `deploy/demo-claude/engram.toml` so the catalog override
  # resolves to a tag the local registry actually serves.
  HARNESS_VERSION: v0.1.0
  HARNESS_PLATFORM: linux-x86_64

jobs:
  lint:
    name: fmt + clippy + check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ADR 0013: `engram-protocol/build.rs` invokes `protoc` to
      # compile `proto/host_service.proto` into Rust bindings.
      # `arduino/setup-protoc` pulls a recent protoc release from
      # https://github.com/protocolbuffers/protobuf/releases and
      # puts it on PATH. Cross-platform (Linux + macOS) so every
      # workflow that touches Rust uses the same step.
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      # Parallel linker — installs a prebuilt mold release (~1–2s)
      # and (with the action's default `make-default: true`) points
      # /usr/bin/ld at it so cargo's default cc→ld chain picks it up
      # transparently. Cuts incremental link time 3–10× on this
      # multi-binary workspace, net positive after install overhead.
      # Skipped on cross-musl-linux (musl-gcc has its own bundled
      # ld) and on test-e2e-stack (downloads prebuilt binaries, no
      # native link step happens).
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with test-linux + test-e2e-stack: all three build
          # the workspace's debug profile, so cargo's `target/debug/`
          # contents (deps + workspace artifacts) populate the same
          # cache bucket and each subsequent job sees prior deps as
          # already-compiled.
          shared-key: workspace-debug

      # Install cargo-hakari from a prebuilt release (~1s) so we can
      # `cargo hakari verify` below. The dev shell pulls this from
      # nixpkgs; CI uses taiki-e/install-action to avoid a slow
      # `cargo install` from source.
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      # `if: always()` so each gate runs regardless of which earlier
      # step failed — surfaces fmt + clippy + check failures together
      # in one CI run instead of forcing a fix-and-rerun loop. The job
      # still ends red if any step fails (the workflow conclusion is
      # the worst step's conclusion).
      - name: cargo fmt --all -- --check
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check --workspace --all-targets
        if: always()
        run: cargo check --workspace --all-targets
      # Catch dep additions that didn't regenerate workspace-hack.
      # Run `just hakari` (or `cargo hakari generate`) locally and
      # commit `workspace-hack/Cargo.toml` if this fails.
      - name: cargo hakari verify
        if: always()
        run: cargo hakari verify

  test-linux:
    name: tests (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # Used by the `#[ignore]`'d ha_listener tests in
      # crates/engram-coordinator/tests/ha_listener.rs. The tests run
      # `store.migrate()` themselves before exercising NOTIFY/LISTEN,
      # so a bare Postgres without engram migrations is fine.
      ENGRAM_TEST_DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # ADR 0007: the GCS round-trip test in engram-storage-gcs is
      # gated on these env vars (so it no-ops on hosts without the
      # emulator). Setting them at the job level so every nextest
      # invocation in this job exercises the real SDK→emulator path.
      # The chunk store backs onto the same BlobStorage impl, so
      # this also covers the chunked-storage primitive end-to-end.
      STORAGE_EMULATOR_HOST: http://localhost:4443
      ENGRAM_TEST_GCS_BUCKET: engram-snapshots-test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with lint + test-e2e-stack — see lint's cache step
          # for the rationale (debug-profile workspace dep graph).
          shared-key: workspace-debug
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # GCS emulator for the cold-tier round-trip test. We can't use
      # `services:` here because github actions service containers
      # don't let us override the image's CMD — fake-gcs-server's
      # default uses HTTPS + a host we can't reach. Plain `docker run`
      # gives us the full CLI surface; mirrors what
      # `deploy/docker-compose.dev.yml` runs locally.
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs-server \
            -p 4443:4443 \
            fsouza/fake-gcs-server:1.54.0 \
            -scheme http -host 0.0.0.0 -port 4443 \
            -public-host localhost:4443

      # Wait for the emulator to come up + seed the test bucket.
      # Mirrors `deploy/dev/seed-buckets.sh` exactly so the local +
      # CI paths share one source of truth.
      - name: Seed GCS test bucket
        run: bash deploy/dev/seed-buckets.sh

      # Default (non-ignored) tests across the entire workspace. Mirrors
      # `just check`'s nextest pass — same speedup, same coverage. The
      # engram-image-builder e2e bake test skips itself if `docker` is
      # not on PATH; ubuntu-latest ships Docker, so it runs. The
      # GCS-emulator round-trip uses STORAGE_EMULATOR_HOST set above.
      #
      # `--no-fail-fast` reports every failing test instead of stopping
      # at the first; `if: always()` keeps the ha_listener steps below
      # running even if this one fails.
      - name: cargo nextest run --workspace
        if: always()
        run: cargo nextest run --workspace --no-fail-fast

      # Postgres-gated ignored tests — the FC `#[ignore]` set needs KVM
      # so we don't try to run them here. Scoping by `--test` keeps us
      # from accidentally tripping firecracker tests that share the
      # `#[ignore]` bucket.
      #
      # `--test-threads=1` is load-bearing: the two ha_listener tests
      # both LISTEN on the `session_events` channel of the same
      # Postgres database. Run in parallel they cross-talk — test B's
      # listener catches test A's NOTIFY, the session_id assertion
      # fires on the wrong row. Production has one listener per
      # coordinator, so this is purely a test-harness artifact.
      - name: Postgres-gated ignored tests
        if: always()
        run: |
          cargo nextest run \
            -p engram-coordinator \
            --test ha_listener \
            --test snapshot_disk_manifest_persistence \
            --test chunk_gc_helpers_live_pg \
            --test bundle_gc_live_pg \
            --test snapshot_blob_gc_live_pg \
            --test admin_chunk_gc_live_pg \
            --test admin_evac_live_pg \
            --test users_live_pg \
            --test eviction_live_pg \
            --test checkpoint_reconcile_live_pg \
            --test enable_jobs_live_pg \
            --test enable_reuse_live_pg \
            --test placement_reservation_live_pg \
            --test host_register_live_pg \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

  cross-musl-linux:
    name: cross-compile linux-musl artifacts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools + kernel uapi headers
        # linux-libc-dev: uffd-handler's transitive userfaultfd-sys build
        # script compiles a C shim that #includes <linux/types.h>, absent
        # from the musl cross-gcc sysroot.
        run: sudo apt-get update && sudo apt-get install -y musl-tools linux-libc-dev

      # Mirrors what `just bake-demo` produces on Linux. If any of these
      # stop building the demo bake
      # path is broken even when the host-target workspace check is
      # green.
      - name: build agentd (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-agentd

      - name: build harness wrappers (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-harness-noop \
            -p engram-harness-claude

      # The FC host image bake (private deploy repo's
      # bake-fc-host-image workflow) ships this binary into the GCE
      # image. Without this lane, musl regressions in host-agent
      # only surface during a bake, which is too late. `libc::Ioctl`
      # has a different width on musl (`c_int`) vs glibc (`c_ulong`)
      # so anything passing raw `u64` ioctl numbers won't catch this
      # on the gnu workspace check.
      - name: build engram-host-agent (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-host-agent

      # uffd-handler also ships into the FC host image (ADR 0020 Route B),
      # so guard its musl build here too. userfaultfd-sys's C shim needs the
      # kernel uapi headers pointed at via CFLAGS/bindgen (libc-agnostic, so
      # safe to mix with the musl sysroot).
      - name: build engram-uffd-handler (musl)
        env:
          CFLAGS_x86_64_unknown_linux_musl: "-I/usr/include -I/usr/include/x86_64-linux-gnu"
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/include -I/usr/include/x86_64-linux-gnu"
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-uffd-handler

  web:
    name: web (pnpm)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # oxlint over src/. Fast (Rust-based) static gate; runs before the
      # build so lint failures surface without waiting on tsc + vite.
      - name: pnpm lint (oxlint)
        run: pnpm lint

      # `pnpm build` runs `tsc -b && vite build` — gives us typecheck
      # AND production bundle validation in one step.
      - name: pnpm build (tsc -b + vite build)
        run: pnpm build

      # Vitest. Currently exercises TerminalPane mount/unmount/remount
      # ordering against a mocked ghostty-web; expand as more components
      # gain regression tests.
      - name: pnpm test (vitest)
        run: pnpm test

  test-firecracker:
    name: tests (firecracker, Linux + KVM)
    # Blacksmith exposes `/dev/kvm` via nested virtualization (see
    # https://docs.blacksmith.sh/blacksmith-runners/overview). Mirrors
    # the dev-vm bootstrap (engram-dev) — the canonical Linux + KVM
    # env for Firecracker development. 4vCPU gives boot+lifecycle
    # tests enough headroom to run microVMs without queuing.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # /dev/kvm is mode 0660 root:kvm by default on hosted runners;
      # relax to 0666 so the runner user can boot microVMs without
      # sudo. /dev/userfaultfd is the same story (FC 1.10+ opens it
      # directly for UFFD-backed restore), with the additional
      # `vm.unprivileged_userfaultfd=1` sysctl required so the
      # non-root process can call userfaultfd(2).
      - name: Relax KVM + UFFD permissions
        run: |
          sudo chmod 0666 /dev/kvm
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo chmod 0666 /dev/userfaultfd

      # `mke2fs` (e2fsprogs) is needed by the exec_real_vm test for
      # ext4 packing. `musl-tools` is for the static agentd build that
      # the same test bakes into the rootfs.
      - name: Install build deps (musl-tools, e2fsprogs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools e2fsprogs

      # Stock firecracker — matches the deployed fork's upstream base (v1.16.0)
      # so the existing FC suite + the stock<->fork compat test exercise the
      # version we actually ship. The cached test artifacts (our engram 6.1.102
      # guest kernel + the ubuntu-22.04 rootfs) are validated compatible with
      # v1.16.0 (dev-vm: the compat test boots+snapshots+restores green).
      - name: Install firecracker (v1.16.0)
        env:
          FC_VER: v1.16.0
        run: |
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      - uses: oras-project/setup-oras@v1

      # ADR 0045 Phase B: stage both binaries for the stock<->fork
      # snapshot-compat test (`stock_fork_snapshot_compat`). Stock = the
      # v1.10.1 just installed; fork = the artifact build-firecracker published,
      # keyed by the submodule's gitlink SHA (read from the tree — no submodule
      # fetch). Graceful: if the fork artifact isn't published yet (e.g. a
      # submodule-bump PR before its merge builds it), leave ENGRAM_FC_FORK_BIN
      # unset and the compat test skips cleanly via compat_preflight().
      - name: Stage stock + forked firecracker (compat test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "ENGRAM_FC_STOCK_BIN=/usr/local/bin/firecracker" >> "$GITHUB_ENV"
          FC_SHA="$(git ls-tree HEAD third_party/firecracker | awk '{print $3}')"
          if [ -z "$FC_SHA" ]; then echo "no third_party/firecracker gitlink; compat test will skip"; exit 0; fi
          if ! echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin; then
            echo "oras login failed; compat test will skip"; exit 0
          fi
          mkdir -p "$HOME/fc-fork"
          if oras pull "ghcr.io/${{ github.repository }}/firecracker:$FC_SHA" --output "$HOME/fc-fork"; then
            chmod +x "$HOME/fc-fork/firecracker"
            echo "ENGRAM_FC_FORK_BIN=$HOME/fc-fork/firecracker" >> "$GITHUB_ENV"
            echo "staged forked firecracker @ $FC_SHA"
          else
            echo "fork artifact firecracker:$FC_SHA not published yet; compat test will skip"
          fi

      # Cache the kernel + ubuntu rootfs in GH Actions cache. Both
      # artifacts are version-pinned via fetch-fc-test-artifacts.sh
      # (currently vmlinux-5.10.223 + ubuntu-22.04.ext4, ~1.9 GB
      # total). Without the cache, every CI run pays a ~19 min
      # download from `spec.ccfc.min` (Firecracker's S3 bucket).
      #
      # On Blacksmith runners, actions/cache@v4 transparently uses
      # Blacksmith's colocated cache — see
      # https://docs.blacksmith.sh/github-actions-runners/blacksmith-cache.
      # No useblacksmith/* fork needed (those are archived). The
      # cache key hashes the fetch script content, so bumping
      # either URL (kernel or rootfs version) invalidates cleanly.
      - name: Cache FC kernel + rootfs artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-fc-test
          key: fc-test-artifacts-${{ hashFiles('crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh') }}

      # Drop the cached kernel + ubuntu rootfs into ~/.cache/engram-fc-test
      # and emit the `FC_TEST_KERNEL` / `FC_TEST_ROOTFS` env vars that
      # `common::fc_preflight()` reads. Idempotent: on a cache hit
      # this just re-emits the env exports without re-downloading.
      - name: Fetch FC kernel + rootfs artifacts
        # GH_TOKEN: the FC guest kernel is now a private release asset on this
        # repo (ADR 0025); fetch-fc-test-artifacts.sh `gh release download`s it.
        # The in-repo GITHUB_TOKEN can read this repo's own releases.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            | sed 's/^export //' >> "$GITHUB_ENV"

      # snapshot_uffd needs the host-side handler binary in
      # `target/debug/` (the test resolves it relative to
      # CARGO_MANIFEST_DIR).
      - name: Build engram-uffd-handler
        run: cargo build -p engram-uffd-handler

      # exec_real_vm + harness_loopback bake static binaries into a
      # rootfs at runtime and boot it; the binaries must be musl-static
      # so they run against whatever libc the rootfs ships. proxy_e2e
      # needs engram-harness-noop statically linked for the harness
      # path it shares with harness_loopback. (ADR 0015 M1 collapsed
      # engram-bootstrap into engram-agentd; the standalone crate is
      # gone.)
      - name: Build static musl binaries (agentd / noop / harness-claude)
        # engram-harness-claude is the real wrapper that the
        # e2e_harness tests load into the harness substrate at
        # `/claude/harness`. Building it here lets the same `target/`
        # serve both the unprivileged tests and the root-required
        # e2e_harness pair below — no second cargo build pass.
        run: |
          cargo build \
            -p engram-agentd \
            -p engram-harness-noop \
            -p engram-harness-claude \
            --target x86_64-unknown-linux-musl \
            --release

      # Cache the Claude Code CLI binary across CI runs. The
      # e2e_harness tests download it from
      # `downloads.claude.ai/claude-code-releases/latest`. Without
      # caching every CI run pays a ~30s download + the upstream
      # may rate-limit. Cache key is intentionally fuzzy (`latest`)
      # since Anthropic's "latest" pointer floats; the test
      # tolerates whatever version is in the cache and only
      # re-downloads when the cache misses.
      - name: Cache Claude Code CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-e2e-harness
          # Refresh every ~week — gives some staleness so we
          # eventually pick up new Claude CLI versions, but doesn't
          # re-download on every run.
          key: claude-code-cli-${{ github.run_id }}
          restore-keys: |
            claude-code-cli-

      # Run the `#[ignore]`'d FC integration tests that don't need
      # root: boot, lifecycle, snapshot, snapshot_uffd, exec_real_vm,
      # harness_loopback. `--no-fail-fast` so a regression in one test
      # doesn't hide regressions in others.
      #
      # `--test-threads=1` is load-bearing: each test creates its own
      # `FirecrackerBackend`, whose vsock CID allocator restarts at 3
      # (CIDs are host-global, so concurrent tests collide and the
      # second VM hits "connect firecracker.sock: Connection refused"
      # when it can't bind a CID). Production runs one backend per
      # host so this isn't an issue there. Booting real microVMs is
      # heavy enough that serial execution is fine.
      #
      # We name the test binaries explicitly (rather than
      # `--run-ignored ignored-only`) because the root-required
      # tests (host_startup, proxy_e2e) live in the same crate and
      # would otherwise be invoked here only to short-circuit via
      # their `require_root()` SKIP path — leaving the gap silent.
      - name: Firecracker `#[ignore]` tests (unprivileged)
        run: |
          # ADR 0021 P1.6: `baked_harness_loopback` replaced the
          # retired `harness_loopback`. `restore_chain` and
          # `option_d_latency_bench` were also deleted with the
          # substrate subsystem; `restore_chain` came back (baked-in
          # variant) in the P1.6 e2e resurrection.
          cargo nextest run \
            -p engram-sandbox-firecracker \
            --test boot \
            --test lifecycle \
            --test reattach_detach \
            --test snapshot \
            --test snapshot_uffd \
            --test exec_real_vm \
            --test baked_harness_loopback \
            --test forge_loopback \
            --test upload_loopback \
            --test multi_restore \
            --test cross_host_restore \
            --test restore_chain \
            --test aux_ro_drive \
            --test diff_snapshot \
            --test file_restore_shared_rss \
            --test stock_fork_snapshot_compat \
            --test vmstate_only_snapshot \
            --test substrate_kernel_capabilities \
            --test substrate_uffd_base \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1
          # ADR 0028 Fix A: the checkpoint-chain pipeline test lives in
          # engram-host-agent (it exercises PooledBackend), same gating
          # as the FC tests above (KVM + Docker + musl agentd).
          cargo nextest run \
            -p engram-host-agent \
            --test checkpoint_chain \
            --test migration_source \
            --test two_host_live_teleport \
            --test pagemap_scanner \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # ADR 0007 Phase 4: NBD daemon serves chunked disks. The
      # `nbd_chunked_disk` integration test boots a real FC microVM
      # with `/dev/nbd0` as the rootfs; the kernel's NBD client
      # talks to our daemon, which serves chunk-store reads on
      # demand. Validates the kernel-userspace NBD boundary that
      # the unit tests can't exercise.
      #
      # Blacksmith DOES ship NBD — it's compiled BUILT-IN
      # (`CONFIG_BLK_DEV_NBD=y`) in the runner's guest kernel (a bare
      # `6.5.13`), not as a loadable module. That distinction is why
      # this test was skipped for so long: the old gate keyed off
      # `modprobe nbd` succeeding, but you can't modprobe a built-in
      # driver — it FATALs with "Module nbd not found" even though
      # the kernel already registered `/dev/nbd0..15` at boot and they
      # work. Verified by the `nbd-probe` workflow: on both Blacksmith
      # sizes CONFIG_BLK_DEV_NBD=y, /dev/nbd0 exists, and a qemu-nbd
      # read/write round trip passes. So we gate on the DEVICE NODE,
      # not on modprobe's exit code.
      - name: Detect NBD availability
        id: nbd_setup
        run: |
          # `=m` kernels (the GitHub-hosted control, dev VM) need the
          # module loaded; `=y` kernels (Blacksmith) already expose the
          # devices and modprobe is a harmless FATAL. Either way the
          # truth is whether /dev/nbd0 exists afterward — so try the
          # load best-effort and decide on the device node.
          sudo modprobe nbd nbds_max=16 2>/dev/null || true
          if [ -e /dev/nbd0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -la /dev/nbd0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NBD unavailable::/dev/nbd0 absent after modprobe — NBD integration tests skipped on this runner."
          fi

      # Runs under `sudo -E` (not plain cargo): the test's own preamble
      # (nbd_chunked_disk.rs) notes that current kernels gate NBD
      # configuration (netlink AND ioctl) behind CAP_SYS_ADMIN
      # regardless of the device's permission bits, mirroring the
      # root-required FC tests below. `env "PATH=$PATH"` re-adds the
      # cargo/rustc PATH that sudo scrubs; `-E` preserves
      # ENGRAM_TEST_NBD_DEVICE + FC_TEST_KERNEL/FC_TEST_ROOTFS.
      - name: NBD chunked-disk + netlink tests (Linux + KVM + nbd, root)
        if: steps.nbd_setup.outputs.available == 'true'
        env:
          ENGRAM_TEST_NBD_DEVICE: /dev/nbd0
        run: |
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-host-agent \
            --test nbd_chunked_disk \
            --test nbd_netlink_reconfigure \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # Root-required tests: host_startup applies real iptables rules,
      # proxy_e2e provisions a TAP device and runs the full
      # guest→TAP→REDIRECT→proxy→upstream chain, snapshot_net asserts
      # that snapshot/restore re-provisions the per-VM TAP + /30
      # under the original name (Gap 1 of the FC parity work). All
      # three need CAP_NET_ADMIN, which on Blacksmith runners means
      # sudo. We `-E` to keep the cargo / rustc env (CARGO_HOME,
      # RUSTUP_HOME, PATH) so the binary can be found, and chown back
      # at the end so the rust-cache action can read /target without
      # permission errors. Docker buildx scratchpad (~/.docker/buildx)
      # also gets touched by proxy_e2e's image bake; cleanup includes
      # it.
      - name: Firecracker `#[ignore]` tests (root — host_startup, snapshot_net, patch_drive_swap, aux_ro_drive, netns_isolation, warm_proxy_chain, proxy_e2e)
        run: |
          # ADR 0021 P1.6: `proxy_e2e` came back in the e2e
          # resurrection — baked-in harness path, CA delivered via
          # `InstallHostCa` vsock RPC instead of the retired
          # `.engram-host/ca.pem` substrate file. `option_d_warm_lease`
          # stays deleted (it was specifically about option-D).
          # ADR 0027: `aux_ro_drive` exercises the read-only bundle
          # drive (skills / playwright squashfs) surviving snapshot +
          # restore by presence — needs sudo mount like patch_drive_swap.
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-sandbox-firecracker \
            --test host_startup \
            --test snapshot_net \
            --test patch_drive_swap \
            --test aux_ro_drive \
            --test netns_isolation \
            --test warm_proxy_chain \
            --test proxy_e2e \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # True-e2e tests (engram-host-agent crate): real bake + real
      # FC microVM + PooledBackend + real proxy + (for harness)
      # real Claude CLI + real api.anthropic.com 401 round-trip.
      # These are the highest-fidelity tests we have for the
      # cold-and-warm path the dashboard's SHELL tab + Claude
      # harness use in prod.
      #
      # They reuse the same `target/` (debug builds, since the host
      # binaries here don't need musl) and the same Claude CLI
      # cache as the steps above. Net new runtime ~80s for the
      # harness pair + ~70s for the shell pair, well within the
      # existing FC job budget.
      # True-e2e tests (engram-host-agent crate): real bake + real
      # FC microVM + PooledBackend + real proxy + (for harness)
      # real Claude CLI + real api.anthropic.com 401 round-trip.
      # Resurrected for ADR 0021 P1.6 against the baked-in harness
      # model — the harness pack travels in /opt/engram/harness/
      # inside the rootfs, the CA via `InstallHostCa` vsock RPC.
      - name: True-e2e tests (root — e2e_shell, e2e_harness)
        run: |
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-host-agent \
            --test e2e_shell \
            --test e2e_harness \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1
        # Run after either success or failure so cache write doesn't
        # trip on root-owned files.
      - name: Restore ownership after sudo tests
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" target/ ~/.cargo ~/.docker 2>/dev/null || true

  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Built-in Claude harness artifact bake (ADR 0021 P0).
  #
  # Folds the prior standalone `bake-harness-claude.yml` workflow
  # into ci.yml so every PR + push-to-main produces the exact
  # artifact it tests against — closing a structural catch-22 where
  # a PR that bumps `HARNESS_VERSION` had no way to publish the new
  # tag before its own e2e_stack lane consumed it.
  #
  # Two consumers:
  #   - **`bake-demo-image` matrix + production** (push-to-main only):
  #     pull from `ghcr.io/cortexapps/engrams/harness-claude:<version>-
  #     <platform>`. This job publishes that tag on push-to-main and
  #     skips the push on PRs.
  #   - **`test-e2e-stack` (every PR + push)**: download the workflow
  #     artifact this job uploads, re-publish to localhost:5001, point
  #     the baker at it via `ENGRAM_BUILTIN_HARNESS_CLAUDE_REPO`. The
  #     catalog override (`engram-image-builder::BuiltinCatalog::
  #     with_overrides_from_env`) makes the in-baker resolution swap
  #     transparently — same tag suffix, different repo.
  #
  # Why a workflow artifact (not "PR pushes to a per-PR GHCR tag"):
  # workflow artifacts auto-expire, never write to a shared registry
  # namespace, and can't accidentally leak a half-baked PR's binary
  # into a tag prod's bake might pull. The trade-off (one extra
  # ~30-60 s job per PR) is worth the elimination of all four
  # failure modes the catch-22 created.
  # ------------------------------------------------------------------
  bake-harness-claude-artifact:
    name: bake harness-claude artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      # `packages: write` only used on push-to-main. The PR path
      # uploads as a workflow artifact and never touches GHCR.
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: x86_64-unknown-linux-musl

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler

      - name: Install musl-tools
        run: sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shares with bake-demo-image matrix (same musl + host
          # release deps) so the second job warms instantly off the
          # first's deps.
          shared-key: release-musl-bake

      - name: Build engram-harness-claude (musl) + engram-publish-builtin-harness (host)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p engram-harness-claude
          cargo build --release -p engram-publish-builtin-harness

      - name: Download Claude Code CLI (Linux x64)
        id: claude_cli
        run: |
          CLAUDE_VERSION=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          curl -fsSL --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude" \
            -o /tmp/claude
          chmod +x /tmp/claude
          /tmp/claude --version || true
          echo "version=$CLAUDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage harness artifact contents
        id: stage
        env:
          CLAUDE_VERSION: ${{ steps.claude_cli.outputs.version }}
        run: |
          # Stage into a known, repo-relative path so upload-artifact
          # has a stable input. The staged directory IS the contents
          # of /opt/engram/harness/ the baker will extract on the
          # image side: entry binary at `harness`, bundled `claude`
          # CLI alongside, and an `artifact.toml` descriptor.
          STAGE="$PWD/var/harness-claude-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -p target/x86_64-unknown-linux-musl/release/engram-harness-claude "$STAGE/harness"
          cp -p /tmp/claude "$STAGE/claude"
          cat > "$STAGE/artifact.toml" <<EOF
          name = "claude"
          version = "${HARNESS_VERSION}"
          entry = "harness"
          description = "Anthropic Claude Code, bundled with engram-harness-claude ${HARNESS_VERSION}. Built on top of claude CLI ${CLAUDE_VERSION}."
          EOF
          ls -la "$STAGE"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      # PR + merge_group: upload as a workflow artifact for downstream
      # consumers (test-e2e-stack downloads + re-publishes locally).
      # Always runs so the artifact exists regardless of whether the
      # GHCR push below ran.
      - name: Upload staged harness as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-claude-artifact
          path: ${{ steps.stage.outputs.dir }}
          # PR-scoped freshness — workflow artifacts auto-expire
          # after the configured retention (90 d default), so this
          # never accumulates indefinitely.
          if-no-files-found: error
          retention-days: 7
          # Three files (binary + binary + 200-byte toml); leave
          # compression default.

      # Push-to-main only: also publish to the production GHCR tag
      # so downstream bakes (bake-demo-image matrix, prod-side
      # demo-claude consumers, future ones) see the same artifact.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push harness-claude artifact to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          TAG: ghcr.io/${{ github.repository }}/harness-claude:${{ env.HARNESS_VERSION }}-${{ env.HARNESS_PLATFORM }}
        run: |
          # ADR 0021 P1.7: `engram-publish-builtin-harness` replaces
          # the retired `engram-cli harness push`. Same underlying
          # `engram_oci::OciClient::push_harness` primitive; same
          # wire shape (one tar.gz layer at our media type). The tag
          # is the catalog's expected format `<repo>:<version>-
          # <platform>` — no `:latest` / `:main` / SHA aliases, per
          # the ADR's "one explicit version, baker records the
          # digest" rule.
          ./target/release/engram-publish-builtin-harness \
            --from "$STAGE" \
            --to "$TAG"
          echo "Published $TAG"

      - name: Summarize
        if: always()
        env:
          PUSH_RAN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "## harness-claude bake" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${HARNESS_VERSION}-${HARNESS_PLATFORM}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- uploaded as workflow artifact: \`harness-claude-artifact\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUSH_RAN" = "true" ]; then
            echo "- pushed to: \`ghcr.io/${{ github.repository }}/harness-claude:${HARNESS_VERSION}-${HARNESS_PLATFORM}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GHCR push: skipped (PR / non-main)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Demo image bake — relocated from
  # engrams-internal/.github/workflows/bake-demo-image.yml so the
  # production demo image and the e2e test image come from one
  # publish path. Push-to-main only (PRs don't need to push; the
  # e2e lane bakes its own image locally for test isolation).
  #
  # Matrix over two variants (ADR 0021):
  #   - `demo`         — harness-neutral starter image. Sessions
  #                       default to `SessionMode::Agent` but the image
  #                       has no `[harness]` block, so `resolve_harness`
  #                       returns None and the session boots as a
  #                       dev VM (empty-argv readiness probe). Useful
  #                       as a base for custom-harness authors who
  #                       bring their own binary, and for shell-only
  #                       workloads.
  #   - `demo-claude`  — same OS + tooling, plus `[harness] builtin
  #                       = "claude"` in `engram.toml`. The baker
  #                       pulls `ghcr.io/cortexapps/engrams/harness-
  #                       claude:<version>-linux-x86_64` (published by
  #                       the `bake-harness-claude-artifact` job above
  #                       on push-to-main) and injects it into the
  #                       rootfs at `/opt/engram/harness/`. Prod
  #                       deploys point here for the default
  #                       Claude-backed session.
  #
  # Each variant publishes its own image:
  #   `ghcr.io/cortexapps/engrams/<variant>:warm-<sha>` (plus the
  #   `:warm-<short>`, `:main`, `:latest` aliases).
  # ------------------------------------------------------------------
  bake-demo-image:
    name: bake ${{ matrix.variant }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # Order AFTER the harness artifact is republished. `demo-claude`
    # pulls `harness-claude:<version>-linux-x86_64` from GHCR at bake
    # time, and that tag is version-pinned + overwritten in place — so
    # without this dependency the two jobs race and demo-claude can bake
    # the PREVIOUS harness binary. `bake-harness-claude-artifact` has no
    # job-level `if`, so it runs (and this `needs:` resolves) on every
    # event this job fires for (push-to-main / workflow_dispatch); on PRs
    # this job is skipped by the `if:` above regardless.
    needs: bake-harness-claude-artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      # `packages: write` is needed for the push; `packages: read`
      # is needed because the `demo-claude` bake pulls the
      # harness-claude artifact from GHCR. `write` implies `read`.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [demo, demo-claude]
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: x86_64-unknown-linux-musl

      # ADR 0013: engram-protocol/build.rs needs protoc.
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install musl tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      # Parallel linker for the native-gnu portion (the musl agentd
      # build uses musl-gcc's bundled ld and is unaffected).
      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with artifacts-e2e-stack: both build release host
          # binaries (engram-cli + others) AND musl-target release
          # agentd. The release+musl dep graph is sizeable and very
          # stable across commits — the shared cache saves ~1-2min
          # on whichever job runs second. Both matrix legs share the
          # same key because their cargo build inputs are identical
          # (the demo-claude variant differs only in `engram.toml`,
          # which engram-cli reads at bake time — not a compile input).
          shared-key: release-musl-bake

      - name: Build engram-cli + static-musl agentd
        run: |
          # Static-musl agentd goes inside the guest rootfs via
          # --inject-agent. (ADR 0015 M1 collapsed engram-bootstrap
          # into engram-agentd, `75ba2df`.)
          cargo build --release --target x86_64-unknown-linux-musl \
              -p engram-agentd
          # engram-cli runs on the host to drive the bake + push.
          cargo build --release -p engram-cli

      - name: Stage ${{ matrix.variant }} source
        run: |
          mkdir -p var/${{ matrix.variant }}
          cp deploy/${{ matrix.variant }}/Dockerfile  var/${{ matrix.variant }}/
          cp deploy/${{ matrix.variant }}/engram.toml var/${{ matrix.variant }}/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/$VARIANT"
          SHORT="${SHA:0:7}"
          # `engram-cli image build --push` pushes to a single URI per
          # call; we push once to the SHA-tagged variant and then
          # alias :short / :latest / :main via crane.
          echo "primary=$BASE:warm-$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "extra_tags<<EOF"
            echo "$BASE:warm-$SHORT"
            echo "$BASE:main"
            echo "$BASE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bake + push ${{ matrix.variant }} image
        env:
          # engram-cli's tracing subscriber defaults to `warn`. Bump
          # to `info` for the image-builder crate so the bake log
          # surfaces the chunked-rootfs push progress AND (for
          # demo-claude) the harness-artifact pull from GHCR.
          RUST_LOG: info,engram_image_builder=info,engram_oci=info
          PUSH_URI: ${{ steps.tags.outputs.primary }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "Building + pushing $PUSH_URI"
          # Binary follows the cargo package name (`engram-cli`); the
          # `engram` you type at the shell is just clap's command-name,
          # not the filename.
          #
          # ADR 0015 M5 (`18be1ad`) retired bake-time canonical
          # memory capture along with the warm pool + `templates`
          # table. Hot-tier startup is now driven by host prefetch
          # of the chunked rootfs from BlobStorage on enable-image,
          # not by a bake-time memory snapshot.
          ./target/release/engram-cli image build \
              --repo "${{ github.repository }}/$VARIANT" \
              --tag "warm-${{ github.sha }}" \
              --source "var/$VARIANT" \
              --format ext4 \
              --images-dir "var/engram/images-$VARIANT" \
              --inject-agent target/x86_64-unknown-linux-musl/release/engram-agentd \
              --push "$PUSH_URI"
          echo "Pushed: $PUSH_URI"

      - name: Mirror primary tag to alias tags
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
          EXTRA_TAGS: ${{ steps.tags.outputs.extra_tags }}
        run: |
          # crane copies tags without re-uploading layers — saves
          # bandwidth vs `docker pull && tag && push`. (The harness
          # bake intentionally doesn't mirror to `:main` / `:latest`
          # aliases — it sticks to the pinned `<version>-<platform>`
          # tag per ADR 0021's reproducibility rule.)
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin crane
          crane auth login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Mirroring $PRIMARY -> $tag"
            crane copy "$PRIMARY" "$tag"
          done <<< "$EXTRA_TAGS"

      - name: Summarize
        if: always()
        env:
          SHA: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "## ${VARIANT} image bake" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- engrams SHA: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pushed: \`ghcr.io/${{ github.repository }}/$VARIANT:warm-$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Build the release binaries the e2e lane consumes. Separated so the
  # ~3min compile happens once and the e2e job downloads via the
  # workflow artifact rather than rebuilding. Cache key shares with
  # `test-firecracker` so deps are warm.
  # ------------------------------------------------------------------
  artifacts-e2e-stack:
    name: build e2e binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: x86_64-unknown-linux-musl

      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install musl tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with bake-demo-image — see that job's cache step
          # for the rationale (release+musl dep graph).
          shared-key: release-musl-bake

      - name: Build host binaries (release)
        run: |
          # `engram-publish-builtin-harness` is added so the
          # downstream `test-e2e-stack` job can republish the
          # `harness-claude` workflow artifact into the integration
          # registry without a separate cargo build (ADR 0021 P0).
          cargo build --release \
              -p engram-coordinator \
              -p engram-host-agent \
              -p engram-cli \
              -p engram-publish-builtin-harness

      - name: Build musl agentd (release)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
              -p engram-agentd

      - name: Upload e2e binaries
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          path: |
            target/release/engram-coordinator
            target/release/engram-host-agent
            target/release/engram-cli
            target/release/engram-publish-builtin-harness
            target/x86_64-unknown-linux-musl/release/engram-agentd
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # True end-to-end against the prod-shape stack. Brings up postgres
  # + fake-gcs + local registry + real coord + real host-agent + real
  # Firecracker. The `demo-claude` bake pulls its `harness-claude`
  # artifact from the **local registry** (localhost:5001) which this
  # lane populates from the workflow artifact uploaded by
  # `bake-harness-claude-artifact`. The catalog override
  # (`ENGRAM_BUILTIN_HARNESS_CLAUDE_REPO`) makes the in-baker
  # resolution swap transparently — same tag suffix, different repo.
  # Runs the three flows in `e2e_stack.rs`.
  #
  # DAG dep on the cheap gates only (lint, test-linux, web,
  # cross-musl-linux) plus the artifacts producer. `test-firecracker`
  # is intentionally NOT in `needs:` — it tests the host-agent's
  # PooledBackend in isolation; this lane tests the coord HTTP →
  # gRPC → host-agent path. Orthogonal coverage; running them in
  # parallel saves ~6min on the critical path on push-to-main and a
  # flaky `proxy_e2e` doesn't suppress e2e-stack signal.
  # ------------------------------------------------------------------
  test-e2e-stack:
    name: e2e stack (coord HTTP → gRPC → FC)
    needs:
      - lint
      - test-linux
      - web
      - cross-musl-linux
      - artifacts-e2e-stack
      # ADR 0021 P0: this lane bakes `deploy/demo-claude/`, which
      # resolves `[harness] builtin = "claude"` through the catalog.
      # The job below provides the harness artifact as a workflow
      # artifact (uploaded on every run regardless of branch). The
      # `Pull harness-claude artifact + republish locally` step
      # downloads it and points the baker at localhost via
      # `ENGRAM_BUILTIN_HARNESS_CLAUDE_REPO`, so the in-PR binary is
      # what gets tested rather than whatever tag GHCR happens to
      # serve.
      - bake-harness-claude-artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # `contents: read` for the checkout; `packages: read` because the
    # host-agent (via coord's HttpAuthResolver, ADR 0013) reads sealed
    # creds from PG seeded by `engram-cli registry add` below — that
    # path still uses GHCR for the demo image's chunked OCI layers if
    # the integration test expands. The *baker* never pulls from GHCR
    # in this lane: the harness artifact comes from a workflow-artifact
    # download + local re-publish (see "Pull harness-claude artifact"
    # below), and the catalog override redirects the resolution there.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      # nextest is what every other test step in this workflow uses.
      - uses: taiki-e/install-action@nextest

      # The Tiltfile's `bootstrap` local_resource runs `just bootstrap`,
      # so the runner needs `just` (Blacksmith runners don't ship it; the
      # other CI jobs hit cargo directly).
      - uses: taiki-e/install-action@just

      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: Cache cargo build (for the e2e test binary itself)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with lint + test-linux: the e2e_stack test binary
          # links in engram-coordinator's full dep graph at debug
          # profile, so the cache populated by the earlier debug
          # workspace jobs hits ~all of it. Saves ~1-2min of cold
          # cargo compile on this lane.
          shared-key: workspace-debug

      # Same KVM + UFFD relax pattern test-firecracker uses (lines
      # 308-312 above). Blacksmith runners ship /dev/kvm but the
      # default perms exclude non-root user processes.
      - name: Relax KVM + UFFD permissions
        run: |
          sudo chmod 0666 /dev/kvm
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo chmod 0666 /dev/userfaultfd

      - name: Install build deps (musl-tools, e2fsprogs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              musl-tools e2fsprogs jq bc python3

      - name: Install firecracker (v1.16.0)
        run: |
          FC_VER=v1.16.0
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" \
            -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" \
              /usr/local/bin/firecracker
          firecracker --version

      - name: Cache FC kernel + rootfs artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-fc-test
          key: fc-test-artifacts-${{ hashFiles('crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh') }}
          restore-keys: |
            fc-test-artifacts-

      - name: Fetch FC kernel + rootfs artifacts
        # GH_TOKEN: private release asset for the FC guest kernel (ADR 0025).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            --cache-dir "$HOME/.cache/engram-fc-test"

      # Pull the release binaries AFTER the Swatinem/rust-cache@v2
      # restore step (`Cache cargo build` above). Surfaced in CI run
      # 26344875066: rust-cache's restore prunes "stale" entries from
      # target/<profile>/ when the lockfile hash changes (Cargo.lock
      # touched by a workspace dep add in ADR 0016 Phase A). The
      # download placed engram-coordinator/host-agent/cli at
      # target/release/, the cache restore wiped them, and
      # the Tiltfile's prebuilt-binary branch had nothing to exec for
      # coord + host-agent, and engram-cli was missing — which broke the
      # next step's `./target/release/engram-cli registry add`. Moving
      # the download below all rust-cache operations
      # makes the order unambiguous: nothing can prune what hasn't
      # been written yet.
      #
      # actions/upload-artifact@v4 strips the longest common path
      # prefix shared by all `path:` entries when packing — for the
      # artifacts-e2e-stack upload that's `target/`, so the artifact
      # contents are flattened to `release/...` +
      # `x86_64-unknown-linux-musl/release/...`. Downloading directly
      # into `./target/` reconstructs the expected layout in place.
      - name: Download e2e binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
          path: ./target/

      - name: Mark e2e binaries executable
        run: |
          chmod +x target/release/engram-{coordinator,host-agent,cli,publish-builtin-harness}
          chmod +x target/x86_64-unknown-linux-musl/release/engram-agentd
          ls -l target/release/engram-{coordinator,host-agent,cli,publish-builtin-harness} \
                target/x86_64-unknown-linux-musl/release/engram-agentd

      # `tilt up` (via tilt-up-ci.sh) boots: postgres + fake-gcs +
      # registry + jaeger via docker-compose, then coord + host-agent.
      # ENGRAM_INTEG_BIN_DIR=target/release makes the Tiltfile exec the
      # downloaded release binaries instead of `cargo run`/build.
      # ENGRAM_SKIP_WEB=1 because there's no browser in CI for the SPA.
      # Tilt is the one dev orchestrator (ADR 0024). Local dev gets it
      # from the nix devShell; CI runners aren't in nix, so install the
      # pinned release binary via the official script.
      - name: Install Tilt
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh \
            | sudo bash
          tilt version

      - name: Bring up prod-shape stack (tilt)
        env:
          ENGRAM_INTEG_BIN_DIR: ./target/release
          ENGRAM_SKIP_WEB: "1"
          # Enable the per-session egress proxy. The local dev path
          # defaults to disabled (unfiltered network — relies on the
          # dev VM's host masquerade). The Blacksmith runner doesn't
          # NAT FC TAP traffic to its outbound interface, so guests
          # need to route via the proxy. Mirrors what `e2e_harness.rs`
          # in test-firecracker already does at the PooledBackend
          # layer.
          ENGRAM_EGRESS_PROXY_PORT: "14443"
        run: |
          # ADR 0025/0027: boot the OWNED guest kernel (6.1.102) the fetch
          # script provides + prod runs — it carries CONFIG_SQUASHFS_ZSTD=y so
          # the init-shim can mount the RO bundles. (The stale vmlinux-5.10.223
          # reference predated ADR 0025 owning the kernel.)
          export ENGRAM_KERNEL_IMAGE_PATH="$HOME/.cache/engram-fc-test/vmlinux"
          bash deploy/dev/tilt-up-ci.sh

      # ADR 0027 → 0035: stage the skills RO bundle CONTENT-ADDRESSED
      # (<name>-<sha256>.squashfs + current.json stamp) — the same shape the
      # FC-host image bake produces. The FC backend resolves the symbolic
      # `skills` drive against the stamp at base-snapshot capture; without the
      # stamp the enable 500s (loudly, by design — a host that can't satisfy a
      # requested aux drive must not capture a skills-less snapshot). The init
      # shim mounts it (the owned 6.1 kernel has squashfs), agentd wires
      # share-file, and `e2e_session_has_mounted_skills_bundle` asserts the
      # whole path. (Only `skills` — the demo image isn't `[browser]`-enabled,
      # so coord doesn't declare the heavy playwright drive.)
      - name: Stage RO skills bundle (ADR 0035)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
          deploy/bundles/skills/build.sh /tmp/skills.squashfs
          sudo mkdir -p /var/lib/engram/shared
          SKILLS_SHA=$(sha256sum /tmp/skills.squashfs | cut -d' ' -f1)
          sudo install -m 0644 /tmp/skills.squashfs "/var/lib/engram/shared/skills-$SKILLS_SHA.squashfs"
          printf '{"skills": "%s"}\n' "$SKILLS_SHA" | sudo tee /var/lib/engram/shared/current.json >/dev/null
          ls -l /var/lib/engram/shared/

      # ADR 0013: host-agent doesn't read docker config; it asks
      # the coord per-pull, and the coord reads sealed credentials
      # from the `registry_credentials` PG table populated via
      # `engram-cli registry add`. Seed ghcr.io with the GITHUB_TOKEN
      # this job was issued (the `permissions: packages: read` block
      # at the top of this job is what makes it pullable). Pipe via
      # --password-stdin so the token never lands in argv / ps.
      - name: Seed GHCR credential in coord PG
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ./target/release/engram-cli \
              --endpoint http://localhost:8090 \
              registry add \
              --host ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      # ADR 0021 P0: pull the harness-claude artifact built by the
      # upstream `bake-harness-claude-artifact` job, re-publish to
      # the integration test's local registry (the `registry:2`
      # container `tilt up` brought up on port 5001), and let the
      # catalog override route the demo-claude bake to it.
      #
      # Why this shape (vs pulling from GHCR):
      # - Tests THIS PR's harness binary, not whatever tag main
      #   happened to publish last.
      # - Closes the catch-22 where a PR that bumps HARNESS_VERSION
      #   couldn't bake because the new tag didn't exist in GHCR yet.
      # - Never publishes a PR-built binary to a production-consumed
      #   GHCR namespace.
      - name: Pull harness-claude artifact + republish locally
        env:
          LOCAL_REPO: localhost:5001/cortexapps/engrams/harness-claude
        run: |
          mkdir -p var/harness-claude-stage
        # ↑ ensure target exists for download-artifact's path: arg.

      - name: Download harness-claude workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-claude-artifact
          path: var/harness-claude-stage

      - name: Restore +x on staged binaries
        run: |
          # actions/upload-artifact@v4 zips the staged directory and
          # actions/download-artifact@v4 unzips it — the ZIP format
          # only carries Unix mode bits as a non-standard extension
          # that some unzip implementations drop. Without this, the
          # baker happily packs the harness into the rootfs as
          # mode 0644, FC boots fine, and agentd's `SpawnHarness`
          # blows up with `Permission denied (os error 13)` when it
          # tries to exec /opt/engram/harness/harness.
          #
          # Belt-and-braces fix: re-set +x on both binaries before
          # we hand the staged dir to `engram-publish-builtin-harness`.
          # The artifact.toml descriptor stays at the default 0644.
          chmod +x var/harness-claude-stage/harness var/harness-claude-stage/claude
          ls -la var/harness-claude-stage/

      - name: Republish harness-claude to local registry + export catalog override
        env:
          LOCAL_REPO: localhost:5001/cortexapps/engrams/harness-claude
        run: |
          TAG="${LOCAL_REPO}:${HARNESS_VERSION}-${HARNESS_PLATFORM}"
          echo "Republishing harness-claude to $TAG"
          # `engram-publish-builtin-harness` was downloaded with the
          # other e2e binaries in the Download e2e binaries step
          # above.
          ./target/release/engram-publish-builtin-harness \
            --from var/harness-claude-stage \
            --to "$TAG"
          # Catalog override: the in-baker
          # `engram-image-builder::BuiltinCatalog::with_overrides_from_env`
          # picks this up and redirects `[harness] builtin = "claude"`
          # resolution to the local registry. Exported via $GITHUB_ENV
          # so subsequent steps (the bake) inherit it.
          echo "ENGRAM_BUILTIN_HARNESS_CLAUDE_REPO=${LOCAL_REPO}" >> "$GITHUB_ENV"
          echo "Catalog override set: ENGRAM_BUILTIN_HARNESS_CLAUDE_REPO=${LOCAL_REPO}"

      - name: Bake demo image + capture URI
        run: |
          IMAGE_URI=$(bash deploy/dev/integration-bake-demo.sh)
          echo "    baked image: $IMAGE_URI"
          echo "ENGRAM_E2E_IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # ADR 0021 P1.5 retired `engram-cli harness add` and the
      # entire `harness_packs` registry. The Claude harness now
      # rides inside the baked image at /opt/engram/harness/ — the
      # `integration-bake-demo.sh` step above baked `demo-claude/`
      # which pulls the published harness-claude artifact from GHCR
      # at bake time and injects it into the rootfs. No separate
      # registration step is needed; the harness contract lives in
      # `manifest.toml` and coord reads it from there.

      - name: Run e2e_stack tests
        env:
          ENGRAM_E2E_COORD_URL: http://127.0.0.1:8090
          # ENGRAM_E2E_IMAGE_URI set via $GITHUB_ENV in the bake step;
          # points at the just-baked `demo-claude` image whose
          # manifest.toml carries the resolved Claude harness contract.
          #
          # Blacksmith's kernel ships NBD built-in (CONFIG_BLK_DEV_NBD=y),
          # so the Tiltfile's `ls /dev/nbd*` discovery wires
          # ENGRAM_NBD_DEVICES and the root host-agent NBD-attaches the
          # chunked disk. Assert it: a null cow-state here is now a real
          # regression, not the old "no nbd.ko" environment gap, so the
          # Phase B chunked-disk tests fail loud instead of skipping.
          ENGRAM_EXPECT_NBD: "1"
        run: |
          cargo nextest run \
              -p engram-coordinator \
              --test e2e_stack \
              --run-ignored ignored-only \
              --no-fail-fast \
              --test-threads=1

      - name: Dump tilt + stack logs on failure
        if: failure()
        run: |
          echo "--- tilt.log (last 300 lines: coord + host-agent streams) ---"
          tail -300 var/integration/tilt.log 2>/dev/null || true

      - name: Tear down stack
        if: always()
        run: |
          # `tilt down` re-evaluates the Tiltfile, which fail()s if the
          # FC kernel env isn't set (only the bring-up step exported it).
          # ADR 0025/0027: boot the OWNED guest kernel (6.1.102) the fetch
          # script provides + prod runs — it carries CONFIG_SQUASHFS_ZSTD=y so
          # the init-shim can mount the RO bundles. (The stale vmlinux-5.10.223
          # reference predated ADR 0025 owning the kernel.)
          export ENGRAM_KERNEL_IMAGE_PATH="$HOME/.cache/engram-fc-test/vmlinux"
          bash deploy/dev/tilt-down-ci.sh || true
