name: CI

# Linux Rust + web/pnpm gate. The macOS / Apple-Silicon coverage
# lives in ci-macos-vz.yml; together they form the full CI surface.
#
# Surfaces this workflow exercises:
#   - lint:             cargo fmt --check, cargo clippy -D warnings
#   - test-linux:       cargo nextest workspace tests + doctests, plus
#                       the Postgres-gated `ha_listener` ignored tests
#                       against the postgres service container
#   - cross-musl:       cross-compile engram-agentd / engram-bootstrap
#                       / the harness wrappers to
#                       x86_64-unknown-linux-musl (catches breakage of
#                       the FC image bake chain)
#   - test-firecracker: every `#[ignore]`'d FC integration test
#                       (boot, lifecycle, snapshot, snapshot_uffd,
#                       exec_real_vm) under nested virt.
#   - web:              pnpm install + tsc + vite build + vitest
#
# All jobs run on Blacksmith Linux runners
# (https://docs.blacksmith.sh/blacksmith-runners/overview) — faster
# CPUs + nested-virt support across the whole matrix, not just the FC
# job. Tier sizing is per-job (2vcpu for cheap stuff, 4vcpu for
# Postgres/test runs and KVM workloads).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy + check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # `if: always()` so each gate runs regardless of which earlier
      # step failed — surfaces fmt + clippy + check failures together
      # in one CI run instead of forcing a fix-and-rerun loop. The job
      # still ends red if any step fails (the workflow conclusion is
      # the worst step's conclusion).
      - name: cargo fmt --all -- --check
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check --workspace --all-targets
        if: always()
        run: cargo check --workspace --all-targets

  test-linux:
    name: tests (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # Used by the `#[ignore]`'d ha_listener tests in
      # crates/engram-coordinator/tests/ha_listener.rs. The tests run
      # `store.migrate()` themselves before exercising NOTIFY/LISTEN,
      # so a bare Postgres without engram migrations is fine.
      ENGRAM_TEST_DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Default (non-ignored) tests across the entire workspace. Mirrors
      # `just check`'s nextest pass — same speedup, same coverage. The
      # engram-image-builder e2e bake test skips itself if `docker` is
      # not on PATH; ubuntu-latest ships Docker, so it runs.
      #
      # `--no-fail-fast` reports every failing test instead of stopping
      # at the first; `if: always()` keeps the doctests + ha_listener
      # steps below running even if this one fails.
      - name: cargo nextest run --workspace
        if: always()
        run: cargo nextest run --workspace --no-fail-fast

      # nextest doesn't run doctests yet (see justfile note). Ride the
      # vanilla cargo runner for the doc pass.
      - name: cargo test --workspace --doc
        if: always()
        run: cargo test --workspace --doc --no-fail-fast

      # Postgres-gated ignored tests — the FC `#[ignore]` set needs KVM
      # so we don't try to run them here. Scoping by `--test` keeps us
      # from accidentally tripping firecracker tests that share the
      # `#[ignore]` bucket.
      #
      # `--test-threads=1` is load-bearing: the two ha_listener tests
      # both LISTEN on the `session_events` channel of the same
      # Postgres database. Run in parallel they cross-talk — test B's
      # listener catches test A's NOTIFY, the session_id assertion
      # fires on the wrong row. Production has one listener per
      # coordinator, so this is purely a test-harness artifact.
      - name: ha_listener ignored tests (Postgres NOTIFY/LISTEN)
        if: always()
        run: |
          cargo nextest run \
            -p engram-coordinator \
            --test ha_listener \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # Diagnostics that surface why `timeout_kills_runaway_command_and_reports_124`
      # fails on Blacksmith with elapsed=30s (= the full sleep duration) but
      # passes on macOS + the dev VM. Captures process-isolation state and
      # an isolated kill repro. Drop once test-linux is reliably green.
      - name: Diagnose timeout_kills (failure only)
        if: failure()
        run: |
          set +e
          echo "=== /proc/self/status (caps + namespaces) ==="
          grep -E '^(Uid|Gid|CapInh|CapPrm|CapEff|CapBnd|CapAmb|Seccomp|NoNewPrivs|NSpid|NSpgid|NSsid)' /proc/self/status
          echo "=== /proc/self/ns/ ==="
          ls -l /proc/self/ns/
          echo "=== sysctl kernel.yama.ptrace_scope ==="
          sysctl kernel.yama.ptrace_scope 2>&1 || true

          echo "=== isolated kill repro: spawn sh -c 'sleep 30', kill -KILL, observe ==="
          ( sh -c 'sleep 30' ) &
          PID=$!
          ps -p $PID -o pid,ppid,pgid,sid,stat,cmd 2>&1 || true
          sleep 0.2
          kill -KILL $PID
          rc=$?
          echo "kill -KILL $PID exit code: $rc"
          sleep 0.2
          if kill -0 $PID 2>/dev/null; then
            echo "PID $PID STILL ALIVE after kill -KILL"
            ps -p $PID -o pid,ppid,pgid,sid,stat,cmd 2>&1 || true
          else
            echo "PID $PID is gone (kill worked)"
          fi
          wait $PID 2>/dev/null
          echo "wait returned: $?"

          echo "=== rerun timeout_kills with --nocapture for stderr ==="
          cargo test -p engram-sandbox-process \
            timeout_kills_runaway_command_and_reports_124 \
            -- --nocapture 2>&1 | tail -40 || true

  cross-musl-linux:
    name: cross-compile linux-musl artifacts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Mirrors what `just install-harnesses` and `just fc-bake-demo`
      # produce on Linux. If any of these stop building the demo bake
      # path is broken even when the host-target workspace check is
      # green.
      - name: build agentd + bootstrap (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-agentd \
            -p engram-bootstrap

      - name: build harness wrappers (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-harness-noop \
            -p engram-harness-claude

  web:
    name: web (pnpm)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc -b && vite build` — gives us typecheck
      # AND production bundle validation in one step.
      - name: pnpm build (tsc -b + vite build)
        run: pnpm build

      # Vitest. Currently exercises TerminalPane mount/unmount/remount
      # ordering against a mocked ghostty-web; expand as more components
      # gain regression tests.
      - name: pnpm test (vitest)
        run: pnpm test

  test-firecracker:
    name: tests (firecracker, Linux + KVM)
    # Blacksmith exposes `/dev/kvm` via nested virtualization (see
    # https://docs.blacksmith.sh/blacksmith-runners/overview). Mirrors
    # the dev-vm bootstrap (engram-dev) — the canonical Linux + KVM
    # env for Firecracker development. 4vCPU gives boot+lifecycle
    # tests enough headroom to run microVMs without queuing.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Defense-in-depth: Blacksmith should already expose /dev/kvm
      # at 0666, but the bootstrap script in `.claude/skills/dev-vm/
      # scripts/bootstrap-remote.sh` does the same chmod, so mirror
      # it. No-op if the device is already world-rw.
      - name: Ensure /dev/kvm is accessible
        run: |
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm

      # `mke2fs` (e2fsprogs) is needed by the exec_real_vm test for
      # ext4 packing. `musl-tools` is for the static agentd build that
      # the same test bakes into the rootfs.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs

      # Pin to v1.10 to match the `firecracker-ci/v1.10` artifact
      # bucket that fetch-fc-test-artifacts.sh pulls from. Bumping
      # both pins should be a coordinated change — kernel ABI between
      # the host firecracker binary and the kernel image needs to
      # match.
      - name: Install firecracker (v1.10.1)
        env:
          FC_VER: v1.10.1
        run: |
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      # snapshot_uffd opens /dev/userfaultfd directly (FC 1.10+
      # behavior). Two things can block this on a hosted runner:
      #
      #   1. /dev/userfaultfd is mode 0600 root-only — relax to 0666.
      #   2. vm.unprivileged_userfaultfd=0 — flip to 1 so non-root
      #      processes can call userfaultfd(2). Required when FC runs
      #      as the runner user, not root.
      #
      # Dump diagnostic state too so a failing snapshot_uffd has data
      # to debug from (kernel version, sysctl, device permissions).
      - name: UFFD setup + diagnostics
        run: |
          echo "=== uname -r ==="
          uname -r
          echo "=== /dev/userfaultfd ==="
          ls -l /dev/userfaultfd 2>&1 || echo "MISSING"
          echo "=== sysctl vm.unprivileged_userfaultfd (before) ==="
          sysctl vm.unprivileged_userfaultfd 2>&1 || echo "(sysctl not present)"
          echo "=== set vm.unprivileged_userfaultfd=1 ==="
          sudo sysctl -w vm.unprivileged_userfaultfd=1 2>&1 || echo "(sysctl write failed)"
          echo "=== relax /dev/userfaultfd permissions ==="
          sudo chmod 0666 /dev/userfaultfd 2>&1 || echo "chmod failed (device missing?)"
          ls -l /dev/userfaultfd 2>&1 || true

      # Drop the cached kernel + ubuntu rootfs into ~/.cache/engram-fc-test
      # and emit the `FC_TEST_KERNEL` / `FC_TEST_ROOTFS` env vars that
      # `common::fc_preflight()` reads.
      - name: Fetch FC kernel + rootfs artifacts
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            | sed 's/^export //' >> "$GITHUB_ENV"

      # snapshot_uffd needs the host-side handler binary in
      # `target/debug/` (the test resolves it relative to
      # CARGO_MANIFEST_DIR).
      - name: Build engram-uffd-handler
        run: cargo build -p engram-uffd-handler

      # exec_real_vm bakes a static agent into a rootfs at runtime and
      # boots it; the binary must be musl-static so it runs against
      # whatever libc the rootfs ships.
      - name: Build static engram-agentd (musl)
        run: cargo build -p engram-agentd --target x86_64-unknown-linux-musl --release

      # Run all five `#[ignore]`'d FC integration tests:
      #   boot, lifecycle, snapshot, snapshot_uffd, exec_real_vm.
      # `--no-fail-fast` so a regression in one test doesn't hide
      # regressions in others.
      #
      # `--test-threads=1` is load-bearing: each test creates its own
      # `FirecrackerBackend`, whose vsock CID allocator restarts at 3
      # (CIDs are host-global, so concurrent tests collide and the
      # second VM hits "connect firecracker.sock: Connection refused"
      # when it can't bind a CID). Production runs one backend per
      # host so this isn't an issue there. Booting real microVMs is
      # heavy enough that serial execution is fine.
      - name: Firecracker `#[ignore]` tests
        run: |
          cargo nextest run \
            -p engram-sandbox-firecracker \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # Diagnostics for `snapshot_uffd`, which fails with FC's UFFD
      # handshake hanging after the socket connect (handler logs
      # "Firecracker connected; awaiting handshake" then nothing for
      # 10s). Re-runs the test in isolation while strace'ing FC, then
      # dumps the strace tail + the test's firecracker.log/uffd-handler.log
      # so we can see exactly which syscall FC is stuck on. Drop once
      # snapshot_uffd is reliably green.
      - name: Diagnose snapshot_uffd (failure only)
        if: failure()
        run: |
          set +e
          sudo apt-get install -y -qq strace

          # Set up isolation dir so we can find the test's tempdir
          # afterward (they live in /tmp/.tmp* by default, hard to glob).
          export TMPDIR=/tmp/uffd-debug
          mkdir -p $TMPDIR
          rm -rf $TMPDIR/*

          # Background the test so we can attach strace mid-run.
          (
            RUST_BACKTRACE=1 cargo nextest run \
              -p engram-sandbox-firecracker \
              --test snapshot_uffd \
              --run-ignored ignored-only \
              --no-fail-fast --test-threads=1 \
              -- --nocapture 2>&1 | tee $TMPDIR/test.out
          ) &
          TEST_PID=$!

          # Wait for FC to launch under the snapshot_uffd test (it boots
          # its first VM ~5s in, then snapshots, then `restore` is when
          # UFFD handshake hangs). We poll every 0.5s for up to 30s.
          FC_PID=""
          for i in $(seq 1 60); do
            FC_PID=$(pgrep -f "firecracker --api-sock" | head -1)
            [ -n "$FC_PID" ] && break
            sleep 0.5
          done
          if [ -z "$FC_PID" ]; then
            echo "FC pid never appeared; test must've failed before reaching restore"
            wait $TEST_PID
            tail -100 $TMPDIR/test.out
            exit 0  # diagnostic step, don't mask the original failure
          fi
          echo "Attached to firecracker PID $FC_PID"

          # Trace the syscalls we care about for UFFD restore — open
          # /dev/userfaultfd, ioctl on the fd, sendmsg for SCM_RIGHTS.
          sudo strace -fp $FC_PID -o $TMPDIR/fc.strace -s 256 \
            -e 'trace=openat,ioctl,connect,sendmsg,recvmsg,close,mmap' &
          STRACE_PID=$!

          wait $TEST_PID
          sudo kill $STRACE_PID 2>/dev/null
          sleep 1

          echo "=== last 200 lines of FC strace ==="
          sudo tail -200 $TMPDIR/fc.strace 2>&1 || true

          echo "=== /dev/userfaultfd opens (any) ==="
          sudo grep -E "openat\(.*userfaultfd|UFFDIO_" $TMPDIR/fc.strace 2>&1 | head -40

          echo "=== sendmsg with SCM_RIGHTS (handshake) ==="
          sudo grep -E "sendmsg.*SCM_RIGHTS" $TMPDIR/fc.strace 2>&1 || echo "(no SCM_RIGHTS sendmsg observed — handshake never sent)"

          echo "=== test output tail ==="
          tail -60 $TMPDIR/test.out
