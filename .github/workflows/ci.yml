name: CI

# Linux Rust + web/pnpm gate. The macOS / Apple-Silicon coverage
# lives in ci-macos-vz.yml; together they form the full CI surface.
#
# Surfaces this workflow exercises:
#   - lint:             cargo fmt --check, cargo clippy -D warnings,
#                       cargo check workspace
#   - test-linux:       cargo nextest workspace tests, plus
#                       Postgres-gated ignored tests (ha_listener,
#                       snapshot_disk_manifest_persistence) against
#                       the postgres service container, plus the
#                       GCS-emulator round-trip via fake-gcs-server
#   - cross-musl:       cross-compile engram-agentd + the harness
#                       wrappers to x86_64-unknown-linux-musl
#                       (catches breakage of the FC image bake chain).
#                       engram-bootstrap was collapsed into
#                       engram-agentd by ADR 0015 M1 (`75ba2df`).
#   - test-firecracker: every `#[ignore]`'d FC integration test under
#                       nested virt. Unprivileged set: boot, lifecycle,
#                       snapshot, snapshot_uffd, exec_real_vm,
#                       harness_loopback, multi_restore, restore_chain,
#                       option_d_latency_bench, cross_host_restore.
#                       ADR 0007 set: nbd_chunked_disk (Linux + nbd,
#                       gated — see the step). (canonical_capture was
#                       retired by ADR 0015 M5, `18be1ad`, when the
#                       bake-time memory-snapshot path was removed.)
#                       Root set under sudo for iptables + TAP + loop
#                       mounts: host_startup, proxy_e2e, snapshot_net,
#                       patch_drive_swap, option_d_warm_lease.
#   - web:              pnpm install + oxlint + tsc + vite build +
#                       vitest
#   - cli:              the `engrams` product CLI (cli/, Bun):
#                       typecheck + stub-orchestrator tests + a
#                       compiled-binary smoke
#   - bake-demo-image:  push-to-main only. ADR 0080: a plain
#                       `docker build && docker push` of deploy/demo
#                       to `ghcr.io/cortexapps/engrams/demo:warm-<sha>`
#                       (+ :main / :latest aliases). The coordinator
#                       materializes the rootfs host-side at enable —
#                       no bake CLI, no agentd/ttyd injection.
#   - artifacts-e2e-stack: release-builds engram-coordinator +
#                       engram-host-agent + musl engram-agentd ONCE
#                       and uploads as a workflow artifact. Consumed
#                       by `test-e2e-stack` so the e2e lane doesn't
#                       pay the compile cost again. (The `engrams`
#                       CLI is Bun — the e2e job runs it from cli/
#                       source.)
#   - test-e2e-stack:   true end-to-end against the prod-shape
#                       stack: real coord HTTP API + real gRPC + real
#                       host-agent + real Firecracker + real chunked
#                       OCI via fake-gcs + real local registry +
#                       published Claude harness pack. Runs three
#                       flows: cold session with harness=none + exec
#                       ls; cold session with harness=claude + exec
#                       ls; cold session with harness=claude + bogus
#                       API key + prompt → assert auth failure event.
#                       Closes the gap that let prod session
#                       8725648d's empty-Binary-frame bug ship (all
#                       existing FC tests bypass the coord HTTP path).
#
# All jobs run on Blacksmith Linux runners
# (https://docs.blacksmith.sh/blacksmith-runners/overview) — faster
# CPUs + nested-virt support across the whole matrix, not just the FC
# job. Tier sizing is per-job (2vcpu for cheap stuff, 4vcpu for
# Postgres/test runs and KVM workloads).

on:
  push:
    branches: [main]
  # No base-branch filter: STACKED PRs (base = another feature branch)
  # must run the same checks — with the old `branches: [main]` filter
  # they triggered no run at all, leaving the ruleset's required
  # contexts "waiting for status to be reported" until a base retarget
  # (whose late-fired run then built a racy stale merge ref).
  pull_request:
  # GitHub Merge Queue fires `merge_group` events for the temporary
  # ref it builds out of (current main + queued PRs combined). Branch
  # protection blocks the queue from completing until every required
  # check passes against THIS ref, which is what guarantees main's
  # HEAD was CI'd against the exact tree being merged.
  merge_group:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-progress PR run when a new push lands on the same
# branch — saves runner minutes during fix-and-rerun cycles. Pushes
# to `main` are *not* cancelled (we want a CI record per merged
# commit, even on rapid back-to-back merges).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only repo access. No job here writes to the repo
# (no GH releases, no commit-back, no PR comments), so least
# privilege. `packages: read` is load-bearing: the test-firecracker
# job oras-pulls the forked firecracker artifact from GHCR — without
# it the pull is DENIED and every fork-gated FC test (the ADR 0045 R2
# stock<->fork compat gate, the substrate suites, vmstate_only)
# silently green-by-skips.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

  # Single source of truth for the built-in claude harness artifact's
  # tag (ADR 0062 — the artifact rides the host bundle stamp, not the
  # image). Used by:
  #   - `bake-harness-claude-artifact` (publishes to GHCR on
  #     push-to-main; uploads as workflow artifact on every run)
  #   - `test-e2e-stack` (downloads the artifact, unpacks it into
  #     ENGRAM_HARNESS_CLAUDE_TREE for the bundle stamp)
  HARNESS_VERSION: v0.1.0
  HARNESS_PLATFORM: linux-x86_64

jobs:
  # Change-detection for the expensive, NON-REQUIRED e2e lane. Reuses the
  # same cargo-dep-closure detector as bake-images.yml so "any crate in
  # the e2e binaries' release closure" is expressed precisely (a glob
  # filter can't). Only the `e2e` output is consumed here; the rest are
  # emitted for free. The e2e jobs gate on this for pull_request events;
  # push-to-main and merge_group always run them (see their `if:`).
  detect:
    name: detect changed lanes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      e2e: ${{ steps.lanes.outputs.e2e }}
      # PR test lanes — each gates the matching job below. A CI-workflow or
      # detector change sets all of these (see detect-rebake-lanes.py), so a
      # change to how CI runs re-runs everything.
      test_rust: ${{ steps.lanes.outputs.test_rust }}
      test_cross: ${{ steps.lanes.outputs.test_cross }}
      test_fc: ${{ steps.lanes.outputs.test_fc }}
      test_web: ${{ steps.lanes.outputs.test_web }}
      test_orchestrator: ${{ steps.lanes.outputs.test_orchestrator }}
      test_cli: ${{ steps.lanes.outputs.test_cli }}
      test_buf: ${{ steps.lanes.outputs.test_buf }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR base SHA is present for the diff.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Detect changed lanes
        id: lanes
        run: |
          # PRs diff against the base SHA (an ancestor of the checked-out
          # merge commit under fetch-depth:0). Other events (merge_group,
          # push) fall back to HEAD^! — the squashed change set of the commit.
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          python3 .github/scripts/detect-rebake-lanes.py --base "$BASE" --head HEAD

  lint:
    name: fmt + clippy + check
    needs: detect
    if: needs.detect.outputs.test_rust == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ADR 0013: `engram-protocol/build.rs` invokes `protoc` to
      # compile `proto/host_service.proto` into Rust bindings.
      # `arduino/setup-protoc` pulls a recent protoc release from
      # https://github.com/protocolbuffers/protobuf/releases and
      # puts it on PATH. Cross-platform (Linux + macOS) so every
      # workflow that touches Rust uses the same step.
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      # Parallel linker — installs a prebuilt mold release (~1–2s)
      # and (with the action's default `make-default: true`) points
      # /usr/bin/ld at it so cargo's default cc→ld chain picks it up
      # transparently. Cuts incremental link time 3–10× on this
      # multi-binary workspace, net positive after install overhead.
      # Skipped on cross-musl-linux (musl-gcc has its own bundled
      # ld) and on test-e2e-stack (downloads prebuilt binaries, no
      # native link step happens).
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with test-linux + test-e2e-stack: all three build
          # the workspace's debug profile, so cargo's `target/debug/`
          # contents (deps + workspace artifacts) populate the same
          # cache bucket and each subsequent job sees prior deps as
          # already-compiled.
          shared-key: workspace-debug

      # Install cargo-hakari from a prebuilt release (~1s) so we can
      # `cargo hakari verify` below. The dev shell pulls this from
      # nixpkgs; CI uses taiki-e/install-action to avoid a slow
      # `cargo install` from source.
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      # `if: always()` so each gate runs regardless of which earlier
      # step failed — surfaces fmt + clippy + check failures together
      # in one CI run instead of forcing a fix-and-rerun loop. The job
      # still ends red if any step fails (the workflow conclusion is
      # the worst step's conclusion).
      - name: cargo fmt --all -- --check
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check --workspace --all-targets
        if: always()
        run: cargo check --workspace --all-targets
      # Catch dep additions that didn't regenerate workspace-hack.
      # Run `just hakari` (or `cargo hakari generate`) locally and
      # commit `workspace-hack/Cargo.toml` if this fails.
      - name: cargo hakari verify
        if: always()
        run: cargo hakari verify

  test-linux:
    name: tests (linux)
    needs: detect
    if: needs.detect.outputs.test_rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # Admin URL for the Postgres-gated `#[ignore]`'d tests. ADR 0099 H1:
      # engram-testkit clones every test its OWN database off this URL
      # (template-cloned, pre-migrated), so a bare Postgres is fine — the
      # role just needs CREATEDB (the `postgres` superuser here).
      ENGRAM_TEST_DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_test
      # ADR 0007: the GCS round-trip test in engram-storage-gcs is
      # gated on these env vars (so it no-ops on hosts without the
      # emulator). Setting them at the job level so every nextest
      # invocation in this job exercises the real SDK→emulator path.
      # The chunk store backs onto the same BlobStorage impl, so
      # this also covers the chunked-storage primitive end-to-end.
      STORAGE_EMULATOR_HOST: http://localhost:4443
      ENGRAM_TEST_GCS_BUCKET: engram-snapshots-test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with lint + test-e2e-stack — see lint's cache step
          # for the rationale (debug-profile workspace dep graph).
          shared-key: workspace-debug
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Postgres via plain `docker run` rather than `services:` for the
      # same reason as fake-gcs-server below: service containers can't
      # override the image's CMD, and the Postgres-gated lane runs deeply
      # parallel (ADR 0099 H2) — each test's PostgresStore holds up to an
      # 8-connection pool, so 16 concurrent tests need headroom over the
      # stock max_connections=100.
      - name: Start postgres
        run: |
          docker run -d --name engram-test-pg \
            -e POSTGRES_PASSWORD=engram \
            -e POSTGRES_DB=engram_test \
            -p 5432:5432 \
            postgres:16 \
            -c max_connections=300
          # -h 127.0.0.1 forces TCP: initdb's temporary bootstrap server
          # listens on the unix socket only, so a socket-based pg_isready
          # can report ready before the real server is up.
          for _ in $(seq 1 30); do
            docker exec engram-test-pg pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec engram-test-pg pg_isready -h 127.0.0.1 -U postgres

      # GCS emulator for the cold-tier round-trip test. We can't use
      # `services:` here because github actions service containers
      # don't let us override the image's CMD — fake-gcs-server's
      # default uses HTTPS + a host we can't reach. Plain `docker run`
      # gives us the full CLI surface; mirrors what
      # `deploy/docker-compose.dev.yml` runs locally.
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs-server \
            -p 4443:4443 \
            fsouza/fake-gcs-server:1.54.0 \
            -scheme http -host 0.0.0.0 -port 4443 \
            -public-host localhost:4443

      # Wait for the emulator to come up + seed the test bucket.
      # Mirrors `deploy/dev/seed-buckets.sh` exactly so the local +
      # CI paths share one source of truth.
      - name: Seed GCS test bucket
        run: bash deploy/dev/seed-buckets.sh

      # ADR 0055 P2: mksquashfs for the engram-coordinator `skill_pack`
      # determinism test (it self-skips without the tool — install it so
      # the test actually RUNS in this lane). ADR 0093 retired the
      # mke2fs/e2fsprogs setup that used to sit here: ext4 packing is
      # pure Rust (mkext4).
      - name: Install squashfs-tools
        run: sudo apt-get install -y -qq --no-install-recommends squashfs-tools

      # Default (non-ignored) tests across the entire workspace. Mirrors
      # `just check`'s nextest pass — same speedup, same coverage. The
      # GCS-emulator round-trip uses STORAGE_EMULATOR_HOST set above.
      #
      # `--no-fail-fast` reports every failing test instead of stopping
      # at the first; `if: always()` keeps the ha_listener steps below
      # running even if this one fails.
      - name: cargo nextest run --workspace
        if: always()
        run: cargo nextest run --workspace --no-fail-fast

      # Postgres-gated ignored tests — the FC `#[ignore]` set needs KVM
      # so we don't try to run them here. Scoping by `--test` keeps us
      # from accidentally tripping firecracker tests that share the
      # `#[ignore]` bucket.
      #
      # ADR 0099 H2: every test clones its own database via
      # engram-testkit (NOTIFY is per-database, so the old ha_listener
      # cross-talk that forced `--test-threads=1` is structurally
      # impossible). The tests are PG-IO-bound, so oversubscribe the
      # 4 vcpus: 16 threads × worst-case ~17 connections per test
      # (8-conn store pool + admin conn + a second pool in a few tests)
      # stays under the max_connections=300 the `Start postgres` step
      # provisions.
      - name: Postgres-gated ignored tests
        if: always()
        run: |
          cargo nextest run \
            -p engram-coordinator \
            --test ha_listener \
            --test snapshot_disk_manifest_persistence \
            --test chunk_gc_helpers_live_pg \
            --test bundle_gc_live_pg \
            --test snapshot_blob_gc_live_pg \
            --test admin_chunk_gc_live_pg \
            --test admin_evac_live_pg \
            --test eviction_live_pg \
            --test checkpoint_reconcile_live_pg \
            --test enable_jobs_live_pg \
            --test capture_jobs_live_pg \
            --test claim_cold_base_live_pg \
            --test enable_reuse_live_pg \
            --test placement_reservation_live_pg \
            --test host_register_live_pg \
            --test host_status_transition_live_pg \
            --test queue_scanner_live_pg \
            --test binding_cas_live_pg \
            --test sandbox_owner_live_pg \
            --test outbox_live_pg \
            --test session_ops_live_pg \
            --test mount_catalog_live_pg \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=16

  cross-musl-linux:
    name: cross-compile linux-musl artifacts
    needs: detect
    if: needs.detect.outputs.test_cross == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Job-level (not step-scoped): any crate in this lane can pull in a
    # transitive C dependency that needs the kernel UAPI headers against
    # the musl sysroot (userfaultfd-sys's build-script shim #includes
    # <linux/types.h>, absent from musl-gcc's own sysroot). ADR 0068 added
    # `userfaultfd` to engram-host-agent too (ProbeSandbox's UFFD MINOR
    # self-test) — step-scoping this only onto engram-uffd-handler left
    # the host-agent musl build with CFLAGS=None and it failed the same
    # way uffd-handler used to.
    env:
      CFLAGS_x86_64_unknown_linux_musl: "-idirafter /opt/uapi"
      BINDGEN_EXTRA_CLANG_ARGS: "-idirafter /opt/uapi"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools + kernel uapi headers
        # linux-libc-dev: uffd-handler's transitive userfaultfd-sys build
        # script compiles a C shim that #includes <linux/types.h>, absent
        # from the musl cross-gcc sysroot.
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools linux-libc-dev
          # Adversarial finding from the #663 rollout: injecting ALL of
          # /usr/include poisons any real vendored-C build (zstd-sys) with
          # glibc headers under a musl target. The shim only needs the
          # KERNEL UAPI headers, which are libc-agnostic — stage exactly
          # those in a scoped dir and reference it with -idirafter, so the
          # musl sysroot's own headers always win and only genuinely
          # missing ones (linux/*, asm*/*) fall through.
          sudo mkdir -p /opt/uapi
          sudo cp -r /usr/include/linux /usr/include/asm-generic /opt/uapi/
          sudo cp -r /usr/include/x86_64-linux-gnu/asm /opt/uapi/asm

      # Mirrors what `just bake-demo` produces on Linux. If any of these
      # stop building the demo bake
      # path is broken even when the host-target workspace check is
      # green.
      - name: build agentd (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-agentd

      - name: build harness wrappers (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-harness-noop \
            -p engram-harness-claude

      # The FC host image bake (private deploy repo's
      # bake-fc-host-image workflow) ships this binary into the GCE
      # image. Without this lane, musl regressions in host-agent
      # only surface during a bake, which is too late. `libc::Ioctl`
      # has a different width on musl (`c_int`) vs glibc (`c_ulong`)
      # so anything passing raw `u64` ioctl numbers won't catch this
      # on the gnu workspace check.
      - name: build engram-host-agent (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-host-agent

      # uffd-handler also ships into the FC host image (ADR 0020 Route B),
      # so guard its musl build here too. userfaultfd-sys's C shim needs the
      # kernel uapi headers pointed at via CFLAGS/bindgen (libc-agnostic, so
      # safe to mix with the musl sysroot) — set at the job level above so
      # every step in this lane gets it, not just this one.
      - name: build engram-uffd-handler (musl)
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-uffd-handler

  web:
    name: web (pnpm)
    needs: detect
    if: needs.detect.outputs.test_web == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # oxlint over src/. Fast (Rust-based) static gate; runs before the
      # build so lint failures surface without waiting on tsc + vite.
      - name: pnpm lint (oxlint)
        run: pnpm lint

      # `pnpm build` runs `tsc -b && vite build` — gives us typecheck
      # AND production bundle validation in one step.
      - name: pnpm build (tsc -b + vite build)
        run: pnpm build

      # Vitest. Currently exercises TerminalPane mount/unmount/remount
      # ordering against a mocked ghostty-web; expand as more components
      # gain regression tests.
      - name: pnpm test (vitest)
        run: pnpm test

  # ADR 0051 Task 14: the orchestration tier (Bun/Hono). install + tsc
  # --noEmit + bun test. A Postgres service backs (a) the live DB-gated tests
  # (db.test.ts etc., which self-skip without a reachable ORCHESTRATOR_DATABASE_URL)
  # and (b) the ADR 0060 DBOS engine — DBOS keeps its system tables in a `dbos`
  # schema of this same database. The .live smoke test still self-skips without a
  # live coordinator.
  orchestrator:
    name: orchestrator (bun)
    needs: detect
    if: needs.detect.outputs.test_orchestrator == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram_orchestrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: orchestrator
    env:
      # Required by loadConfig(); tests override per-test via process.env
      # assignments, but the module-level `config` singleton reads this at
      # import time. A dummy value is fine for CI unit tests.
      CONTROL_PLANE_BEARER: ci-test-token
      # Reachable Postgres → the DB-gated tests + the DBOS smoke test run here
      # (instead of self-skipping). `bun run migrate` below applies the Drizzle
      # schema before the suite; DBOS creates its own `dbos` schema on launch.
      ORCHESTRATOR_DATABASE_URL: postgres://postgres:engram@localhost:5432/engram_orchestrator_test
    steps:
      - uses: actions/checkout@v6
      # Exact pin, not "latest": resolving a floating version makes
      # setup-bun list tags via api.github.com, which 503s during GH API
      # incidents and took out whole CI rounds (2026-07-16). An exact
      # version downloads straight from the release CDN — same reason
      # protoc moved to apt. Bump deliberately alongside bun upgrades.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun typecheck
        run: bun run typecheck
      - name: apply orchestrator migrations
        run: bun run migrate
      - name: bun test
        run: bun test

  # The `engrams` product CLI (cli/, Bun + TS, orchestrator-native).
  # Typecheck + the stub-orchestrator test suite (spawns the real entrypoint
  # against an in-process Connect server — no external services needed).
  cli:
    name: cli (bun)
    needs: detect
    if: needs.detect.outputs.test_cli == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      # Exact pin, not "latest": resolving a floating version makes
      # setup-bun list tags via api.github.com, which 503s during GH API
      # incidents and took out whole CI rounds (2026-07-16). An exact
      # version downloads straight from the release CDN — same reason
      # protoc moved to apt. Bump deliberately alongside bun upgrades.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun typecheck
        run: bun run typecheck
      - name: bun test
        run: bun test
      - name: compiled binary smoke
        run: |
          bun run build
          ./dist/engrams --version

  # ADR 0051 §7: buf owns crates/engram-protocol/proto. Lint GATES style —
  # legacy host_service.proto carries scoped exceptions in buf.yaml;
  # everything new must be clean under full STANDARD, and a lint failure
  # fails this job. Breaking-change detection is ADVISORY: it runs against
  # the PR base, but a detected break does NOT fail the job — it surfaces
  # as a `::warning::` plus a detailed PR comment so a reviewer can confirm
  # the wire-compat impact is intended. Codegen-drift activates only once
  # the generated TS bindings are committed (ADR 0051 Tasks 4-5) — until
  # then this PR ships only the contract + Rust stubs.
  buf:
    name: buf (proto lint + breaking + codegen drift)
    needs: detect
    if: needs.detect.outputs.test_buf == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The breaking step posts a PR comment via the action's pr_comment;
    # that needs pull-requests: write (the workflow default is read-only).
    # This job doesn't pull from GHCR, so it drops the top-level
    # `packages: read` — job-level permissions replace, not merge.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      # Lint (fatal). Split from breaking because a single buf-action run
      # can't make one check fatal and another advisory.
      - name: buf lint (fatal)
        uses: bufbuild/buf-action@v1
        with:
          # Pin to the locally-verified buf CLI; bump deliberately. A new
          # buf release can surface new lint rules (1.69.0 added
          # ENUM_VALUE_PREFIX / ENUM_ZERO_VALUE_SUFFIX to STANDARD's
          # findings on host_service.proto).
          version: 1.69.0
          input: crates/engram-protocol/proto
          # host_service.proto predates `buf format`; don't gate on
          # formatting (the action runs it by default on PRs).
          format: false
          # lint defaults to PR-events only — force it on so push-to-main
          # + merge_group keep the gate.
          lint: true
          breaking: false
          # The action's push step publishes to the BSR by default on push
          # events — we don't use the BSR.
          push: false
          archive: false
          pr_comment: false
      # Breaking (advisory). PR-only: the comparison base and the PR comment
      # only make sense on pull_request events. continue-on-error keeps a
      # detected break from failing the job — buf-action posts the PR
      # comment BEFORE it sets its failure status, so the comment still
      # lands. The next step turns that swallowed failure into a warning.
      - name: buf breaking (advisory — warns + comments, never fails)
        id: breaking
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: bufbuild/buf-action@v1
        with:
          version: 1.69.0
          input: crates/engram-protocol/proto
          format: false
          lint: false
          breaking: true
          push: false
          archive: false
          # Post/update a single comment keyed by <workflow>:<job> with the
          # breaking-change details (needs pull-requests: write above;
          # silently skipped on fork PRs where the token is read-only).
          pr_comment: true
      - name: Flag breaking changes as a warning
        if: github.event_name == 'pull_request' && steps.breaking.outcome == 'failure'
        run: |
          echo "::warning title=Proto breaking change detected::buf found a wire-incompatible change to crates/engram-protocol/proto against the PR base. This is non-blocking — see the buf comment on the PR for details. Confirm the break is intended before merging."
      # TS codegen drift check. Guarded on the committed output dir so it
      # stays inert in this PR (protos + Rust stubs only) and activates
      # once web/src/gen lands with the connect-es deps (ADR 0051 Task 4).
      - name: Codegen drift check (buf generate)
        run: |
          if [ -d web/src/gen/engram/app ]; then
            buf generate
            # Assert porcelain-clean rather than `git diff --exit-code`:
            # plain diff misses UNTRACKED new bindings, and `add -N` would
            # stage (and so hide) DELETIONS that `clean: true` performs on
            # proto removals — porcelain catches edits, adds, and deletes.
            if [ -n "$(git status --porcelain -- web/src/gen orchestrator/src/gen)" ]; then
              git status --porcelain -- web/src/gen orchestrator/src/gen
              echo "generated bindings drifted — run 'just gen-proto' and commit the result"
              exit 1
            fi
          else
            echo "generated bindings not committed yet (ADR 0051 Tasks 4-5) — skipping codegen drift check"
          fi

  test-firecracker:
    name: tests (firecracker, Linux + KVM)
    needs: detect
    if: needs.detect.outputs.test_fc == 'true'
    # Blacksmith exposes `/dev/kvm` via nested virtualization (see
    # https://docs.blacksmith.sh/blacksmith-runners/overview). Mirrors
    # the dev-vm bootstrap (engram-dev) — the canonical Linux + KVM
    # env for Firecracker development. 4vCPU gives boot+lifecycle
    # tests enough headroom to run microVMs without queuing.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version
      - name: Setup mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `just` runs the `bundles-squashfs` recipe that stages the `browser`
      # squashfs the e2e_vnc test mounts (ADR 0064).
      - uses: taiki-e/install-action@just

      # /dev/kvm is mode 0660 root:kvm by default on hosted runners;
      # relax to 0666 so the runner user can boot microVMs without
      # sudo. /dev/userfaultfd is the same story (FC 1.10+ opens it
      # directly for UFFD-backed restore), with the additional
      # `vm.unprivileged_userfaultfd=1` sysctl required so the
      # non-root process can call userfaultfd(2).
      - name: Relax KVM + UFFD permissions
        run: |
          sudo chmod 0666 /dev/kvm
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo chmod 0666 /dev/userfaultfd

      # `musl-tools` is for the static agentd build the FC tests bake
      # into the rootfs. `squashfs-tools` (mksquashfs) is for `just
      # bundles-squashfs`, which stages the `browser` bundle the e2e_vnc
      # test mounts (ADR 0064), and for the agentd-bundle staging in
      # agentd_bundle_reexec/materialize_boot. `busybox-static` is the
      # materialize_boot guest's entire userland (ADR 0080 phase 3b).
      # ADR 0093: ext4 packing is pure Rust — no e2fsprogs. (debugfs for
      # the nbd_chunked_disk inspection comes with the runner's distro.)
      - name: Install build deps (musl-tools, squashfs-tools, busybox-static)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools squashfs-tools busybox-static

      # Stock firecracker — matches the deployed fork's upstream base (v1.16.0)
      # so the existing FC suite + the stock<->fork compat test exercise the
      # version we actually ship. The cached test artifacts (our engram 6.1.102
      # guest kernel + the ubuntu-22.04 rootfs) are validated compatible with
      # v1.16.0 (dev-vm: the compat test boots+snapshots+restores green).
      - name: Install firecracker (v1.16.0)
        env:
          FC_VER: v1.16.0
        run: |
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      - uses: oras-project/setup-oras@v1

      # ADR 0045 Phase B: stage both binaries for the stock<->fork
      # snapshot-compat test (`stock_fork_snapshot_compat`). Stock = the
      # v1.10.1 just installed; fork = the artifact build-firecracker published,
      # keyed by the submodule's gitlink SHA (read from the tree — no submodule
      # fetch). Graceful: if the fork artifact isn't published yet (e.g. a
      # submodule-bump PR before its merge builds it), leave ENGRAM_FC_FORK_BIN
      # unset and the compat test skips cleanly via compat_preflight().
      - name: Stage stock + forked firecracker (compat test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "ENGRAM_FC_STOCK_BIN=/usr/local/bin/firecracker" >> "$GITHUB_ENV"
          FC_SHA="$(git ls-tree HEAD third_party/firecracker | awk '{print $3}')"
          if [ -z "$FC_SHA" ]; then echo "no third_party/firecracker gitlink; compat test will skip"; exit 0; fi
          if ! echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin; then
            echo "oras login failed; compat test will skip"; exit 0
          fi
          mkdir -p "$HOME/fc-fork"
          if oras pull "ghcr.io/${{ github.repository }}/firecracker:$FC_SHA" --output "$HOME/fc-fork"; then
            chmod +x "$HOME/fc-fork/firecracker"
            echo "ENGRAM_FC_FORK_BIN=$HOME/fc-fork/firecracker" >> "$GITHUB_ENV"
            echo "staged forked firecracker @ $FC_SHA"
          else
            echo "fork artifact firecracker:$FC_SHA not published yet; compat test will skip"
          fi

      # Cache the kernel + ubuntu rootfs in GH Actions cache. Both
      # artifacts are version-pinned via fetch-fc-test-artifacts.sh
      # (currently vmlinux-5.10.223 + ubuntu-22.04.ext4, ~1.9 GB
      # total). Without the cache, every CI run pays a ~19 min
      # download from `spec.ccfc.min` (Firecracker's S3 bucket).
      #
      # On Blacksmith runners, actions/cache@v4 transparently uses
      # Blacksmith's colocated cache — see
      # https://docs.blacksmith.sh/github-actions-runners/blacksmith-cache.
      # No useblacksmith/* fork needed (those are archived). The
      # cache key hashes the fetch script content, so bumping
      # either URL (kernel or rootfs version) invalidates cleanly.
      - name: Cache FC kernel + rootfs artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-fc-test
          key: fc-test-artifacts-${{ hashFiles('crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh') }}

      # Drop the cached kernel + ubuntu rootfs into ~/.cache/engram-fc-test
      # and emit the `FC_TEST_KERNEL` / `FC_TEST_ROOTFS` env vars that
      # `common::fc_preflight()` reads. Idempotent: on a cache hit
      # this just re-emits the env exports without re-downloading.
      - name: Fetch FC kernel + rootfs artifacts
        # GH_TOKEN: the FC guest kernel is now a private release asset on this
        # repo (ADR 0025); fetch-fc-test-artifacts.sh `gh release download`s it.
        # The in-repo GITHUB_TOKEN can read this repo's own releases.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            | sed 's/^export //' >> "$GITHUB_ENV"

      # snapshot_uffd needs the host-side handler binary in
      # `target/debug/` (the test resolves it relative to
      # CARGO_MANIFEST_DIR).
      - name: Build engram-uffd-handler
        run: cargo build -p engram-uffd-handler

      # exec_real_vm + harness_loopback bake static binaries into a
      # rootfs at runtime and boot it; the binaries must be musl-static
      # so they run against whatever libc the rootfs ships. proxy_e2e
      # needs engram-harness-noop statically linked for the harness
      # path it shares with harness_loopback. (ADR 0015 M1 collapsed
      # engram-bootstrap into engram-agentd; the standalone crate is
      # gone.)
      - name: Build static musl binaries (agentd / noop / built-in harnesses)
        # engram-harness-claude is the real wrapper that the
        # e2e_harness tests load into the harness substrate at
        # `/claude/harness`. Building it here lets the same `target/`
        # serve both the unprivileged tests and the root-required
        # e2e_harness pair below — no second cargo build pass.
        run: |
          cargo build \
            -p engram-agentd \
            -p engram-harness-noop \
            -p engram-harness-claude \
            -p engram-harness-codex \
            --target x86_64-unknown-linux-musl \
            --release

      # Cache the Claude Code CLI binary across CI runs. The
      # e2e_harness tests download it from
      # `downloads.claude.ai/claude-code-releases/latest`. Without
      # caching every CI run pays a ~30s download + the upstream
      # may rate-limit. Cache key is intentionally fuzzy (`latest`)
      # since Anthropic's "latest" pointer floats; the test
      # tolerates whatever version is in the cache and only
      # re-downloads when the cache misses.
      - name: Cache Claude Code CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-e2e-harness
          # Refresh every ~week — gives some staleness so we
          # eventually pick up new Claude CLI versions, but doesn't
          # re-download on every run.
          key: claude-code-cli-${{ github.run_id }}
          restore-keys: |
            claude-code-cli-

      # Run the `#[ignore]`'d FC integration tests that don't need
      # root: boot, lifecycle, snapshot, snapshot_uffd, exec_real_vm,
      # harness_loopback. `--no-fail-fast` so a regression in one test
      # doesn't hide regressions in others.
      #
      # `--test-threads=1` is load-bearing: each test creates its own
      # `FirecrackerBackend`, whose vsock CID allocator restarts at 3
      # (CIDs are host-global, so concurrent tests collide and the
      # second VM hits "connect firecracker.sock: Connection refused"
      # when it can't bind a CID). Production runs one backend per
      # host so this isn't an issue there. Booting real microVMs is
      # heavy enough that serial execution is fine.
      #
      # We name the test binaries explicitly (rather than
      # `--run-ignored ignored-only`) because the root-required
      # tests (host_startup, proxy_e2e) live in the same crate and
      # would otherwise be invoked here only to short-circuit via
      # their `require_root()` SKIP path — leaving the gap silent.
      - name: Firecracker `#[ignore]` tests (unprivileged)
        run: |
          # ADR 0021 P1.6: `baked_harness_loopback` replaced the
          # retired `harness_loopback`. `restore_chain` and
          # `option_d_latency_bench` were also deleted with the
          # substrate subsystem; `restore_chain` came back (baked-in
          # variant) in the P1.6 e2e resurrection.
          #
          # Runs in PARALLEL (--test-threads=4 ≈ runner vCPUs): these are
          # unprivileged tests (net_pool=None — no TAP), so the only
          # host-global resource they share is the vsock CID space, which
          # FirecrackerBackend now partitions per nextest slot
          # (NEXTEST_TEST_GLOBAL_SLOT → CID base offset). Jail/work dirs
          # are per-process temp dirs and the substrate shm base is
          # PID-keyed, so nothing else collides. ~4x faster than the old
          # serial run. The 128-256 MiB test VMs keep 4 concurrent slots
          # well within the runner's RAM.
          cargo nextest run \
            -p engram-sandbox-firecracker \
            --test boot \
            --test lifecycle \
            --test reattach_detach \
            --test probe_sandbox_desync \
            --test snapshot \
            --test snapshot_uffd \
            --test exec_real_vm \
            --test agentd_bundle_reexec \
            --test materialize_boot \
            --test baked_harness_loopback \
            --test forge_loopback \
            --test upload_loopback \
            --test proxy_port_loopback \
            --test multi_restore \
            --test cross_host_restore \
            --test restore_chain \
            --test aux_ro_drive \
            --test diff_snapshot \
            --test file_restore_shared_rss \
            --test stock_fork_snapshot_compat \
            --test pause_resume_vsock \
            --test vmstate_only_snapshot \
            --test substrate_kernel_capabilities \
            --test substrate_uffd_base \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=4
          # ADR 0028 Fix A: the checkpoint-chain pipeline test lives in
          # engram-host-agent (it exercises PooledBackend), same gating
          # as the FC tests above (KVM + Docker + musl agentd).
          cargo nextest run \
            -p engram-host-agent \
            --test checkpoint_chain \
            --test warm_hook_capture \
            --test cold_base_capture \
            --test migration_source \
            --test two_host_live_teleport \
            --test two_host_drain_wave \
            --test pagemap_scanner \
            --test eviction_finalize_redrive \
            --test chain_rehydrate \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # ADR 0007 Phase 4: NBD daemon serves chunked disks. The
      # `nbd_chunked_disk` integration test boots a real FC microVM
      # with `/dev/nbd0` as the rootfs; the kernel's NBD client
      # talks to our daemon, which serves chunk-store reads on
      # demand. Validates the kernel-userspace NBD boundary that
      # the unit tests can't exercise.
      #
      # Blacksmith DOES ship NBD — it's compiled BUILT-IN
      # (`CONFIG_BLK_DEV_NBD=y`) in the runner's guest kernel (a bare
      # `6.5.13`), not as a loadable module. That distinction is why
      # this test was skipped for so long: the old gate keyed off
      # `modprobe nbd` succeeding, but you can't modprobe a built-in
      # driver — it FATALs with "Module nbd not found" even though
      # the kernel already registered `/dev/nbd0..15` at boot and they
      # work. Verified by the `nbd-probe` workflow: on both Blacksmith
      # sizes CONFIG_BLK_DEV_NBD=y, /dev/nbd0 exists, and a qemu-nbd
      # read/write round trip passes. So we gate on the DEVICE NODE,
      # not on modprobe's exit code.
      - name: Detect NBD availability
        id: nbd_setup
        run: |
          # `=m` kernels (the GitHub-hosted control, dev VM) need the
          # module loaded; `=y` kernels (Blacksmith) already expose the
          # devices and modprobe is a harmless FATAL. Either way the
          # truth is whether /dev/nbd0 exists afterward — so try the
          # load best-effort and decide on the device node.
          sudo modprobe nbd nbds_max=16 2>/dev/null || true
          if [ -e /dev/nbd0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -la /dev/nbd0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NBD unavailable::/dev/nbd0 absent after modprobe — NBD integration tests skipped on this runner."
          fi

      # Runs under `sudo -E` (not plain cargo): the test's own preamble
      # (nbd_chunked_disk.rs) notes that current kernels gate NBD
      # configuration (netlink AND ioctl) behind CAP_SYS_ADMIN
      # regardless of the device's permission bits, mirroring the
      # root-required FC tests below. `env "PATH=$PATH"` re-adds the
      # cargo/rustc PATH that sudo scrubs; `-E` preserves
      # ENGRAM_TEST_NBD_DEVICE + FC_TEST_KERNEL/FC_TEST_ROOTFS.
      #
      # Stays `--test-threads=1`. Per-slot `/dev/nbd{N}` keying fixes the
      # device collision, but nbd_netlink_reconfigure's parked-IO assertion
      # is coupled to a dead-connection timeout that -j4 CPU contention
      # pushes past its window (it timed out under parallelism in CI). The
      # contention can't be slot-partitioned away, so this batch stays
      # serial; the dedup below is the win that doesn't risk a flake.
      - name: NBD chunked-disk + netlink tests (Linux + KVM + nbd, root)
        if: steps.nbd_setup.outputs.available == 'true'
        env:
          ENGRAM_TEST_NBD_DEVICE: /dev/nbd0
        run: |
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-host-agent \
            --test nbd_chunked_disk \
            --test nbd_netlink_reconfigure \
            --test nbd_restore_cancel \
            --test nbd_shutdown_abandon_race \
            --test nbd_shutdown_final_flush \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # Root-required tests: host_startup applies real iptables rules,
      # proxy_e2e provisions a TAP device and runs the full
      # guest→TAP→REDIRECT→proxy→upstream chain, snapshot_net asserts
      # that snapshot/restore re-provisions the per-VM TAP + /30
      # under the original name (Gap 1 of the FC parity work). All
      # three need CAP_NET_ADMIN, which on Blacksmith runners means
      # sudo. We `-E` to keep the cargo / rustc env (CARGO_HOME,
      # RUSTUP_HOME, PATH) so the binary can be found, and chown back
      # at the end so the rust-cache action can read /target without
      # permission errors. Docker buildx scratchpad (~/.docker/buildx)
      # also gets touched by proxy_e2e's image bake; cleanup includes
      # it.
      - name: Firecracker `#[ignore]` tests (root — host_startup, snapshot_net, patch_drive_swap, netns_isolation, warm_proxy_chain, proxy_e2e)
        run: |
          # ADR 0021 P1.6: `proxy_e2e` came back in the e2e
          # resurrection — baked-in harness path, CA delivered via
          # the `SpawnHarness` vsock RPC (2026-07 core-ops fold: one
          # first-contact call installs the CA and spawns) instead of
          # the retired `.engram-host/ca.pem` substrate file.
          # `option_d_warm_lease` stays deleted (it was specifically
          # about option-D).
          # `aux_ro_drive` is NOT in this list: it self-isolates (raw FC
          # spawn, per-process tempdir + auto loop device, its own `sudo
          # mount`) and already runs in the unprivileged `--test-threads=4`
          # batch above, so listing it here too was pure duplication on the
          # serial path (~4 tests x ~20s). Dropped; ADR 0027 coverage is
          # unchanged (same tests, still run, just once).
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-sandbox-firecracker \
            --test host_startup \
            --test snapshot_net \
            --test patch_drive_swap \
            --test netns_isolation \
            --test warm_proxy_chain \
            --test proxy_e2e \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1

      # True-e2e tests (engram-host-agent crate): real bake + real
      # FC microVM + PooledBackend + real proxy + (for harness)
      # real Claude CLI + real api.anthropic.com 401 round-trip.
      # These are the highest-fidelity tests we have for the
      # cold-and-warm path the dashboard's SHELL tab + Claude
      # harness use in prod.
      #
      # They reuse the same `target/` (debug builds, since the host
      # binaries here don't need musl) and the same Claude CLI
      # cache as the steps above. Net new runtime ~80s for the
      # harness pair + ~70s for the shell pair, well within the
      # existing FC job budget.
      # ADR 0064: stage the `browser` squashfs bundle the e2e_vnc test
      # mounts. `just bundles-squashfs` content-addresses every bundle
      # (<sha>.squashfs + current.json) under the repo's var/shared/ — the
      # same shape the FC-host image bake produces under /var/lib/engram/shared.
      # e2e_vnc points FirecrackerConfig.bundle_dir at var/shared/ and reads
      # the `browser` sha from current.json, so this MUST run before it.
      # The browser build needs Docker (chromium + Xvfb + x11vnc, glibc-linked),
      # which Blacksmith runners provide; the other bundles in the recipe
      # degrade gracefully if their build skips (e2e_vnc only needs `browser`).
      - name: Stage browser bundle for e2e_vnc (ADR 0064)
        env:
          # ADR 0080: `bundles-squashfs` also packs `bundle-agentd`; reuse the
          # musl agentd this lane already built instead of a second compile.
          ENGRAM_AGENTD_BIN: target/x86_64-unknown-linux-musl/release/engram-agentd
        run: |
          just bundles-squashfs
          ls -l var/shared/
          cat var/shared/current.json
          # `bundles-squashfs` `|| continue`s past a failed bundle build, so it
          # always exits 0. If the `browser` build failed, current.json has no
          # `browser` key, e2e_vnc prints `SKIP:` and the lane stays GREEN — the
          # VNC e2e never runs. Fail loud here so a broken browser bundle FAILS
          # the job before the FC test invocation. (python3 is preinstalled on
          # the ubuntu runner; jq is not.)
          python3 -c 'import json,sys; d=json.load(open("var/shared/current.json")); sys.exit(0 if "browser" in d else 1)' || { echo "FATAL: browser bundle missing from current.json — e2e_vnc would silently skip" >&2; exit 1; }

      # True-e2e tests (engram-host-agent crate): real bake + real
      # FC microVM + PooledBackend + real proxy + (for harness)
      # real Claude CLI + real api.anthropic.com 401 round-trip.
      # ADR 0062: the harness is a per-session bundle mounted on dyn_0
      # (no longer baked into the rootfs); the CA rides the
      # `SpawnHarness` vsock RPC (2026-07 core-ops fold).
      - name: True-e2e tests (root — e2e_shell, e2e_harness, e2e_vnc)
        run: |
          sudo -E env "PATH=$PATH" cargo nextest run \
            -p engram-host-agent \
            --test e2e_shell \
            --test e2e_harness \
            --test e2e_vnc \
            --run-ignored ignored-only \
            --no-fail-fast \
            --test-threads=1
        # Run after either success or failure so cache write doesn't
        # trip on root-owned files.
      - name: Restore ownership after sudo tests
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" target/ ~/.cargo ~/.docker 2>/dev/null || true

  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Built-in Claude harness artifact bake (ADR 0021 P0).
  #
  # Folds the prior standalone `bake-harness-claude.yml` workflow
  # into ci.yml so every PR + push-to-main produces the exact
  # artifact it tests against — closing a structural catch-22 where
  # a PR that bumps `HARNESS_VERSION` had no way to publish the new
  # tag before its own e2e_stack lane consumed it.
  #
  # ADR 0062: the harness rides the fleet `current_bundles` stamp, NOT
  # the image. Two consumers of this artifact:
  #   - **production hosts** (push-to-main only): node-assets stages
  #     `ghcr.io/cortexapps/engrams/harness-claude:<version>-<platform>`
  #     into each host's bundle stamp. This job publishes that tag on
  #     push-to-main and skips the push on PRs.
  #   - **`test-e2e-stack` (every PR + push)**: download the workflow
  #     artifact this job uploads, unpack it into ENGRAM_HARNESS_CLAUDE_TREE,
  #     and `just bundles-squashfs` packs it into the host stamp so the
  #     coordinator resolves the built-in `claude` from `current_bundles`.
  #
  # Why a workflow artifact (not "PR pushes to a per-PR GHCR tag"):
  # workflow artifacts auto-expire, never write to a shared registry
  # namespace, and can't accidentally leak a half-baked PR's binary
  # into a tag prod's bake might pull. The trade-off (one extra
  # ~30-60 s job per PR) is worth the elimination of all four
  # failure modes the catch-22 created.
  # ------------------------------------------------------------------
  bake-harness-claude-artifact:
    name: bake harness-claude artifact
    # Consumed only by test-e2e-stack (downloads the workflow artifact) and
    # bake-demo-image (push-to-main / dispatch) — so gate it on the union of
    # their conditions. No point building the harness when nothing consumes it
    # (e.g. a docs- or chart-only PR). Mirrors artifacts-e2e-stack's gating.
    needs: detect
    if: >-
      needs.detect.outputs.e2e == 'true'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      # `packages: write` only used on push-to-main. The PR path
      # uploads as a workflow artifact and never touches GHCR.
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: x86_64-unknown-linux-musl

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler

      - name: Install musl-tools
        run: sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shares with bake-demo-image matrix (same musl + host
          # release deps) so the second job warms instantly off the
          # first's deps.
          shared-key: release-musl-bake

      - name: Build built-in harnesses (musl) + publisher (host)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p engram-harness-claude -p engram-harness-codex
          cargo build --release -p engram-publish-builtin-harness

      - name: Download Claude Code CLI (Linux x64)
        id: claude_cli
        run: |
          # PINNED, not floating `latest`: claude >=2.1.187 removed AskUserQuestion
          # from headless `--print` mode, which silently breaks ADR 0054 interactive
          # questions in every baked image (cortexapps/engrams#431). 2.1.185 is the
          # newest CLI that still offers the tool headlessly; bump deliberately and
          # re-verify AUQ (the `system/init` tool list) before raising this.
          CLAUDE_VERSION=2.1.185
          curl -fsSL --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude" \
            -o /tmp/claude
          chmod +x /tmp/claude
          /tmp/claude --version || true
          echo "version=$CLAUDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage harness artifact contents
        id: stage
        env:
          CLAUDE_VERSION: ${{ steps.claude_cli.outputs.version }}
        run: |
          # Stage into a known, repo-relative path so upload-artifact
          # has a stable input. The staged directory is the harness pack:
          # entry binary at `harness`, bundled `claude` CLI alongside, and
          # the ADR 0063 `harness.toml` descriptor (read by RegisterHarness,
          # which pulls this artifact + packs it into the catalog). The
          # legacy `artifact.toml` is still staged transitionally until the
          # bake-time injection path is removed (ADR 0062 A4b).
          STAGE="$PWD/var/harness-claude-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -p target/x86_64-unknown-linux-musl/release/engram-harness-claude "$STAGE/harness"
          cp -p /tmp/claude "$STAGE/claude"
          # ADR 0062/0063: the canonical harness descriptor (committed, reviewed).
          cp -p deploy/harness-claude/harness.toml "$STAGE/harness.toml"
          cat > "$STAGE/artifact.toml" <<EOF
          name = "claude"
          version = "${HARNESS_VERSION}"
          entry = "harness"
          description = "Anthropic Claude Code, bundled with engram-harness-claude ${HARNESS_VERSION}. Built on top of claude CLI ${CLAUDE_VERSION}."
          EOF
          ls -la "$STAGE"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      # PR + merge_group: upload as a workflow artifact for downstream
      # consumers (test-e2e-stack downloads + re-publishes locally).
      # Always runs so the artifact exists regardless of whether the
      # GHCR push below ran.
      - name: Upload staged harness as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-claude-artifact
          path: ${{ steps.stage.outputs.dir }}
          # PR-scoped freshness — workflow artifacts auto-expire
          # after the configured retention (90 d default), so this
          # never accumulates indefinitely.
          if-no-files-found: error
          retention-days: 7
          # Three files (binary + binary + 200-byte toml); leave
          # compression default.

      - name: Download and stage Codex CLI 0.144.1
        id: stage_codex
        run: |
          set -euo pipefail
          STAGE="$PWD/var/harness-codex-stage"
          deploy/harness-codex/stage.sh x86_64 \
            target/x86_64-unknown-linux-musl/release/engram-harness-codex \
            "$STAGE"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload staged Codex harness as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-codex-artifact
          path: ${{ steps.stage_codex.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

      # Push-to-main only: also publish to the production GHCR tag
      # so production hosts (node-assets stages it into the bundle
      # stamp) and future consumers see the same artifact.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push harness-claude artifact to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          TAG: ghcr.io/${{ github.repository }}/harness-claude:${{ env.HARNESS_VERSION }}-${{ env.HARNESS_PLATFORM }}
        run: |
          # ADR 0021 P1.7: `engram-publish-builtin-harness` replaces
          # the retired `engram-cli harness push`. Same underlying
          # `engram_oci::OciClient::push_harness` primitive; same
          # wire shape (one tar.gz layer at our media type). The tag
          # is the catalog's expected format `<repo>:<version>-
          # <platform>` — no `:latest` / `:main` / SHA aliases, per
          # the ADR's "one explicit version, baker records the
          # digest" rule.
          ./target/release/engram-publish-builtin-harness \
            --from "$STAGE" \
            --to "$TAG"
          echo "Published $TAG"

      - name: Push harness-codex artifact to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STAGE: ${{ steps.stage_codex.outputs.dir }}
          TAG: ghcr.io/${{ github.repository }}/harness-codex:${{ env.HARNESS_VERSION }}-${{ env.HARNESS_PLATFORM }}
        run: |
          ./target/release/engram-publish-builtin-harness --from "$STAGE" --to "$TAG"

      - name: Summarize
        if: always()
        env:
          PUSH_RAN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "## harness-claude bake" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${HARNESS_VERSION}-${HARNESS_PLATFORM}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- uploaded as workflow artifact: \`harness-claude-artifact\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUSH_RAN" = "true" ]; then
            echo "- pushed to: \`ghcr.io/${{ github.repository }}/harness-claude:${HARNESS_VERSION}-${HARNESS_PLATFORM}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GHCR push: skipped (PR / non-main)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Demo image bake — relocated from
  # engrams-internal/.github/workflows/bake-demo-image.yml so the
  # production demo image and the e2e test image come from one
  # publish path. Push-to-main only (PRs don't need to push; the
  # e2e lane bakes its own image locally for test isolation).
  #
  # ADR 0062/0080: ONE `demo` image — the workspace rootfs (debian +
  # git/curl/socat/iproute2) with NO harness, NO agentd, and NO ttyd
  # baked in. The harness (`claude`), agentd, and ttyd (`guest-tools`)
  # all ride the fleet `current_bundles` stamp, staged onto hosts by
  # node-assets. Prod points here for the default session and selects
  # `harness = "claude"` per session.
  #
  # Publishes `ghcr.io/cortexapps/engrams/demo:warm-<sha>` (plus the
  # `:warm-<short>`, `:main`, `:latest` aliases). Kept as a 1-entry
  # matrix so a second image variant is a one-line addition.
  # ------------------------------------------------------------------
  bake-demo-image:
    name: bake ${{ matrix.variant }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      # `packages: write` for the GHCR push (`write` implies `read`).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [demo]
    steps:
      - uses: actions/checkout@v6

      # ADR 0080: a session image is a plain `docker build && docker push`
      # of a standard OCI image — no engram-cli bake, no agentd/ttyd
      # injection, no ext4 pack. The coordinator materializes the rootfs
      # host-side (MaterializeImage) at enable time. So this job is now a
      # straight buildx build+push, same shape as bake-images.yml.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/$VARIANT"
          SHORT="${SHA:0:7}"
          # buildx pushes every tag in one build — the :warm-<sha> pin plus
          # the :warm-<short> / :main / :latest aliases prod points at.
          {
            echo "list<<EOF"
            echo "$BASE:warm-$SHA"
            echo "$BASE:warm-$SHORT"
            echo "$BASE:main"
            echo "$BASE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build + push ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.variant }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Summarize
        if: always()
        env:
          SHA: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "## ${VARIANT} image bake" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- engrams SHA: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pushed: \`ghcr.io/${{ github.repository }}/$VARIANT:warm-$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Build the release binaries the e2e lane consumes. Separated so the
  # ~3min compile happens once and the e2e job downloads via the
  # workflow artifact rather than rebuilding. Cache key shares with
  # `test-firecracker` so deps are warm.
  # ------------------------------------------------------------------
  artifacts-e2e-stack:
    name: build e2e binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    # Only consumed by test-e2e-stack, so gate it on the same condition —
    # no point building the e2e binaries when the e2e lane won't run.
    needs:
      - detect
    if: >-
      needs.detect.outputs.e2e == 'true'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: x86_64-unknown-linux-musl

      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install musl tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with bake-demo-image — see that job's cache step
          # for the rationale (release+musl dep graph).
          shared-key: release-musl-bake

      - name: Build host binaries (release)
        run: |
          # `engram-publish-builtin-harness` is added so the
          # downstream `test-e2e-stack` job can republish the
          # `harness-claude` workflow artifact into the integration
          # registry without a separate cargo build (ADR 0021 P0).
          cargo build --release \
              -p engram-coordinator \
              -p engram-host-agent \
              -p engram-publish-builtin-harness

      - name: Build musl agentd (release)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
              -p engram-agentd

      - name: Upload e2e binaries
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          path: |
            target/release/engram-coordinator
            target/release/engram-host-agent
            target/release/engram-publish-builtin-harness
            target/x86_64-unknown-linux-musl/release/engram-agentd
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # True end-to-end against the prod-shape stack. Brings up postgres
  # + fake-gcs + local registry + real coord + real host-agent + real
  # Firecracker. ADR 0062: the `demo` image bakes NO harness — the
  # built-in `claude` harness's tree is downloaded from the
  # `bake-harness-claude-artifact` workflow artifact, packed into the
  # host `current_bundles` stamp (ENGRAM_HARNESS_CLAUDE_TREE +
  # `just bundles-squashfs`), and resolved from there per session.
  # Runs the three flows in `e2e_stack.rs`.
  #
  # `needs:` only lists jobs whose *artifacts* this lane downloads
  # (artifacts-e2e-stack's release binaries, bake-harness-claude-artifact's
  # harness tree, detect's `e2e` flag). It used to also list the cheap
  # gates (lint, test-linux, web, cross-musl-linux) as a cost-saving
  # DAG dep, but GitHub Actions force-skips a job whenever ANY of its
  # `needs:` was skipped — overriding this job's own `if:`. `web` (gated
  # on web-path changes) and `cross-musl-linux`/`lint`/`test-linux`
  # (gated on their own path flags) routinely skip on a Rust-only PR
  # that doesn't touch their paths, which silently skipped this entire
  # lane on every Rust-only push/PR (never actually exercising the
  # coord HTTP → gRPC → host-agent path CI claims to cover). Those
  # lanes are still independently required via `ci-gate`'s `needs:`, so
  # dropping them here doesn't weaken the overall gate — it just means
  # this lane no longer skips itself as a side effect of an unrelated
  # lane skipping. `test-firecracker` is intentionally NOT in `needs:`
  # — it tests the host-agent's PooledBackend in isolation; this lane
  # tests the coord HTTP → gRPC → host-agent path. Orthogonal coverage;
  # running them in parallel saves ~6min on the critical path on
  # push-to-main and a flaky `proxy_e2e` doesn't suppress e2e-stack
  # signal.
  # ------------------------------------------------------------------
  test-e2e-stack:
    name: e2e stack ${{ matrix.variant }} (coord app-gRPC → FC)
    # Two variants of the same prod-shape stack (egress proxy on — the proven
    # config), driven over the coordinator's app-gRPC surface (ADR 0051 Drip E
    # removed the web-facing REST surface the suite used to drive):
    #   - suite: single host. Runs every e2e_stack test EXCEPT the two-host
    #     evacuation test (incl. the egress-dependent claude auth test, which
    #     a single host serves reliably).
    #   - teleport: two hosts (host-a + host-b). Runs ONLY the two-host
    #     evacuation test, which drives `FleetService.EvacuateSession` (the
    #     teleport primitive on the app-gRPC surface, ADR 0051) and asserts the
    #     session relocates off the source host with its disk byte-identical.
    #
    # ADR 0051 restored this two-host coverage as
    # `e2e_two_host_evacuate_preserves_sentinel` (replacing the deleted REST
    # `e2e_two_host_teleport_preserves_sentinel` — there is no Teleport RPC, so
    # EvacuateSession is the gRPC teleport primitive; it relocates to any peer
    # rather than a pinned host).
    #
    # e2e stack IS gated now (in the CI Gate's needs). Branch protection requires
    # only the CI Gate, never the matrix-suffixed job names directly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: suite
            two_hosts: ""
            expect_two_hosts: ""
            # Excludes the two-host evacuation test (the `teleport` variant runs it)
            # and `e2e_claude_with_bogus_key…` — quarantined per #403 (consistently
            # times out at 180s); re-add it to the filter when #403 is fixed. The
            # tests are `#[ignore]`'d, so the filter (not the attribute) is the lever.
            nextest_filter: "test(/e2e_/) - test(e2e_two_host_evacuate_preserves_sentinel) - test(e2e_claude_with_bogus_key_surfaces_anthropic_auth_error)"
          - variant: teleport
            two_hosts: "1"
            expect_two_hosts: "1"
            nextest_filter: "test(e2e_two_host_evacuate_preserves_sentinel)"
    # Path-gate: run on any e2e-relevant change, and always on merge_group +
    # push-to-main. On changes that can't affect e2e it skips, which the CI Gate
    # treats as OK (so gating it doesn't wedge non-coord PRs).
    #
    # `!cancelled()` is required because this job's `needs:` includes jobs
    # (artifacts-e2e-stack, bake-harness-claude-artifact) that share this same
    # path-gate — without it, GitHub Actions' default "skip if any needed job
    # skipped" behavior would force-skip this job whenever those upstream jobs
    # skip, regardless of this `if:`. That default skip-propagation is exactly
    # what silently dropped this lane on Rust-only changes before `web` /
    # `cross-musl-linux` were removed from `needs:` below. Since `!cancelled()`
    # also stops GitHub from implicitly requiring those `needs:` entries to have
    # *succeeded*, each one this job actually depends on for artifacts is
    # checked explicitly below instead.
    if: >-
      !cancelled()
      && needs.detect.result == 'success'
      && needs.artifacts-e2e-stack.result == 'success'
      && needs.bake-harness-claude-artifact.result == 'success'
      && (
        needs.detect.outputs.e2e == 'true'
        || github.event_name == 'merge_group'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    needs:
      - detect
      - artifacts-e2e-stack
      # ADR 0062: the demo image is harness-free. The built-in `claude`
      # harness rides the host `current_bundles` stamp instead — the job
      # below builds its tree (entry binary + claude CLI) and uploads it as
      # a workflow artifact (on every run, regardless of branch). The
      # "Download harness-claude artifact" + "Stage RO bundles" steps pack
      # that tree into a squashfs and stamp `harness-claude`, so the in-PR
      # harness binary is what the agent tests exec — no registration, no
      # local-registry republish.
      - bake-harness-claude-artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # `contents: read` for the checkout; `packages: read` because the
    # host-agent (via coord's HttpAuthResolver, ADR 0013) reads sealed
    # creds from PG seeded by `engrams registry add` below — that
    # path still uses GHCR for the demo image's chunked OCI layers if
    # the integration test expands. The *baker* never pulls from GHCR
    # in this lane: the harness artifact comes from a workflow-artifact
    # download + local re-publish (see "Pull harness-claude artifact"
    # below), and the catalog override redirects the resolution there.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      # nextest is what every other test step in this workflow uses.
      - uses: taiki-e/install-action@nextest

      # The Tiltfile's `bootstrap` local_resource runs `just bootstrap`,
      # so the runner needs `just` (Blacksmith runners don't ship it; the
      # other CI jobs hit cargo directly).
      - uses: taiki-e/install-action@just

      # Install protoc via apt: arduino/setup-protoc@v3 with a pinned
      # version *still* called the GH releases API to validate and
      # 401'd with "Bad credentials" on a not-rare-enough fraction
      # of runs. Ubuntu 24.04's protobuf-compiler ships 3.21.12,
      # well above tonic-build/prost-build's minimum, and `apt`
      # never hits the GH API — deterministic, ~2s.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: Cache cargo build (for the e2e test binary itself)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with lint + test-linux: the e2e_stack test binary
          # links in engram-coordinator's full dep graph at debug
          # profile, so the cache populated by the earlier debug
          # workspace jobs hits ~all of it. Saves ~1-2min of cold
          # cargo compile on this lane.
          shared-key: workspace-debug

      # Same KVM + UFFD relax pattern test-firecracker uses (lines
      # 308-312 above). Blacksmith runners ship /dev/kvm but the
      # default perms exclude non-root user processes.
      - name: Relax KVM + UFFD permissions
        run: |
          sudo chmod 0666 /dev/kvm
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo chmod 0666 /dev/userfaultfd

      - name: Install build deps (musl-tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              musl-tools jq bc python3

      - name: Install firecracker (v1.16.0)
        run: |
          FC_VER=v1.16.0
          curl -fL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" \
            -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" \
              /usr/local/bin/firecracker
          firecracker --version

      - name: Cache FC kernel + rootfs artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-fc-test
          key: fc-test-artifacts-${{ hashFiles('crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh') }}
          restore-keys: |
            fc-test-artifacts-

      - name: Fetch FC kernel + rootfs artifacts
        # GH_TOKEN: private release asset for the FC guest kernel (ADR 0025).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash crates/engram-sandbox-firecracker/scripts/fetch-fc-test-artifacts.sh \
            --cache-dir "$HOME/.cache/engram-fc-test"

      # Pull the release binaries AFTER the Swatinem/rust-cache@v2
      # restore step (`Cache cargo build` above). Surfaced in CI run
      # 26344875066: rust-cache's restore prunes "stale" entries from
      # target/<profile>/ when the lockfile hash changes (Cargo.lock
      # touched by a workspace dep add in ADR 0016 Phase A). The
      # download placed engram-coordinator/host-agent at
      # target/release/, the cache restore wiped them, and
      # the Tiltfile's prebuilt-binary branch had nothing to exec for
      # coord + host-agent. Moving
      # the download below all rust-cache operations
      # makes the order unambiguous: nothing can prune what hasn't
      # been written yet.
      #
      # actions/upload-artifact@v4 strips the longest common path
      # prefix shared by all `path:` entries when packing — for the
      # artifacts-e2e-stack upload that's `target/`, so the artifact
      # contents are flattened to `release/...` +
      # `x86_64-unknown-linux-musl/release/...`. Downloading directly
      # into `./target/` reconstructs the expected layout in place.
      - name: Download e2e binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
          path: ./target/

      - name: Mark e2e binaries executable
        run: |
          chmod +x target/release/engram-{coordinator,host-agent,publish-builtin-harness}
          chmod +x target/x86_64-unknown-linux-musl/release/engram-agentd
          ls -l target/release/engram-{coordinator,host-agent,publish-builtin-harness} \
                target/x86_64-unknown-linux-musl/release/engram-agentd

      # `tilt up` (via tilt-up-ci.sh) boots: postgres + fake-gcs +
      # registry + jaeger via docker-compose, then coord + host-agent.
      # ENGRAM_INTEG_BIN_DIR=target/release makes the Tiltfile exec the
      # downloaded release binaries instead of `cargo run`/build.
      # ENGRAM_SKIP_WEB=1 because there's no browser in CI for the SPA.
      # Tilt is the one dev orchestrator (ADR 0024). Local dev gets it
      # from the nix devShell; CI runners aren't in nix, so install the
      # pinned release binary via the official script.
      - name: Install Tilt
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh \
            | sudo bash
          tilt version

      # The orchestrator (a core stack member — the Tiltfile boots it even
      # under ENGRAM_SKIP_WEB=1) and the `engrams` CLI both run on bun.
      # Exact pin, not "latest": resolving a floating version makes
      # setup-bun list tags via api.github.com, which 503s during GH API
      # incidents and took out whole CI rounds (2026-07-16). An exact
      # version downloads straight from the release CDN — same reason
      # protoc moved to apt. Bump deliberately alongside bun upgrades.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # ADR 0027 → 0035 → 0055 → 0062: the e2e host-agent reads its RO bundles
      # from var/shared (Tiltfile sets ENGRAM_BUNDLE_DIR there), CONTENT-ADDRESSED
      # (<sha256>.squashfs + a current.json stamp) and staged by `just
      # bundles-squashfs` when tilt brings the stack up — the host reads the stamp
      # ONCE at startup (host_agent/src/lib.rs read_stamp) and reports the same
      # current_bundles on every heartbeat, exactly like prod's Packer-baked stamp.
      # The coord resolves a session's selected_skills + harness against that.
      # `bundles-squashfs` stages `sentinel` (MANDATORY — base-snapshot capture
      # resolves every reserved dyn-* slot to its sha) + `skills` (the catalog skill
      # `e2e_session_has_mounted_skills_bundle` asserts).
      #
      # ADR 0062: the built-in `claude` harness rides that same stamp. Its tree
      # (entry binary + claude CLI) is BUILT, not committed, so download it (from
      # `bake-harness-claude-artifact`) and hand it to `bundles-squashfs` via
      # ENGRAM_HARNESS_CLAUDE_TREE (next step) — it packs `harness-claude` into the
      # stamp alongside skills/sentinel. No RegisterHarness; the coordinator
      # resolves the built-in from the host's current_bundles + its embedded
      # descriptor.
      - name: Download harness-claude artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-claude-artifact
          path: var/harness-claude-stage

      - name: Download harness-codex artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-codex-artifact
          path: var/harness-codex-stage

      - name: Restore +x on the harness binaries + hand the tree to tilt
        run: |
          # upload/download-artifact's ZIP drops Unix mode bits; the guest execs
          # /opt/engram/dyn/0/harness, so it must stay executable in the squashfs.
          chmod +x var/harness-claude-stage/harness var/harness-claude-stage/claude
          chmod +x var/harness-codex-stage/harness var/harness-codex-stage/codex
          ls -la var/harness-claude-stage/
          # Point `just bundles-squashfs` (tilt runs it next) at this downloaded
          # tree so it packs `harness-claude` into var/shared's stamp.
          echo "ENGRAM_HARNESS_CLAUDE_TREE=$PWD/var/harness-claude-stage" >> "$GITHUB_ENV"
          echo "ENGRAM_HARNESS_CODEX_TREE=$PWD/var/harness-codex-stage" >> "$GITHUB_ENV"
          # ADR 0080: likewise hand it the pre-built musl agentd (downloaded
          # with the e2e binaries above) so packing `bundle-agentd` doesn't
          # recompile anything in this no-cargo lane.
          echo "ENGRAM_AGENTD_BIN=$PWD/target/x86_64-unknown-linux-musl/release/engram-agentd" >> "$GITHUB_ENV"

      # `just bundles-squashfs` (the tilt `bundles` resource) packs the RO bundles
      # with mksquashfs, so squashfs-tools must be on PATH before the stack comes up.
      - name: Install squashfs-tools (for bundles-squashfs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: Bring up prod-shape stack (tilt)
        env:
          ENGRAM_INTEG_BIN_DIR: ./target/release
          ENGRAM_SKIP_WEB: "1"
          # Per-session egress proxy. The local dev path defaults to
          # disabled (unfiltered network — relies on the dev VM's host
          # masquerade). The Blacksmith runner doesn't NAT FC TAP
          # traffic to its outbound interface, so guests need to route
          # via the proxy. Mirrors what `e2e_harness.rs` in
          # test-firecracker already does at the PooledBackend layer.
          # (Host-b gets a distinct port in the two-host variant; see
          # the Tiltfile.)
          ENGRAM_EGRESS_PROXY_PORT: "14443"
          # Empty for suite (single host), "1" for teleport (host-a +
          # host-b). tilt-up-ci.sh waits for the matching host count.
          ENGRAM_INTEG_TWO_HOSTS: "${{ matrix.two_hosts }}"
        run: |
          # ADR 0025/0027: boot the OWNED guest kernel (6.1.102) the fetch
          # script provides + prod runs — it carries CONFIG_SQUASHFS_ZSTD=y so
          # the init-shim can mount the RO bundles. (The stale vmlinux-5.10.223
          # reference predated ADR 0025 owning the kernel.)
          export ENGRAM_KERNEL_IMAGE_PATH="$HOME/.cache/engram-fc-test/vmlinux"
          bash deploy/dev/tilt-up-ci.sh

      # ADR 0013: host-agent doesn't read docker config; it asks
      # the coord per-pull, and the coord reads sealed credentials
      # from the `registry_credentials` PG table populated via
      # `engrams registry add` (→ the orchestrator's ImageService
      # passthrough). Seed ghcr.io with the GITHUB_TOKEN this job was
      # issued (the `permissions: packages: read` block at the top of
      # this job is what makes it pullable). Pipe via --password-stdin
      # so the token never lands in argv / ps. Endpoint + admin key
      # come from the shared helper (tilt-up-ci.sh already waited for
      # the seeded var/dev-api-key).
      - name: Seed GHCR credential in coord PG
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source deploy/dev/engrams-cli.sh
          printf '%s' "$GHCR_TOKEN" | engrams \
              registry add \
              --host ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      # ADR 0062: the built-in claude harness is no longer registered or pushed
      # to a local registry — its tree was downloaded + packed into the host stamp
      # before the stack came up (see "Download harness-claude artifact" + the
      # stage step above), so the coordinator resolves it from `current_bundles`.
      - name: Bake demo image + capture URI
        run: |
          IMAGE_URI=$(bash deploy/dev/integration-bake-demo.sh)
          echo "    baked image: $IMAGE_URI"
          echo "ENGRAM_E2E_IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Run e2e_stack tests
        env:
          # ADR 0051 Drip E: the coordinator's web-facing REST surface is
          # gone; e2e_stack now drives the coord over app-gRPC. These match
          # the Tiltfile's coord_env (ENGRAM_APP_GRPC_ADDR /
          # ENGRAM_APP_GRPC_TOKENS). The address needs the http:// scheme so
          # tonic's Endpoint::from_shared parses it.
          ENGRAM_E2E_GRPC_ADDR: http://127.0.0.1:50061
          ENGRAM_E2E_GRPC_TOKEN: dev-app-grpc-token
          # ENGRAM_E2E_IMAGE_URI set via $GITHUB_ENV in the bake step;
          # points at the just-baked `demo` image (harness-free; ADR 0062 —
          # the `claude` harness rides the host `current_bundles` stamp).
          #
          # Blacksmith's kernel ships NBD built-in (CONFIG_BLK_DEV_NBD=y),
          # so the Tiltfile's `ls /dev/nbd*` discovery wires
          # ENGRAM_NBD_DEVICES and the root host-agent NBD-attaches the
          # chunked disk. Assert it: a null cow-state here is now a real
          # regression, not the old "no nbd.ko" environment gap, so the
          # Phase B chunked-disk tests fail loud instead of skipping.
          ENGRAM_EXPECT_NBD: "1"
          # suite: "" → the two-host evac test self-skips (and is filtered out
          # below anyway). teleport: "1" → the evac test hard-asserts that >=2
          # hosts registered (a single-host regression fails loud instead of
          # silently skipping).
          ENGRAM_EXPECT_TWO_HOSTS: "${{ matrix.expect_two_hosts }}"
          # Per-variant nextest filterset: suite runs everything except the
          # two-host evac test; teleport runs only it (ADR 0051 restored the
          # split when EvacuateSession became the gRPC teleport primitive).
          E2E_NEXTEST_FILTER: "${{ matrix.nextest_filter }}"
        run: |
          cargo nextest run \
              -p engram-coordinator \
              --test e2e_stack \
              --run-ignored ignored-only \
              --no-fail-fast \
              --test-threads=1 \
              -E "$E2E_NEXTEST_FILTER"

      - name: Dump tilt + stack logs on failure
        if: failure()
        run: |
          echo "--- tilt.log (last 300 lines: coord + host-agent streams) ---"
          tail -300 var/integration/tilt.log 2>/dev/null || true

      - name: Tear down stack
        if: always()
        run: |
          # `tilt down` re-evaluates the Tiltfile, which fail()s if the
          # FC kernel env isn't set (only the bring-up step exported it).
          # ADR 0025/0027: boot the OWNED guest kernel (6.1.102) the fetch
          # script provides + prod runs — it carries CONFIG_SQUASHFS_ZSTD=y so
          # the init-shim can mount the RO bundles. (The stale vmlinux-5.10.223
          # reference predated ADR 0025 owning the kernel.)
          export ENGRAM_KERNEL_IMAGE_PATH="$HOME/.cache/engram-fc-test/vmlinux"
          bash deploy/dev/tilt-down-ci.sh || true

  # ─────────────────────────────────────────────────────────────────────
  # macOS / Apple-Silicon coverage (consolidated here from the former
  # ci-macos-vz.yml — one workflow + one detect + one gate, no duplicate). Two
  # jobs, path-gated on `test_rust` like the Linux Rust lanes, on Blacksmith M4
  # runners (faster than the GitHub-hosted macos SKU). Protects the macOS dev-loop
  # surface; Linux/FC remains the canonical production gate.
  vz:
    name: engram-sandbox-vz unit tests
    needs: detect
    if: needs.detect.outputs.test_rust == 'true'
    runs-on: blacksmith-6vcpu-macos-15  # arm64, has Xcode CLT pre-installed
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # ADR 0013: engram-protocol/build.rs needs protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install entitlements (verify file is well-formed plist)
        run: plutil -lint crates/engram-sandbox-vz/entitlements.plist
      - name: Build sandbox-vz test binaries (nextest shape)
        # MUST be `cargo nextest run --no-run` — the same invocation shape the
        # run steps use, so they reuse these exact binaries and the signatures
        # below survive. A plain `cargo build -p a -p b --tests` resolves
        # features differently and nextest would recompile fresh UNSIGNED
        # binaries after codesign (ADR 0096).
        run: cargo nextest run -p engram-sandbox-vz --no-run
      - name: Codesign with virtualization entitlement
        run: bash crates/engram-sandbox-vz/scripts/codesign.sh debug
      # `if: always()` from here so one VZ-test step's failure doesn't hide the
      # ones after it — same pattern as the lint / test-linux jobs.
      - name: Run engram-sandbox-vz unit tests (default)
        if: always()
        run: cargo nextest run -p engram-sandbox-vz --no-fail-fast
      # The ignored VZ tests split two ways here:
      #  - `config_validation_surfaces_clear_error_without_entitlement` builds a
      #    VZ config and asserts `validateWithError:` surfaces a clear error. It
      #    never boots a VM, but it *does* stat a kernel + rootfs file, skipping
      #    if either is missing — so the pulled kernel + the empty placeholder
      #    below let it actually run.
      #  - the `e2e_vz_*` smokes DO boot real VMs. ADR 0096 made them
      #    self-staging (Docker-free rootfs via mkext4 + `just vz-e2e`), so
      #    they run HERE whenever the runner's hypervisor is available —
      #    probed explicitly below, since a hosted macOS runner may itself be
      #    a VM without nested virtualization. When the probe passes,
      #    ENGRAM_VZ_REQUIRE=1 turns any leftover preflight SKIP into a hard
      #    failure (no more skip-and-green); when it fails, the skip is loud
      #    in the log and `just vz-e2e` is the documented local pre-merge
      #    gate (ADR 0096 D3).
      - name: Cache VZ test artifacts (kernel + Alpine minirootfs)
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/engram-vz-test
          key: vz-test-artifacts-${{ hashFiles('crates/engram-sandbox-vz/scripts/pull-kernel.sh', 'crates/engram-sandbox-vz/scripts/make-test-rootfs.sh') }}
      - name: Pull VZ kernel (engram arm64 Image, ADR 0096)
        if: always()
        # GH_TOKEN: the kernel is a private release asset fetched via `gh`
        # (same as the FC lane's fetch-fc-test-artifacts step).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash crates/engram-sandbox-vz/scripts/pull-kernel.sh
      - name: Stage rootfs placeholder (for the non-booting config-validation test)
        if: always()
        run: touch /tmp/engram-vz-rootfs.ext4
      - name: Run ignored VZ tests (config validation; e2e_vz runs live below)
        if: always()
        run: cargo nextest run -p engram-sandbox-vz --run-ignored ignored-only --no-fail-fast -E 'not test(e2e_vz)'
      - name: Probe nested virtualization
        id: hv
        if: always()
        run: |
          hv="$(sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          echo "hv=${hv}" >> "$GITHUB_OUTPUT"
          echo "kern.hv_support=${hv}"
      - name: Install live-e2e staging deps (just, squashfs-tools, musl cross cc)
        if: always() && steps.hv.outputs.hv == '1'
        run: |
          brew install just squashfs messense/macos-cross-toolchains/aarch64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
      - name: Live VZ e2e (just vz-e2e — boots real VMs)
        if: always() && steps.hv.outputs.hv == '1'
        env:
          # .cargo/config.toml names the nix devshell's aarch64-linux-musl-gcc;
          # the brew tap installs aarch64-unknown-linux-musl-gcc. Env overrides
          # the config linker for this step only.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-unknown-linux-musl-gcc
          # vz-e2e depends on pull-kernel (a no-op when the step above
          # cached it, but `gh` still needs the token on a cache miss).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just vz-e2e
      - name: Workspace check (catches downstream-of-VZ regressions)
        if: always()
        run: cargo check --workspace --all-targets

  test-macos:
    name: workspace tests (macOS arm64, excl. sandbox-vz)
    needs: detect
    if: needs.detect.outputs.test_rust == 'true'
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Same default set as Linux minus engram-sandbox-vz (the `vz` job runs that
      # codesigned) — catches macOS-only regressions in cross-platform crates.
      - name: cargo nextest run --workspace --exclude engram-sandbox-vz
        if: always()
        run: cargo nextest run --workspace --exclude engram-sandbox-vz --no-fail-fast

  # The SINGLE required status check. Because the lanes above are path-gated (and
  # so legitimately `skipped` on changes that can't affect them), they must NOT be
  # required individually — a skipped required check never reports and would wedge
  # the merge queue. Instead this gate ALWAYS runs, depends on EVERY lane (Linux +
  # macOS + the e2e stack), and is the one required check: it passes iff each lane
  # succeeded or was skipped, and fails on any `failure`/`cancelled`.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - detect
      - lint
      - test-linux
      - cross-musl-linux
      - web
      - orchestrator
      - cli
      - buf
      - test-firecracker
      - vz
      - test-macos
      # The end-to-end coord lane + its upstream bake/artifact deps. Previously
      # omitted (e2e was non-required), which let a red e2e merge — now gated.
      - bake-harness-claude-artifact
      - artifacts-e2e-stack
      - test-e2e-stack
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check lane results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Per-lane result table. `skipped` is OK (path filter didn't match);
          # fail only on `failure`/`cancelled`.
          echo "$NEEDS_JSON" | jq -r '
            to_entries
            | sort_by(.key)
            | (["LANE","RESULT"], ["----","------"], (.[] | [.key, .value.result]))
            | @tsv' | column -t -s "$(printf '\t')"
          failed=$(echo "$NEEDS_JSON" | jq -r '
            [to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key]
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::CI Gate failed — non-passing lanes: $failed"
            exit 1
          fi
          echo "CI Gate passed."
