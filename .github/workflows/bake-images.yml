name: Bake container images

# Two concerns in one workflow:
#
# 1. When an image-affecting path changes, build coord/web/host-agent
#    container images at this SHA and push to GHCR under
#    `ghcr.io/cortexapps/engrams/<image>:{<sha>,<short>,main,latest}`.
#    Anyone forking the repo gets the same images under their own
#    org's GHCR namespace automatically.
#
# 2. After every push to main (image-affecting OR not), fire a
#    `repository_dispatch: engrams-changed` at cortexapps/engrams-
#    internal carrying the SHA. The deploy repo's auto-pipeline
#    decides what needs to happen from there (helm rollout, TF
#    apply, FC host image rebake). Path-filtered bakes + an
#    always-fires notify let chart-only or TF-only pushes propagate
#    to a redeploy without forcing a no-op image rebuild.
#
# TEMPORARY: the dispatch to engrams-internal exists while engrams
# is still private. Remove the `notify` job when engrams goes
# public — at that point engrams-internal pulls in releases on its
# own cadence.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override ref to build (defaults to the dispatching ref).'
        required: false

permissions:
  contents: read
  packages: write   # push to GHCR under this repo's namespace

concurrency:
  group: bake-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
      host_image: ${{ steps.filter.outputs.host_image }}
      tf_or_helm: ${{ steps.filter.outputs.tf_or_helm }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Three filters drive the downstream fan-out into
          # engrams-internal:
          # - `images`: container rebake (coord / host-agent / web).
          #   Gates this workflow's own bake job + the
          #   `engrams-changed` dispatch that triggers helm-deploy.
          # - `host_image`: FC host GCE image rebake. Gates the new
          #   `engrams-host-changed` dispatch that triggers
          #   bake-fc-host-image in engrams-internal.
          # - `tf_or_helm`: TF / helm module changes that don't
          #   need a container or host-image rebake. Gates the new
          #   `engrams-tf-changed` dispatch that triggers
          #   tf-apply directly. Without this filter, every OSS
          #   push fanned tf-apply in parallel with bake-fc-host,
          #   wasting a ~5min run against the stale image.
          # paths-filter supports `!` negation — host-side bake
          # tools (engram-cli, engram-image-builder) ship in no
          # deployed binary, so excluding them stops a CLI-only or
          # image-builder-only commit from triggering the entire
          # container-bake + FC-host-rebake + helm-deploy + TF-apply
          # fan-out. engram-agentd is baked *into the demo image*
          # (which has its own manual bake workflow), so it doesn't
          # affect coord/web/host-agent container images either.
          # (ADR 0015 M1 collapsed engram-bootstrap into agentd; the
          # standalone crate is gone, so it doesn't need its own
          # negation here.) engram-harness-* belongs to
          # bake-harness-claude's lane, which has its own narrow
          # filters.
          filters: |
            images:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '!crates/engram-cli/**'
              - '!crates/engram-image-builder/**'
              - '!crates/engram-agentd/**'
              - '!crates/engram-harness-claude/**'
              - '!crates/engram-harness-noop/**'
              - '!crates/engram-harness-proto/**'
              - 'docker/**'
              - 'deploy/migrations/**'
              - 'web/**'
              - '.github/workflows/bake-images.yml'
            host_image:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '!crates/engram-cli/**'
              - '!crates/engram-image-builder/**'
              - '!crates/engram-agentd/**'
              - '!crates/engram-harness-claude/**'
              - '!crates/engram-harness-noop/**'
              - '!crates/engram-harness-proto/**'
              # Coord-only crates: not in engram-host-agent's dep
              # tree. Changes here don't alter the host-agent
              # binary that bakes into the FC host GCE image, so
              # there's no point in firing the ~15 min FC-host
              # bake + ~3 min MIG roll on a coord-only commit.
              # Verified via `Cargo.toml` of engram-host-agent and
              # its transitive deps: none of these crates are
              # reachable from engram-host-agent. (Coord IS itself
              # a consumer of engram-host-agent's LocalHostClient
              # in mode=all, but the dependency edge is one-way.)
              # Observed bloat: each commit to engram-coordinator
              # was forcing the FC roll cycle on 2026-05-20.
              - '!crates/engram-coordinator/**'
              - '!crates/engram-postgres/**'
              - '!crates/engram-cloud-gcp/**'
              - '!crates/engram-cloud-mock/**'
              - '!crates/engram-secrets-dev/**'
              - 'deploy/packer/**'
              - 'rust-toolchain.toml'
            tf_or_helm:
              - 'deploy/terraform/**'
              - 'deploy/helm/**'

  bake:
    needs: detect
    if: needs.detect.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    strategy:
      # Surface every image's failure independently — easier to debug.
      fail-fast: false
      matrix:
        image: [coordinator, host-agent, web]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-minted per workflow and has
          # `packages: write` for this repo's namespace.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/$IMAGE"
          SHORT="${SHA:0:7}"
          TAGS=("$BASE:$SHA" "$BASE:$SHORT")
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=("$BASE:main" "$BASE:latest")
          fi
          # docker/build-push-action wants one tag per line.
          printf '%s\n' "${TAGS[@]}" > /tmp/tags.txt
          echo "Will tag:"
          cat /tmp/tags.txt
          { echo 'list<<EOF'; cat /tmp/tags.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Use GHA's built-in cache so successive runs are fast.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Fires on EVERY push to main where the `bake` job didn't fail.
  # Fans path-aware repository_dispatches into engrams-internal so
  # each downstream workflow only runs when its inputs actually
  # moved:
  #
  #   - `engrams-changed` → helm-deploy. Fires when container
  #     images got (or could have) rebaked.
  #   - `engrams-host-changed` → bake-fc-host-image. Fires when
  #     the FC host GCE image needs a rebake (host-agent code,
  #     packer manifest, Cargo lock, etc.).
  #   - `engrams-tf-changed` → tf-apply directly. Fires for
  #     OSS-side TF/helm module changes that don't need a
  #     container or host-image rebake. Without this dispatch,
  #     such changes don't propagate at all under the path-aware
  #     model.
  #
  # `if: always() && ...` lets this fire when `bake` was skipped
  # for path reasons; the `bake.result != 'failure'` guard keeps
  # it from firing if a bake actually broke.
  notify:
    needs: [detect, bake]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bake.result != 'failure' &&
      needs.bake.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Fire path-aware repository_dispatches at engrams-internal
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHA: ${{ github.sha }}
          BAKED: ${{ needs.bake.result == 'success' }}
          CONTAINERS_CHANGED: ${{ needs.detect.outputs.images }}
          HOST_IMAGE_CHANGED: ${{ needs.detect.outputs.host_image }}
          TF_CHANGED: ${{ needs.detect.outputs.tf_or_helm }}
        run: |
          set -euo pipefail
          fire() {
            local event_type="$1"
            curl --fail -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/cortexapps/engrams-internal/dispatches \
              -d "{\"event_type\":\"$event_type\",\"client_payload\":{\"engrams_ref\":\"$SHA\",\"baked\":$BAKED}}"
            echo "Dispatched $event_type -> cortexapps/engrams-internal @ $SHA (baked=$BAKED)"
          }
          if [[ "$CONTAINERS_CHANGED" == "true" ]]; then
            fire engrams-changed
          fi
          if [[ "$HOST_IMAGE_CHANGED" == "true" ]]; then
            fire engrams-host-changed
          fi
          if [[ "$TF_CHANGED" == "true" ]]; then
            fire engrams-tf-changed
          fi
          if [[ "$CONTAINERS_CHANGED" != "true" \
             && "$HOST_IMAGE_CHANGED" != "true" \
             && "$TF_CHANGED" != "true" ]]; then
            echo "No deploy-relevant paths changed in this push; skipping dispatches."
          fi
