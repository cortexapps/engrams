name: Bake container images

# Two concerns in one workflow:
#
# 1. When an image-affecting path changes, build coord/web/host-agent
#    container images at this SHA and push to GHCR under
#    `ghcr.io/cortexapps/engrams/<image>:{<sha>,<short>,main,latest}`.
#    Anyone forking the repo gets the same images under their own
#    org's GHCR namespace automatically.
#
# 2. After every push to main (image-affecting OR not), fire a
#    `repository_dispatch: engrams-changed` at cortexapps/engrams-
#    internal carrying the SHA. The deploy repo's auto-pipeline
#    decides what needs to happen from there (helm rollout, TF
#    apply, FC host image rebake). Path-filtered bakes + an
#    always-fires notify let chart-only or TF-only pushes propagate
#    to a redeploy without forcing a no-op image rebuild.
#
# TEMPORARY: the dispatch to engrams-internal exists while engrams
# is still private. Remove the `notify` job when engrams goes
# public — at that point engrams-internal pulls in releases on its
# own cadence.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override ref to build (defaults to the dispatching ref).'
        required: false

permissions:
  contents: read
  packages: write   # push to GHCR under this repo's namespace

concurrency:
  group: bake-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            images:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'docker/**'
              - 'deploy/migrations/**'
              - 'web/**'
              - '.github/workflows/bake-images.yml'

  bake:
    needs: detect
    if: needs.detect.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    strategy:
      # Surface every image's failure independently — easier to debug.
      fail-fast: false
      matrix:
        image: [coordinator, host-agent, web]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-minted per workflow and has
          # `packages: write` for this repo's namespace.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/$IMAGE"
          SHORT="${SHA:0:7}"
          TAGS=("$BASE:$SHA" "$BASE:$SHORT")
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=("$BASE:main" "$BASE:latest")
          fi
          # docker/build-push-action wants one tag per line.
          printf '%s\n' "${TAGS[@]}" > /tmp/tags.txt
          echo "Will tag:"
          cat /tmp/tags.txt
          { echo 'list<<EOF'; cat /tmp/tags.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Use GHA's built-in cache so successive runs are fast.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Fires on EVERY push to main, whether `bake` ran or was skipped
  # (chart/TF-only changes don't need new container images). The
  # deploy repo's auto-pipeline picks up the SHA and converges:
  # helm-deploy pins images to `bake_ref` (most-recent successful
  # bake) or the dispatched SHA when fresh; tf-apply re-runs in
  # case TF modules / values moved.
  #
  # `if: always() && ...` lets this fire when `bake` was skipped;
  # the `bake.result != 'failure'` guard keeps it from firing if a
  # bake actually failed.
  notify:
    needs: [detect, bake]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bake.result != 'failure' &&
      needs.bake.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at engrams-internal
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHA: ${{ github.sha }}
          BAKED: ${{ needs.bake.result == 'success' }}
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cortexapps/engrams-internal/dispatches \
            -d "{\"event_type\":\"engrams-changed\",\"client_payload\":{\"engrams_ref\":\"$SHA\",\"baked\":$BAKED}}"
          echo "Dispatched engrams-changed -> cortexapps/engrams-internal @ $SHA (baked=$BAKED)"
