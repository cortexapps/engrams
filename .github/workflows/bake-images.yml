name: Bake container images

# Two concerns in one workflow:
#
# 1. When an image-affecting path changes, build coord/web/host-agent
#    container images at this SHA and push to GHCR under
#    `ghcr.io/cortexapps/engrams/<image>:{<sha>,<short>,main,latest}`.
#    Anyone forking the repo gets the same images under their own
#    org's GHCR namespace automatically.
#
# 2. After every push to main (image-affecting OR not), fire a
#    `repository_dispatch: engrams-changed` at cortexapps/engrams-
#    internal carrying the SHA. The deploy repo's auto-pipeline
#    decides what needs to happen from there (helm rollout, TF
#    apply, FC host image rebake). Path-filtered bakes + an
#    always-fires notify let chart-only or TF-only pushes propagate
#    to a redeploy without forcing a no-op image rebuild.
#
# TEMPORARY: the dispatch to engrams-internal exists while engrams
# is still private. Remove the `notify` job when engrams goes
# public — at that point engrams-internal pulls in releases on its
# own cadence.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Override ref to build (defaults to the dispatching ref).'
        required: false

permissions:
  contents: read
  packages: write   # push to GHCR under this repo's namespace

# Concurrency is per-JOB, not workflow-wide. A workflow-wide group would
# cancel an entire in-flight run on the next push to the ref — so a fast
# web bake would die just because a slow coordinator bake (or any sibling)
# was still going. Instead each build job owns its own group keyed by ref
# (and, for the image matrix, by image), so a following SHA cancels only
# the SAME unit being rebuilt and lets unrelated builds finish + deploy.

jobs:
  detect:
    runs-on: ubuntu-latest
    concurrency:
      group: bake-detect-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      images: ${{ steps.lanes.outputs.images }}
      host_binaries: ${{ steps.lanes.outputs.host_binaries }}
      host_base: ${{ steps.lanes.outputs.host_base }}
      host_image: ${{ steps.lanes.outputs.host_image }}
      cli_tools: ${{ steps.lanes.outputs.cli_tools }}
      tf_or_helm: ${{ steps.lanes.outputs.tf_or_helm }}
      bundles: ${{ steps.lanes.outputs.bundles }}
      dev_image: ${{ steps.lanes.outputs.dev_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the detector can diff github.event.before..sha.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Decide deploy lanes from the cargo dependency graph, not a
      # hand-maintained path denylist. detect-rebake-lanes.py computes each
      # artifact's binary RELEASE-dep closure (dev-deps excluded — they
      # don't ship) and trips a lane iff a changed crate is in that closure.
      # This can't silently drift the way `crates/** minus !denylist` did:
      # that list wrongly excluded engram-postgres / engram-agentd /
      # engram-image-builder / engram-harness-proto, all of which bake into
      # the FC-host binaries — a change to them never rebaked the host.
      #   images        = closure(coordinator, host-agent) + web/docker/migrations
      #   host_binaries = closure(host-agent, uffd-handler) + toolchain  (thin bake)
      #   host_base     = deploy/packer + deploy/otel                    (base bake)
      #   host_image    = host_binaries OR host_base                     (publish gate)
      #   tf_or_helm    = deploy/terraform + deploy/helm
      # Containers and the FC host image are decoupled: a uffd-handler change
      # rebakes the host image only; a coord change rebakes containers only.
      # The host image is itself two-staged — a binary change re-drops the
      # binaries (host_binaries -> thin bake); an OS-layer change rebakes the
      # base (host_base -> base bake, which then re-triggers a thin bake).
      - id: lanes
        run: |
          python3 .github/scripts/detect-rebake-lanes.py \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}"

  bake:
    needs: detect
    if: needs.detect.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # Per-IMAGE concurrency: a following SHA cancels only the same image's
    # in-flight bake (`matrix.image` is in the group), never a sibling. A
    # slow/cancelled coordinator bake no longer kills an already-running web
    # bake — they supersede independently.
    concurrency:
      group: bake-image-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    strategy:
      # Surface every image's failure independently — easier to debug.
      fail-fast: false
      matrix:
        image: [coordinator, host-agent, host-operator, web]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-minted per workflow and has
          # `packages: write` for this repo's namespace.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/$IMAGE"
          SHORT="${SHA:0:7}"
          TAGS=("$BASE:$SHA" "$BASE:$SHORT")
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=("$BASE:main" "$BASE:latest")
          fi
          # docker/build-push-action wants one tag per line.
          printf '%s\n' "${TAGS[@]}" > /tmp/tags.txt
          echo "Will tag:"
          cat /tmp/tags.txt
          { echo 'list<<EOF'; cat /tmp/tags.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # No `cache-to/from type=gha`. The expensive layer in each of these
          # images is a build-local `RUN --mount=type=cache` (cargo
          # target+registry for coord/host-agent, the pnpm store for web) —
          # which BuildKit NEVER exports to a registry/gha cache anyway. That
          # mount stays warm across runs via Blacksmith's colocated BuildKit
          # cache (the same colocated pool that backs actions/cache@v4 here;
          # the useblacksmith/* forks are archived). It's why `cargo build`
          # holds at ~2min instead of a 10-15min cold compile.
          #
          # The `type=gha` exporter, by contrast, round-trips to GitHub's REAL
          # cache service from inside the Blacksmith microVM. Restoring a
          # single ~290MB apt/COPY layer was clocking ~0.2 MB/s (~24 min/job),
          # and the repo had blown past GitHub's hard 10GB cache cap and begun
          # evicting. "Restoring" those cheap layers cost far more than just
          # rebuilding them cold (~30s of apt-get), so the gha cache is gone.

  # Compile the FC-host musl binaries ONCE — the exact, CI-tested binaries —
  # and publish them to GHCR as an OCI artifact keyed by SHA. The downstream
  # FC-host bakes in engrams-internal pull these instead of recompiling from
  # a private source checkout (ADR 0013-era split): the bake that ships is
  # now the bake that CI tested, and the bake workflow no longer needs a Rust
  # toolchain. Gated on the host_image UNION so the artifact is present at
  # this SHA for either downstream bake (thin and/or base).
  publish-host-binaries:
    needs: detect
    if: needs.detect.outputs.host_image == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    concurrency:
      group: bake-host-binaries-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust (stable + musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # engram-protocol/build.rs invokes protoc to compile host_service.proto
      # (ADR 0013). Pin an exact tag — the action's default semver range hits
      # the GitHub releases API, which flakes on the shared Blacksmith IP pool.
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo build state
        uses: Swatinem/rust-cache@v2

      - name: Install musl-tools + kernel uapi headers
        # linux-libc-dev provides /usr/include/linux/*.h needed by
        # uffd-handler's transitive userfaultfd-sys build script; the musl
        # cross-gcc sysroot has no kernel uapi headers.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools linux-libc-dev

      - name: Build engram-host-agent + engram-uffd-handler (musl-static)
        env:
          # Point the musl C compile (cc-rs) + bindgen/clang at the system
          # kernel uapi headers so userfaultfd-sys finds <linux/types.h>.
          # uapi headers are libc-agnostic, so mixing them with the musl
          # sysroot is safe.
          CFLAGS_x86_64_unknown_linux_musl: "-I/usr/include -I/usr/include/x86_64-linux-gnu"
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/include -I/usr/include/x86_64-linux-gnu"
        run: |
          cargo build \
            --target x86_64-unknown-linux-musl \
            --release \
            -p engram-host-agent -p engram-uffd-handler
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/engram-host-agent dist/
          cp target/x86_64-unknown-linux-musl/release/engram-uffd-handler dist/
          file dist/engram-host-agent dist/engram-uffd-handler

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Publish musl binaries to GHCR (oras)
        working-directory: dist
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}/host-binaries"
          SHORT="${SHA:0:7}"
          # Push the two static binaries as a single OCI artifact tagged by
          # full SHA. `oras pull <repo>:<sha>` on the consumer side drops both
          # files into cwd verbatim.
          oras push "$REPO:$SHA" \
            --artifact-type application/vnd.engrams.fc-host-binaries.v1 \
            engram-host-agent:application/octet-stream \
            engram-uffd-handler:application/octet-stream
          # Convenience tags. `oras tag` is a cheap registry-side re-point.
          oras tag "$REPO:$SHA" "$SHORT"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            oras tag "$REPO:$SHA" "main"
          fi
          echo "Published host-binaries -> $REPO:{$SHA,$SHORT}"

  # Compile the ops CLI + the in-guest agentd ONCE — the exact, CI-tested
  # binaries — and publish them to GHCR as an OCI artifact keyed by SHA. The
  # reusable bake-dev-image.yml workflow (and any consuming repo's dev-image
  # bake) pulls these instead of compiling from a private source checkout —
  # exactly how the FC-host bakes consume publish-host-binaries, and for the
  # same reason: the bake that ships is the bake CI tested, and the consuming
  # workflow needs no Rust toolchain. agentd matches the deployed coordinator at
  # the moving `main` tag (the same contract host-binaries:main relies on).
  # engram-agentd is static-musl (injected into the guest rootfs at bake);
  # engram-cli is the runner-native gnu build — it only ever runs on the ubuntu
  # bake runner, so gnu is correct and dodges a musl reqwest/TLS rebuild.
  publish-cli-tools:
    needs: detect
    if: needs.detect.outputs.cli_tools == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    concurrency:
      group: bake-cli-tools-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust (stable + musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # engram-protocol/build.rs (transitively, via engram-agentd) invokes
      # protoc. Pin an exact tag — the action's default semver range hits the
      # GitHub releases API, which flakes on the shared Blacksmith IP pool.
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo build state
        uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build engram-cli (gnu) + engram-agentd (musl-static)
        run: |
          # agentd is injected into the guest rootfs, so it must be static-musl
          # (no glibc loader inside the minimal guest).
          cargo build --release --target x86_64-unknown-linux-musl -p engram-agentd
          # engram-cli drives the bake on the host runner; the runner-native gnu
          # build is correct and avoids the musl reqwest/TLS rebuild.
          cargo build --release -p engram-cli
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/engram-agentd dist/
          cp target/release/engram-cli dist/
          file dist/engram-cli dist/engram-agentd

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Publish cli-tools to GHCR (oras)
        working-directory: dist
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}/cli-tools"
          SHORT="${SHA:0:7}"
          # Both binaries as one artifact tagged by full SHA. `oras pull
          # <repo>/cli-tools:<ref>` drops engram-cli + engram-agentd into cwd.
          oras push "$REPO:$SHA" \
            --artifact-type application/vnd.engrams.cli-tools.v1 \
            engram-cli:application/octet-stream \
            engram-agentd:application/octet-stream
          oras tag "$REPO:$SHA" "$SHORT"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            oras tag "$REPO:$SHA" "main"
          fi
          echo "Published cli-tools -> $REPO:{$SHA,$SHORT}"

  # ADR 0044 K2 / GAP 2: bake the node-assets image (firecracker + the engram
  # guest kernel) the engram-host-fleet chart stages onto each K8s node via a
  # host-agent pod init container. Stock K8s nodes carry neither (the
  # GCE/Packer node image did). Gated on the images lane (it fires on docker/
  # changes, incl. node-assets.Dockerfile / node-assets-fetch.sh).
  publish-node-assets:
    needs: detect
    if: needs.detect.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: bake-node-assets-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read   # read this repo's own (private) guest-kernel release asset
      packages: write  # push to GHCR
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Stage firecracker (public release) + the engram guest kernel (this
      # repo's own private release asset — GITHUB_TOKEN/contents:read reads it)
      # into the build context.
      - name: Stage firecracker + engram guest kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash docker/node-assets-fetch.sh node-assets-ctx

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: tags
        env:
          SHA: ${{ github.sha }}
        run: |
          BASE="ghcr.io/${{ github.repository }}/node-assets"
          SHORT="${SHA:0:7}"
          TAGS=("$BASE:$SHA" "$BASE:$SHORT")
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=("$BASE:main" "$BASE:latest")
          fi
          printf '%s\n' "${TAGS[@]}" > /tmp/na-tags.txt
          echo "Will tag:"
          cat /tmp/na-tags.txt
          { echo 'list<<EOF'; cat /tmp/na-tags.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build + push node-assets
        uses: docker/build-push-action@v6
        with:
          context: node-assets-ctx
          file: docker/node-assets.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

  # ADR 0027: build the RO session bundles (skills, playwright) and publish
  # each as an OCI artifact to GHCR, mirroring publish-host-binaries. The
  # FC-host image bake (engrams-internal) pulls them and stages each at the
  # fleet-canonical /var/lib/engram/shared/<name>.squashfs symlink.
  publish-bundles:
    needs: detect
    if: needs.detect.outputs.bundles == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    concurrency:
      group: bake-bundles-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: Build bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          # skills: pure pack of our wrapper scripts + SKILL.md.
          deploy/bundles/skills/build.sh dist/skills.squashfs
          # playwright: glibc Docker build (chromium-headless-shell + node +
          # @playwright/mcp + deps), then squashfs.
          deploy/bundles/playwright/build.sh dist/playwright.squashfs
          ls -l dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Publish bundles to GHCR (oras)
        working-directory: dist
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          for name in skills playwright; do
            REPO="ghcr.io/${{ github.repository }}/bundle-$name"
            # `oras pull <repo>:<sha>` drops <name>.squashfs into cwd verbatim.
            oras push "$REPO:$SHA" \
              --artifact-type "application/vnd.engrams.ro-bundle.v1" \
              "$name.squashfs:application/octet-stream"
            oras tag "$REPO:$SHA" "$SHORT"
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              oras tag "$REPO:$SHA" "main"
            fi
            echo "Published bundle-$name -> $REPO:{$SHA,$SHORT}"
          done

  # Fires on EVERY push to main where the `bake` job didn't fail.
  # Fans path-aware repository_dispatches into engrams-internal so
  # each downstream workflow only runs when its inputs actually
  # moved:
  #
  #   - `engrams-changed` → helm-deploy. Fires when container
  #     images got (or could have) rebaked.
  #   - `engrams-host-changed` → bake-fc-host-image (THIN). Fires
  #     when only the FC-host binaries moved — re-drop them onto
  #     the existing base image.
  #   - `engrams-host-base-changed` → bake-fc-host-base (BASE).
  #     Fires when the OS layer moved (deploy/packer, deploy/otel).
  #     The base bake re-triggers a thin bake when it finishes.
  #   - `engrams-tf-changed` → tf-apply directly. Fires for
  #     OSS-side TF/helm module changes that don't need a
  #     container or host-image rebake. Without this dispatch,
  #     such changes don't propagate at all under the path-aware
  #     model.
  #
  # `if: always() && ...` lets this fire when `bake` was skipped
  # for path reasons; the `*.result != 'failure'` guards keep it
  # from firing if a bake actually broke. The host dispatches
  # additionally require publish-host-binaries to have succeeded —
  # the downstream FC-host bakes pull that GHCR artifact, so firing
  # them without it would 404 on the pull.
  notify:
    needs: [detect, bake, publish-host-binaries, publish-bundles]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bake.result != 'failure' &&
      needs.bake.result != 'cancelled' &&
      needs.publish-host-binaries.result != 'failure' &&
      needs.publish-host-binaries.result != 'cancelled' &&
      needs.publish-bundles.result != 'failure' &&
      needs.publish-bundles.result != 'cancelled'
    runs-on: ubuntu-latest
    # Only the latest run's notify should dispatch — a superseded run must
    # not fire a stale deploy. (The old workflow-wide concurrency group used
    # to guarantee this by cancelling the whole prior run.)
    concurrency:
      group: bake-notify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Fire path-aware repository_dispatches at engrams-internal
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHA: ${{ github.sha }}
          BAKED: ${{ needs.bake.result == 'success' }}
          CONTAINERS_CHANGED: ${{ needs.detect.outputs.images }}
          HOST_BINARIES_CHANGED: ${{ needs.detect.outputs.host_binaries }}
          HOST_BASE_CHANGED: ${{ needs.detect.outputs.host_base }}
          TF_CHANGED: ${{ needs.detect.outputs.tf_or_helm }}
          BUNDLES_CHANGED: ${{ needs.detect.outputs.bundles }}
          DEV_IMAGE_CHANGED: ${{ needs.detect.outputs.dev_image }}
        run: |
          set -euo pipefail
          fire() {
            local event_type="$1"
            curl --fail -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/cortexapps/engrams-internal/dispatches \
              -d "{\"event_type\":\"$event_type\",\"client_payload\":{\"engrams_ref\":\"$SHA\",\"baked\":$BAKED}}"
            echo "Dispatched $event_type -> cortexapps/engrams-internal @ $SHA (baked=$BAKED)"
          }
          if [[ "$CONTAINERS_CHANGED" == "true" ]]; then
            fire engrams-changed
          fi
          # The base bake re-fires engrams-host-changed (thin) when it
          # finishes, so when the OS layer moved we fire ONLY the base event
          # and let it drive the thin re-layer. Firing the thin bake directly
          # too would race the base — the thin bake sources from
          # engram-fc-host-base, which may not exist yet (cutover) or would be
          # the stale pre-rebake image. So: host_base => base only; thin fires
          # directly only when binaries moved WITHOUT an OS-layer change.
          if [[ "$HOST_BASE_CHANGED" == "true" ]]; then
            fire engrams-host-base-changed
          elif [[ "$HOST_BINARIES_CHANGED" == "true" ]]; then
            fire engrams-host-changed
          fi
          if [[ "$TF_CHANGED" == "true" ]]; then
            fire engrams-tf-changed
          fi
          # ADR 0027: a bundle change republished the squashfs artifacts above;
          # the FC-host image must re-bake to pull them onto every host. The
          # engrams-internal handler for this re-stages /var/lib/engram/shared.
          if [[ "$BUNDLES_CHANGED" == "true" ]]; then
            fire engrams-bundles-changed
          fi
          # ADR 0027: auto-rebake the dev-engrams dogfood session image when
          # any source it builds moved. This only triggers the bake; ENABLING
          # the freshly-baked image (POST /api/enabled-images) stays a manual
          # step by design — auto-enable is a separate decision.
          if [[ "$DEV_IMAGE_CHANGED" == "true" ]]; then
            fire engrams-dev-image-changed
          fi
          if [[ "$CONTAINERS_CHANGED" != "true" \
             && "$HOST_BINARIES_CHANGED" != "true" \
             && "$HOST_BASE_CHANGED" != "true" \
             && "$TF_CHANGED" != "true" \
             && "$BUNDLES_CHANGED" != "true" \
             && "$DEV_IMAGE_CHANGED" != "true" ]]; then
            echo "No deploy-relevant paths changed in this push; skipping dispatches."
          fi
