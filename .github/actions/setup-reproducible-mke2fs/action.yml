name: 'Setup reproducible mke2fs'
description: >
  Install Nix and put the engrams-flake-pinned e2fsprogs (>= 1.47.1) mke2fs ahead
  of the system one on PATH. ADR 0036: `engram-cli image build` (Mke2fsPacker)
  sets SOURCE_DATE_EPOCH for byte-deterministic ext4 — the keystone for cross-bake
  chunk dedup — but only e2fsprogs >= 1.47.1 honors it, and the CI/bake runners'
  apt ships <= 1.47.0 (silently stamps wall-clock times). One pinned rev
  (engrams' flake.lock → `packages.mke2fs`) backs every bake + `nix develop`, so
  re-bakes of unchanged content stay byte-identical and dedup. cache.nixos.org
  serves e2fsprogs prebuilt, so this is a download, not a compile.

inputs:
  flake-ref:
    description: >
      Flake reference whose `#mke2fs` output to build. Default `.` (engrams is
      checked out at the workspace root, e.g. engrams' own CI). Use `./engrams`
      when engrams sits in a subdir, or `github:cortexapps/engrams/<ref>` when
      there is no engrams checkout.
    required: false
    default: '.'
  github-token:
    description: >
      Token for Nix to fetch a remote engrams flake-ref over the network (engrams
      is org-internal). Leave empty for a local flake-ref or a public engrams.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        # Only when a token is supplied (remote/private flake-ref); empty is a no-op.
        extra-conf: ${{ inputs.github-token != '' && format('access-tokens = github.com={0}', inputs.github-token) || '' }}
    - name: Build the pinned mke2fs onto PATH
      shell: bash
      run: |
        set -euo pipefail
        MKE2FS_BIN="$(nix build "${{ inputs.flake-ref }}#mke2fs" --no-link --print-out-paths)/bin"
        "$MKE2FS_BIN/mke2fs" -V
        echo "$MKE2FS_BIN" >> "$GITHUB_PATH"
