version: 2

# Cadence: weekly across the board.
#   - Daily creates PR fatigue; monthly misses security windows.
#   - GitHub Security Advisories ship out-of-band regardless of cadence,
#     so this is purely about how often *non-security* upgrades land.
#
# Grouping strategy:
#   - Minor + patch bumps are grouped into one rollup PR per ecosystem,
#     because individually they're rarely interesting to review.
#   - Major bumps fall *outside* the group and arrive as individual PRs,
#     because that's where breaking changes hide and the review needs
#     to happen one crate / package / image at a time.

updates:
  # GitHub Actions ----------------------------------------------------------
  # Floating tags (`@v4`) are convenient but invisible — when a major
  # version ships a breaking change we want a PR with the diff, not
  # silent drift.
  - package-ecosystem: "github-actions"
    # `directory: "/"` scans only `.github/workflows/*`. Local composite
    # actions under `.github/actions/**` are a separate directory as far as
    # Dependabot is concerned (dependabot-core #4178, #6704, #7495), so a
    # bare "/" left `fc-setup/action.yml` pinned to setup-oras@v1 and
    # actions/cache@v4 while the workflows moved to v2/v6 — a silent skew in
    # the `oras pull` path that fc-setup and bake-images.yml share.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Rust workspace ----------------------------------------------------------
  # One entry covers every Cargo.toml under the workspace root.
  # Add explicit `ignore` entries below only when a crate is pinned for a
  # known reason (MSRV, vendored fork, blocked on upstream PR) — and
  # leave a comment so future-us knows when to revisit.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        # The grpc and rustcrypto-digest groups below own these at every
        # update level; without the exclude a tonic MINOR would match both
        # groups and land wherever Dependabot's first-match ordering puts
        # it. Same for sha2/hmac: a lone sha2 patch landing here would
        # split the digest-generation pair that must move together.
        exclude-patterns:
          ["tonic", "tonic-*", "prost", "prost-*", "sha2", "hmac", "digest"]
      # Exception to the majors-arrive-individually rule: the tonic/prost
      # family is version-locked to itself (tonic 0.14 codegen emits code
      # that only compiles against prost 0.14 and the tonic 0.14 runtime).
      # Individual major PRs for these crates can NEVER go green — see
      # #25 / #26 / #29 — so "one crate at a time" is not a reviewable
      # unit here, it is an unbuildable one. Grouping majors for exactly
      # this family keeps them one PR without weakening the rule anywhere
      # else.
      grpc:
        patterns: ["tonic", "tonic-*", "prost", "prost-*"]
        update-types: ["major", "minor", "patch"]
      # Same exception, same reason, different family. sha2 and hmac are
      # version-locked to each other through the `digest`/`crypto-common`
      # generation they share: sha2 0.11 and hmac 0.13 both want digest
      # 0.11, while sha2 0.10 and hmac 0.12 both want digest 0.10. Mixing
      # generations does not compile, because `Hmac<Sha256>` needs its
      # `Sha256` to implement the *same* digest crate's traits:
      #
      #   sha2 0.11 + hmac 0.12 -> error[E0599]: `new_from_slice` exists for
      #     `CoreWrapper<HmacCore<Sha256>>` but its trait bounds were not
      #     satisfied  (crates/engram-coordinator/src/oauth_redirect.rs)
      #
      # So neither #10 (sha2 0.11) nor #1031 (hmac 0.13) can EVER go green
      # on its own — the pair is the smallest buildable review unit, exactly
      # like tonic/prost above. Grouping majors here keeps them one PR
      # without weakening the majors-arrive-individually rule elsewhere.
      rustcrypto-digest:
        patterns: ["sha2", "hmac", "digest"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # `workspace-hack/Cargo.toml` is generated by `cargo hakari generate`,
      # but it is a workspace member, so the cargo ecosystem scans it and
      # Dependabot proposes bumps for crates that appear ONLY there. axum-core
      # is the live example: #1032 tried to move it 0.4 -> 0.5, and the only
      # declaration in the repo is the hakari-generated line. Two reasons that
      # can never land: the next `just hakari` overwrites it, and axum-core's
      # version is dictated by the axum major (0.7 needs 0.4, 0.8 needs 0.5),
      # so it cannot move until `axum` does. A real axum 0.8 upgrade will carry
      # it. Same argument would apply to any other hakari-only crate.
      - dependency-name: "axum-core"

  # Frontend (pnpm) ---------------------------------------------------------
  # Dependabot reads pnpm-lock.yaml directly via the `npm` ecosystem.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(web)"
      include: "scope"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  # Container base images --------------------------------------------------
  # Matched by case-insensitive substring "dockerfile", so the
  # `<service>.Dockerfile` files in this directory are picked up.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]
    ignore:
      # Only even Node majors ever become LTS; odd ones are Current-only and
      # go EOL about 7 months after release. Dependabot proposed
      # `node:25-alpine` in #130 — a line that was ALREADY EOL (2026-06-01)
      # on the day the PR was opened, and the release that stopped shipping
      # `corepack` (nodejs/node#57617), which is what web.Dockerfile used to
      # install pnpm. So it could not have built either. Skip odd majors; the
      # even ones (26, 28, …) still arrive normally.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x", "31.x", "33.x"]
