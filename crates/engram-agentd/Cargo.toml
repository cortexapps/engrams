[package]
name = "engram-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest exec daemon for Firecracker microVMs. Listens on vsock, runs commands, streams stdout/stderr/exit back over the same connection."

[lints]
workspace = true

[lib]
name = "engram_agentd"

[[bin]]
name = "engram-agentd"
path = "src/main.rs"

[dependencies]
bincode.workspace = true
bytes.workspace = true
# Guest clock discipline: step CLOCK_REALTIME to the host KVM PTP clock
# (/dev/ptp0) after snapshot/restore (see `clock`). Safe API — no unsafe.
clock-steering.workspace = true
engram-transport.workspace = true
# ADR 0023: forge wire types (ForgeRequest/Response, FORGE_VSOCK_PORT) +
# SessionId for the in-guest `forge-*` client subcommands.
engram-harness-proto.workspace = true
engram-core.workspace = true
futures.workspace = true
# ADR 0027: activate RO skill/browser bundles into the harness discovery paths.
engram-session-bundles.workspace = true
serde.workspace = true
serde_json.workspace = true
# `io-std` for the exec-journal tees (tokio::io::stdout/stderr in
# exec_journal.rs). It is not in the workspace tokio pin; this crate
# was getting it only through feature unification, which is why the
# otel 0.32 graph change made it disappear.
tokio = { workspace = true, features = ["io-std"] }
sha2.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
engram-telemetry.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Linux-only: harness_supervisor calls mount(2) via the safe `nix`
# wrapper for the per-session harness drive (ADR 0014 M1.12), and
# main.rs flips the console stdout to O_NONBLOCK via fcntl(2) ("fs",
# ADR 0033). The workspace forbids unsafe_code, so libc directly
# isn't available. On non-Linux (the supervisor's mount_harness is a
# stub) nix is harmless.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["mount", "fs", "signal"] }

[dev-dependencies]
tempfile = "3"
# Mock `engram_transport::Transport`/`Listener` impls in the port_relay unit
# tests (both are `#[async_trait]`, so their mocks need the same macro).
async-trait.workspace = true
# `#[tokio::test(start_paused = true)]` for the port_relay backoff/escalation
# tests: they assert on iteration count, not wall-clock time, so paused
# virtual time skips every backoff sleep instantly instead of the test
# actually waiting out ~8 doublings of a 1s-capped backoff.
tokio = { workspace = true, features = ["test-util"] }
# ADR 0099 H4: decode-never-panics property suites (tests/decode_never_panics.rs).
proptest.workspace = true
