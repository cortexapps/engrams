[package]
name = "engram-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest exec daemon for Firecracker microVMs. Listens on vsock, runs commands, streams stdout/stderr/exit back over the same connection."

[lints]
workspace = true

[lib]
name = "engram_agentd"

[[bin]]
name = "engram-agentd"
path = "src/main.rs"

[dependencies]
bincode.workspace = true
engram-transport.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux-only: harness_supervisor calls mount(2) via the safe `nix`
# wrapper for the per-session harness drive (ADR 0014 M1.12). The
# workspace forbids unsafe_code, so libc::mount directly isn't
# available. On non-Linux (the supervisor's mount_harness is a stub)
# nix is harmless.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount"] }

[dev-dependencies]
tempfile = "3"
