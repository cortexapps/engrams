[package]
name = "engram-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest exec daemon for Firecracker microVMs. Listens on vsock, runs commands, streams stdout/stderr/exit back over the same connection."

[lints]
workspace = true

[lib]
name = "engram_agentd"

[[bin]]
name = "engram-agentd"
path = "src/main.rs"

[dependencies]
bincode.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# AF_VSOCK listener for in-guest deployments. Linux-only; on macOS the
# binary still builds (workspace `cargo check` passes) but `--vsock-port`
# returns a clear "not supported on this OS" at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tempfile = "3"
