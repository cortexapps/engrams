[package]
name = "engram-substrate-proto"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

# ADR 0075: the populate protocol between the chunk-cache WRITER (the
# host-agent — later engram-substrated, ADR 0076) and its read-only
# clients (the per-VM uffd handlers). Deliberately synchronous and
# dependency-minimal: the client sits adjacent to the page-fault path,
# which is a blocking thread that must never grow tokio/tonic (the
# engram-migrate-proto / peer.rs discipline).

[lints.rust]
unsafe_code = "allow"

[lints.cargo]
# `workspace-hack` is a dependency of every crate and no crate names it, and a
# dependency that one platform uses reads as unused on the other.
unused_dependencies = "allow"

# Copied from the root Cargo.toml: `workspace = true` cannot coexist
# with a crate-local lint.
[lints.clippy]
disallowed_methods = "deny"

[dependencies]
engram-core.workspace = true
bincode.workspace = true
serde.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["socket", "uio"] }

[dev-dependencies]
tempfile = "3"
# ADR 0099 H4: decode-never-panics property suites (tests/decode_never_panics.rs).
proptest.workspace = true
