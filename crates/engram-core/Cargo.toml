[package]
name = "engram-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits, and errors for Engram. No I/O."

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# tokio brought in solely for the AsyncRead+AsyncWrite traits in the
# HarnessSink type alias. No runtime dependency.
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# Bincode is the canonical wire-encoding for `CowState` /
# `CowStateRecord` (carried inside the proto `bytes` field per
# ADR 0013 / 0016). The round-trip tests exercise that wire shape;
# production code paths in this crate don't depend on bincode.
bincode.workspace = true
toml.workspace = true
