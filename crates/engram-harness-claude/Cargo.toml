[package]
name = "engram-harness-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harness adapter wrapping the `claude` CLI: spawns Claude per prompt with --output-format stream-json, parses the JSONL stream into HarnessEvents, exposes back-and-forth via HarnessCommand::Prompt."

[lints]
workspace = true

[[bin]]
name = "engram-harness-claude"
path = "src/main.rs"

[dependencies]
clap.workspace = true
engram-core.workspace = true
engram-harness-proto.workspace = true
engram-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros", "time", "sync", "fs", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
