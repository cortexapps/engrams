[package]
name = "engram-harness-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engram harness adapter for the Codex CLI app-server"

[lints]
workspace = true

[[bin]]
name = "engram-harness-codex"
path = "src/main.rs"

[dependencies]
clap.workspace = true
engram-core.workspace = true
engram-harness-proto.workspace = true
engram-harness-sdk.workspace = true
engram-transport.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
