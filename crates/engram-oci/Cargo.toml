[package]
name = "engram-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OCI Distribution Spec client for Engram-managed image and harness artifacts."

[lints]
workspace = true

[dependencies]
engram-tls.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
engram-chunk-store.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
# No oci-client TLS feature on purpose. 0.17's `rustls-tls` enables
# `reqwest/rustls` (which turns on rustls's aws-lc-rs provider) and
# `jsonwebtoken/aws_lc_rs` — either one puts a second crypto provider in
# a tree the workspace pins to ring, and rustls then panics at runtime on
# provider ambiguity. The workspace `reqwest` below supplies the TLS
# stack: it is 0.13 with `rustls-no-provider`, which unifies with
# oci-client's own reqwest node. `engram-tls` installs the one provider
# the workspace compiles (ring) before oci-client builds its client.
# jsonwebtoken's backend arrives the same way, by unification with the
# workspace's `rust_crypto` selection.
#
# This used to need a separate `reqwest13 = { package = "reqwest", .. }`
# alias, because oci-client was on 0.13 while the workspace was on 0.12
# and the two majors could not share a feature set. The workspace moved
# to 0.13, so the alias is gone and there is one reqwest in the tree.
oci-client = { version = "0.17", default-features = false }
parking_lot.workspace = true
reqwest.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
axum.workspace = true
http.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "net", "rt-multi-thread"] }
uuid.workspace = true
