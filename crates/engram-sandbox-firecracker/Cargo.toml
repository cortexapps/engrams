[package]
name = "engram-sandbox-firecracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Production SandboxBackend driving Firecracker microVMs over its HTTP-over-Unix-socket API."

# ADR 0009 §4: `spawn_process_supervisor` calls `libc::kill(pid, 0)` to
# poll FC process liveness. The libc syscall is `unsafe` by signature
# (FFI), but the call itself with `sig=0` is provably safe — it inspects
# but doesn't mutate. We loosen `unsafe_code` from the workspace's
# `forbid` to `allow` here so the single supervisor block compiles;
# every unsafe block carries a `// SAFETY:` comment explaining why.
[lints.rust]
unsafe_code = "allow"

[dependencies]
engram-chunk-store.workspace = true
engram-core.workspace = true
engram-telemetry.workspace = true
engram-agentd.workspace = true
engram-harness-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
libc = "0.2"
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
metrics.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# netlink is Linux-only at the SOCKET level (AF_NETLINK) — the crate
# doesn't build on macOS, so gate it with the code that uses it.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink.workspace = true

[dev-dependencies]
engram-image-builder.workspace = true
engram-egress-proxy.workspace = true
engram-storage-local.workspace = true
futures.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
tempfile = "3"
