[package]
name = "engram-host-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-host daemon: chunked-OCI session create, snapshot manager, resource governor."

# ADR 0007 Phase 4: the NBD daemon's `disk_daemon::runtime` module
# wraps Linux kernel ioctls (`NBD_SET_SOCK`, `socketpair`, raw fd
# ownership transfer to the kernel) that the safe Rust surface
# can't model. We loosen `unsafe_code` from the workspace's
# `forbid` to `allow` here so the unavoidable kernel-surface
# blocks pass clippy; each block carries a `// SAFETY:` comment
# explaining the invariant it relies on. Other lints stay at the
# workspace default.
[lints.rust]
unsafe_code = "allow"

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-host-agent"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-protocol.workspace = true
engram-chunk-store.workspace = true
engram-storage-local.workspace = true
engram-storage-gcs.workspace = true
engram-egress-proxy.workspace = true
engram-oci.workspace = true
engram-image-builder.workspace = true
engram-sandbox-firecracker.workspace = true
engram-sandbox-vz.workspace = true
engram-cloud-static.workspace = true
engram-secrets-gcp.workspace = true
engram-harness-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
# Linux-only: raw libc bindings for the NBD ioctl orchestration
# in `disk_daemon::runtime`. Gated by `target_os = "linux"` on the
# call sites; the dep is unconditional because Cargo's
# target-cfg deps machinery doesn't gate workspace-style deps and
# `libc` is platform-portable (it just compiles to a no-op crate
# on non-Linux).
libc = "0.2"
rustls.workspace = true
sha2.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
# For the disk-pressure detector's statvfs-based free-space probe.
# Linux + macOS both expose statvfs; nix's `fs` feature wraps it.
nix = { version = "0.31", default-features = false, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile = "3"

[dev-dependencies]
engram-harness-noop.workspace = true
engram-sandbox-process.workspace = true
tempfile = "3"
# ADR 0008 Phase 5: the chunked-OCI fault integration test spins
# up a loopback fake-registry that speaks just enough of the OCI
# Distribution Spec for `OciChunkResolver` to fault chunks.
# axum + tokio TcpListener bound to 127.0.0.1:0 keeps the test
# self-contained — no docker, no external registry.
axum = { workspace = true }
http = { workspace = true }
