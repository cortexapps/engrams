[package]
name = "engram-host-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-host daemon: chunked-OCI session create, snapshot manager, resource governor."

# ADR 0007 Phase 4: the NBD daemon's `disk_daemon::runtime` module
# wraps Linux kernel ioctls (`NBD_SET_SOCK`, `socketpair`, raw fd
# ownership transfer to the kernel) that the safe Rust surface
# can't model. We loosen `unsafe_code` from the workspace's
# `forbid` to `allow` here so the unavoidable kernel-surface
# blocks pass clippy; each block carries a `// SAFETY:` comment
# explaining the invariant it relies on. Other lints stay at the
# workspace default.
[lints.rust]
unsafe_code = "allow"

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-host-agent"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-host-core.workspace = true
engram-protocol.workspace = true
engram-chunk-store.workspace = true
engram-substrate-proto.workspace = true
engram-migrate-proto.workspace = true
engram-storage-local.workspace = true
engram-storage-gcs.workspace = true
engram-egress-proxy.workspace = true
engram-oci.workspace = true
# ADR 0080 §C: host-side materialization of standard docker images —
# the `MaterializeImage` RPC's engine (pull → flatten → pack → chunk).
engram-rootfs-materializer.workspace = true
engram-sandbox-firecracker.workspace = true
engram-sandbox-vz.workspace = true
engram-cloud-static.workspace = true
engram-secrets-gcp.workspace = true
engram-harness-proto.workspace = true
async-trait.workspace = true
base64.workspace = true
bincode.workspace = true
bytes.workspace = true
# Raw libc bindings: the NBD ioctl orchestration in
# `disk_daemon::runtime` (Linux) and the `hw.memsize` capacity
# sysctl in `resource` (macOS). Call sites are target_os-gated;
# the dep is unconditional because `libc` is platform-portable.
libc = "0.2"
rustls.workspace = true
sha2.workspace = true
chrono.workspace = true
clap.workspace = true
crc32c.workspace = true
dashmap.workspace = true
futures.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tonic.workspace = true
reqwest.workspace = true
# For the disk-pressure detector's statvfs-based free-space probe.
# Linux + macOS both expose statvfs; nix's `fs` feature wraps it (also
# `memfd_create`/`ftruncate`, used by ADR 0068's uffd-minor-shmem
# probe). `sched` is needed on Linux for ADR 0014 issue #6's ProxyShell
# netns-dial (setns + CloneFlags). `uio` wraps process_vm_readv for
# ADR 0045 C2's page server (a safe API — no new unsafe in this
# crate). `mman` wraps mmap/munmap for the same ADR 0068 probe (a
# memfd-backed self-test, no guest involved). The extra modules
# compile to no-ops on non-Linux so the features are portable.
nix = { version = "0.31", default-features = false, features = ["fs", "mman", "sched", "uio"] }
tracing.workspace = true
tracing-subscriber.workspace = true
engram-telemetry.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
uuid.workspace = true
tempfile = "3"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Linux-only: userfaultfd is a Linux kernel surface (ADR 0068's
# `capabilities::probe_uffd_minor_shmem` self-test). Target-gated the
# same way `engram-uffd-handler` gates its own copy of this dep, so a
# workspace-wide `cargo check` on macOS doesn't try to build it.
[target.'cfg(target_os = "linux")'.dependencies]
# linux5_13: `RegisterMode::MINOR` — the exact ioctl mode the probe
# exercises.
userfaultfd = { version = "0.9", features = ["linux5_13"] }

[dev-dependencies]
engram-uffd-handler.workspace = true
# base_shm_gc tests backdate mtimes
filetime = "0.2"
engram-harness-noop.workspace = true
engram-sandbox-process.workspace = true
# item d (#530) deleted `ensure_stub_harness`, the only src/ consumer
# (Mke2fsPacker in lib.rs); every remaining use is test-fixture image
# packing in tests/*.rs, so this only needs to build for `cargo test`.
tempfile = "3"
# ADR 0008 Phase 5: the chunked-OCI fault integration test spins
# up a loopback fake-registry that speaks just enough of the OCI
# Distribution Spec for `OciChunkResolver` to fault chunks.
# axum + tokio TcpListener bound to 127.0.0.1:0 keeps the test
# self-contained — no docker, no external registry.
axum = { workspace = true }
http = { workspace = true }
