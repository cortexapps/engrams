[package]
name = "engram-host-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-host daemon: warm pool, snapshot manager, resource governor."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-host-agent"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-protocol.workspace = true
engram-egress-proxy.workspace = true
engram-oci.workspace = true
engram-image-builder.workspace = true
engram-sandbox-firecracker.workspace = true
engram-sandbox-vz.workspace = true
engram-cloud-static.workspace = true
engram-secrets-gcp.workspace = true
engram-harness-proto.workspace = true
async-trait.workspace = true
rustls.workspace = true
sha2.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
# For the disk-pressure detector's statvfs-based free-space probe.
# Linux + macOS both expose statvfs; nix's `fs` feature wraps it.
nix = { version = "0.31", default-features = false, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile = "3"

[dev-dependencies]
engram-harness-noop.workspace = true
engram-sandbox-process.workspace = true
tempfile = "3"
