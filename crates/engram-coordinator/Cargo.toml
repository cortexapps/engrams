[package]
name = "engram-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP API + scheduler for Engram. Stateless; backed by Postgres."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-coordinator"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-protocol.workspace = true
engram-postgres.workspace = true
# ADR 0055 P2: the shared mount.json schema, generated for an uploaded skill.
engram-mount-manifest.workspace = true
engram-chunk-store.workspace = true
engram-host-agent.workspace = true
engram-sandbox-firecracker.workspace = true
engram-sandbox-vz.workspace = true
# ADR 0023: ProcessBackend is now an operator-selectable (guarded) backend,
# not just a test fixture — promoted from dev-dependencies.
engram-sandbox-process.workspace = true
engram-cloud-static.workspace = true
engram-cloud-gcp.workspace = true
engram-cloud-mock.workspace = true
engram-harness-proto.workspace = true
engram-secrets-dev.workspace = true
engram-secrets-gcp.workspace = true
# ADR 0023: GitHub App forge for the in-session credential + PR seam.
engram-git-github.workspace = true
engram-image-builder.workspace = true
engram-egress-proxy.workspace = true
engram-crypto.workspace = true
engram-oci.workspace = true
engram-oci-auth.workspace = true
engram-storage-local.workspace = true
engram-storage-gcs.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bincode.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# ADR 0055 P2: unpack an uploaded skill tar (gzip-sniffed) for the squashfs pack.
tar.workspace = true
flate2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tonic.workspace = true
tonic-reflection.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
engram-telemetry.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
# ADR 0055 P2: staging dirs for the skill_pack mksquashfs path (lib, not test).
tempfile = "3"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
engram-harness-proto.workspace = true
engram-secrets-dev.workspace = true
engram-git-dev.workspace = true
futures = { workspace = true }
http-body-util = "0.1"
parking_lot.workspace = true
# Decode the app FileDescriptorSet in the reflection test (assert the
# descriptor actually carries the app services). Test-only.
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
