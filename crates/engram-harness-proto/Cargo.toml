[package]
name = "engram-harness-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types for the harness ↔ host vsock channel: tool-call events, checkpoint/shutdown commands."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
bincode.workspace = true
chrono.workspace = true
engram-core.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# Used by the ADR 0014 M1.12 backwards-compat test: a pre-M1.12
# BootstrapLaunch frame (argv + env only) must still deserialize
# into the new struct, with `harness_dev` + `harness_mount`
# defaulting to None. JSON is the simplest format that exercises
# `#[serde(default)]` independent of bincode's wire framing.
serde_json = "1"
