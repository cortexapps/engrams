[package]
name = "engram-egress-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ADR 0121: the control protocol, manifest schema, and adopt decision between host-agent and the node-local engram-egress-proxyd."

# UNSAFE-CODE CARVE-OUT (the engram-uffd-handler pattern): the
# workspace lints forbid `unsafe_code`; the one unsafe block here is
# `OwnedFd::from_raw_fd` on the fd the kernel just delivered via
# SCM_RIGHTS in `recv_fd` — the same block engram-substrate-proto
# carries, with its own SAFETY comment.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
disallowed_methods = "deny"

[dependencies]
engram-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "uio"] }

[dev-dependencies]
tempfile = "3"
