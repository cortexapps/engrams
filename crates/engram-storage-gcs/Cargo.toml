[package]
name = "engram-storage-gcs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GCS BlobStorage impl. Stage 0 ships a stub returning NotImplemented; Stage 4 wires google-cloud-storage."

[lints]
workspace = true

[dependencies]
engram-tls.workspace = true
engram-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
# `gcloud-storage` is the crate we have always used. It was published as
# `google-cloud-storage` up to 0.24; @yoshidan then donated THAT NAME to
# Google for the official google-cloud-rust SDK and continued the same
# codebase under `gcloud-storage`. So this is a rename, not a new
# dependency: same `ClientConfig`/`http::objects` surface, same
# `Client::upload_streamed_object`/`download_streamed_object`. What the
# rename buys is reqwest 0.13 + reqwest-middleware 0.5, which is what
# releases the injected-client pin below.
#
# Feature choice mirrors the workspace crypto pins exactly (see the
# jsonwebtoken and rustls notes in the root manifest): `auth` for ADC,
# `rustls-no-provider` so the TLS stack takes the workspace's `ring`
# instead of pulling aws-lc-rs, `jwt-rust-crypto` so the signing backend
# unifies with the workspace's `rust_crypto`. The crate's own default
# feature set is `rustls-tls` + `jwt-aws-lc-rs`, which is precisely the
# second-provider panic engram-oci documents, hence default-features = false.
gcloud-storage = { version = "1.3", default-features = false, features = [
    "auth",
    "rustls-no-provider",
    "jwt-rust-crypto",
] }
# The SDK accepts an injected `ClientConfig.http` — we build our own
# tuned reqwest client (bounded connect, sized keep-alive pool,
# pinned http1) rather than taking the SDK's untuned default. NO
# extra reqwest features here: `hickory-dns` (like `http2`, see
# lib.rs) unifies workspace-wide and flips the DEFAULT resolver for
# every reqwest client off getaddrinfo — adopt deliberately with
# k8s resolv.conf (ndots/search/hosts) validation, never as a side
# effect.
reqwest = { workspace = true }
# 0.5 is required by gcloud-storage 1.3 and requires reqwest 0.13; the
# three move as one unit (see the `gcs-transport` group in dependabot.yml).
reqwest-middleware = "0.5"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
