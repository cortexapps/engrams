[package]
name = "engram-image-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bakes engram images from a Dockerfile + engram.toml into the registry layout the coordinator reads."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-image-builder"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-chunk-store.workspace = true
engram-oci.workspace = true
engram-postgres.workspace = true
engram-storage-local.workspace = true
engram-storage-gcs.workspace = true
# ADR 0007 Phase 5: bake-time canonical memory capture re-uses
# `FirecrackerBackend` to boot the just-built rootfs once at bake
# time and snapshot `memory.bin`. FC has only a dev-dep on
# image-builder (for its integration tests that bake fixtures),
# so the dep graph stays acyclic.
engram-sandbox-firecracker.workspace = true
# ADR 0014 M1.14 + ADR 0015 M1: synthetic profile pass sends a
# `WireRequest::SpawnHarness` over vsock to drive in-VM activity
# through the kernel paths warm-lease will hit, so the UFFD
# handler's recorder captures them.
engram-agentd.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
uuid.workspace = true

tempfile = "3"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
engram-storage-local.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
