[package]
name = "engram-image-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bakes engram images from a Dockerfile + engram.toml into the registry layout the coordinator reads."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engram-image-builder"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-postgres.workspace = true
engram-storage-local.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
parking_lot.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
