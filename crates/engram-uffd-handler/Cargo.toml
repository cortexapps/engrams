[package]
name = "engram-uffd-handler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Userfaultfd page-fault handler for Firecracker UFFD-backed snapshot restore. Receives the guest's UFFD over SCM_RIGHTS and serves page faults from content-addressed chunks."

# UNSAFE-CODE CARVE-OUT
#
# The workspace lints forbid `unsafe_code`. The kernel surface this
# crate drives (userfaultfd ioctls, mmap of chunk files and shared
# memory, fds from SCM_RIGHTS) cannot be used without it. Each unsafe
# block carries a SAFETY comment. `allow`, not `warn`, so that
# `cargo clippy -- -D warnings` passes.
[lints.rust]
unsafe_code = "allow"

[lib]
name = "engram_uffd_handler"

[[bin]]
name = "engram-uffd-handler"
path = "src/main.rs"

[dependencies]
engram-core.workspace = true
engram-chunk-store.workspace = true
chrono.workspace = true
engram-substrate-proto.workspace = true
engram-storage-local.workspace = true
engram-blob-client.workspace = true
engram-migrate-proto.workspace = true
bytes.workspace = true
libc = "0.2"
sendfd = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `all` feature unlocks TcpKeepalive::with_interval/with_retries
# (TCP_KEEPINTVL/TCP_KEEPCNT) on the page channel; with_time is
# unconditional. See peer.rs `apply_peer_sockopts`.
socket2 = { workspace = true, features = ["all"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
engram-telemetry.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Linux-only: userfaultfd is a Linux kernel surface. The crate
# itself doesn't gate by target_os; we do here so a workspace-wide
# `cargo check` on macOS doesn't try to build it.
[target.'cfg(target_os = "linux")'.dependencies]
# linux5_13: Uffd::continue_ (UFFDIO_CONTINUE) for the ADR 0045 substrate's
# shared-base installs (MINOR-fault resolution against the base shm file).
userfaultfd = { version = "0.9", features = ["linux5_13"] }

[dev-dependencies]
proptest.workspace = true
async-trait.workspace = true
tempfile = "3"
