[package]
name = "engram-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest supervisor that listens on vsock for BootstrapLaunch frames from the host, spawns the described agent process as a child, and respawns it (kill + spawn) on each subsequent launch frame — so the host can re-establish a fresh agent after FC snapshot/restore. Lives at /sbin/engram-bootstrap inside the rootfs."

[lints]
workspace = true

[[bin]]
name = "engram-bootstrap"
path = "src/main.rs"

[dependencies]
engram-harness-proto.workspace = true
engram-transport.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux-only: bootstrap calls mount(2) via the safe `nix` wrapper
# when the host's BootstrapLaunch frame nominates a harness device
# (ADR 0014 M1.12). The workspace forbids unsafe_code, so direct
# libc::mount isn't available. On non-Linux (where bootstrap's
# main() is a stub) nix is harmless.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount"] }
