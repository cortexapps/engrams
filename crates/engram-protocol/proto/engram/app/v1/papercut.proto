syntax = "proto3";

package engram.app.v1;

import "engram/app/v1/profile.proto";
import "google/protobuf/timestamp.proto";

service PapercutService {
  rpc ListPapercuts(ListPapercutsRequest) returns (ListPapercutsResponse);
  rpc ArchivePapercut(ArchivePapercutRequest) returns (ArchivePapercutResponse);
  rpc UnarchivePapercut(UnarchivePapercutRequest) returns (UnarchivePapercutResponse);
}

message Papercut {
  string id = 1;
  string summary = 2;
  string description = 3;
  string category = 4;
  // Empty means unset.
  string severity = 5;
  repeated string tags = 6;
  string session_id = 7;
  string task_id = 8;
  bool archived = 9;
  google.protobuf.Timestamp created_at = 10;
  ProfileSnapshot profile = 11;
}

message ListPapercutsRequest {
  bool include_archived = 1;
}

message ListPapercutsResponse {
  repeated Papercut papercuts = 1;
}

message ArchivePapercutRequest {
  string id = 1;
}

message ArchivePapercutResponse {
  Papercut papercut = 1;
}

message UnarchivePapercutRequest {
  string id = 1;
}

message UnarchivePapercutResponse {
  Papercut papercut = 1;
}
