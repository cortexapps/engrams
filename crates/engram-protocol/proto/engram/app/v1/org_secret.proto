syntax = "proto3";

package engram.app.v1;

// ADR 0057: the admin-managed, KEK-sealed org secret store. The caller is the
// single trusted orchestrator (bearer-authed); per-user authz (admin-only
// writes) lives there. Values are sealed at the coordinator on write and are
// NEVER returned — List surfaces metadata only ("set / not set"). The org store
// is the single value store for profile secrets, integration inject creds, and
// the GitHub App mint key, resolved through the composed SecretStore.
service OrgSecretService {
  // Upsert (seal + store) an org secret by name. The plaintext `value` is
  // sealed under the KEK at the coordinator and stored as ciphertext; it never
  // leaves the coordinator after this call. Idempotent (re-put overwrites).
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  // List org-secret metadata (name + key id + timestamps) — never the value.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Delete an org secret by name. Idempotent (deleting an absent secret yields
  // `deleted = false`, not an error).
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

// Org-secret metadata — everything EXCEPT the value, so the UI can render
// "set / not set" without ever echoing a credential back.
message OrgSecretMeta {
  // Stable lookup name (the `secret_ref` that profiles + connectors reference).
  string name = 1;
  // The KEK key id in effect at seal time (rotation visibility).
  string key_id = 2;
  // ISO-8601.
  string created_at = 3;
  string updated_at = 4;
}

message PutSecretRequest {
  string name = 1;
  // Plaintext in; sealed at the coordinator; never echoed back.
  string value = 2;
}

message PutSecretResponse {
  OrgSecretMeta secret = 1;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated OrgSecretMeta secrets = 1;
}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {
  // Whether a row was deleted (idempotent).
  bool deleted = 1;
}
