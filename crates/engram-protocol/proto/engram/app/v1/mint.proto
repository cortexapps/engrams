syntax = "proto3";

package engram.app.v1;

// ADR 0057 C3: the coordinator-owned mint-kind registry, surfaced read-only so
// the orchestrator/web can render the Plane-A "add a mint integration" form
// data-driven. The mint *logic* (building the engine) stays bespoke Rust in the
// coordinator (`mint_kind_registry()`); this only exposes the form metadata.
// Admin-gated at the orchestrator proxy (like OrgSecretService).
service MintService {
  // List every built-in mint kind the coordinator can build (e.g. github_app).
  rpc ListMintKinds(ListMintKindsRequest) returns (ListMintKindsResponse);
  // Test an integration credential: resolve it (from the org store, or a
  // just-entered draft) and make ONE benign authenticated GET to the host,
  // reporting whether the credential was accepted. The orchestrator (which owns
  // the connector registry) supplies the resolved spec; the coordinator is the
  // only tier that can unseal secrets + run the mint engine. Admin-gated there.
  rpc RunConnectorTest(RunConnectorTestRequest) returns (RunConnectorTestResponse);
}

// The input kind of a mint-config field — drives the form widget + whether the
// value is sealed at rest. Mirrors `engram_core::traits::MintFieldKind`.
enum MintFieldKind {
  MINT_FIELD_KIND_UNSPECIFIED = 0;
  // Non-sensitive configuration (e.g. an App ID) — plain text input.
  MINT_FIELD_KIND_CONFIG = 1;
  // A credential (e.g. a private-key PEM) — masked input, sealed in the org store.
  MINT_FIELD_KIND_SEALED_SECRET = 2;
}

// One field an admin supplies to configure a mint kind. `name` is also the org
// secret name suffix the coordinator resolves the value from (`<kind>.<name>`).
message MintFieldDescriptor {
  string name = 1;
  string label = 2;
  MintFieldKind field_kind = 3;
  bool required = 4;
}

// One mint kind: the provider it backs + the fields an admin fills in.
message MintKind {
  string kind = 1;        // "github_app"
  string provider = 2;    // "github"
  string display_name = 3;
  repeated MintFieldDescriptor fields = 4;
}

message ListMintKindsRequest {}

message ListMintKindsResponse {
  repeated MintKind mint_kinds = 1;
}

// A resolved connector test spec, built by the orchestrator from the connector
// registry. Carries the inject header/template/secret_ref OR the mint kind, plus
// an optional draft (the about-to-be-saved credential, tested before sealing).
message RunConnectorTestRequest {
  string provider = 1;      // "github" / "datadog"
  string host = 2;          // hosts[0], e.g. "api.github.com"
  string source = 3;        // "inject" | "mint"

  // inject:
  string header = 4;        // header name (default Authorization)
  string template = 5;      // "Bearer {}" / "{}"
  string secret_ref = 6;    // org secret to resolve when no draft is given
  string draft_secret = 7;  // test this value instead of the stored secret_ref

  // mint:
  string kind = 8;                   // mint kind id (e.g. github_app)
  map<string, string> draft_fields = 9; // build the engine from these instead of the stored secrets
}

message RunConnectorTestResponse {
  bool ok = 1;        // the credential was accepted (not a 401/403)
  string message = 2; // short human summary
}
