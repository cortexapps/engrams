syntax = "proto3";

package engram.app.v1;

// KEK-sealed opaque secret store (ADR 0051 §2.3, rev 2026-06-10). Keys
// are caller-supplied and never interpreted (the orchestrator uses its
// better-auth user ids). The caller is a single trusted service
// (bearer-authed); there is no per-user authz here — attribution and
// authz live in the orchestrator. Replaces the storage half of
// /me/claude-token; sealing stays in Rust.
service SecretService {
  // Upsert: seals the value and inserts-or-replaces the row under
  // `key` (the plan's Task 13: "PutSecret seals + upserts"). There is
  // no create/update distinction and no already-exists error.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc HasSecret(HasSecretRequest) returns (HasSecretResponse);
  // Idempotent on missing keys: deleting a key that does not exist
  // succeeds. Intended contract, not an accident — callers need no
  // exists-check before delete.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message PutSecretRequest {
  string key = 1;
  // Plaintext in transit (TLS/private net); sealed at rest. Never
  // returned — there is deliberately no GetSecret on this surface.
  string value = 2;
}

// Success carries no payload — no body to mirror, per the package's
// empty-response convention.
message PutSecretResponse {}

message HasSecretRequest {
  string key = 1;
}

message HasSecretResponse {
  bool exists = 1;
}

message DeleteSecretRequest {
  string key = 1;
}

// Success carries no payload — no body to mirror, per the package's
// empty-response convention.
message DeleteSecretResponse {}
