syntax = "proto3";

package engram.app.v1;

// Automations v2 (ADR 0119): trigger + ordered block graph + inputs, run on
// one durable interpreter workflow. ORCHESTRATOR-NATIVE: like task.proto /
// profile.proto, this service is not compiled into the coordinator's Rust
// surface.
//
// Definitions ride the wire as JSON strings (`definition_json`,
// `inputs_schema_json`, `inputs_json`, `block_overrides_json`); the
// orchestrator is the validation authority and answers with structured,
// block-addressed BlockError values rather than prose.
service AutomationService {
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  // By id, or by builtin_key for the shipped automations.
  rpc GetAutomation(GetAutomationRequest) returns (GetAutomationResponse);
  // definition_json → version 1.
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  // Builder v2: create a disabled automation plus the sandboxed drafting
  // session that assembles it from a plain-English prompt.
  rpc DraftAutomation(DraftAutomationRequest) returns (DraftAutomationResponse);
  // Save = a new immutable version; in-flight runs finish on theirs.
  // PermissionDenied on a built-in (structure is locked — use
  // SetBlockOverrides / SetInputs).
  rpc SaveVersion(SaveVersionRequest) returns (SaveVersionResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc SetAutomationEnabled(SetAutomationEnabledRequest) returns (SetAutomationEnabledResponse);
  // Name / description / run settings. Settings are PermissionDenied on a
  // built-in.
  rpc UpdateAutomationMeta(UpdateAutomationMetaRequest) returns (UpdateAutomationMetaResponse);
  // Per-automation input values (allowed on built-ins).
  rpc SetInputs(SetInputsRequest) returns (SetInputsResponse);
  // Per-automation tunable block fields (allowed on built-ins). Every key
  // must be a `tunable` field of that block in the current version, and the
  // merged config must re-validate against the block's schema.
  rpc SetBlockOverrides(SetBlockOverridesRequest) returns (SetBlockOverridesResponse);
  // A fully editable user copy (built-ins included); overrides are folded in.
  rpc DuplicateAutomation(DuplicateAutomationRequest) returns (DuplicateAutomationResponse);
  rpc ArchiveAutomation(ArchiveAutomationRequest) returns (ArchiveAutomationResponse);
  // Render every block against a sample without side effects: per-block
  // rendered config, filter verdicts, and the scope visible at that block.
  rpc TestRender(TestRenderRequest) returns (TestRenderResponse);
  // A real run whose integration actions are stubbed (they record what they
  // would have done). Appears in the run list flagged dry_run.
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  // Evaluate a code-block source in the QuickJS sandbox (ADR 0119 D6).
  rpc EvalCode(EvalCodeRequest) returns (EvalCodeResponse);
  // Manual trigger: start a run now with an optional input override.
  rpc RunNow(RunNowRequest) returns (RunNowResponse);
  // Stored deliveries for the automation's trigger source (integration ledger
  // or custom-webhook samples).
  rpc ListEventSamples(ListEventSamplesRequest) returns (ListEventSamplesResponse);
  // Picker values for a map input keyed by an integration noun.
  rpc ListInputKeyOptions(ListInputKeyOptionsRequest) returns (ListInputKeyOptionsResponse);
  // ADR 0119 D5: the connector-declared event and action catalogs.
  rpc ListEventCatalog(ListEventCatalogRequest) returns (ListEventCatalogResponse);
  rpc ListActionCatalog(ListActionCatalogRequest) returns (ListActionCatalogResponse);
}

service AutomationRunService {
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  // A fresh run with the same trigger payload. `from_step_id` is recorded
  // but v1 always re-runs from the start.
  rpc RetryRun(RetryRunRequest) returns (RetryRunResponse);
}

service WebhookRegistrationService {
  // The verification secret is returned only by this RPC. It is sealed into
  // the org-secret store server-side and never persisted in orchestrator PG.
  rpc CreateWebhookRegistration(CreateWebhookRegistrationRequest) returns (CreateWebhookRegistrationResponse);
  rpc ListWebhookRegistrations(ListWebhookRegistrationsRequest) returns (ListWebhookRegistrationsResponse);
  rpc DeleteWebhookRegistration(DeleteWebhookRegistrationRequest) returns (DeleteWebhookRegistrationResponse);
  rpc ListWebhookEvents(ListWebhookEventsRequest) returns (ListWebhookEventsResponse);
}

// ---------------------------------------------------------------------------
// Core shapes
// ---------------------------------------------------------------------------

message Automation {
  string id = 1;
  string name = 2;
  string description = 3;
  // "user" | "builtin"
  string kind = 4;
  optional string builtin_key = 5;
  bool enabled = 6;
  int32 current_version = 7;
  // Per-automation input values.
  string inputs_json = 8;
  // Per-automation tunable block overrides: {[blockId]: {[field]: value}}.
  string block_overrides_json = 9;
  bool archived = 10;
  optional string created_by_user_id = 11;
  optional string next_fire_at = 12;
  optional string last_fired_at = 13;
  // Builder v2: the AI drafting session bound to this automation, when a
  // draft is in progress.
  optional string draft_session_id = 17;
  string created_at = 14;
  string updated_at = 15;
  // The current version's definition, for the editor.
  AutomationVersion version = 16;
}

message AutomationVersion {
  string automation_id = 1;
  int32 number = 2;
  // AutomationDefinition JSON: {engine, trigger, blocks, inputsSchema, settings}.
  string definition_json = 3;
  optional string created_by_user_id = 4;
  string created_at = 5;
}

message AutomationRunBrief {
  string id = 1;
  string automation_id = 2;
  int32 version = 3;
  string status = 4;
  optional string error = 5;
  // "cron" | "webhook" | "integration" | "manual"
  string trigger_source = 6;
  optional string event_key = 7;
  optional string delivery_key = 8;
  bool dry_run = 9;
  optional string started_at = 10;
  optional string ended_at = 11;
  string created_at = 12;
}

message DayRunCount {
  // YYYY-MM-DD (UTC)
  string day = 1;
  int32 completed = 2;
  int32 failed = 3;
  int32 filtered = 4;
  int32 other = 5;
}

message AutomationSummary {
  Automation automation = 1;
  // Server-rendered, e.g. "GitHub · PR opened, synchronize · 4 repos".
  string trigger_summary = 2;
  optional AutomationRunBrief last_run = 3;
  repeated DayRunCount runs_7d = 4;
}

// A validation error addressed to the block and field the editor must show.
// block_id is "" for definition-level errors (trigger, settings).
message BlockError {
  string block_id = 1;
  string field = 2;
  string code = 3;
  string message = 4;
}

// ---------------------------------------------------------------------------
// AutomationService requests/responses
// ---------------------------------------------------------------------------

message ListAutomationsRequest {
  bool include_archived = 1;
}

message ListAutomationsResponse {
  repeated AutomationSummary automations = 1;
}

message GetAutomationRequest {
  oneof lookup {
    string id = 1;
    string builtin_key = 2;
  }
}

message GetAutomationResponse {
  Automation automation = 1;
}

message DraftAutomationRequest {
  // The plain-English description the drafting agent starts from.
  string prompt = 1;
  // The profile the drafting session runs on (this is what gives the agent
  // its repos).
  string profile_id = 2;
  // Client-stable key: a retried create reaches the same automation/session.
  string idempotency_key = 3;
  optional string harness = 4;
  optional string model = 5;
  optional string model_router = 6;
  optional string effort = 7;
  optional string harness_mode = 8;
}

message DraftAutomationResponse {
  string automation_id = 1;
  string session_id = 2;
  // False when the call replayed a create the same key already made.
  bool created = 3;
}

message CreateAutomationRequest {
  string name = 1;
  string description = 2;
  bool enabled = 3;
  string definition_json = 4;
  string inputs_json = 5;
}

message CreateAutomationResponse {
  Automation automation = 1;
}

message SaveVersionRequest {
  string automation_id = 1;
  string definition_json = 2;
}

message SaveVersionResponse {
  Automation automation = 1;
}

message ListVersionsRequest {
  string automation_id = 1;
}

message ListVersionsResponse {
  repeated AutomationVersion versions = 1;
}

message SetAutomationEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message SetAutomationEnabledResponse {
  Automation automation = 1;
}

message UpdateAutomationMetaRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  // AutomationSettings JSON; saves a new version carrying the settings.
  optional string settings_json = 4;
}

message UpdateAutomationMetaResponse {
  Automation automation = 1;
}

message SetInputsRequest {
  string automation_id = 1;
  string inputs_json = 2;
}

message SetInputsResponse {
  Automation automation = 1;
}

message SetBlockOverridesRequest {
  string automation_id = 1;
  string overrides_json = 2;
}

message SetBlockOverridesResponse {
  Automation automation = 1;
}

message DuplicateAutomationRequest {
  string automation_id = 1;
  optional string name = 2;
}

message DuplicateAutomationResponse {
  Automation automation = 1;
}

message ArchiveAutomationRequest {
  string id = 1;
}

message ArchiveAutomationResponse {
  Automation automation = 1;
}

message TestRenderRequest {
  string automation_id = 1;
  // Unsaved editor state; falls back to the stored current version.
  optional string draft_definition_json = 2;
  // Draft input values; falls back to the stored values.
  optional string inputs_json = 3;
  oneof sample {
    string sample_id = 4;
    string payload_json = 5;
  }
  // Cron/manual previews carry no payload; this names the occurrence.
  optional string scheduled_for = 6;
  // ADR 0119 D9: which entrypoint to render (default "main").
  optional string entrypoint_id = 7;
}

message BlockRender {
  string block_id = 1;
  string block_type = 2;
  // The block config with every Liquid template resolved.
  string rendered_json = 3;
  // Filter blocks: whether the sample passes.
  optional bool filter_pass = 4;
  // The variables visible AT this block (trigger/event/inputs/steps so far).
  string scope_json = 5;
}

message TestRenderResponse {
  repeated BlockRender blocks = 1;
  repeated BlockError errors = 2;
}

message DryRunRequest {
  string automation_id = 1;
  oneof sample {
    string sample_id = 2;
    string payload_json = 3;
  }
  // ADR 0119 D9: which entrypoint to run (default "main").
  optional string entrypoint_id = 4;
}

message DryRunResponse {
  string run_id = 1;
}

message EvalCodeRequest {
  string source = 1;
  // "value" | "boolean"
  string mode = 2;
  // JSON object with optional event/steps/inputs/trigger keys; the scope the
  // code sees. Capped at 512 KiB.
  string input_json = 3;
}

message EvalCodeResponse {
  optional string value_json = 1;
  optional string error_name = 2;
  optional string error_message = 3;
  optional int32 error_line = 4;
  repeated string logs = 5;
  int64 duration_ms = 6;
}

message RunNowRequest {
  string automation_id = 1;
  // Optional one-off input override (merged over the stored values).
  optional string inputs_json = 2;
  // Optional event payload for integration/webhook-shaped automations.
  optional string payload_json = 3;
  // ADR 0119 D9: which entrypoint to run (default "main").
  optional string entrypoint_id = 4;
}

message RunNowResponse {
  string run_id = 1;
}

message EventSample {
  string id = 1;
  string event_key = 2;
  string payload_json = 3;
  string received_at = 4;
}

message ListEventSamplesRequest {
  string automation_id = 1;
  optional string event_key = 2;
  int32 limit = 3;
}

message ListEventSamplesResponse {
  repeated EventSample samples = 1;
}

message ListInputKeyOptionsRequest {
  // "repository" | "channel" | "team"
  string noun = 1;
  optional string connection_id = 2;
}

message InputKeyOption {
  string key = 1;
  string label = 2;
}

message ListInputKeyOptionsResponse {
  repeated InputKeyOption options = 1;
}

// ---------------------------------------------------------------------------
// AutomationRunService
// ---------------------------------------------------------------------------

message ListRunsRequest {
  string automation_id = 1;
  // Most-recent first; 0 uses the server default, capped server-side.
  int32 limit = 2;
  // Include filtered runs individually instead of collapsing them.
  bool include_filtered = 3;
}

// Consecutive filtered runs collapsed between real runs.
message FilteredWindow {
  int32 count = 1;
  string first_at = 2;
  string last_at = 3;
  // The id of the run this window precedes (newest first), or "" at the end.
  string before_run_id = 4;
}

message ListRunsResponse {
  repeated AutomationRunBrief runs = 1;
  repeated FilteredWindow filtered = 2;
}

message AutomationStepRun {
  // The frame path (loop iterations suffixed blockId[i]).
  string block_id = 1;
  int32 attempt = 2;
  string status = 3;
  string inputs_json = 4;
  string outputs_json = 5;
  optional string error = 6;
  optional string session_id = 7;
  string started_at = 8;
  optional string ended_at = 9;
}

message AutomationRun {
  AutomationRunBrief brief = 1;
  string trigger_json = 2;
  repeated AutomationStepRun steps = 3;
  repeated string session_ids = 4;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  AutomationRun run = 1;
}

message StopRunRequest {
  string run_id = 1;
  optional string reason = 2;
}

message StopRunResponse {
  bool sent = 1;
}

message RetryRunRequest {
  string run_id = 1;
  optional string from_step_id = 2;
}

message RetryRunResponse {
  string run_id = 1;
}

// ---------------------------------------------------------------------------
// Webhook registrations (custom generic hooks)
// ---------------------------------------------------------------------------

message WebhookRegistration {
  string id = 1;
  string name = 2;
  string verification_scheme = 3;
  optional string provider_hint = 4;
  optional string created_by_user_id = 5;
  string created_at = 6;
  string updated_at = 7;
  // Set when the registration can no longer receive deliveries (ADR 0119 D5:
  // provider signature schemes retired). The hook URL answers 410 Gone.
  optional string disabled_reason = 8;
}

message CreateWebhookRegistrationRequest {
  // Lowercase URL-safe slug used as /api/v1/hooks/:id.
  string id = 1;
  string name = 2;
  string verification_scheme = 3;
  optional string provider_hint = 4;
}

message CreateWebhookRegistrationResponse {
  WebhookRegistration registration = 1;
  // Plaintext verification secret, visible exactly once in this response.
  string secret = 2;
}

message ListWebhookRegistrationsRequest {}

message ListWebhookRegistrationsResponse {
  repeated WebhookRegistration registrations = 1;
}

message DeleteWebhookRegistrationRequest {
  string id = 1;
}

message DeleteWebhookRegistrationResponse {
  bool deleted = 1;
}

message ListWebhookEventsRequest {
  string registration_id = 1;
}

message WebhookEvent {
  string key = 1;
  string display_name = 2;
  bool observed = 3;
}

message WebhookVariable {
  string path = 1;
  string alias = 2;
}

message ListWebhookEventsResponse {
  repeated WebhookEvent events = 1;
  repeated WebhookVariable variables = 2;
}

// ---------------------------------------------------------------------------
// Catalogs (ADR 0119 D5)
// ---------------------------------------------------------------------------

message ListEventCatalogRequest {
  string provider = 1;
}

message EventCatalogEntry {
  string key = 1;
  string label = 2;
  string description = 3;
  // FieldSchema JSON (the bounded subset the connector declared); empty when
  // the event has no curated schema.
  string schema_json = 4;
  // Newest ledgered payload for the default connection, else the checked-in
  // fixture; empty when neither exists.
  string sample_json = 5;
  bool observed = 6;
  bool hidden = 7;
}

message EventCatalogScope {
  string key = 1;
  string label = 2;
}

message ListEventCatalogResponse {
  repeated EventCatalogEntry events = 1;
  optional EventCatalogScope scope = 2;
  repeated WebhookVariable variables = 3;
  string default_connection_id = 4;
}

message ListActionCatalogRequest {
  string provider = 1;
}

// Member-safe projection: never the execution details.
message ActionCatalogEntry {
  string id = 1;
  string label = 2;
  string description = 3;
  string input_schema_json = 4;
}

message ListActionCatalogResponse {
  repeated ActionCatalogEntry actions = 1;
}
