syntax = "proto3";

package engram.app.v1;

import "engram/app/v1/session.proto";
import "engram/app/v1/profile.proto";
import "engram/app/v1/user.proto";

// The application aggregate root (ADR 0051 §3, rev 2026-06-10).
// ORCHESTRATOR-NATIVE: the
// control plane neither implements nor knows about tasks — this file
// lives in the same package so web gets one uniform generated API, and
// it is excluded from the Rust build.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // Filters narrow inside the caller's ability, never widen it. An empty
  // request is the legacy ability-scoped, unpaginated behavior.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // BLAST RADIUS (plan Task 19): requires ability "delete" on the
  // task. The orchestrator first calls the control plane's
  // DeleteSession for each task_session row — deleting a task tears
  // down its session(s), sandboxes included — then deletes the task
  // row (task_session rows go by FK cascade). Idempotent-ish: the
  // session teardown inherits DeleteSession's racy-idempotent
  // semantics.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // Rename (or reset) a task's title. Requires ability "update" on the
  // task — the owner or an admin. A present `title` sets the user's
  // STICKY custom title (harness suggestions no longer override it); an
  // absent `title` clears it (reset), so the effective title falls back
  // to the most-recent harness suggestion, then the truncated-prompt
  // default.
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
}

message CreateTaskRequest {
  // "chat" is the only accepted value for now;
  // linear_issue/dependabot/incident later.
  string type = 1;
  // ADR 0053: sessions now start from a profile, not a raw image. The image
  // is resolved server-side from the profile's image_id.
  reserved 2;
  reserved "image_uri";
  // The user's task (no longer ever an admin-configured value; profiles carry
  // no prompt — ADR §5).
  optional string prompt = 3;
  optional string title = 4;
  // The profile the user picked (ADR §5). Required in practice; the handler
  // rejects an empty/unknown/archived id.
  string profile_id = 5;
  // ADR 0063 B2: per-session override of the profile's default harness / model /
  // effort (e.g. Claude Code for planning, a smaller model for execution). Unset
  // = use the profile's default. Validated against the harness catalog.
  optional string harness = 6;
  optional string model = 7;
  optional string effort = 8;
  // ADR 0107: session mode for the initial prompt (e.g. "plan"). Passed
  // through to CreateSessionRequest.harness_mode; validated against the
  // selected harness's descriptor modes.
  optional string harness_mode = 9;
  // ADR 0113: create the task and primary session without sending the prompt.
  // The prompt still supplies the initial task title.
  bool defer_initial_prompt = 10;
  // Empty means direct/native provider. Unset inherits the profile.
  optional string model_router = 11;
}

message CreateTaskResponse {
  Task task = 1;
}

message Task {
  string id = 1;
  // "chat" now; linear_issue/dependabot/incident later.
  string type = 2;
  optional string title = 3;
  // "open" | "working" | "awaiting_review" | "done" | "failed".
  string status = 4;
  // Raw attribution fact matching the task.created_by_user_id DB column;
  // unset for system-triggered tasks. Attribution lives HERE, not on the
  // control-plane Session.
  optional string created_by_user_id = 5;
  // Type-specific trigger ref (jsonb passthrough).
  string source_json = 6;
  repeated TaskSessionRef sessions = 7;
  // ISO-8601.
  string created_at = 8;
  // True when `title` is the user's sticky custom title (they renamed it);
  // false when it is auto (harness suggestion or truncated prompt). Lets the
  // UI offer a "reset to auto" affordance. Derived: custom_title != null.
  bool title_is_custom = 9;
  // Best-effort directory resolution of created_by_user_id, performed
  // server-side. Unset for unattributed/automation rows (no creator) or when
  // the corresponding better-auth user row is gone.
  optional User created_by = 10;
  // ADR 0063 B2 echo: the EFFECTIVE harness / model / effort this task's
  // sessions run with, resolved at create time (per-task override ?? profile
  // default ?? catalog default) and persisted on the task row. Unset on tasks
  // created before the columns existed.
  optional string harness = 11;
  optional string model = 12;
  optional string effort = 13;
  optional string parent_task_id = 14;
  optional string root_task_id = 15;
  optional string local_task_name = 16;
  optional string canonical_task_name = 17;
  optional string spawning_session_id = 18;
  repeated Task descendants = 19;
  optional string model_router = 20;
}

message TaskSessionRef {
  string session_id = 1;
  optional string role = 2;
  // Denormalized from the control plane at read time (state, image, …);
  // unset when the control-plane lookup fails or lags. proto3
  // `optional` on a message-typed field is redundant but kept to make
  // the unset case explicit.
  optional Session session = 3;
  // ADR 0053: resolved profile identity for the session's originating profile,
  // for the app-wide chip (§9). Unset for legacy / profile-less sessions.
  optional ProfileSnapshot profile = 4;
}

message ListTasksRequest {
  // "" = legacy ability default (member → own, admin → all + unattributed);
  // "mine" = strictly the caller's own tasks (admins included);
  // "all"  = fleet-wide + unattributed, admin-only (PermissionDenied otherwise).
  string scope = 1;
  // Case-insensitive substring over task title, task id, and session ids.
  string search = 2;
  // Owner filter: entries are better-auth user ids or the sentinel "system"
  // for unattributed rows. OR within the field; empty = no owner filter.
  repeated string created_by_user_ids = 3;
  // Live session-state filter (e.g. "active", "idle", "dead"). A task matches
  // when its DISPLAY state — the primary session's live status, "pending" when
  // the task has no session at all, or "dead" when its session is gone from the
  // control plane — is in the set. Empty = no filter. Nothing matches while
  // session state is unavailable: the server will not guess a state to filter
  // on (see session_state_available on the response).
  repeated string states = 4;
  // 1-based page over the filtered ordering.
  // page_size 0 = unpaginated (legacy callers); clamped to 1000 otherwise.
  int32 page = 5;
  int32 page_size = 6;
  // "" (default) = band first, then recency inside the band: everything that
  // needs a person, then everything working, then everything asleep, then
  // history. This is what a task LIST wants — page one holds the live work.
  // "recency" = strict most-recently-active-first, for a caller that wants the
  // newest few whatever their state (the start screen's "Recent"). Under band
  // order a just-finished task is paged out behind every live one, so a
  // recency caller must say so rather than re-sorting the page it was given.
  string order = 7;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  int32 total_count = 2; // matches BEFORE pagination
  // True when the control plane did not answer, so NO task on this response
  // carries live session state. A task whose `session` is unset is then simply
  // unknown — it has NOT been collected, and a client must not band, filter, or
  // draw it as terminal. False on every healthy response, including one where
  // individual sessions are genuinely gone.
  //
  // Stated in the NEGATIVE on purpose. proto3 defaults a bool to false, so the
  // absent field has to mean "nothing is wrong": a new client reading an old
  // server's response would otherwise decide the control plane was down and
  // drop every list to its degraded shape.
  bool session_state_unavailable = 3;
}

message GetTaskRequest {
  // Supply exactly one selector. Session lookup lets a session page resolve
  // child tasks, which ListTasks intentionally hides from top-level lists.
  string task_id = 1;
  string session_id = 2;
}

message GetTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  string task_id = 1;
}

message DeleteTaskResponse {}

message UpdateTaskRequest {
  string task_id = 1;
  // Present ⇒ set the sticky custom title. Absent ⇒ clear it (reset to auto).
  optional string title = 2;
}

message UpdateTaskResponse {
  Task task = 1;
}
