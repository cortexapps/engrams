syntax = "proto3";

package engram.app.v1;

// Session profiles (ADR 0053) — admin-curated session starting points.
// ORCHESTRATOR-NATIVE: the control plane neither implements nor knows about
// profiles. This file lives in the app package so web gets one uniform
// generated API, and it is deliberately ABSENT from crates/engram-protocol/
// build.rs (never compiled into Rust), exactly like task.proto.
service ProfileService {
  // active only by default; include_archived is admin-only (ADR §4/§6).
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Soft delete — sets deleted_at (ADR §4).
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
}

// An admin-curated bundle of session-launch inputs (ADR §1).
message Profile {
  string id = 1;
  string name = 2;
  string description = 3;
  // A lucide-react icon name (ADR §1; the web app's icon set).
  string icon = 4;
  // Logical ref to the coordinator's enabled_images.id (ADR §3) — NOT a wire
  // FK. Resolved to the live image_uri at session-create / read time.
  string image_id = 5;
  // Capability grant: inject the user's Claude token (ADR §5).
  bool include_user_tokens = 6;
  // Admin-only environment ({KEY: VALUE}); the model lives here. OMITTED
  // (empty) for non-admin callers (ADR §6).
  map<string, string> env_vars = 7;
  // deleted_at IS NOT NULL (ADR §4). Archived profiles are admin-visible only.
  bool archived = 8;
  // ISO-8601.
  string created_at = 9;
  // ISO-8601.
  string updated_at = 10;
  // ADR 0055: dynamic skill bundle names this profile's sessions mount (e.g.
  // ["skills", "browser"]). The coordinator resolves each to a reserved-slot
  // mount at session create. Empty = base session (no skills).
  repeated string skills = 11;
  reserved 12; // was flat integration capabilities; replaced by structured grants.
  // ADR 0057: egress network allow-list this profile's sessions may reach
  // (deny by default). Lifted from the image manifest onto the profile; compiled
  // into the per-session egress policy (not consumed at boot until B2).
  ProfileNetwork network = 13;
  // ADR 0057: secrets injected into this profile's sessions, resolved from the
  // org secret store by `ref` (the value lives there, never here). Lifted from
  // the image manifest onto the profile; B2 consumes it at boot.
  repeated ProfileSecret secrets = 14;
  reserved 15; // was is_default; Slack routing picks a profile per message.
  // ADR 0062/0063: the default harness (a HarnessCatalogService catalog
  // name) plus default model/effort (catalog option ids) for this
  // profile's sessions. Empty = inherit (deployment-default harness; the
  // harness descriptor's default model/effort). Overridable per session
  // at create.
  optional string harness = 16;
  optional string model = 17;
  optional string effort = 18;
  // ADR 0064: guest ports auto-exposed (private) for every session from this profile.
  repeated uint32 port_exposures = 19;
  // ADR 0100: system-role marker (e.g. "pr_reviewer"). At most one active
  // profile per designation (the store clears the prior when one is set); a
  // designated profile cannot be deleted. Empty = an ordinary profile.
  optional string designation = 20;
  // ADR 0109: named connection + operation + resource authority. The
  // connection fixes the provider identity used by the session.
  repeated ProfileIntegrationGrant integration_grants = 21;
}

message ProfileIntegrationGrant {
  string connection_id = 1;
  string operation = 2;
  repeated string resource_constraints = 3;
}

// ADR 0057: a profile's egress network allow-list. `default` is the posture for
// hosts not matched by an allow entry ("deny" — the only sane default — or
// "allow" for a fully-open profile). Mirrors the manifest NetworkPolicy it lifts.
message ProfileNetwork {
  string default = 1; // "deny" (default) | "allow"
  repeated string allow_hosts = 2; // exact hostnames
  repeated string allow_host_patterns = 3; // leading-wildcard globs (*.example.com)
}

// ADR 0057: one secret a profile injects. The value is NOT here — `ref` names an
// org secret resolved at session create. `mode` picks the injection style:
// "broker" (env placeholder + proxy substitution on allow_hosts; the guest never
// holds the value) or "literal" (raw value in the guest env).
message ProfileSecret {
  string ref = 1; // org-secret name (the value-store key)
  string env_var = 2; // env var the value is exposed as
  string mode = 3; // "broker" (default) | "literal"
  repeated string allow_hosts = 4; // broker-mode substitution hosts
  repeated string allow_host_patterns = 5;
}

// Lightweight resolved identity embedded on TaskSessionRef for the chip
// (ADR §9). image_uri is resolved from image_id at read time.
message ProfileSnapshot {
  string id = 1;
  string name = 2;
  string icon = 3;
  bool archived = 4;
  string image_uri = 5;
  // ADR 0064: the profile's selected skill bundle names (same set as
  // Profile.skills; member-visible, not sensitive). The web derives optional
  // session capabilities from these — e.g. the BROWSER tab shows iff this
  // includes "browser" — without a separate capability fetch. Resolved from the
  // current profile row at read time, like image_uri.
  repeated string skills = 6;
}

message ListProfilesRequest {
  // Admin-only; silently ignored (treated as false) for non-admin callers.
  bool include_archived = 1;
}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message GetProfileRequest {
  string id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message CreateProfileRequest {
  string name = 1;
  string description = 2;
  string icon = 3;
  string image_id = 4;
  bool include_user_tokens = 5;
  map<string, string> env_vars = 6;
  // ADR 0055: dynamic skill bundle names (see Profile.skills).
  repeated string skills = 7;
  reserved 8; // was flat integration capabilities.
  // ADR 0057: see Profile.network / Profile.secrets.
  ProfileNetwork network = 9;
  repeated ProfileSecret secrets = 10;
  reserved 11; // was is_default.
  // ADR 0062/0063: default harness / model / effort (see Profile).
  optional string harness = 12;
  optional string model = 13;
  optional string effort = 14;
  // ADR 0064: guest ports auto-exposed (private) for every session from this profile.
  repeated uint32 port_exposures = 15;
  // ADR 0100: system-role marker (see Profile.designation). Admin-only.
  optional string designation = 16;
  repeated ProfileIntegrationGrant integration_grants = 17;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string image_id = 5;
  bool include_user_tokens = 6;
  map<string, string> env_vars = 7;
  // ADR 0055: dynamic skill bundle names (see Profile.skills).
  repeated string skills = 8;
  reserved 9; // was flat integration capabilities.
  // ADR 0057: see Profile.network / Profile.secrets.
  ProfileNetwork network = 10;
  repeated ProfileSecret secrets = 11;
  reserved 12; // was is_default.
  // ADR 0062/0063: default harness / model / effort (see Profile).
  optional string harness = 13;
  optional string model = 14;
  optional string effort = 15;
  // ADR 0064: guest ports auto-exposed (private) for every session from this profile.
  repeated uint32 port_exposures = 16;
  // ADR 0100: system-role marker (see Profile.designation). Admin-only.
  optional string designation = 17;
  repeated ProfileIntegrationGrant integration_grants = 18;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message DeleteProfileRequest {
  string id = 1;
}

message DeleteProfileResponse {}
