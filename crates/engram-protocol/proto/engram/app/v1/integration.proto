syntax = "proto3";

package engram.app.v1;

// ADR 0057 C3: orchestrator-native connector catalog CRUD (Plane B). Connectors
// live in the orchestrator DB (the `connector` table, C1); the built-ins
// (github/datadog) are read-only file seeds surfaced alongside custom ones.
// NOT compiled into the coordinator (orchestrator-native, like ProfileService /
// TaskService). Admin-gated; `config_json` is the raw connector JSON, validated
// by `parseConnector` (the admin-trust boundary) on write.
service IntegrationService {
  // Built-in seeds (read-only) ∪ admin-authored connectors. Admin-only; each row
  // carries the derived connected/available `status`.
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  // Create or replace a custom connector. Rejects a built-in provider id and
  // any config `parseConnector` refuses. Invalidates the registry cache.
  rpc UpsertConnector(UpsertConnectorRequest) returns (UpsertConnectorResponse);
  // Delete a custom connector (idempotent). Rejects a built-in provider id.
  rpc DeleteConnector(DeleteConnectorRequest) returns (DeleteConnectorResponse);
  // Member-readable provider catalog: per-connector display identity + the
  // powers it grants + the hosts it opens, derived from the merged registry.
  // Carries NO secret material (no secretRef / header / template / mint kind) —
  // safe for the Launch receipt + in-session provider icons (redesign).
  rpc GetIntegrationCatalog(GetIntegrationCatalogRequest) returns (GetIntegrationCatalogResponse);
  // Admin-only: store a mint kind's credentials, sealing each field as an org
  // secret `<kind>.<field>` (the coordinator resolves them by that name). The
  // GitHub App private key is a secret; the App ID is config — both are sealed.
  rpc SetMintCredential(SetMintCredentialRequest) returns (SetMintCredentialResponse);
  // Admin-only: upload (or replace) a connector's logo — orchestrator-owned
  // (the coordinator never sees connectors). Bytes land in the connector_logo
  // table (≤512 KB, SVG or square PNG, sniffed) and are served at
  // GET /api/v1/integrations/<provider>/logo. Empty `data` clears the logo.
  rpc UploadConnectorLogo(UploadConnectorLogoRequest) returns (UploadConnectorLogoResponse);
  // Admin-only: test a connector's credential. Builds the resolved spec from the
  // registry and delegates the actual unseal/mint + benign GET to the coordinator
  // (MintService.RunConnectorTest). `draft_values` carries an about-to-be-saved
  // credential to test before sealing (inject: the single value under any key;
  // mint: the field map); empty tests the stored credential.
  rpc TestConnector(TestConnectorRequest) returns (TestConnectorResponse);
  // Admin-only: store the values of a connector's declared `settings` (non-
  // secret parameters such as the API host a regional or self-hosted provider
  // is reached on). Values live on the provider's default connection and feed
  // the connector's effective hosts, the test probe, and the CLI env.
  rpc SetConnectorSettings(SetConnectorSettingsRequest) returns (SetConnectorSettingsResponse);
  // ADR 0109: configured credential instances. Existing providers expose an
  // ordinary default connection; the first provider with user-created named
  // connections is Google Cloud, whose config contains no private key.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  rpc SetConnectionEnabled(SetConnectionEnabledRequest) returns (SetConnectionEnabledResponse);
  rpc GetGoogleCloudSetup(GetGoogleCloudSetupRequest) returns (GetGoogleCloudSetupResponse);
  rpc DiscoverMcp(DiscoverMcpRequest) returns (DiscoverMcpResponse);
  rpc PublishMcp(PublishMcpRequest) returns (PublishMcpResponse);
  rpc PutMcpCredential(PutMcpCredentialRequest) returns (McpCredentialResponse);
  rpc GetMcpSetup(GetMcpSetupRequest) returns (GetMcpSetupResponse);
  rpc CompleteMcpAuthorization(CompleteMcpAuthorizationRequest) returns (McpCredentialResponse);
  rpc RecoverMcpCredential(RecoverMcpCredentialRequest) returns (McpCredentialResponse);
  rpc AuthorizeMcp(AuthorizeMcpRequest) returns (AuthorizeMcpResponse);
  rpc DisconnectMcp(DisconnectMcpRequest) returns (DisconnectMcpResponse);
  rpc ListMcpApprovals(ListMcpApprovalsRequest) returns (ListMcpApprovalsResponse);
  rpc DecideMcpApproval(DecideMcpApprovalRequest) returns (DecideMcpApprovalResponse);
  rpc CancelMcpCall(CancelMcpCallRequest) returns (CancelMcpCallResponse);
  rpc ResolveMcpOutcome(ResolveMcpOutcomeRequest) returns (ResolveMcpOutcomeResponse);
  rpc RebindMcp(RebindMcpRequest) returns (RebindMcpResponse);
}

message GoogleCloudConnectionConfig {
  // Full provider resource:
  // //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
  string workload_identity_provider = 1;
  string service_account_email = 2;
  // Exact Google API hosts and explicit non-googleapis targets such as GKE API
  // servers. Wildcards and URLs are rejected.
  repeated string endpoints = 3;
  // Optional exact PostgreSQL instance connection name: project:region:instance.
  // The guest can open only this target through the host Cloud SQL tunnel.
  string cloud_sql_postgres_instance = 4;
}

message IntegrationConnection {
  string id = 1;
  string alias = 2;
  string provider = 3;
  string display_name = 4;
  bool enabled = 5;
  string tested_at = 6;
  string created_at = 7;
  string updated_at = 8;
  GoogleCloudConnectionConfig google_cloud = 9;
  bool is_default = 10;
  McpConnectionConfig mcp = 11;
  uint32 config_revision = 12;
  uint32 auth_generation = 13;
  string credential_identity = 14;
  uint32 catalog_revision = 15;
  bool revoked = 16;
}

message ListConnectionsRequest {}
message ListConnectionsResponse {
  repeated IntegrationConnection connections = 1;
}

message CreateConnectionRequest {
  string alias = 1;
  string provider = 2;
  string display_name = 3;
  GoogleCloudConnectionConfig google_cloud = 4;
  McpConnectionConfig mcp = 5;
}
message CreateConnectionResponse {
  IntegrationConnection connection = 1;
}

message UpdateConnectionRequest {
  uint32 expected_generation = 7;
  uint32 expected_revision = 6;
  string id = 1;
  string alias = 2;
  string display_name = 3;
  GoogleCloudConnectionConfig google_cloud = 4;
  McpConnectionConfig mcp = 5;
}
message UpdateConnectionResponse {
  IntegrationConnection connection = 1;
}

message DeleteConnectionRequest {
  uint32 expected_revision = 2;
  uint32 expected_generation = 3;
  string id = 1;
}
message DeleteConnectionResponse {
  bool deleted = 1;
}

message TestConnectionRequest {
  string id = 1;
}
message TestConnectionResponse {
  bool ok = 1;
  string message = 2;
}

message SetConnectionEnabledRequest {
  string id = 1;
  bool enabled = 2;
  uint32 expected_revision = 3;
}
message SetConnectionEnabledResponse {
  IntegrationConnection connection = 1;
}

message GetGoogleCloudSetupRequest {
  string id = 1;
}
message GetGoogleCloudSetupResponse {
  string issuer = 1;
  string audience = 2;
  string subject_attribute = 3;
  string connection_attribute = 4;
  string gcloud_script = 5;
  string terraform = 6;
}

message Connector {
  string provider = 1;
  // The raw connector JSON (the same shape `parseConnector` validates).
  string config_json = 2;
  // True for the read-only built-in file seeds (github/datadog).
  bool builtin = 3;
  // ISO-8601; empty for built-in seeds.
  string created_at = 4;
  string updated_at = 5;
  // Derived credential posture: "connected" (configured) | "available". For an
  // inject connector, connected ⇔ its secretRef exists in the org store; for a
  // mint connector, connected ⇔ every required `<kind>.<field>` secret exists.
  string status = 6;
  // Stored values of the connector's declared `settings` (setting name →
  // value), read from the provider's default connection. Non-secret; a
  // setting the administrator has not set is absent (its default applies).
  map<string, string> settings = 7;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

message UpsertConnectorRequest {
  // Raw connector JSON; `provider` is read from it.
  string config_json = 1;
}

message UpsertConnectorResponse {
  Connector connector = 1;
}

message DeleteConnectorRequest {
  string provider = 1;
}

message DeleteConnectorResponse {
  bool deleted = 1;
}

// ---------------------------------------------------------------------------
// Member-readable provider catalog (redesign): display identity + derived
// powers + hosts. Mirrors `buildProviderCatalog()` in connectors/registry.ts.
// ---------------------------------------------------------------------------

// Per-connector visual identity. `mono` + `color` are always set; `logo` is a
// serve URL when an uploaded logo exists (the renderer falls back to `mono`).
message ConnectorIcon {
  string mono = 1;
  string color = 2;
  string logo = 3; // "" when none
}

message ConnectorDisplay {
  string name = 1;
  string category = 2;
  string blurb = 3;
  ConnectorIcon icon = 4;
  // True for a connector the marketplace lists first (built-in seeds only).
  bool featured = 5;
}

// One grantable power, derived for display (the slug stays canonical).
message CatalogCapability {
  string action = 1; // e.g. "issues:write"
  string access = 2; // "read" | "write" (derived from the op's HTTP method)
  string asset = 3; // asset kind this op surfaces, or "" when none
  // ADR 0109 seam: operator-facing name. A named-connection provider serves
  // its operation list here so the web renders from the SAME table the
  // orchestrator compiles policy from — two hand-maintained copies drift, and
  // the one the UI reads decides what an administrator can grant.
  string label = 4;
  // The exact host this operation calls; empty when its reach comes from the
  // connection's own endpoint list instead.
  string host = 5;
  // For a host-less operation, the kind of endpoint that makes it usable:
  // "google-api" | "non-google-api". Empty for a curated operation.
  string endpoint_rule = 6;
}

message ProviderCatalogEntry {
  string provider = 1;
  ConnectorDisplay display = 2;
  string credential_source = 3; // "mint" | "inject"
  repeated string hosts = 4;
  repeated CatalogCapability capabilities = 5;
  // Stable opaque ID for the provider's existing singleton credential slot.
  // New multi-connection surfaces list their instances separately.
  string default_connection_id = 6;
  // ADR 0109 seam: "singleton" (one org-wide credential slot) or "named" (an
  // administrator configures connections, each its own authority). The web
  // used to decide this by hard-coding the one provider it knew was named.
  string connection_model = 7;
  // ADR 0115: user-scoped credential support, when the connector declares it.
  // Absent = org-only. Member-safe (no refs/headers).
  UserCredentialSupport user_credential = 8;
}

// ADR 0115: which personal-credential modes a connector accepts, plus the
// member-facing setup line for token (PAT) mode.
message UserCredentialSupport {
  bool oauth = 1;
  bool token = 2;
  string token_hint = 3;
}

message GetIntegrationCatalogRequest {}

message GetIntegrationCatalogResponse {
  repeated ProviderCatalogEntry providers = 1;
}

// ---------------------------------------------------------------------------
// Mint-credential write path (redesign): seal a mint kind's fields as org
// secrets so the coordinator can mint a token per session.
// ---------------------------------------------------------------------------

message SetMintCredentialRequest {
  string provider = 1; // e.g. "github"
  string kind = 2; // e.g. "github_app"
  // field name → value (e.g. app_id, private_key_pem). Each non-empty value is
  // sealed as the org secret `<kind>.<field>`; values are never returned.
  map<string, string> values = 3;
}

message SetMintCredentialResponse {
  // The org-secret names written (the `<kind>.<field>` keys), for confirmation.
  repeated string secret_names = 1;
}

message UploadConnectorLogoRequest {
  string provider = 1;
  // Logo bytes (SVG or square PNG; ≤512 KB). Empty clears any existing logo.
  bytes data = 2;
  // Optional MIME hint ("image/svg+xml" | "image/png"); the server also sniffs.
  string media_type = 3;
}

message UploadConnectorLogoResponse {
  // The serve URL the catalog now points `icon.logo` at, or "" when cleared.
  string logo_url = 1;
}

message TestConnectorRequest {
  string provider = 1;
  // About-to-be-saved credential to test before sealing (empty = test the
  // stored one). inject: the single secret value under any key; mint: the
  // field map (e.g. app_id, private_key_pem).
  map<string, string> draft_values = 2;
  // About-to-be-saved settings values (setting name → value) to probe with,
  // e.g. the API host; a setting not present here uses the stored value, else
  // the connector's default.
  map<string, string> draft_settings = 3;
}

message TestConnectorResponse {
  bool ok = 1;
  string message = 2;
}

message SetConnectorSettingsRequest {
  string provider = 1;
  // Setting name → value. Every declared setting is validated against its
  // facet (a `host` setting must be a bare hostname); an unknown name is
  // rejected. Omitted settings are cleared back to their defaults.
  map<string, string> settings = 2;
}

message SetConnectorSettingsResponse {
  Connector connector = 1;
}

// Organization credential references only. Secret values never enter this contract.
message McpConnectionConfig {
  string endpoint = 1;
  string zone = 2;
  string auth_kind = 3;
  string api_key_secret_ref = 4;
  string oauth_client_registration_id = 5;
  bool share_with_org_sessions = 6;
}
message McpTool {
  string upstream_name = 1;
  string description = 2;
  string input_schema_json = 3;
  string output_schema_json = 4;
  // Empty in discovery drafts. Publication requires explicit read or write.
  string classification = 5;
  bool enabled = 6;
  string fingerprint = 7;
}
message McpCatalog {
  string id = 1;
  string connection_id = 2;
  string kind = 3;
  uint32 revision = 4;
  uint32 config_revision = 5;
  uint32 auth_generation = 6;
  repeated McpTool tools = 7;
  string fingerprint = 8;
}
message DiscoverMcpRequest {
  string connection_id = 1;
  uint32 expected_revision = 2;
}
message DiscoverMcpResponse {
  McpCatalog catalog = 1;
}
message PublishMcpRequest {
  string connection_id = 1;
  string draft_id = 2;
  uint32 expected_revision = 3;
  repeated McpTool tools = 4;
}
message PublishMcpResponse {
  McpCatalog catalog = 1;
}
message AuthorizeMcpRequest {
  uint32 expected_revision = 4;
  string connection_id = 1;
  uint32 expected_generation = 2;
  bool share_with_org_sessions = 3;
}
message AuthorizeMcpResponse {
  uint32 config_revision = 4;
  uint32 auth_generation = 5;
  string flow_id = 2;
  string expires_at = 3;
  string authorization_url = 1;
}
message DisconnectMcpRequest {
  uint32 expected_revision = 3;
  string connection_id = 1;
  uint32 expected_generation = 2;
}
message DisconnectMcpResponse {
  IntegrationConnection connection = 1;
}
message McpApproval {
  string execution_id = 1;
  string session_id = 2;
  string run_id = 3;
  string tool_call_id = 4;
  string connection_id = 5;
  string upstream_name = 6;
  string request_digest = 7;
  string argument_hash = 8;
  string expires_at = 9;
}
message ListMcpApprovalsRequest {
  string session_id = 1;
}
message ListMcpApprovalsResponse {
  repeated McpApproval approvals = 1;
}
message DecideMcpApprovalRequest {
  string execution_id = 1;
  bool approve = 2;
}
message DecideMcpApprovalResponse {
  string state = 1;
}
message CancelMcpCallRequest {
  string execution_id = 1;
}
message CancelMcpCallResponse {
  string state = 1;
}
message ResolveMcpOutcomeRequest {
  string execution_id = 1;
  string outcome = 2;
}
message ResolveMcpOutcomeResponse {
  string outcome = 1;
}
message RebindMcpRequest {
  string session_id = 1;
  string expected_binding_hash = 2;
}
message RebindMcpResponse {
  string binding_hash = 1;
}

// Entered values are request-only; responses contain metadata and references.
message PutMcpCredentialRequest {
  string connection_id = 1;
  uint32 expected_revision = 2;
  uint32 expected_generation = 3;
  string kind = 4;
  string header = 5;
  string value = 6;
}
message McpCredentialStatus {
  string status = 1;
  string reference = 2;
  string kind = 3;
  string credential_identity = 4;
  int64 version = 5;
  int64 reservation_generation = 6;
}
message McpCredentialResponse {
  IntegrationConnection connection = 1;
  McpCredentialStatus credential = 2;
}
message McpApprovedDestination {
  string zone_id = 1;
  string endpoint = 2;
}
message McpClientRegistration {
  string id = 1;
  string client_id = 2;
  bool confidential = 3;
  string redirect_uri = 4;
  string issuer = 5;
  McpApprovedDestination resource = 6;
  repeated string scopes = 7;
}
message GetMcpSetupRequest {
  string connection_id = 1;
}
message GetMcpSetupResponse {
  bool enabled = 1;
  repeated McpClientRegistration registrations = 2;
  repeated McpApprovedDestination destinations = 3;
  McpCredentialResponse current = 4;
  bool transition_pending = 5;
  string flow_id = 6;
  string flow_expires_at = 7;
  bool client_secret_configured = 8;
}
message CompleteMcpAuthorizationRequest {
  string connection_id = 1;
  uint32 expected_revision = 2;
  uint32 expected_generation = 3;
  string flow_id = 4;
  string state = 5;
  string code = 6;
  optional string issuer = 7;
  string redirect_uri = 8;
}
message RecoverMcpCredentialRequest {
  string connection_id = 1;
  uint32 expected_revision = 2;
  uint32 expected_generation = 3;
}
