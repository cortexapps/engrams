syntax = "proto3";

package engram.app.v1;

// ADR 0057 C3: orchestrator-native connector catalog CRUD (Plane B). Connectors
// live in the orchestrator DB (the `connector` table, C1); the built-ins
// (github/datadog) are read-only file seeds surfaced alongside custom ones.
// NOT compiled into the coordinator (orchestrator-native, like ProfileService /
// TaskService). Admin-gated; `config_json` is the raw connector JSON, validated
// by `parseConnector` (the admin-trust boundary) on write.
service IntegrationService {
  // Built-in seeds (read-only) ∪ admin-authored connectors. Admin-only; each row
  // carries the derived connected/available `status`.
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  // Create or replace a custom connector. Rejects a built-in provider id and
  // any config `parseConnector` refuses. Invalidates the registry cache.
  rpc UpsertConnector(UpsertConnectorRequest) returns (UpsertConnectorResponse);
  // Delete a custom connector (idempotent). Rejects a built-in provider id.
  rpc DeleteConnector(DeleteConnectorRequest) returns (DeleteConnectorResponse);
  // Member-readable provider catalog: per-connector display identity + the
  // powers it grants + the hosts it opens, derived from the merged registry.
  // Carries NO secret material (no secretRef / header / template / mint kind) —
  // safe for the Launch receipt + in-session provider icons (redesign).
  rpc GetIntegrationCatalog(GetIntegrationCatalogRequest) returns (GetIntegrationCatalogResponse);
  // Admin-only: store a mint kind's credentials, sealing each field as an org
  // secret `<kind>.<field>` (the coordinator resolves them by that name). The
  // GitHub App private key is a secret; the App ID is config — both are sealed.
  rpc SetMintCredential(SetMintCredentialRequest) returns (SetMintCredentialResponse);
  // Admin-only: upload (or replace) a connector's logo — orchestrator-owned
  // (the coordinator never sees connectors). Bytes land in the connector_logo
  // table (≤512 KB, SVG or square PNG, sniffed) and are served at
  // GET /api/v1/integrations/<provider>/logo. Empty `data` clears the logo.
  rpc UploadConnectorLogo(UploadConnectorLogoRequest) returns (UploadConnectorLogoResponse);
  // Admin-only: test a connector's credential. Builds the resolved spec from the
  // registry and delegates the actual unseal/mint + benign GET to the coordinator
  // (MintService.RunConnectorTest). `draft_values` carries an about-to-be-saved
  // credential to test before sealing (inject: the single value under any key;
  // mint: the field map); empty tests the stored credential.
  rpc TestConnector(TestConnectorRequest) returns (TestConnectorResponse);
  // ADR 0109: named credential instances. The first provider is Google Cloud;
  // its config contains no private key or other long-lived credential.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  rpc SetConnectionEnabled(SetConnectionEnabledRequest) returns (SetConnectionEnabledResponse);
  rpc GetGoogleCloudSetup(GetGoogleCloudSetupRequest) returns (GetGoogleCloudSetupResponse);
}

message GoogleCloudConnectionConfig {
  // Full provider resource:
  // //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
  string workload_identity_provider = 1;
  string service_account_email = 2;
  // Exact Google API hosts and explicit non-googleapis targets such as GKE API
  // servers. Wildcards and URLs are rejected.
  repeated string endpoints = 3;
}

message IntegrationConnection {
  string id = 1;
  string alias = 2;
  string provider = 3;
  string display_name = 4;
  bool enabled = 5;
  string tested_at = 6;
  string created_at = 7;
  string updated_at = 8;
  GoogleCloudConnectionConfig google_cloud = 9;
}

message ListConnectionsRequest {}
message ListConnectionsResponse { repeated IntegrationConnection connections = 1; }

message CreateConnectionRequest {
  string alias = 1;
  string provider = 2;
  string display_name = 3;
  GoogleCloudConnectionConfig google_cloud = 4;
}
message CreateConnectionResponse { IntegrationConnection connection = 1; }

message UpdateConnectionRequest {
  string id = 1;
  string alias = 2;
  string display_name = 3;
  GoogleCloudConnectionConfig google_cloud = 4;
}
message UpdateConnectionResponse { IntegrationConnection connection = 1; }

message DeleteConnectionRequest { string id = 1; }
message DeleteConnectionResponse { bool deleted = 1; }

message TestConnectionRequest { string id = 1; }
message TestConnectionResponse { bool ok = 1; string message = 2; }

message SetConnectionEnabledRequest { string id = 1; bool enabled = 2; }
message SetConnectionEnabledResponse { IntegrationConnection connection = 1; }

message GetGoogleCloudSetupRequest { string id = 1; }
message GetGoogleCloudSetupResponse {
  string issuer = 1;
  string audience = 2;
  string subject_attribute = 3;
  string connection_attribute = 4;
  string gcloud_script = 5;
  string terraform = 6;
}

message Connector {
  string provider = 1;
  // The raw connector JSON (the same shape `parseConnector` validates).
  string config_json = 2;
  // True for the read-only built-in file seeds (github/datadog).
  bool builtin = 3;
  // ISO-8601; empty for built-in seeds.
  string created_at = 4;
  string updated_at = 5;
  // Derived credential posture: "connected" (configured) | "available". For an
  // inject connector, connected ⇔ its secretRef exists in the org store; for a
  // mint connector, connected ⇔ every required `<kind>.<field>` secret exists.
  string status = 6;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

message UpsertConnectorRequest {
  // Raw connector JSON; `provider` is read from it.
  string config_json = 1;
}

message UpsertConnectorResponse {
  Connector connector = 1;
}

message DeleteConnectorRequest {
  string provider = 1;
}

message DeleteConnectorResponse {
  bool deleted = 1;
}

// ---------------------------------------------------------------------------
// Member-readable provider catalog (redesign): display identity + derived
// powers + hosts. Mirrors `buildProviderCatalog()` in connectors/registry.ts.
// ---------------------------------------------------------------------------

// Per-connector visual identity. `mono` + `color` are always set; `logo` is a
// serve URL when an uploaded logo exists (the renderer falls back to `mono`).
message ConnectorIcon {
  string mono = 1;
  string color = 2;
  string logo = 3; // "" when none
}

message ConnectorDisplay {
  string name = 1;
  string category = 2;
  string blurb = 3;
  ConnectorIcon icon = 4;
}

// One grantable power, derived for display (the slug stays canonical).
message CatalogCapability {
  string action = 1;  // e.g. "issues:write"
  string access = 2;  // "read" | "write" (derived from the op's HTTP method)
  string asset = 3;   // asset kind this op surfaces, or "" when none
}

message ProviderCatalogEntry {
  string provider = 1;
  ConnectorDisplay display = 2;
  string credential_source = 3; // "mint" | "inject"
  repeated string hosts = 4;
  repeated CatalogCapability capabilities = 5;
}

message GetIntegrationCatalogRequest {}

message GetIntegrationCatalogResponse {
  repeated ProviderCatalogEntry providers = 1;
}

// ---------------------------------------------------------------------------
// Mint-credential write path (redesign): seal a mint kind's fields as org
// secrets so the coordinator can mint a token per session.
// ---------------------------------------------------------------------------

message SetMintCredentialRequest {
  string provider = 1; // e.g. "github"
  string kind = 2;     // e.g. "github_app"
  // field name → value (e.g. app_id, private_key_pem). Each non-empty value is
  // sealed as the org secret `<kind>.<field>`; values are never returned.
  map<string, string> values = 3;
}

message SetMintCredentialResponse {
  // The org-secret names written (the `<kind>.<field>` keys), for confirmation.
  repeated string secret_names = 1;
}

message UploadConnectorLogoRequest {
  string provider = 1;
  // Logo bytes (SVG or square PNG; ≤512 KB). Empty clears any existing logo.
  bytes data = 2;
  // Optional MIME hint ("image/svg+xml" | "image/png"); the server also sniffs.
  string media_type = 3;
}

message UploadConnectorLogoResponse {
  // The serve URL the catalog now points `icon.logo` at, or "" when cleared.
  string logo_url = 1;
}

message TestConnectorRequest {
  string provider = 1;
  // About-to-be-saved credential to test before sealing (empty = test the
  // stored one). inject: the single secret value under any key; mint: the
  // field map (e.g. app_id, private_key_pem).
  map<string, string> draft_values = 2;
}

message TestConnectorResponse {
  bool ok = 1;
  string message = 2;
}
