syntax = "proto3";

package engram.app.v1;

import "engram/app/v1/oauth.proto";

// The orchestrator-facing app contract (ADR 0051 §2.3, rev 2026-06-10).
// The caller is a single trusted service (bearer-authed); there is no
// per-user anything here. Attribution and authz live in the orchestrator.
service SessionService {
  // Returns ALL sessions. The orchestrator filters by task ownership.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc SendPrompt(SendPromptRequest) returns (SendPromptResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  // Phase 1b (ADR 0052): mutate a still-queued (type-ahead) prompt by its
  // client-minted prompt_id, before the harness consumes it. No-op once
  // consumed (the harness is the single writer).
  rpc EditQueuedPrompt(EditQueuedPromptRequest) returns (EditQueuedPromptResponse);
  rpc DequeueQueuedPrompt(DequeueQueuedPromptRequest) returns (DequeueQueuedPromptResponse);
  // ADR 0089: complete an outstanding tool call (the `tool_call_requested`
  // event) with its result. Appends a
  // `tool_result_submitted` event at RPC time, enqueues a durable ToolResult
  // outbox row, and resumes an idle session exactly as SendPrompt does.
  rpc CompleteToolCall(CompleteToolCallRequest) returns (CompleteToolCallResponse);
  // Streams the event envelope itself, not a wrapped Response message.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc StreamEvents(StreamEventsRequest) returns (stream SessionEvent);
  // ADR 0060: unary, paginated, UNFILTERED read of the persistent event log
  // (curation is the consumer's concern). The reverse-channel pump
  // (SessionIngestWorkflow) walks `after_idx` forward in bounded batches; a
  // unary read is far more testable than racing the StreamEvents tail.
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
  // One streaming RPC; the unary HTTP route's semantics are the
  // degenerate collected case.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Exec(ExecRequest) returns (stream ExecOutput);
  rpc CancelExec(CancelExecRequest) returns (CancelExecResponse);
  // ADR 0100: stage a batch of files inside a running session without
  // embedding content in a shell command. Each file reports its own result.
  rpc WriteFiles(WriteFilesRequest) returns (WriteFilesResponse);
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  // ADR 0065: bring up the ephemeral in-guest browser stack (x11vnc + headful
  // chromium) for a session and return the VNC port. The orchestrator calls
  // this before opening a PortRelay tunnel to the guest's :5900 (ADR 0066).
  rpc EnsureBrowser(EnsureBrowserRequest) returns (EnsureBrowserResponse);
  // ADR 0085: bring up the ephemeral in-guest IDE (code-server) for a
  // session and return its loopback HTTP port. The orchestrator calls this
  // before proxying the IDE tab's HTTP/WS traffic over a PortRelay tunnel
  // (ADR 0066), exactly as EnsureBrowser does for VNC.
  rpc EnsureIde(EnsureIdeRequest) returns (EnsureIdeResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc EvictLocal(EvictLocalRequest) returns (EvictLocalResponse);
  // ADR 0051: the explicit admin trigger for the idle-eviction primitive
  // (was POST /api/admin/sessions/:id/evict-idle). Fires the SAME pipeline
  // (idle_evictor::evict_idle_session) the host-side idle detector + the
  // coord idle-detect backstop drive on a timeout, so it is a faithful
  // stand-in for "the session went idle" WITHOUT waiting out (or lowering)
  // the idle TTL. Synchronous: the session is Idle by the time this returns.
  rpc EvictIdle(EvictIdleRequest) returns (EvictIdleResponse);
  rpc GetCowState(GetCowStateRequest) returns (GetCowStateResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // STREAMING: artifacts run to 512 MiB (MAX_ARTIFACT_BYTES); a unary
  // response would blow the 4 MiB message cap. First message = metadata.
  rpc GetArtifact(GetArtifactRequest) returns (stream GetArtifactResponse);
  rpc CreateArtifactFromPath(CreateArtifactFromPathRequest) returns (CreateArtifactFromPathResponse);
}

// Browser-shell relay (ADR §8), its own service: keeps the bidi
// (browser-uncallable) method out of the UI surface and avoids colliding
// with host_service.proto's ProxyShell.
service ShellRelayService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Relay(stream RelayShellRequest) returns (stream RelayShellResponse);
}

// ADR 0064: raw-byte port relay — the orchestrator→coordinator app-tier
// bridge for vanity-subdomain preview tunnels. Like ShellRelayService it
// is bidi + browser-uncallable, kept off the UI surface; it carries
// opaque TCP bytes (the orchestrator HTTP-proxies a preview request
// through it, coordinator → host → guest port). Distinct from
// host_service.proto's ProxyPort (this is the app tier in front of it).
service PortRelayService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Relay(stream RelayPortRequest) returns (stream RelayPortResponse);
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionListItem sessions = 1;
}

// A session list row — the session plus the owner's identity (ADR 0031),
// folded in as optionals. `owner_kind` ("system" for warm-pool /
// automated sessions, "user" or absent for human-launched) is a
// TS-mirror-only field today — absent from the Rust wire
// (SessionListItem), so absent is the norm.
message SessionListItem {
  Session session = 1;
  optional string owner_email = 2;
  optional string owner_name = 3;
  optional string owner_kind = 4;
}

// Mirrors engram_core::types::Session as serialized on today's JSON wire
// (web/src/types.ts Session). `user_id` is OMITTED — attribution leaves
// the contract (ADR §2.1). String-literal unions stay strings:
// status ∈ SessionState, mode ∈ {"agent","dev_vm"}. Timestamps are
// ISO-8601 strings, as on the JSON wire.
message Session {
  string id = 1;
  // engram_core SessionState, snake_case: "pending" | "queued" |
  // "created" | "active" | "unreachable" | "parked" | "idle" |
  // "host_lost" | "evacuating" | "evicting" | "failed" |
  // "completed" | "dead".
  string status = 2;
  optional string host_id = 3;
  optional string sandbox_id = 4;
  // Flat OCI URI (`<host>[:port]/<repo>:<tag>`) — Stage B1 wire shape.
  string image = 5;
  string mode = 6;
  string created_at = 7;
  string last_active_at = 8;
  // The latest harness-suggested (LLM-generated) title for this session, if
  // any. Written in real time by the coordinator's event sink when a
  // TitleSuggested harness event arrives. A self-descriptive operational fact
  // (never user attribution/preference); the orchestrator reads it to build a
  // task's display title. Unset until the harness emits one.
  optional string suggested_title = 9;
}

message CreateSessionRequest {
  string image_uri = 1;
  // engram_core SessionMode, snake_case: "agent" (run the selected harness) |
  // "dev_vm" (no harness driven; interact via shell / exec).
  string mode = 2;
  optional string prompt = 3;
  reserved 4; // was harness_secret_id (SecretService); removed in ADR 0051 Drip A.
  // Phase 1b: client-minted id for the initial `prompt`, so the web can
  // correlate its optimistic bubble with the server echo + RunStarted.
  // Ignored when `prompt` is unset; the coord mints one if absent.
  optional string prompt_id = 7;
  // Per-request secret values keyed by env-var name. Only honored under
  // SecretMode::Literal; broker-mode images reject overrides.
  map<string, string> secrets = 5;
  // Orchestrator-resolved harness identity env (e.g. CLAUDE_CODE_OAUTH_TOKEN).
  // The caller is the single trusted orchestrator (bearer-authed); it owns the
  // user's harness auth token in its OWN store and passes the resolved name→value
  // map here. The coordinator is harness-agnostic: it injects these verbatim AND
  // persists them into session_secrets so they are REPLAYED on resume (closing
  // the gap where an idle-evicted gRPC session — user_id = NULL — would otherwise
  // silently lose its token). Honored regardless of SecretMode: this is NOT a
  // user override, it is the trusted orchestrator's identity injection. NEVER logged.
  map<string, string> harness_env = 6;
  // ADR 0055: profile-selected skill bundle names (e.g. "skills", "browser").
  // The coordinator resolves each to its staged content sha (from the fleet's
  // current bundles), assigns a reserved slot (dyn_0..), and patch_drives it in
  // during the paused restore window; the guest reads each mount's mount.json to
  // wire the skills. Capped at RESERVED_SLOTS. Empty = base session, no skills.
  repeated string selected_skills = 8;
  // ADR 0056: profile-granted integration capabilities, each
  // "provider:action[@resource]" (e.g. "github:issues:write",
  // "datadog:logs:read", "s3:read@bucket"). The coordinator parses +
  // validates each (a malformed string is a create-time error), binds them
  // to the session in Postgres (`session_capabilities`), and the broker
  // clamps every guest credential/action request to this set. Empty = no
  // third-party integration access. Bound this phase; enforced in a later one.
  repeated string capabilities = 9;
  // ADR 0056 (option B′): the per-session integration policy the orchestrator
  // compiled from the profile's capabilities + its connector config, as a JSON
  // string (an orchestrator-authored artifact, opaque to proto — like an event
  // payload_json). The coordinator resolves each inject's `secret_ref`
  // host-side and the host proxy enforces the gate + injection. Carries secret
  // *refs*, never values. Empty = no integration policy.
  string integration_policy_json = 10;
  // ADR 0062: the selected harness name (a HarnessCatalogService catalog key).
  // The coordinator mounts the current catalog generation on dyn_0 and execs
  // /opt/engram/dyn/0/<harness>/<exec>. Required for an agent-mode session;
  // unset/ignored for dev_vm. Selection is per session, not baked into the image.
  optional string harness = 11;
  // ADR 0106: human OAuth binding. Contains no credential bytes; the
  // coordinator verifies a live subject connection and persists it atomically.
  OAuthCredentialBinding oauth_credential = 12;
  // ADR 0107: session mode for the initial `prompt` (e.g. "plan") —
  // create-time plan mode is just mode on the first prompt. Ignored when
  // `prompt` is unset. Validated against the selected harness's descriptor.
  // Not named `mode` — field 2 is the agent/dev_vm SessionMode.
  optional string harness_mode = 13;
}

message OAuthCredentialBinding {
  OAuthSubject subject = 1;
  string provider = 2;
}

message CreateSessionResponse {
  string session_id = 1;
  string status = 2;
  string image_version = 3;
  // "warm" if the session was satisfied by a pre-restored warm-pool slot,
  // "cold" if it took the full create path. (On the Rust JSON wire —
  // api/sessions.rs CreateSessionResponse — absent from the TS mirror.)
  string kind = 4;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

// Today's HTTP delete returns 204 No Content (idempotently, even when a
// sibling raced us to terminal) — there is no body to mirror.
message DeleteSessionResponse {}

message SendPromptRequest {
  string session_id = 1;
  string text = 2;
  // Phase 1b: client-minted id correlating this prompt with its
  // RunStarted{prompt_id} and (if queued) PromptQueued/Edited/Dequeued.
  // The coord mints one if empty (back-compat / non-web callers).
  string prompt_id = 3;
  // ADR 0107: session-mode directive that applies from this prompt's turn
  // onward (e.g. "plan"). Validated against the session harness's declared
  // descriptor modes; unset = no change. Not named `mode` — that name is the
  // agent/dev_vm SessionMode on CreateSessionRequest/Session.
  optional string harness_mode = 4;
}

message SendPromptResponse {
  string session_id = 1;
  // Human-readable diagnostic; not machine-parsed, not stable.
  string note = 2;
}

message InterruptRequest {
  string session_id = 1;
  // ADR 0108: who asked for the interrupt. Free-form label from the
  // caller ("esc", "stop-button", "aui-cancel", "steer", "cli", ...).
  // The coordinator logs and counts it; it does not change behavior.
  // Attribution exists because a 2026-07-31 phantom interrupt took an
  // hour of archaeology to trace to an ungated library Esc handler.
  string source = 2;
}

message InterruptResponse {
  string session_id = 1;
  // Human-readable diagnostic; not machine-parsed, not stable.
  string note = 2;
}

message EditQueuedPromptRequest {
  string session_id = 1;
  string prompt_id = 2;
  string text = 3;
}

message EditQueuedPromptResponse {
  string session_id = 1;
  string note = 2;
}

message DequeueQueuedPromptRequest {
  string session_id = 1;
  string prompt_id = 2;
}

message DequeueQueuedPromptResponse {
  string session_id = 1;
  string note = 2;
}

message CompleteToolCallRequest {
  string session_id = 1;
  // The call_id carried on the `tool_call_requested` event — the
  // correlation token the harness minted for this call.
  string tool_call_id = 2;
  // Opaque JSON result. Validated upstream (orchestrator) against the
  // tool's output schema; the coordinator never inspects it.
  string result_json = 3;
}

message CompleteToolCallResponse {
  string session_id = 1;
  string note = 2;
}

message StreamEventsRequest {
  string session_id = 1;
  // Replay strictly-after this idx, then tail. UNSET = from the start
  // (callers translate the HTTP -1 sentinel to unset; proto3 default 0
  // would silently skip idx 0).
  optional int64 since = 2;
  // ADR 0108 B: suppress ephemeral frames (agent_message_chunk) server-
  // side. Cursor-based consumers (the orchestrator SessionListener) set
  // this: every frame they receive then carries an idx, except the
  // `lagged` sentinel. Unset = today's behavior (chunks flow) — the SSE
  // passthrough and the browser depend on that.
  bool durable_only = 3;
}

// The typed event ENVELOPE. payload_json is NORMATIVELY the JSON object
// today's SSE `data:` carries: the event payload with
// _recovery_epoch/_rewound folded in via with_rewind_meta
// (api/events.rs) — on BOTH the replay and live arms.
message SessionEvent {
  // optional: a broadcast-lag notification has no idx (today's SSE emits
  // `event: lagged` with NO id: line so it never disturbs Last-Event-ID).
  optional int64 idx = 1;
  // The event's "type" discriminant. Special value "lagged": idx unset,
  // payload_json = {"missed": n}.
  string kind = 2;
  string payload_json = 3;
}

message ListSessionEventsRequest {
  string session_id = 1;
  // Return events strictly after this idx, in idx order. UNSET = from the
  // start of the log (mirrors StreamEvents.since; proto3 default 0 would
  // silently skip idx 0).
  optional int64 after_idx = 2;
  // Max events to return. Server clamps to a hard cap; unset/non-positive
  // uses the server default page size.
  optional int64 limit = 3;
}

message ListSessionEventsResponse {
  // The page, oldest-first — the same envelope StreamEvents emits, so a
  // consumer renders catch-up and live events identically.
  repeated SessionEvent events = 1;
  // Pass as the next call's `after_idx` to continue. The last returned
  // event's idx, or the request's `after_idx` echoed back when the page is
  // empty, so a caller at the tail never rewinds its cursor.
  int64 next_after_idx = 2;
}

message ExecRequest {
  string session_id = 1;
  // Either a single shell command (passed to `sh -c`) or an explicit
  // argv vector. Exactly one of `command` / non-empty `argv` must be set.
  optional string command = 2;
  repeated string argv = 3;
  map<string, string> env = 4;
  optional string workdir = 5;
  optional uint64 timeout_secs = 6;
  // Durable attach-or-start ticket. Omitted callers receive the minted value
  // in the stream's first ExecStarted frame.
  optional string exec_id = 7;
  optional uint64 stdout_offset = 8;
  optional uint64 stderr_offset = 9;
  // Resume a parked session before attaching, matching SendPrompt semantics.
  optional bool wake = 10;
}

message CancelExecRequest {
  string session_id = 1;
  string exec_id = 2;
}

message CancelExecResponse {}

message WriteFileSpec {
  string path = 1;
  bytes content = 2;
  // Unix permission bits (for example, 0755). Unset preserves the default
  // permissions chosen when the guest creates the file.
  optional uint32 mode = 3;
}

message WriteFilesRequest {
  string session_id = 1;
  repeated WriteFileSpec files = 2;
}

message WriteFileResult {
  string path = 1;
  bool ok = 2;
  optional string error = 3;
}

message WriteFilesResponse {
  repeated WriteFileResult results = 1;
}

// engram_core::types::ExecEvent is authoritative for the stream body:
// stdout/stderr are intentionally bytes, not string, so non-UTF-8 output
// (binary tools, raw pipe content) flows unmolested — callers stringify
// lossily at the API edge. Framed like GetArtifact: the first message is
// `started` (exec_id lives on the ExecStream metadata, not on ExecEvent);
// the stream is terminated by exactly one `exit`.
message ExecOutput {
  oneof event {
    ExecStarted started = 1; // always the first message
    bytes stdout = 2;
    bytes stderr = 3;
    ExecExit exit = 4; // always the last message
  }
}

message ExecStarted {
  string exec_id = 1;
}

message ExecExit {
  // Unset when the process was killed (no exit status), mirroring
  // ExecEvent::Exit(Option<i32>).
  optional int32 exit_status = 1;
  // Coordinator-measured rusage attached to today's exec_completed
  // event and the sync /exec response.
  ExecRusage rusage = 2;
}

// engram_core::types::ExecRusage. wall_ms is coordinator-measured wall
// time; the rest are backend-supplied and absent on backends that can't
// capture them (the TS mirror is explicitly non-exhaustive here).
message ExecRusage {
  uint64 wall_ms = 1;
  optional uint64 peak_rss_kb = 2;
  optional uint64 user_cpu_ms = 3;
  optional uint64 sys_cpu_ms = 4;
}

message GetLogRequest {
  string session_id = 1;
  // Only "conversation" (or unset, defaults to conversation) is accepted
  // post-ADR-0005; anything else is INVALID_ARGUMENT.
  optional string kind = 2;
  // Cap on number of rows returned. Server defaults to 200, hard-capped
  // at 1000 to keep responses bounded.
  optional int64 limit = 3;
  // Return the NEWEST `limit` rows (still in ascending idx order) instead
  // of the oldest. What every interactive consumer wants — the CLI's
  // `session log` defaults to it. (2026-07-11 campaign: oldest-N default
  // cost multiple agents stalled polls against long sessions.)
  optional bool tail = 4;
}

message GetLogResponse {
  string session_id = 1;
  string kind = 2;
  repeated ConversationEntry events = 3;
}

message ConversationEntry {
  int64 idx = 1;
  string kind = 2;
  // ISO-8601.
  string at = 3;
  // The raw session_events payload (serde_json::Value on the Rust side).
  string payload_json = 4;
}

message SnapshotRequest {
  string session_id = 1;
}

message SnapshotResponse {
  string session_id = 1;
  optional string snapshot_id = 2;
  optional uint64 size_bytes = 3;
  // Human-readable diagnostic; not machine-parsed, not stable.
  string note = 4;
}

message EnsureBrowserRequest {
  string session_id = 1;
}
message EnsureBrowserResponse {
  // The in-guest RFB port x11vnc is serving on (loopback); the orchestrator
  // opens a PortRelay tunnel to it (ADR 0066).
  uint32 port = 1;
}

message EnsureIdeRequest {
  string session_id = 1;
}
message EnsureIdeResponse {
  // The in-guest HTTP port code-server is serving on (loopback); the
  // orchestrator opens a PortRelay tunnel to it (ADR 0066).
  uint32 port = 1;
}

message ResumeRequest {
  string session_id = 1;
}

// Same shape as SnapshotResponse (the HTTP resume handler reuses it);
// a distinct type per RPC_REQUEST_RESPONSE_UNIQUE.
message ResumeResponse {
  string session_id = 1;
  optional string snapshot_id = 2;
  optional uint64 size_bytes = 3;
  string note = 4;
}

message EvictLocalRequest {
  string session_id = 1;
}

// Today's HTTP handler returns 202 Accepted with no body.
message EvictLocalResponse {}

message EvictIdleRequest {
  string session_id = 1;
}

// Mirrors api/admin.rs EvictIdleResponse. The synchronous pipeline has
// already run by the time this returns: the session is paused, flushed,
// snapshotted, and its local sandbox destroyed; the PG row is at Idle and
// a subsequent Resume rebinds it. `status` is always "idle" on success.
message EvictIdleResponse {
  string session_id = 1;
  string status = 2;
}

message GetCowStateRequest {
  string session_id = 1;
}

message GetCowStateResponse {
  string session_id = 1;
  // Unset when the session has no live sandbox (Idle, HostLost, Pending,
  // terminal) — the disk-tier numbers don't exist.
  optional CowStateView state = 2;
}

// Mirrors engram_coordinator::cow_state::CowStateView. One row per
// chunk-tracked sandbox.
message CowStateView {
  string sandbox_id = 1;
  optional string session_id = 2;
  // Current disk manifest version. Ticks on every flush().
  string disk_manifest_id = 3;
  uint64 disk_manifest_version = 4;
  // Dirty chunks resident in host RAM (not yet flushed to BlobStorage).
  uint32 dirty_chunks = 5;
  uint64 dirty_bytes = 6;
  // ISO-8601 timestamp of the last successful flush(). Unset = never
  // flushed since the backend was constructed.
  optional string last_flush_at = 7;
  // Total chunks the disk manifest references.
  uint32 base_chunks = 8;
  // Of base_chunks, how many are resident on this host's local NVMe
  // cache vs. fetched on-demand from BlobStorage.
  uint32 base_chunks_local = 9;
  // Most recent memory manifest captured in a snapshot. Unset if the
  // session has never been snapshotted.
  optional string memory_manifest_id = 10;
  optional uint64 memory_manifest_version = 11;
  // ISO-8601 timestamp of the last successful snapshot. Unset = never
  // snapshotted.
  optional string last_snapshot_at = 12;
}

message ListCheckpointsRequest {
  string session_id = 1;
}

message ListCheckpointsResponse {
  string session_id = 1;
  // Newest first; bounded to the forkable-history retention window
  // (latest always kept).
  repeated CheckpointSummary checkpoints = 2;
}

// ADR 0028 A.log: one checkpoint in a session's chain.
message CheckpointSummary {
  string snapshot_id = 1;
  // ISO-8601.
  string created_at = 2;
  uint64 size_bytes = 3;
  // The transcript cursor a rung-1 rewind / fork would cut at.
  optional int64 events_cursor = 4;
  // HEAD-verified durable in object storage (rung-1-eligible).
  bool recoverable = 5;
  // The newest checkpoint — the always-pinned rung-1 recovery anchor.
  bool is_latest = 6;
}

message GetArtifactRequest {
  string session_id = 1;
  string artifact_id = 2;
}

message GetArtifactResponse {
  oneof msg {
    ArtifactMetadata metadata = 1; // always the first message
    bytes chunk = 2;
  }
}

message ArtifactMetadata {
  string media_type = 1;
  // uint64, deviating from the plan skeleton's int64: sizes are never
  // negative, and every other size field in this file is uint64.
  uint64 size_bytes = 2;
  string file_name = 3;
}

// ADR 0026 trusted operator file pull: capture ANY file in the session
// by path, no MIME restriction, same size cap + quota.
message CreateArtifactFromPathRequest {
  string session_id = 1;
  string path = 2;
  optional string caption = 3;
}

message CreateArtifactFromPathResponse {
  string artifact_id = 1;
  string media_type = 2;
  uint64 size_bytes = 3;
}

// ---------------------------------------------------------------------
// ShellRelayService messages.
// ---------------------------------------------------------------------

// Frame kinds mirror the WS frames / host ProxyShellMessage 1:1. Request
// and response are separate types (RPC_REQUEST_RESPONSE_UNIQUE) and mark
// directionality.
message RelayShellRequest {
  oneof frame {
    ShellOpen open = 1; // first client frame: which session's shell
    string text = 2;
    bytes binary = 3;
    bytes ping = 4;
    bytes pong = 5;
    ShellClose close = 6;
  }
}

message RelayShellResponse {
  oneof frame {
    string text = 1;
    bytes binary = 2;
    bytes ping = 3;
    bytes pong = 4;
    ShellClose close = 5;
  }
}

message ShellOpen {
  string session_id = 1;
}

message ShellClose {
  uint32 code = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------
// PortRelayService messages (ADR 0064).
// ---------------------------------------------------------------------

// Raw opaque bytes; no frame-kind taxonomy (cf. RelayShell*). Request
// and response are separate types (RPC_REQUEST_RESPONSE_UNIQUE) and
// mark directionality.
message RelayPortRequest {
  oneof frame {
    PortOpen open = 1; // first client frame: which session + which port
    bytes data = 2;
    PortClose close = 3;
  }
}

message RelayPortResponse {
  oneof frame {
    bytes data = 1;
    PortClose close = 2;
  }
}

message PortOpen {
  string session_id = 1;
  uint32 port = 2; // guest TCP port to reach (1..=65535)
}

// Clean teardown sentinel (see ProxyPortClose in host_service.proto).
message PortClose {}
