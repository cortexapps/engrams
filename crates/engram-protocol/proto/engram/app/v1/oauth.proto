syntax = "proto3";

package engram.app.v1;

// ADR 0106: trusted-orchestrator API for subject-scoped OAuth connections.
// The orchestrator authenticates users and supplies their opaque subject id;
// the coordinator owns provider drivers, encrypted storage, and lifecycle.
service OAuthCredentialService {
  rpc BeginFlow(BeginFlowRequest) returns (BeginFlowResponse);
  rpc GetFlow(GetFlowRequest) returns (GetFlowResponse);
  rpc CancelFlow(CancelFlowRequest) returns (CancelFlowResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

  // Authorization-code (redirect) flow family for connector subjects. The
  // spec is derived from the connector's oauth facet by the orchestrator,
  // which enforced host containment at the connector parse boundary; the
  // coordinator re-checks shape only and is the sole tier that resolves the
  // client-credential org secrets. The returned flow id doubles as the OAuth
  // `state` parameter: the durable flow row is the CSRF state, valid on any
  // replica.
  rpc BeginRedirectFlow(BeginRedirectFlowRequest) returns (BeginRedirectFlowResponse);
  rpc CompleteRedirectFlow(CompleteRedirectFlowRequest) returns (CompleteRedirectFlowResponse);

  // Internal credential-control operations. Callers must additionally present
  // the session's broker token; the coordinator derives subject/provider from
  // the session binding and never accepts them from the harness.
  rpc FetchSessionCredential(FetchSessionCredentialRequest) returns (FetchSessionCredentialResponse);
  rpc UpdateSessionCredential(UpdateSessionCredentialRequest) returns (UpdateSessionCredentialResponse);
}

enum OauthSubjectKind {
  OAUTH_SUBJECT_KIND_UNSPECIFIED = 0;
  OAUTH_SUBJECT_KIND_USER = 1;
  OAUTH_SUBJECT_KIND_CONNECTOR = 2;
  OAUTH_SUBJECT_KIND_MCP = 3;
}

message OAuthSubject {
  OauthSubjectKind kind = 1;
  string id = 2;
}

message BeginFlowRequest {
  OAuthSubject subject = 1;
  string provider = 2;
}

message BeginFlowResponse {
  OAuthFlow flow = 1;
  // Ephemeral: returned only by BeginFlow from the owning replica.
  string verification_url = 2;
  string user_code = 3;
}

message GetFlowRequest {
  OAuthSubject subject = 1;
  string flow_id = 2;
}

message GetFlowResponse { OAuthFlow flow = 1; }

message CancelFlowRequest {
  OAuthSubject subject = 1;
  string flow_id = 2;
}

message CancelFlowResponse { OAuthFlow flow = 1; }

message OAuthFlow {
  string id = 1;
  string provider = 2;
  string status = 3;
  optional string error_code = 4;
  string expires_at = 5;
  string updated_at = 6;
}

message OAuthAccountMetadata {
  optional string display_name = 1;
  optional string plan_type = 2;
  optional string workspace_id = 3;
  optional string workspace_name = 4;
}

message OAuthCredentialMeta {
  string provider = 1;
  int64 version = 2;
  bool connected = 3;
  OAuthAccountMetadata account = 4;
  string created_at = 5;
  string updated_at = 6;
  // Derived lifecycle: "connected" | "expired" | "broken" | "revoked".
  // "broken" means the provider terminally rejected refresh — reconnect.
  string status = 7;
  // Access-token expiry (RFC3339) when the provider expires it; "" otherwise.
  string expires_at = 8;
  // The credential's subject id (e.g. the integration-connection id for
  // connector subjects). Useful on kind-wide listings.
  string subject_id = 9;
}

// `subject.id` may be EMPTY to list every credential of `subject.kind` —
// the connector status surface reads all connector credentials in one call.
message ListCredentialsRequest { OAuthSubject subject = 1; }
message ListCredentialsResponse { repeated OAuthCredentialMeta credentials = 1; }

message DisconnectRequest {
  OAuthSubject subject = 1;
  string provider = 2;
  int64 expected_version = 3;
}

message DisconnectResponse { OAuthCredentialMeta credential = 1; }

// Wire form of a connector's oauth facet, supplied on both Begin and
// Complete (the flow row deliberately persists no URLs or refs).
message RedirectOauthSpec {
  string authorize_url = 1;
  string token_url = 2;
  repeated string scopes = 3;
  // Scope-join delimiter; empty means comma (Slack, Linear).
  string scope_delimiter = 4;
  // Bounded provider extras (e.g. Linear `actor`/`prompt`). Standard OAuth
  // parameter names are rejected.
  map<string, string> extra_authorize_params = 5;
  // Org-secret refs; resolved coordinator-side only.
  string client_id_ref = 6;
  string client_secret_ref = 7;
  // PKCE (S256). The verifier is derived, never persisted.
  bool pkce = 8;
  RedirectMetadataSpec metadata = 9;
}

// Declarative account-metadata extraction — no per-provider coordinator code.
// Values are bounded dot-paths into JSON. Recognized keys: account_id,
// display_name, workspace_id, workspace_name. `account_id` falls back to the
// subject id when unmapped (account-switch detection degrades).
message RedirectMetadataSpec {
  map<string, string> from_token_response = 1;
  RedirectMetadataProbe probe = 2;
}

// One bounded "who am I" request against a connector host, authenticated
// with the newly-obtained access token (e.g. Linear GraphQL `viewer`).
message RedirectMetadataProbe {
  string method = 1;  // GET | POST
  string host = 2;
  string path = 3;
  string body = 4;
  map<string, string> map = 5;
}

message BeginRedirectFlowRequest {
  OAuthSubject subject = 1;
  string provider = 2;
  RedirectOauthSpec spec = 3;
  string redirect_uri = 4;
}

message BeginRedirectFlowResponse {
  OAuthFlow flow = 1;
  // Fully-assembled provider authorize URL (client_id resolved, state = flow
  // id, scopes joined). The orchestrator 302s the admin's browser to it.
  string authorize_url = 2;
}

message CompleteRedirectFlowRequest {
  OAuthSubject subject = 1;
  string provider = 2;
  // The callback's `state` parameter — the flow id.
  string flow_id = 3;
  string code = 4;
  string redirect_uri = 5;
  RedirectOauthSpec spec = 6;
}

message CompleteRedirectFlowResponse {
  OAuthCredentialMeta credential = 1;
}

message FetchSessionCredentialRequest {
  string session_id = 1;
  string broker_token = 2;
}

message FetchSessionCredentialResponse {
  string provider = 1;
  int64 version = 2;
  bytes opaque_bundle = 3;
}

message UpdateSessionCredentialRequest {
  string session_id = 1;
  string broker_token = 2;
  int64 expected_version = 3;
  bytes opaque_bundle = 4;
}

message UpdateSessionCredentialResponse {
  string provider = 1;
  int64 version = 2;
  bytes opaque_bundle = 3;
}
