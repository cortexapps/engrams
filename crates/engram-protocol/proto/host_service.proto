syntax = "proto3";

// ADR 0013: coord ↔ host transport. Replaces the bincode-over-WS
// wire defined in `src/wire.rs`. One gRPC method per existing
// `HostClient` trait method (transport per-method dispatch is the
// debug-grep win); structurally-simple payloads use native proto
// fields; structurally-complex payloads (SandboxSpec,
// SnapshotMetadata, SessionEgressPolicy, AgentSpec, ExecRequest)
// stay bincode-encoded inside a `bytes` field. That carves a small
// proto surface while keeping the existing Rust types
// authoritative — coord+host always deploy at the same OSS tag so
// bincode drift can't happen (same atomic-deploy property the WS
// path relies on today).
//
// UUIDs ride as 16-byte `bytes` fields, not as strings. Strings
// would double the wire size for no schema benefit.

package engram.host.v1;

service HostService {
  // ---- sandbox lifecycle ----
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc DestroySandbox(SandboxIdMessage) returns (Empty);
  rpc ListSandboxes(Empty) returns (ListSandboxesResponse);
  rpc Snapshot(SandboxIdMessage) returns (SnapshotResponse);
  // ADR 0014 issue #1/#2: signal that a just-produced snapshot's
  // downstream pipeline (record_snapshot → destroy → mark Idle)
  // fully succeeded; the host clears its in-flight tracking and the
  // snapshot artifacts are now PG-owned. Idempotent.
  rpc CommitSnapshot(SandboxIdMessage) returns (Empty);
  // ADR 0014 issue #1/#2: signal that a just-produced snapshot's
  // downstream pipeline failed; the host removes the local
  // snapshot dir + the per-snapshot opaque blobs (state.bin,
  // sidecar.json, working_set.json) so they don't accumulate as
  // 4 GiB-per-attempt leaks during retry storms. Idempotent.
  rpc AbortSnapshot(SandboxIdMessage) returns (Empty);
  // ADR 0045 D5: the teardown reorder. SnapshotBegin runs only the
  // pause-side capture (pause -> NBD drain -> FC create; for eviction
  // the VM stays paused) and spawns the chunk+upload work as a host-side
  // background task; SnapshotWait awaits that task and returns the
  // durable SnapshotMetadata. The coordinator marks the session Idle
  // between the two — user-visible teardown ends at Begin. The legacy
  // Snapshot RPC stays as the composed begin+wait (periodic checkpoints,
  // drain paths, old coordinators).
  rpc SnapshotBegin(SandboxIdMessage) returns (SnapshotBeginResponse);
  rpc SnapshotWait(SandboxIdMessage) returns (SnapshotResponse);
  // ADR 0045 Phase C1: live-teleport source-side surface.
  // MigrationCapture freezes the sandbox for a move: pause + NBD drain +
  // FC diff capture + LOCAL-sink re-chunk (no GCS on the pause path);
  // the guest STAYS PAUSED and the sandbox is fenced (no flush publish,
  // no checkpoints) until Commit or Abort. Returns the not-yet-durable
  // next manifests inline plus the transfer set the destination must
  // pull. MigrationFetch is the one host-to-host RPC: the DESTINATION
  // host-agent streams the export's artifacts (state.bin, sidecar,
  // chunk bytes), gated by the export_id nonce + a server-side
  // allowlist. Commit destroys the source VM + drops the export; Abort
  // un-pauses the guest in place and unfences (zero loss).
  rpc MigrationCapture(SandboxIdMessage) returns (MigrationCaptureResponse);
  rpc MigrationFetch(MigrationFetchRequest) returns (stream MigrationFrame);
  rpc MigrationCommit(MigrationExportRef) returns (Empty);
  rpc MigrationAbort(MigrationExportRef) returns (Empty);
  // ADR 0045 C2 post-copy: the pre-pause presetup (export identity +
  // the restore package sans state.bin), the blackout capture
  // (vmstate-only + pagemap seal), and the destination's drain await.
  rpc MigrationPresetup(SandboxIdMessage) returns (MigrationPresetupResponse);
  rpc MigrationCapturePostCopy(MigrationExportRef) returns (PostCopyCaptureResponse);
  rpc MigrationDrainWait(SandboxIdMessage) returns (DrainOutcomeResponse);
  rpc Restore(RestoreRequest) returns (SandboxIdMessage);
  rpc GuestIp(SandboxIdMessage) returns (GuestIpResponse);
  // ADR 0045 Phase F: freeze / unfreeze a running microVM *in place* —
  // pause vCPUs without snapshotting, destroying, or changing session
  // state. An admin affordance to exercise + observe the pause/flush
  // path; maps to SandboxBackend::pause / ::resume.
  rpc PauseSandbox(SandboxIdMessage) returns (Empty);
  rpc ResumeSandbox(SandboxIdMessage) returns (Empty);

  // ADR 0020 P1: boot the image to agentd-ready with a stub harness,
  // take a portable FC snapshot (chunked memory + uploaded
  // state/sidecar), tear the capture VM down, and return the
  // snapshot's metadata. The coord calls this during
  // POST /api/enabled-images to produce the per-image base snapshot
  // that CreateSession later restores from.
  rpc BuildBaseSnapshot(BuildBaseSnapshotRequest) returns (BuildBaseSnapshotResponse);

  // ADR 0020 P1: restore a per-image base snapshot for a session and
  // late-bind the session's harness via the option-D drive swap (the
  // base snapshot was captured with a stub harness). Returns the
  // bound sandbox id, like Restore. CreateSession calls this on a
  // base-snapshot hit instead of CreateSandbox.
  rpc RestoreBaseForSession(RestoreBaseForSessionRequest) returns (SandboxIdMessage);

  // ---- harness routing ----
  rpc BindHarnessSession(BindHarnessSessionRequest) returns (Empty);
  rpc UnbindHarnessSession(UnbindHarnessSessionRequest) returns (Empty);
  rpc SendHarnessPrompt(SendHarnessPromptRequest) returns (Empty);
  // Phase 1b (ADR 0052): mutate a still-queued type-ahead prompt on the
  // attached harness by its prompt_id. No-op once the harness has
  // consumed it (single writer).
  rpc EditHarnessQueuedPrompt(EditHarnessQueuedPromptRequest) returns (Empty);
  rpc DequeueHarnessQueuedPrompt(DequeueHarnessQueuedPromptRequest) returns (Empty);
  // ADR 0054: deliver a user's answer to a deferred AskUserQuestion to the
  // attached harness (which stashes it and re-fires the deferred tool via
  // `--resume`).
  rpc AnswerHarnessQuestion(AnswerHarnessQuestionRequest) returns (Empty);
  // ADR 0030: operator interrupt. Stop the in-flight run on the
  // attached harness (it SIGINTs its current `claude` child and
  // returns to Idle); the session stays alive and resumable.
  rpc InterruptHarness(InterruptHarnessRequest) returns (Empty);
  // Track A: non-destructive re-handshake. Tell the attached harness to
  // drop + re-dial its connection so the re-attach re-emits Idle,
  // resyncing a session whose event stream desynced from the run state
  // machine. The running agent is untouched. Driven by the coordinator's
  // desync watchdog.
  rpc RehandshakeHarness(RehandshakeHarnessRequest) returns (Empty);

  // StartAgent bundles SessionEgressPolicy inline so the host
  // applies the policy to its egress proxy registry *before*
  // spawning the agent. Eliminates the WS-era "policy notify must
  // arrive first on the same connection" frame-ordering invariant.
  rpc StartAgent(StartAgentRequest) returns (Empty);

  // Apply an egress policy without spawning an agent (no-agent
  // sessions still need their proxy allowlist populated). The
  // standalone companion to StartAgent's bundled form.
  rpc ApplyEgressPolicy(ApplyEgressPolicyRequest) returns (Empty);

  // ADR 0011 follow-up #3.
  rpc AcquireShell(SandboxIdMessage) returns (Empty);
  rpc ReleaseShell(SandboxIdMessage) returns (Empty);
  // Issue #219: refresh the keep-alive stamp on a live shell pin. The
  // coord shell bridge calls this on its WS-keepalive interval so the
  // host can reap pins whose coord-side bridge died without a
  // ReleaseShell (rolling deploy, crash, dropped WS).
  rpc RenewShell(SandboxIdMessage) returns (Empty);

  // ---- admin (ADR 0011 follow-up #1: HostAdminHandler folded in) ----
  rpc ReapMaterializeDir(ReapMaterializeDirRequest) returns (ReapMaterializeDirResponse);

  // ---- ADR 0016 Phase A: COW observability ----
  //
  // Per-sandbox diagnostic: dirty/synced chunk counts, current disk
  // manifest version, last flush timestamp, and the snapshot-bounded
  // memory-tier RPO signal. Read-only; coord fans these out to power
  // `GET /api/{hosts,sessions}/:id/cow-state`. Caller caches the
  // response for ~1s to keep the host load low under web-app polling.
  rpc CowState(SandboxIdMessage) returns (CowStateResponse);
  rpc CowStateAll(Empty) returns (CowStateAllResponse);

  // ---- ADR 0016 Phase B: admin flush trigger ----
  //
  // Force an immediate ChunkedDiskBackend::flush() on `id`. Pairs
  // the FlushScheduler's implicit 30s tick with an explicit admin
  // trigger per `[explicit_admin_triggers_for_testability]`. E2E
  // tests drive this to verify the publish-to-PG round-trip without
  // sleeping a full cadence; operators use it to flush a stuck
  // sandbox's pending dirty bytes on demand.
  //
  // Response carries an optional manifest_ref: empty bytes encode
  // `None` (sandbox not chunk-tracked, or zero dirty chunks), a
  // full bincode blob encodes the new `ManifestRef` that the coord
  // immediately funnels into `update_live_disk_manifest`.
  rpc FlushSandbox(SandboxIdMessage) returns (FlushSandboxResponse);

  // ---- streaming ----
  rpc ExecStart(ExecStartRequest) returns (stream ExecFrame);

  // ADR 0014 issue #6: bidi shell tunnel. Coord pods in GKE can't
  // reach the per-VM `guest_ip` (10.200.0.x; lives behind a TAP on
  // the FC host VM, or behind a netns for warm-restored VMs), so the
  // pre-M1.16 `ws://<guest_ip>:7681/ws` direct-WebSocket from
  // coord/api/shell.rs always times out from prod. The fix is to
  // tunnel WS frames through this bidi gRPC: host-agent opens the
  // upstream WebSocket to ttyd inside the right network namespace
  // and shuttles frames between the gRPC stream and ttyd.
  //
  // First client message MUST be `ProxyShellMessage.open` carrying
  // `sandbox_id`; subsequent messages from either side are pure
  // shell-frame variants. See the comment block by
  // `ProxyShellMessage` for the rationale (prior flat-bag shape let
  // the sentinel get forwarded as a Binary frame to ttyd, which
  // 1.7.8 rejects with a TCP-RST).
  rpc ProxyShell(stream ProxyShellMessage) returns (stream ProxyShellMessage);

  // ---- pool warming ----
  // Lightweight no-op that forces TCP+H2 handshake when called on a
  // freshly built `Channel::connect_lazy`. Coord pods fire one of
  // these on host register / first heartbeat to keep the warm-path
  // RPC latency budget intact.
  rpc Ping(Empty) returns (Empty);
}

message Empty {}

// 16-byte UUID. Same shape as `engram_core::SandboxId`'s underlying
// `uuid::Uuid::as_bytes()`. Validating that `len(uuid) == 16` is the
// caller's responsibility.
message SandboxIdMessage {
  bytes uuid = 1;
}

// --- CreateSandbox ---

message CreateSandboxRequest {
  // bincode-encoded `engram_core::types::sandbox::SandboxSpec`.
  bytes spec_bincode = 1;
}

message CreateSandboxResponse {
  bytes sandbox_id = 1; // 16-byte UUID
}

// --- ListSandboxes ---

message ListSandboxesResponse {
  // Each entry is a 16-byte UUID.
  repeated bytes sandbox_ids = 1;
}

// --- Snapshot ---

message MigrationCaptureResponse {
  // Single-use unguessable nonce naming this export on the source;
  // the destination presents it to MigrationFetch.
  string export_id = 1;
  // The next memory manifest (fork lineage @v+1), serialized Manifest
  // JSON — NOT yet in the blob store; durable only after the
  // destination's catch-up upload.
  bytes memory_manifest_json = 2;
  // The drained, coherent disk manifest JSON (coherence cut = the
  // pause-window drain).
  bytes disk_manifest_json = 3;
  // Chunk hashes the destination must pull from this export (rebuilt
  // memory chunks + pending-tier disk chunks). 32-byte raw hashes.
  repeated bytes new_memory_chunk_hashes = 4;
  repeated bytes new_disk_chunk_hashes = 5;
  bytes snapshot_id = 6;
  int64 paused_at_unix_ms = 7;
  // bincode ManifestRef for each inline manifest. The memory ref is
  // the fork lineage's next version (owned by this session); the disk
  // ref is PROVISIONAL — the destination's catch-up publish does the
  // version-conflict retry dance (shared-template disk lineages).
  bytes memory_manifest_ref = 8;
  bytes disk_manifest_ref = 9;
  // ADR 0045 C2 (E2B fold): the source guest's hot set in FAULT ORDER
  // (the handler's working-set recorder, dumped per-jail). The
  // destination pulls/prefaults these FIRST so the post-move re-fault
  // storm hits warm NVMe. 32-byte raw hashes; empty when the source
  // had no trace (best-effort rider, never load-bearing).
  repeated bytes hot_chunks = 10;
}

message MigrationExportRef {
  bytes sandbox_id = 1;
  string export_id = 2;
}

// ADR 0045 C2: see MigrationPresetupOut in engram-core for field
// semantics (this is a 1:1 wire mapping).
message MigrationPresetupResponse {
  string export_id = 1;
  string peer_token = 2;
  uint32 peer_port = 3;
  bytes sidecar_json = 4;
  bytes memory_manifest_json = 5;
  bytes memory_manifest_ref = 6;   // bincode ManifestRef
  bytes disk_manifest_ref = 7;     // bincode Option<ManifestRef> (empty = none)
  repeated bytes hot_chunks = 8;
}

message PostCopyCaptureResponse {
  uint64 sealed_chunks = 1;
  uint64 total_chunks = 2;
  uint64 scan_ms = 3;
  // 4-6 were the pre-disk-post-copy drained-manifest fields
  // (disk_manifest_json / disk_manifest_ref / new_disk_chunk_hashes):
  // the capture no longer re-chunks disk under the freeze — sealed
  // dirty blocks demand-fault from the source like memory does.
  reserved 4, 5, 6;
  int64 paused_at_unix_ms = 7;
  // ADR 0045 C2 PR 10: blackout decomposition (all under the freeze).
  uint64 pause_ms = 8;
  uint64 disk_drain_ms = 9;
  uint64 vmstate_ms = 10;
  // Disk post-copy: how many disk chunks were sealed (dirty +
  // pending tiers) for P2P demand-fetch.
  uint64 sealed_disk_chunks = 11;
}

message DrainOutcomeResponse {
  bool done = 1;
  // done=true:
  uint64 pulled = 2;
  uint64 alt_sourced = 3;
  uint64 zero_chunks = 4;
  uint64 ms = 5;
  // done=false (PeerLost):
  uint64 remaining = 6;
  string detail = 7;
}

message MigrationFetchRequest {
  string export_id = 1;
  // Named artifacts + chunk hashes, in the order frames should refer
  // to them by index.
  repeated MigrationItem items = 2;
}

message MigrationItem {
  // Exactly one of:
  //   kind = STATE_BIN | SIDECAR  (hash + chunk_idx empty)
  //   kind = CHUNK                (hash = 32-byte chunk hash)
  //   kind = DISK_CHUNK_AT        (chunk_idx = disk chunk index)
  enum Kind {
    CHUNK = 0;
    STATE_BIN = 1;
    SIDECAR = 2;
    // ADR 0045 C2: the drained coherent disk manifest JSON.
    DISK_MANIFEST = 3;
    // ADR 0045 C2 disk post-copy: the seal descriptor JSON (base
    // manifest content + sealed chunk indices). Intentionally a NEW
    // kind (not DISK_MANIFEST) so an old destination polling a new
    // source fails LOUDLY at the fetch (NeverLoaded → zero-loss
    // abort-to-source) instead of resuming against a stale disk.
    DISK_SEAL_INFO = 4;
    // ADR 0045 C2 disk post-copy: one sealed disk chunk's RAW bytes,
    // by chunk index — served from the frozen source's sealed
    // dirty/pending tiers (RAM), never hashed or uploaded.
    DISK_CHUNK_AT = 5;
  }
  Kind kind = 1;
  bytes hash = 2;
  uint64 chunk_idx = 3;
}

message MigrationFrame {
  uint32 item_idx = 1;
  uint64 offset = 2;
  bytes data = 3;
  // Last frame for this item.
  bool last = 4;
}

message SnapshotBeginResponse {
  // Correlates Begin with the eventual Wait result; also proves the
  // capture itself (pause + FC create) succeeded before the coordinator
  // marks the session Idle.
  bytes snapshot_id = 1;
}

message SnapshotResponse {
  // bincode-encoded `engram_core::types::snapshot::SnapshotMetadata`.
  bytes metadata_bincode = 1;
}

// --- Restore ---

message RestoreRequest {
  // bincode-encoded `engram_core::types::snapshot::SnapshotMetadata`.
  bytes metadata_bincode = 1;
}
message BuildBaseSnapshotRequest {
  // bincode-encoded `engram_core::types::sandbox::SandboxSpec` — the
  // image to boot + capture. ADR 0021 P1.5: the image's `[harness]`
  // block now lives in the rootfs, so the snapshot captures it
  // directly — no separate stub-harness drive to swap.
  bytes spec_bincode = 1;
  // bincode-encoded `Option<engram_core::types::image::WarmConfig>` — the
  // image's optional capture-time `[warm]` hook. When `Some`, the host
  // runs it in the live VM (via exec) after agentd-ready and before the
  // snapshot freezes, so a long-lived process it spawns (e.g. a gradle
  // daemon) is captured into the base snapshot. Empty/absent on older
  // callers decodes to `None` (coord+host roll together, so this is just
  // additive). A warm failure is fail-loud — it aborts the capture.
  bytes warm_bincode = 2;
}
message BuildBaseSnapshotResponse {
  // bincode-encoded `engram_core::types::snapshot::SnapshotMetadata`.
  bytes metadata_bincode = 1;
}
message RestoreBaseForSessionRequest {
  // bincode-encoded `engram_core::types::snapshot::SnapshotMetadata`
  // for the per-image base snapshot.
  bytes metadata_bincode = 1;
  // ADR 0021 P1.7 retired `harness_pack_uri` (field 2) +
  // `harness_name` (field 3). The harness travels in the rootfs now;
  // the host doesn't need a per-session name/URI to swap-in. Field
  // numbers stay reserved so a future field doesn't accidentally
  // collide with old wire payloads.
  reserved 2, 3;
  reserved "harness_pack_uri", "harness_name";
  // ADR 0020: per-session env (manifest env + resolved secrets +
  // ENGRAM_SESSION_*) merged into the restored sandbox — the shared base
  // snapshot can't carry per-session values.
  map<string, string> session_env = 4;
  // ADR 0055: bincode-encoded `Vec<engram_core::types::sandbox::AuxRoDrive>` —
  // the per-session skills the coordinator resolved + assigned to reserved
  // slots (dyn_0..). The host `patch_drive`s each over its sentinel slot in the
  // paused restore window. Empty = no dynamic skills (slots stay sentinel).
  bytes selected_mounts_bincode = 5;
}

// --- GuestIp ---

message GuestIpResponse {
  // `None` ↔ ip field absent. v4 dotted-quad string when present.
  optional string ip = 1;
}

// --- Harness routing ---

message BindHarnessSessionRequest {
  bytes session_id = 1; // 16-byte UUID
  bytes sandbox_id = 2; // 16-byte UUID
}

message UnbindHarnessSessionRequest {
  bytes session_id = 1; // 16-byte UUID
}

message SendHarnessPromptRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  string text = 2;
  // Phase 1b: client/coord-minted id correlating this prompt with its
  // RunStarted{prompt_id} and (while queued) PromptQueued/Edited/Dequeued.
  string prompt_id = 3;
}

message EditHarnessQueuedPromptRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  string prompt_id = 2;
  string text = 3;
}

message DequeueHarnessQueuedPromptRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  string prompt_id = 2;
}

message AnswerHarnessQuestionRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  // Claude's tool_use_id of the deferred AskUserQuestion.
  string tool_call_id = 2;
  // Selected labels keyed by question text. Always a list (1 for
  // single-select, N for multi-select); proto3 map values can't be
  // `repeated`, so each is wrapped in StringList.
  map<string, StringList> answers = 3;
}

// A list of strings, for use as a proto3 map value.
message StringList {
  repeated string values = 1;
}

message InterruptHarnessRequest {
  bytes sandbox_id = 1; // 16-byte UUID
}

message RehandshakeHarnessRequest {
  bytes sandbox_id = 1; // 16-byte UUID
}

message StartAgentRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  // bincode-encoded `engram_core::types::sandbox::AgentSpec`.
  bytes agent_bincode = 2;
  // bincode-encoded `engram_core::types::egress::SessionEgressPolicy`.
  // Applied to the host's egress proxy registry before the agent
  // spawns. Required (not optional) — even a "no policy" session
  // serialises an `SessionEgressPolicy::empty()`-shaped struct so
  // the host has uniform handling.
  bytes policy_bincode = 3;
}

message ApplyEgressPolicyRequest {
  // bincode-encoded `engram_core::types::egress::SessionEgressPolicy`.
  bytes policy_bincode = 1;
}

// --- ReapMaterializeDir ---

message ReapMaterializeDirRequest {
  uint64 min_age_secs = 1;
  // Each entry is a 16-byte UUID. Coord ships this snapshot of
  // `list_live_disk_manifest_ids` inline; hosts have no DB access.
  // 1M IDs = 16 MiB — bump the per-method max_decoding_message_size
  // on the host server.
  repeated bytes live_disk_manifest_ids = 2;
}

message ReapMaterializeDirResponse {
  // bincode-encoded `engram_protocol::wire::WireReapStats`.
  bytes stats_bincode = 1;
}

// --- ExecStart (server-streaming) ---

message ExecStartRequest {
  bytes sandbox_id = 1; // 16-byte UUID
  // bincode-encoded `engram_protocol::wire::WireExecRequest`.
  bytes request_bincode = 2;
}

message ExecFrame {
  oneof frame {
    // First frame on a fresh stream — carries the host-assigned
    // `exec_id`. Mirrors today's `ResponseKind::ExecStarted`.
    string started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    // Terminal frame; the client closes its receiver after one of
    // these. `status` is `None` when the process was killed by
    // signal without an exit code.
    ExecExit exit = 4;
  }
}

message ExecExit {
  optional int32 status = 1;
}

// --- ADR 0014 issue #6: ProxyShell ---
//
// Wire shape: the coord opens the stream by sending exactly one
// `ProxyShellOpen` carrying `sandbox_id`; subsequent messages from
// either side are pure shell-frame variants. The earlier shape
// (single `ProxyShellFrame` with a `bytes sandbox_id` populated only
// on the first frame and a `ProxyShellKind` field that picked which
// of `data`/`close_code`/`close_reason` were meaningful) was a flat
// field-bag — the host receiver tried to "defensively forward" the
// sentinel's empty payload as if it were a WS Binary frame, which
// ttyd 1.7.8 treats as a protocol violation and TCP-RSTs (prod
// session 8725648d on 2026-05-23). The oneof here makes every
// variant carry only its own meaningful fields, and makes Open a
// distinct enum arm from any data variant so the bug class is
// structurally impossible to express on either side.

message ProxyShellMessage {
  oneof body {
    // Coord → host, sent exactly once at stream start. Carries
    // the 16-byte UUID identifying which sandbox the host should
    // dial. The host MUST reject a stream that opens with any
    // other variant, and MUST reject any subsequent Open.
    ProxyShellOpen open = 1;
    // ShellFrame variants. Bidirectional from this point on:
    // coord → host means "the browser typed this"; host → coord
    // means "ttyd produced this".
    ProxyShellText text = 2;
    ProxyShellBinary binary = 3;
    ProxyShellPing ping = 4;
    ProxyShellPong pong = 5;
    ProxyShellClose close = 6;
  }
}

message ProxyShellOpen {
  bytes sandbox_id = 1;
}

message ProxyShellText {
  string data = 1;
}

message ProxyShellBinary {
  bytes data = 1;
}

message ProxyShellPing {
  bytes data = 1;
}

message ProxyShellPong {
  bytes data = 1;
}

message ProxyShellClose {
  // RFC 6455 close code. Zero + empty reason encodes the
  // "Close with no body" case.
  uint32 code = 1;
  string reason = 2;
}

// --- ADR 0016 Phase A: CowState / CowStateAll ---

// `Some(CowState)` if the host hosts a chunk-tracked view of this
// sandbox; `None` (state_bincode empty) otherwise. Wire shape uses
// bincode for the payload (same pattern as `SnapshotResponse`), so
// schema evolution stays in Rust-land and proto is just envelope.
message CowStateResponse {
  // bincode-encoded `engram_core::types::cow_state::CowState`.
  // Empty bytes encode the `None` case — distinguished from a
  // present-but-empty payload because `CowState` always carries a
  // populated `disk_manifest`.
  bytes state_bincode = 1;
}

message CowStateAllResponse {
  // bincode-encoded `Vec<engram_core::types::cow_state::CowStateRecord>`.
  // Empty vec is encoded as a non-empty bincode blob (the length
  // prefix is 0); the proto field is non-optional.
  bytes records_bincode = 1;
}

// --- ADR 0016 Phase B commit 4a: FlushSandbox response ---

// Outcome of `HostService.FlushSandbox`. `manifest_ref_bincode`
// carries `Some(ManifestRef)` (bincode-encoded `Option<ManifestRef>`)
// when chunks were drained, `None` otherwise. The wire shape mirrors
// `CowStateResponse`'s empty-means-None convention: empty bytes
// distinguish "sandbox not chunk-tracked OR zero dirty chunks" from
// "drained N chunks, here's the new manifest version."
message FlushSandboxResponse {
  // bincode-encoded `Option<engram_core::types::manifest::ManifestRef>`.
  // Empty bytes encode `None` (no chunk tracking / no dirty bytes);
  // non-empty encodes `Some(ManifestRef { manifest_id, version })`.
  bytes manifest_ref_bincode = 1;
}

