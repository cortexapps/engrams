# buf owns this proto tree (ADR 0051 §7): `buf lint` GATES style (a lint
# failure fails CI), `buf breaking` is ADVISORY — it checks wire
# compatibility against the PR base and CI surfaces a detected break as a
# warning + PR comment rather than a hard failure (see the `buf` job in
# .github/workflows/ci.yml) — and the repo-root buf.gen.yaml drives TS
# codegen (`just gen-proto`).
#
# host_service.proto predates buf — it was authored for tonic-build
# (ADR 0013) and fails six STANDARD rules. Those exceptions are
# scoped to the legacy file ONLY: everything new (engram/app/...)
# must be clean under full STANDARD.
version: v2
lint:
  use:
    - STANDARD
  ignore_only:
    ENUM_VALUE_PREFIX: # surfaced by buf 1.69.0
      - host_service.proto
    ENUM_ZERO_VALUE_SUFFIX: # surfaced by buf 1.69.0
      - host_service.proto
    PACKAGE_DIRECTORY_MATCH:
      - host_service.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - host_service.proto
    RPC_REQUEST_STANDARD_NAME:
      - host_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - host_service.proto
# FILE is the standing policy: the strictest `buf breaking` category, it
# flags any structural change to a released proto (field/file deletion,
# renames) on top of wire-compat. Detection is advisory in CI (warning +
# PR comment, not a hard gate — see the `buf` job in ci.yml), so FILE's
# strictness keeps the signal high without blocking deliberate breaks.
breaking:
  use:
    - FILE
