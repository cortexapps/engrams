# buf owns this proto tree (ADR 0051 §7): `buf lint` gates style,
# `buf breaking` gates wire compatibility against main (enforced in
# CI via bufbuild/buf-action's PR-base behavior), and the repo-root
# buf.gen.yaml drives TS codegen (`just gen-proto`).
#
# host_service.proto predates buf — it was authored for tonic-build
# (ADR 0013) and fails six STANDARD rules. Those exceptions are
# scoped to the legacy file ONLY: everything new (engram/app/...)
# must be clean under full STANDARD.
version: v2
lint:
  use:
    - STANDARD
  ignore_only:
    ENUM_VALUE_PREFIX: # surfaced by buf 1.69.0
      - host_service.proto
    ENUM_ZERO_VALUE_SUFFIX: # surfaced by buf 1.69.0
      - host_service.proto
    PACKAGE_DIRECTORY_MATCH:
      - host_service.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - host_service.proto
    RPC_REQUEST_STANDARD_NAME:
      - host_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - host_service.proto
# TEMPORARY (ADR 0051): relaxed FILE -> WIRE for the migration's structural
# proto removals ONLY. Drip A deletes the unreleased SecretService +
# CreateSession.harness_secret_id before anything consumed them — a FILE-category
# break (file + field deletion) that the stricter gate rightly blocks. WIRE still
# protects real binary wire-compat (field type/number reuse), which is the only
# guarantee that matters for this internal, lockstep-deployed contract during the
# migration. FILE is the intended permanent policy and is RESTORED by the final
# PR in the ADR 0051 stack, once these removals have landed on main (that PR's
# `buf breaking` then compares against a main that already lacks these protos, so
# FILE passes with nothing to flag). Do NOT treat WIRE as the standing policy.
breaking:
  use:
    - WIRE
