# ADR 0098 D1: time and entropy are world inputs, injected via
# `Services.clock` / `Services.entropy` so the deterministic-simulation
# harness can substitute them. Direct calls are banned crate-wide;
# `SystemClock` / `OsEntropy` in engram-core are the one honest caller of
# each. Test code that drives a live system may carry a scoped
# `#[allow(clippy::disallowed_methods)]` with a justifying comment.
disallowed-methods = [
    { path = "chrono::Utc::now", reason = "read time via services.clock.now_utc() (ADR 0098 D1)" },
    { path = "std::time::Instant::now", reason = "measure via services.clock.now_mono() (ADR 0098 D1)" },
    { path = "tokio::time::Instant::now", reason = "measure via services.clock.now_mono() (ADR 0098 D1)" },
    { path = "uuid::Uuid::new_v4", reason = "mint ids via services.entropy.uuid() (ADR 0098 D1)" },
]
