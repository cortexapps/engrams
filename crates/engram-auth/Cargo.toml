[package]
name = "engram-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable authentication for Engram (ADR 0031): OIDC + forward-auth (IAP) verifiers behind one IdentityVerifier trait, opaque web sessions, and per-user token sealing. Framework-free."

[lints]
workspace = true

[dependencies]
engram-core.workspace = true
engram-crypto.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
rand = "0.8"
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
