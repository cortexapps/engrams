[package]
name = "engram-sandbox-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-dev SandboxBackend that runs commands as host subprocesses. NOT isolated — never deploy."

[lints]
workspace = true

[dependencies]
engram-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
flate2.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "macros", "rt"] }
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

# `nix::sys::signal::killpg` for the process-group kill in the
# timeout-and-SIGKILL path (Unix-only). The whole crate is a no-op
# on Windows; keep it gated to avoid pulling unix-y deps everywhere.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
futures = { workspace = true }
tempfile = "3"
