[package]
name = "engram-chunk-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressed chunked-immutable storage for Engram. Manifests + chunks live in BlobStorage; local NVMe cache fronts hot reads."

[lints]
workspace = true

[dependencies]
engram-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
# ADR 0014 M1.15: chunk-cache hit/miss/eviction metrics emit through
# the global `metrics::*` recorder that the host-agent's Prometheus
# exporter binds at boot. When no recorder is installed (unit tests
# without the exporter) the macros are cheap no-ops.
metrics.workspace = true
# ADR 0039 #16: disk-aware cache floor. `statvfs(2)` (Linux + macOS) lets
# the evictor yield to snapshots/checkpoints sharing the work_dir mount.
# default-features=false keeps it to the `fs` wrapper — same pin the
# host-agent / workspace-hack already lock to (nix 0.31).
nix = { version = "0.31", default-features = false, features = ["fs"] }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "macros"] }
tracing.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
engram-testkit.workspace = true
engram-storage-local.workspace = true
engram-storage-gcs.workspace = true
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
