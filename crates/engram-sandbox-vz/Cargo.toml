[package]
name = "engram-sandbox-vz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "macOS Apple Silicon SandboxBackend driving Apple's Virtualization.framework via objc2."

[lints]
workspace = true

# The crate is implemented for macOS only — on Linux/Windows it
# compiles down to an empty shell so workspace `cargo check` stays
# green everywhere. Coordinator main.rs gates VzBackend construction
# behind the same target_os check.

[dependencies]
engram-core.workspace = true
engram-agentd.workspace = true
engram-harness-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

# Apple Virtualization.framework bindings — macOS-only. All VZ-touching
# code is `#[cfg(target_os = "macos")]`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError", "NSArray", "NSData"] }
objc2-virtualization = "0.3"
block2 = "0.6"

[dev-dependencies]
futures.workspace = true
tempfile = "3"
