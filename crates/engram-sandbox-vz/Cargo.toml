[package]
name = "engram-sandbox-vz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "macOS Apple Silicon SandboxBackend driving Apple's Virtualization.framework via objc2."

# The crate is implemented for macOS only — on Linux/Windows it
# compiles down to an empty shell so workspace `cargo check` stays
# green everywhere. Coordinator main.rs gates VzBackend construction
# behind the same target_os check.

# Workspace forbids `unsafe_code`, but objc2 + Virtualization.framework
# bindings fundamentally require `unsafe` blocks at every method call
# (the bindings are auto-generated from Apple's headers and surface as
# `unsafe fn`). We allow it here and confine all unsafe to the
# vm.rs / vsock_bridge.rs / snapshot.rs modules, each guarded by
# SAFETY comments. We don't inherit the workspace lints, but we
# re-state the same denies the workspace applies elsewhere.
[lints.rust]
unsafe_code = "allow"

[dependencies]
engram-core.workspace = true
engram-chunk-store.workspace = true
engram-agentd.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Apple Virtualization.framework bindings — macOS-only. All VZ-touching
# code is `#[cfg(target_os = "macos")]`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError", "NSArray", "NSData", "NSObject", "NSFileHandle"] }
objc2-virtualization = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[dev-dependencies]
futures.workspace = true
tempfile = "3"
tracing-subscriber.workspace = true
