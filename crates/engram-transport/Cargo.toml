[package]
name = "engram-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest host↔guest byte-stream transport. Two impls: vsock (Firecracker) and virtio-console (Apple Virtualization.framework). Selected at runtime via ENGRAM_TRANSPORT."

# Workspace forbids `unsafe_code`, but the console transport needs
# raw libc::open/read/write to bypass tokio::fs::File's
# state-machine — that wrapper stalled mid-stream on virtio-console
# char devices during bring-up. All unsafe is contained in the
# console.rs Linux impl with SAFETY comments.
[lints.rust]
unsafe_code = "allow"

[dependencies]
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

# vsock is a Linux-only kernel feature. Both transports compile only
# on Linux; on macOS / other hosts the crate is an empty shell so the
# workspace cargo check stays green everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"
libc = "0.2"
