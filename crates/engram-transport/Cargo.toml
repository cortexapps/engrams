[package]
name = "engram-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-guest host↔guest byte-stream transport over virtio-vsock (Firecracker + Apple Virtualization). Selected at runtime via ENGRAM_TRANSPORT."

[dependencies]
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# vsock is a Linux-only kernel feature. The transport compiles only on
# Linux; on macOS / other hosts the crate is an empty shell so the
# workspace cargo check stays green everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"
