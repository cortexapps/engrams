# Configuration for hawk (https://github.com/astral-sh/hawk): a
# workspace-aware audit of unnecessary public Rust APIs.
#
# Production entry points: every shipped binary in the workspace.
# Note: when hawk.toml exists, hawk does NOT fall back to its
# "all binary targets" default — keep this list in sync with the
# workspace's binary crates.

[[production]]
package = "engram-coordinator"
bin = "engram-coordinator"
reason = "control-plane API server"

[[production]]
package = "engram-host-agent"
bin = "engram-host-agent"
reason = "per-host sandbox lifecycle daemon"

[[production]]
package = "engram-host-operator"
bin = "engram-host-operator"
reason = "kubernetes host-fleet operator"

[[production]]
package = "engram-agentd"
bin = "engram-agentd"
reason = "in-guest init/supervisor daemon"

[[production]]
package = "engram-uffd-handler"
bin = "engram-uffd-handler"
reason = "userfaultfd page-serving sidecar (linux production restore path)"

[[production]]
package = "engram-harness-claude"
bin = "engram-harness-claude"
reason = "claude agent harness shipped into guest images"

[[production]]
package = "engram-harness-codex"
bin = "engram-harness-codex"
reason = "codex agent harness shipped into guest images"

[[production]]
package = "engram-harness-noop"
bin = "engram-harness-noop"
reason = "no-op harness used by integration/e2e stacks"

[[production]]
package = "engram-publish-builtin-harness"
bin = "engram-publish-builtin-harness"
reason = "release tooling that publishes the built-in harness bundle"

# prost/tonic generate `as_str_name`/`from_str_name` on every proto
# enum. When a proto enum's helpers have no caller yet, they are dead
# code hawk can see but we cannot delete (build.rs regenerates them).
[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::OauthSubjectKind::as_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::OauthSubjectKind::from_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::OauthDelivery::as_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::OauthDelivery::from_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::MintFieldKind::as_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "app::MintFieldKind::from_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "grpc::migration_item::Kind::as_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

[[override]]
lint = "hawk::dead_public"
crate = "engram_protocol"
item = "grpc::migration_item::Kind::from_str_name"
level = "allow"
reason = "prost-generated; regenerated by build.rs"

# Doc-tests are intentionally out of scope in this repo (AGENTS.md).
# Hawk compiles doctests for the whole workspace unless restricted, so
# pin its doctest pass to the empty workspace-hack crate.
[[doctest]]
package = "workspace-hack"
