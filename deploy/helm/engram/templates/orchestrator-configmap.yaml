{{- if .Values.web.enabled -}}
{{- /*
Non-secret orchestrator env (ADR 0051). The three REQUIRED vars
(ORCHESTRATOR_DATABASE_URL, CONTROL_PLANE_BEARER, BETTER_AUTH_SECRET) come
from a Secret in the Deployment — never from this ConfigMap. Everything here
is non-sensitive config the orchestrator reads at boot (config.ts).

The sign-in door (`orchestrator.auth.mode`) is validated HERE, at render time:
an unknown mode, or a mode missing a value it needs, fails the install with a
message naming the value — the pods never start half-configured. Only the
ACTIVE mode's values are emitted; the orchestrator refuses to boot on config
for a mode it is not in (a stray IAP audience would arm the fail-closed IAP
bridge on a deployment with no IAP in front of it).

CONTROL_PLANE_{GRPC,HTTP}_URL default to the in-cluster coord Service when the
operator leaves them empty, so a same-chart deploy needs zero wiring.
*/ -}}
{{- $coordHost := printf "%s.%s.svc.cluster.local" (include "engram.coordinator.fullname" .) .Release.Namespace -}}
{{- $coordHttp := printf "%s:%v" $coordHost .Values.service.port -}}
{{- /* app-gRPC port (ADR 0051). Default 50061 so this renders even before the
       coordinator chart's appGrpc.port value merges (stacked PRs). */ -}}
{{- $agPort := 50061 -}}
{{- if .Values.appGrpc -}}{{- $agPort = .Values.appGrpc.port -}}{{- end -}}
{{- $coordGrpc := printf "%s:%v" $coordHost $agPort -}}
{{- $auth := .Values.orchestrator.auth -}}
{{- $authMode := $auth.mode | default "" -}}
{{- if not (has $authMode (list "oauth" "iap" "password")) -}}
  {{- fail (printf "values.orchestrator.auth.mode must be one of oauth, iap, password (got %q)" $authMode) -}}
{{- end -}}
{{- if eq $authMode "oauth" -}}
  {{- if not $auth.oauth.issuer -}}
    {{- fail "values.orchestrator.auth.oauth.issuer is required when orchestrator.auth.mode=oauth (e.g. https://accounts.google.com). For an evaluation install with no identity provider, set orchestrator.auth.mode=password" -}}
  {{- end -}}
  {{- if not $auth.oauth.clientId -}}
    {{- fail "values.orchestrator.auth.oauth.clientId is required when orchestrator.auth.mode=oauth" -}}
  {{- end -}}
  {{- if not $auth.oauth.clientSecret.existingSecret -}}
    {{- fail "values.orchestrator.auth.oauth.clientSecret.existingSecret is required when orchestrator.auth.mode=oauth" -}}
  {{- end -}}
  {{- if not (or $auth.oauth.allowedDomains $auth.oauth.allowedEmails $auth.adminEmails) -}}
    {{- fail "orchestrator.auth.mode=oauth needs an allowlist: set values.orchestrator.auth.oauth.allowedDomains (\"*\" admits every account the provider authenticates), oauth.allowedEmails, or auth.adminEmails" -}}
  {{- end -}}
{{- else if eq $authMode "iap" -}}
  {{- if not $auth.iap.audiences -}}
    {{- fail "values.orchestrator.auth.iap.audiences is required when orchestrator.auth.mode=iap" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "engram.orchestrator.fullname" . }}-config
  labels:
    {{- include "engram.orchestrator.labels" . | nindent 4 }}
data:
  ORCHESTRATOR_PORT: {{ .Values.orchestrator.containerPort | quote }}
  {{- with .Values.orchestrator.publicUrl }}
  ORCHESTRATOR_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.orchestrator.preview.baseDomain }}
  ORCHESTRATOR_PREVIEW_BASE_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.orchestrator.sessionCookieDomain }}
  ORCHESTRATOR_SESSION_COOKIE_DOMAIN: {{ . | quote }}
  {{- end }}
  CONTROL_PLANE_GRPC_URL: {{ .Values.orchestrator.controlPlane.grpcUrl | default (printf "http://%s" $coordGrpc) | quote }}
  CONTROL_PLANE_HTTP_URL: {{ .Values.orchestrator.controlPlane.httpUrl | default (printf "http://%s" $coordHttp) | quote }}
  {{- with .Values.orchestrator.trustedOrigins }}
  TRUSTED_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.orchestrator.githubAppLogin }}
  GITHUB_APP_LOGIN: {{ . | quote }}
  {{- end }}
  {{- /* ADR 0119 parallel-window kill switch: emitted only when ON, so an
         unset switch leaves the env var absent (config.ts reads "1"/"true"). */ -}}
  {{- if .Values.orchestrator.killSwitches.slackAutomation }}
  ORCHESTRATOR_SLACK_AUTOMATION_DISABLED: "1"
  {{- end }}
  ORCHESTRATOR_AUTH_MODE: {{ $authMode | quote }}
  {{- if eq $authMode "oauth" }}
  ORCHESTRATOR_OAUTH_ISSUER: {{ $auth.oauth.issuer | quote }}
  ORCHESTRATOR_OAUTH_CLIENT_ID: {{ $auth.oauth.clientId | quote }}
  {{- with $auth.oauth.allowedDomains }}
  ORCHESTRATOR_OAUTH_ALLOWED_DOMAINS: {{ join "," . | quote }}
  {{- end }}
  {{- with $auth.oauth.allowedEmails }}
  ORCHESTRATOR_OAUTH_ALLOWED_EMAILS: {{ join "," . | quote }}
  {{- end }}
  {{- with $auth.oauth.displayName }}
  ORCHESTRATOR_OAUTH_DISPLAY_NAME: {{ . | quote }}
  {{- end }}
  {{- with $auth.oauth.providerId }}
  ORCHESTRATOR_OAUTH_PROVIDER_ID: {{ . | quote }}
  {{- end }}
  {{- with $auth.oauth.scopes }}
  ORCHESTRATOR_OAUTH_SCOPES: {{ . | quote }}
  {{- end }}
  {{- else if eq $authMode "iap" }}
  IAP_AUDIENCES: {{ join "," $auth.iap.audiences | quote }}
  {{- with $auth.iap.jwksUrl }}
  IAP_JWKS_URL: {{ . | quote }}
  {{- end }}
  {{- else }}
  ORCHESTRATOR_AUTH_PASSWORD_SIGNUP: {{ ternary "true" "false" (eq ($auth.password.signup | toString) "true") | quote }}
  {{- end }}
  {{- with $auth.adminEmails }}
  ORCHESTRATOR_ADMIN_EMAILS: {{ join "," . | quote }}
  {{- end }}
{{- end -}}
