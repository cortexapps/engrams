apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engram.coordinator.fullname" . }}
  labels:
    {{- include "engram.coordinator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "engram.coordinator.selectorLabels" . | nindent 6 }}
  # The coord is stateless (ADR 0047), so rolls are safe. `maxUnavailable: 0`
  # keeps ≥replicas Ready throughout (a new pod must pass readiness before an
  # old one terminates); `maxSurge: 1` bounds the surge so a slow rollout
  # doesn't double our DB conns. Zero-downtime relies on the preStop drain +
  # SIGTERM graceful shutdown below (ADR 0050) — without the preStop, the
  # endpoint-removal race RSTs in-flight clients during the recycle.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "engram.coordinator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll pods on config change so a `values.yaml` edit actually
        # takes effect without a manual `kubectl rollout restart`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "engram.coordinator.serviceAccountName" . }}
      # ADR 0050: zero-downtime rolls. The grace window must cover the
      # preStop drain (below) + the app's in-flight drain. preStop sleeps
      # `drainSeconds` so kube-proxy finishes removing this pod from the
      # Service endpoints on every node BEFORE the app gets SIGTERM —
      # otherwise new connections race onto a closing listener and RST
      # (the n=100 RemoteDisconnected/Connection-refused). The app then
      # SIGTERM-drains in-flight requests + ends its SSE streams
      # (engram_coordinator graceful shutdown), and a force-exit backstop
      # fires at `drainSeconds`+drain so we never wait out the SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Coord doesn't need elevated privileges — it's pure userland
      # HTTP + WS + Postgres + OCI client. Default sec context is
      # locked down; override per overlay if a sidecar needs more.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
      # ADR 0019: OTel Collector as a k8s NATIVE sidecar (init container with
      # restartPolicy: Always). It starts before the coordinator and runs for
      # the pod's lifetime, receiving OTLP on localhost:4317 and forwarding to
      # Cloud Trace (googlecloud exporter; ADC via the pod's Workload-Identity
      # SA + roles/cloudtrace.agent). Crucially it has NO readinessProbe, so —
      # unlike a regular sidecar — it does NOT gate the pod's Ready condition:
      # a crashing collector can never pull the coordinator out of the Service
      # (the 2026-05-27 incident). Config from an existing ConfigMap (key
      # config.yaml), created from deploy/otel/collector-gcp.yaml.
      initContainers:
        - name: otel-collector
          image: {{ .Values.otel.collector.image | quote }}
          restartPolicy: Always
          args: ["--config", "/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.otel.collector.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            # ADR 0051: app-gRPC surface (orchestrator-only).
            - name: app-grpc
              containerPort: {{ .Values.appGrpc.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "engram.coordinator.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            {{- if .Values.auth.existingSecret }}
            - name: ENGRAM_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            {{- /* ADR 0051: bind app-gRPC on all interfaces (coord default is
                   loopback) so the orchestrator (cross-pod) reaches it via
                   the Service. Bearer-gated by
                   ENGRAM_APP_GRPC_TOKENS, defaulting to the same Secret as the
                   REST auth tokens so the two stay in sync (override via
                   appGrpc.tokensSecret). Empty tokens => fail closed. */}}
            - name: ENGRAM_APP_GRPC_ADDR
              value: "0.0.0.0:{{ .Values.appGrpc.port }}"
            {{- $agSecret := .Values.appGrpc.tokensSecret.existingSecret | default .Values.auth.existingSecret }}
            {{- $agKey := .Values.appGrpc.tokensSecret.secretKey | default .Values.auth.secretKey }}
            {{- if $agSecret }}
            - name: ENGRAM_APP_GRPC_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $agSecret }}
                  key: {{ $agKey }}
            {{- end }}
            {{- if eq .Values.forge.provider "github" }}
            # ADR 0023: the GitHub App private key (PEM). The coord reads
            # ENGRAM_GITHUB_APP_PRIVATE_KEY in preference to a key path.
            # configmap.yaml fails the render if this Secret is unset.
            - name: ENGRAM_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forge.github.privateKey.existingSecret }}
                  key: {{ .Values.forge.github.privateKey.secretKey }}
            {{- end }}
            {{- if eq .Values.kek.provider "env-var" }}
            # When KEK lives in env (dev/CI only), the value comes
            # from a Secret. Production overlays default to gcp-kms
            # and skip this block.
            - name: {{ .Values.kek.envVarName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: ENGRAM_KEK_MASTER_KEY
            {{- end }}
            {{- if .Values.otel.enabled }}
            # ADR 0019: export traces to the in-pod otelcol sidecar (which
            # forwards to Cloud Trace). engram-telemetry is a no-op if unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: local-data
              mountPath: /var/engram
          # ADR 0050: preStop drain. Runs BEFORE SIGTERM, so the sleep
          # holds the pod open while kube-proxy removes it from the
          # Service endpoints across all nodes (propagation lag ~1-2s);
          # only then does the app get SIGTERM and drain. Closes the
          # endpoint-removal race that RSTs in-flight clients on a roll.
          # `/bin/sh` is present in the image; readOnlyRootFilesystem
          # doesn't block `sleep`.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.drainSeconds | default 8 }}"]
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: local-data
          emptyDir: {}
        {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
        - name: otel-config
          configMap:
            name: {{ required "otel.collector.configMap is required when the otel collector is enabled" .Values.otel.collector.configMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
