apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engram.coordinator.fullname" . }}
  labels:
    {{- include "engram.coordinator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "engram.coordinator.selectorLabels" . | nindent 6 }}
  # The coord is stateless; rolling updates pause sessions on the
  # WS for ~2s while each pod recycles. `maxSurge: 1` keeps total
  # replicas bounded so a slow rollout doesn't double our DB conns.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "engram.coordinator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll pods on config change so a `values.yaml` edit actually
        # takes effect without a manual `kubectl rollout restart`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "engram.coordinator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Coord doesn't need elevated privileges — it's pure userland
      # HTTP + WS + Postgres + OCI client. Default sec context is
      # locked down; override per overlay if a sidecar needs more.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
      # ADR 0019: OTel Collector as a k8s NATIVE sidecar (init container with
      # restartPolicy: Always). It starts before the coordinator and runs for
      # the pod's lifetime, receiving OTLP on localhost:4317 and forwarding to
      # Cloud Trace (googlecloud exporter; ADC via the pod's Workload-Identity
      # SA + roles/cloudtrace.agent). Crucially it has NO readinessProbe, so —
      # unlike a regular sidecar — it does NOT gate the pod's Ready condition:
      # a crashing collector can never pull the coordinator out of the Service
      # (the 2026-05-27 incident). Config from an existing ConfigMap (key
      # config.yaml), created from deploy/otel/collector-gcp.yaml.
      initContainers:
        - name: otel-collector
          image: {{ .Values.otel.collector.image | quote }}
          restartPolicy: Always
          args: ["--config", "/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.otel.collector.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "engram.coordinator.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            {{- if .Values.auth.existingSecret }}
            - name: ENGRAM_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            {{- if eq .Values.kek.provider "env-var" }}
            # When KEK lives in env (dev/CI only), the value comes
            # from a Secret. Production overlays default to gcp-kms
            # and skip this block.
            - name: {{ .Values.kek.envVarName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: ENGRAM_KEK_MASTER_KEY
            {{- end }}
            {{- if .Values.otel.enabled }}
            # ADR 0019: export traces to the in-pod otelcol sidecar (which
            # forwards to Cloud Trace). engram-telemetry is a no-op if unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: local-data
              mountPath: /var/engram
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: local-data
          emptyDir: {}
        {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
        - name: otel-config
          configMap:
            name: {{ required "otel.collector.configMap is required when the otel collector is enabled" .Values.otel.collector.configMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
