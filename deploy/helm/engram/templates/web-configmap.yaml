{{- if .Values.web.enabled -}}
# nginx config for the web frontend. Mounted at
# /etc/nginx/templates/default.conf.template by the web Deployment;
# the official nginx-alpine entrypoint runs envsubst on it at pod
# start and writes the rendered config to /etc/nginx/conf.d/. The
# coord backend reference is templated from the coord component's
# fullname so a release rename retargets cleanly. nginx is configured
# for SPA routing (try_files → /index.html) and to proxy the coord's
# HTTP API + SSE + WebSocket on the same hostname (the browser only
# sees the IAP'd public LB; nginx splits per path).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "engram.web.fullname" . }}-config
  labels:
    {{- include "engram.web.labels" . | nindent 4 }}
data:
  default.conf.template: |
    # Sets `Connection: upgrade` only when the client requested an
    # Upgrade; otherwise leaves it alone so keep-alive works for
    # plain HTTP. Standard nginx WS-proxy idiom. Must live at http{}
    # context, which is what conf.d/*.conf top level resolves to.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }

    # ADR 0051: the web is backed by the orchestrator (Bun/Hono), which
    # fronts the coordinator's app-gRPC. All /api + /rpc traffic proxies
    # here; the orchestrator owns auth (better-auth + the IAP bridge) and
    # holds the coordinator CONTROL_PLANE_BEARER server-side.
    upstream engram_backend {
      # The orchestrator SERVICE port (.service.port, default 80), NOT its
      # containerPort (8787): nginx dials the ClusterIP, which listens on the
      # service port and forwards to the pod's targetPort. Using containerPort
      # here black-holes every /api + /rpc request (the service isn't listening
      # on 8787) → the web spins on "authenticating…" then "cannot reach the
      # coordinator".
      server {{ include "engram.orchestrator.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.orchestrator.service.port }};
    }

    server {
      listen {{ .Values.web.containerPort }};
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Health probe target. Cheap and auth-free; the readiness
      # probe hits this before the pod joins the Service.
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # ADR 0051: /rpc (Connect/gRPC-web) and /api (better-auth /api/auth,
      # the /api/v1 legs, SSE events, the shell WebSocket) both proxy to
      # the orchestrator. The IAP assertion the public LB forwards is
      # passed through so the orchestrator's IAP bridge can mint a
      # session; nginx injects NO bearer (the orchestrator authenticates
      # the user and holds the coordinator bearer itself). proxy_buffering
      # off for the SSE event stream; WS upgrade headers for the shell.
      location /rpc/ {
        proxy_pass http://engram_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Goog-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location /api/ {
        proxy_pass http://engram_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Goog-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }

      # SPA: every path the /api/ proxy didn't claim falls through to
      # index.html so client-side routing handles it — crucially a
      # browser deep-link / refresh on /sessions/:id now serves the app
      # shell instead of proxying to the coord's API.
      #
      # ADR 0026: a dashboard-wide Content-Security-Policy (defense in
      # depth for the whole SPA, incl. agent-shared artifacts rendered
      # inline). Artifacts are served same-origin under
      # /api/v1/sessions/... so `img-src`/`media-src 'self'` covers them;
      # `object-src`/`frame-ancestors 'none'` block embeds + clickjacking.
      # This is the SPA's own CSP only — the coord sets a stricter
      # `sandbox` CSP on each artifact response itself (proxied via the
      # /api/ location above, untouched here).
      location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
      }
    }
{{- end -}}
