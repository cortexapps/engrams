{{- if .Values.web.enabled -}}
# nginx config for the web frontend. Mounted at
# /etc/nginx/templates/default.conf.template by the web Deployment;
# the official nginx-alpine entrypoint runs envsubst on it at pod
# start and writes the rendered config to /etc/nginx/conf.d/. The
# coord backend reference is templated from the coord component's
# fullname so a release rename retargets cleanly. nginx is configured
# for SPA routing (try_files → /index.html) and to proxy the coord's
# HTTP API + SSE + WebSocket on the same hostname (the browser only
# sees the IAP'd public LB; nginx splits per path).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "engram.web.fullname" . }}-config
  labels:
    {{- include "engram.web.labels" . | nindent 4 }}
data:
  default.conf.template: |
    # Sets `Connection: upgrade` only when the client requested an
    # Upgrade; otherwise leaves it alone so keep-alive works for
    # plain HTTP. Standard nginx WS-proxy idiom. Must live at http{}
    # context, which is what conf.d/*.conf top level resolves to.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }

    upstream engram_coord {
      server {{ include "engram.coordinator.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }};
    }

    server {
      listen {{ .Values.web.containerPort }};
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Health probe target. Cheap and auth-free; the readiness
      # probe hits this before the pod joins the Service.
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # SPA: every unknown path falls through to index.html so
      # client-side routing handles it.
      #
      # ADR 0026: a dashboard-wide Content-Security-Policy (defense in
      # depth for the whole SPA, incl. agent-shared artifacts rendered
      # inline). Artifacts are served same-origin under /sessions/... so
      # `img-src`/`media-src 'self'` covers them; `object-src`/
      # `frame-ancestors 'none'` block embeds + clickjacking. This is the
      # SPA's own CSP only — the coord sets a stricter `sandbox` CSP on
      # each artifact response itself (proxied via the location below,
      # untouched here).
      location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
      }

      # Coord API. WS upgrade headers carried through so /v1/control
      # works; proxy_buffering off so SSE on /v1/events streams.
      #
      # Bearer auth: the browser carries the IAP cookie (authenticated
      # at the public LB) but no coord bearer. We stamp it here from
      # an env var rendered by the nginx-alpine envsubst entrypoint —
      # see web-deployment.yaml for the secret wiring. The {{`${...}`}}
      # form survives Helm rendering and is substituted at pod start.
      location ~ ^/(v1|api|events|sessions)(/|$) {
        proxy_pass http://engram_coord;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        {{- if .Values.web.coordinatorToken.existingSecret }}
        proxy_set_header Authorization "Bearer {{`${ENGRAM_API_TOKEN}`}}";
        {{- end }}
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
    }
{{- end -}}
