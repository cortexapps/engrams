{{- if .Values.serviceAccount.create -}}
# ServiceAccount the coord runs as. Production overlays bind
# cloud-native identity via annotations: `iam.gke.io/gcp-service-account`
# on GKE (Workload Identity), `eks.amazonaws.com/role-arn` on EKS
# (IRSA). The chart stays cloud-agnostic; the binding is in values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "engram.coordinator.serviceAccountName" . }}
  labels:
    {{- include "engram.coordinator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
