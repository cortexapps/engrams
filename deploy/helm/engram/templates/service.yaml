apiVersion: v1
kind: Service
metadata:
  name: {{ include "engram.coordinator.fullname" . }}
  labels:
    {{- include "engram.coordinator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # ADR 0051: app-gRPC — reached by the orchestrator (in-cluster) only
    # (kubectl port-forward remains a debug path). Network-private.
    - name: app-grpc
      port: {{ .Values.appGrpc.port }}
      targetPort: app-grpc
      protocol: TCP
  selector:
    {{- include "engram.coordinator.selectorLabels" . | nindent 4 }}
