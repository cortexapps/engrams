{{- if .Values.orchestrator.enabled -}}
# ClusterIP Service for the orchestrator pod. When the orchestrator Ingress
# (orchestrator-ingress.yaml) is enabled it targets this Service; the Service
# has no externally reachable address on its own. The
# `cloud.google.com/backend-config` annotation pattern (for IAP) is applied
# here when the values overlay sets `orchestrator.service.annotations`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "engram.orchestrator.fullname" . }}
  labels:
    {{- include "engram.orchestrator.labels" . | nindent 4 }}
  {{- with .Values.orchestrator.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.orchestrator.service.type }}
  ports:
    - name: http
      port: {{ .Values.orchestrator.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "engram.orchestrator.selectorLabels" . | nindent 4 }}
{{- end -}}
