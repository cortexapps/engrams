# Default values — cloud-agnostic. Override per-cloud via
# `values-gcp.yaml` / `values-aws.yaml` overlays.
#
# Top-level keys configure the coordinator (the chart was originally
# coord-only); the `web` block at the bottom owns the optional nginx
# frontend that serves the React dashboard.

# ─── coordinator ──────────────────────────────────────────────────

replicaCount: 2

image:
  # Override at deploy: `image.repository=us-docker.pkg.dev/...`
  repository: ghcr.io/cortexapps/engram-coordinator
  tag: ""           # falls back to .Chart.AppVersion when unset
  pullPolicy: IfNotPresent

# Optional image pull secrets when the registry needs auth. Shared
# between coord + web pods.
imagePullSecrets: []
# - name: engram-pull-secret

# `--mode` flag: `coordinator` (multi-host production) or `all`
# (single-binary dev). Production deploys must use `coordinator`;
# the host-agent runs separately on FC-capable VMs.
mode: coordinator

# Sandbox backend the coord registers locally in `--mode=all`. Ignored
# in `--mode=coordinator`. `firecracker` requires Linux + KVM in the
# coord pod (uncommon for K8s); `vz` is macOS-only and won't help here.
sandboxBackend: firecracker

# Blob storage backend selection (ADR 0007). Production reads chunks
# from the same bucket the image-builder writes to.
blob:
  # `local` or `gcs`. AWS S3 is reserved.
  backend: gcs
  # Required when backend=gcs.
  gcs:
    bucket: ""

# KEK provider for envelope-encrypted creds + cold-tier blob seals.
kek:
  # `env-var` (dev/CI) or `gcp-kms` (production).
  provider: gcp-kms
  # env-var only — name of the env var carrying the base64 master key.
  envVarName: ENGRAM_KEK_MASTER_KEY
  # gcp-kms only — full resource path.
  gcpResource: ""

# Secrets backend for image manifest's `[secrets.*]` references.
secrets:
  # `env` (dev) or `gcp` (Secret Manager via Workload Identity).
  backend: gcp
  # Required when backend=gcp.
  gcpProjectId: ""

# Database: Postgres URL pulled from a Secret; the chart never lets
# raw URLs sit in a ConfigMap.
database:
  existingSecret: engram-coordinator-secrets
  secretKey: DATABASE_URL

# Authentication (ADR 0031).
#
# `existingSecret`/`secretKey` carry the deployment bearer token(s) for the
# MACHINE path — the host-agent's coord→internal-router calls. This stays set
# in every real deploy regardless of how humans authenticate. An empty value
# disables the bearer entirely (dev only).
#
# `mode` selects how HUMANS authenticate:
#   ""/none      → synthetic admin for every request (dev; zero setup)
#   oidc         → coord runs the Authorization-Code+PKCE flow (set `oidc.*`)
#   forward-auth → trust a signed JWT from an edge proxy (GCP IAP / Cloudflare
#                  Access / oauth2-proxy); set `forwardAuth.*`
#
# NOTE: when humans use forward-auth/OIDC, the web pod must NOT stamp a bearer
# onto browser requests (set web.coordinatorToken.existingSecret: "") — otherwise
# the service-bearer verifier short-circuits and every user resolves to the admin
# service principal.
#
# Bootstrap admins moved to the orchestrator post-ADR-0051: human auth lives in
# the Bun/Hono tier now, so the designated-admin allowlist is
# `orchestrator.auth.adminEmails` → ORCHESTRATOR_ADMIN_EMAILS, not the coord.
auth:
  existingSecret: ""
  secretKey: ENGRAM_AUTH_TOKENS
  mode: ""
  # Set true in HTTPS prod (only affects the OIDC session cookie; inert in
  # forward-auth, which mints no cookie).
  cookieSecure: false
  # forward-auth (edge proxy) — GCP IAP preset shown in comments:
  forwardAuth:
    header: ""      # X-Goog-IAP-JWT-Assertion
    jwksUrl: ""     # https://www.gstatic.com/iap/verify/public_key-jwk
    issuer: ""      # https://cloud.google.com/iap
    audience: ""    # /projects/<PROJECT_NUMBER>/global/backendServices/<BACKEND_SERVICE_ID>
    emailClaim: email
  # OIDC (when mode=oidc). The client secret comes from a K8s secret.
  oidc:
    issuer: ""
    clientId: ""
    redirectUrl: ""   # https://<host>/api/v1/auth/callback
    clientSecret:
      existingSecret: ""
      secretKey: ENGRAM_OIDC_CLIENT_SECRET

# Coordinator app-gRPC surface (ADR 0051). The orchestrator (cross-pod) and
# engram-cli (via kubectl port-forward) reach the coordinator over this gRPC
# port. The deployment binds it on 0.0.0.0 (the coord default is loopback) and
# the Service exposes a named `app-grpc` port. The surface is bearer-gated
# (ENGRAM_APP_GRPC_TOKENS — fail-closed when empty) and must stay network-private
# (ClusterIP / port-forward only; never internet-reachable).
appGrpc:
  port: 50061
  # ENGRAM_APP_GRPC_TOKENS bearer allowlist. Defaults to the SAME Secret as the
  # REST auth tokens (.Values.auth) so the two token sets stay in sync; override
  # for a dedicated app-gRPC token. REQUIRED in prod — without it the coord
  # rejects every app-gRPC call (fail closed), so the orchestrator can't reach it.
  tokensSecret:
    existingSecret: ""        # "" -> falls back to .Values.auth.existingSecret
    secretKey: ""             # "" -> falls back to .Values.auth.secretKey

# Git forge (ADR 0023). Lets in-session agents fetch short-lived git
# credentials and open pull/merge requests through the platform — no
# durable token ever lives in the sandbox. Off by default.
#
# This block is the coordinator-side authority (the App credential).
# WHICH repos a session may act on is set per image in the manifest's
# `[git]` block (`provider` + `owner`); the seam only activates for a
# session whose image declares one. An installation token works across
# every repo the App can reach, so one App serves all of an org's images.
forge:
  # `none` (off) or `github`.
  provider: none
  github:
    # Numeric GitHub App ID, as a string (an identifier, not a secret).
    # The App needs Contents + Pull requests = Read & write, and must be
    # installed on the org/user that owns the target repos.
    appId: ""
    # The App's PEM private key — the one durable secret. The chart never
    # inlines it: put the PEM in a Secret and reference it here. The coord
    # receives it as `ENGRAM_GITHUB_APP_PRIVATE_KEY`.
    privateKey:
      existingSecret: ""
      secretKey: github-app-private-key

# Cloud-agnostic identity. Production overlays bind to a
# cloud-specific SA via annotations (GKE Workload Identity, EKS IRSA).
# Web pods use the namespace `default` SA — they make no cloud API
# calls, so they don't need bindings.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod-level identity hints for the coord pod.
podLabels: {}
podAnnotations: {}

# HTTP service exposing the coord's API + WS to in-cluster traffic
# — primarily the engram web nginx pod proxying browser API calls.
# Keep this as `ClusterIP`; the coord must never have a public IP,
# and out-of-cluster (in-VPC) reach is `serviceInternal` below, not
# this Service.
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Internal LoadBalancer Service for FC host-agents dialing in over
# WS from the host MIG (out of cluster, in VPC). Always created —
# this chart targets production; `--mode=all` single-binary dev is
# handled by Tilt/docker-compose, not Helm. Pin `loadBalancerIP`
# from Terraform (a pre-reserved internal address) so the FC MIG's
# coordinator_endpoint can be wired before Helm installs and the
# whole bring-up is one TF apply + one Helm install.
serviceInternal:
  # Pre-reserved VPC-internal IP, e.g.
  # `google_compute_address.coord_internal.address`. Leaving empty
  # works (auto-assigned) but means a follow-up step to plumb the
  # resulting IP back to the FC MIG. The LB port matches `service.port`.
  loadBalancerIP: ""
  # Cloud-specific internal-LB annotations live in the values
  # overlay (values-gcp.yaml.example sets the GKE pair).
  annotations: {}

# Optional ingress for the coord itself. Off by default — the
# supported topology is "browsers reach the web Ingress (below);
# nginx proxies API calls to the coord ClusterIP." Only flip this on
# if you're deploying without the web frontend AND want direct
# external access to the coord API (e.g. CLI-only consumers gated
# by bearer tokens). NEVER enable a coord ingress that lacks an
# auth layer in front of it.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: engram.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

# HorizontalPodAutoscaler. The coord is stateless; scale on CPU.
# Active sessions live on FC hosts so coord scaling is independent of
# session count.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# PodDisruptionBudget so rolling restarts never drop below quorum.
pdb:
  enabled: true
  minAvailable: 1

# Metrics scraping. On GKE the natural fit is Google Managed
# Prometheus (GMP), which scrapes via a `PodMonitoring` CRD.
# Operators on self-hosted Prometheus typically add scrape configs
# directly; for those, leave `podMonitoring.enabled = false` and
# point the scraper at the coord pod's `:9090` `metrics` port.
metrics:
  podMonitoring:
    enabled: false
    interval: "30s"

# NetworkPolicy egress controls. The coord needs to reach Postgres,
# the blob backend, and the OCI registry. Tighten per cloud.
networkPolicy:
  enabled: false
  egress:
    # CIDRs the coord can dial. `[]` allows all.
    cidrs: []
    # TCP ports for those CIDRs.
    ports: []

# Resource requests + limits. Default sizing fits the
# small/medium-fleet shape; bump for high-throughput deploys.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Pod scheduling for the coord.
nodeSelector: {}
tolerations: []
affinity: {}

# Optional sidecars on the coord pod (e.g. cloudsql-proxy on GCP).
# Each entry mirrors a k8s container spec.
extraContainers: []

# Optional environment vars on the coord pod not covered by the
# structured fields above. Format: list of { name, value } or
# { name, valueFrom }.
extraEnv: []

# Optional ConfigMap key/value pairs mounted as env vars on the coord.
extraConfig: {}

# Distributed tracing (ADR 0019). When enabled, the coordinator exports
# OTLP/gRPC to a collector at `endpoint` (default: the in-pod sidecar below),
# which forwards traces to the cloud's trace backend. Disabled by default;
# a GCP overlay sets enabled=true + collector.configMap. engram-telemetry is
# a no-op whenever `endpoint` resolves to unset.
otel:
  enabled: false
  # OTLP/gRPC endpoint the coordinator exports to. Default = the sidecar.
  endpoint: "http://localhost:4317"
  collector:
    # Run an otelcol as a NATIVE sidecar (init container, restartPolicy:
    # Always, no readinessProbe) in the coord pod — the GKE analogue of the
    # FC hosts' per-host systemd collector. Native so a crashing collector
    # never gates coord readiness. Requires k8s >= 1.29 (native-sidecar GA).
    # Set false to export to an external collector via `endpoint` instead.
    enabled: true
    # otelcol-contrib (the `googlecloud` exporter is contrib-only). Pin a
    # VERIFIED-good tag: 0.116.0's image ships a dynamically-linked binary on
    # a distroless base missing the glibc loader (`exec: no such file or
    # directory`); 0.111.0 runs. Re-verify `--version` on bump.
    image: "otel/opentelemetry-collector-contrib:0.111.0"
    # Name of an existing ConfigMap with key `config.yaml`, created from
    # deploy/otel/collector-gcp.yaml. Required when collector.enabled.
    configMap: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi

# Probes — defaults aligned with the coord's /healthz handler.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3

# ─── graceful shutdown (ADR 0050) ─────────────────────────────────
#
# Zero-downtime rolls. `drainSeconds` is the preStop sleep that lets
# kube-proxy finish removing the pod from the Service endpoints across
# all nodes BEFORE the app receives SIGTERM (closes the endpoint-removal
# race). 5-10s covers typical propagation. The app then SIGTERM-drains
# in-flight requests and ends its SSE streams; a force-exit backstop
# fires `ENGRAM_SHUTDOWN_DRAIN_SECS` after SIGTERM so a stuck stream
# can't wait out the SIGKILL. `terminationGracePeriodSeconds` must cover
# drainSeconds + that backstop with margin.
drainSeconds: 8
terminationGracePeriodSeconds: 45

# ─── web ──────────────────────────────────────────────────────────
#
# nginx pod serving the React SPA + reverse-proxying API calls to
# the in-cluster coord. The public Ingress (when enabled) fronts
# this pod; the coord has no public surface.
web:
  enabled: true

  replicaCount: 2

  image:
    repository: ghcr.io/cortexapps/engram-web
    tag: ""           # falls back to .Chart.AppVersion when unset
    pullPolicy: IfNotPresent

  # nginx listens on a high port so the pod can run as the
  # unprivileged `nginx` user (UID 101 in the alpine image). The
  # web Service maps its `port` to this `containerPort`.
  containerPort: 8080

  # Bearer token nginx stamps onto every proxied API/SSE/WS request.
  # The browser SPA itself never carries the token — IAP at the LB
  # authenticates the user, then this pod (which lives behind IAP)
  # attaches the coord-side bearer on every upstream call. The
  # referenced secret key MUST hold a single token (not a comma list)
  # that also appears in the coord's `ENGRAM_AUTH_TOKENS`.
  # Leave both fields empty to disable injection (e.g. a dev deploy
  # where the coord runs without auth).
  coordinatorToken:
    existingSecret: ""
    secretKey: ENGRAM_AUTH_TOKENS

  service:
    type: ClusterIP
    port: 80
    # Cloud-specific annotations land here. The IAP BackendConfig
    # pointer goes on the Service (see values-iap.yaml.example), not
    # on the Ingress.
    annotations: {}

  ingress:
    # The single public surface of the whole deployment. On GCP this
    # provisions a Google HTTPS LB; pair with a managed cert + IAP
    # BackendConfig in the values overlay.
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    # - host: engram.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  podLabels: {}
  podAnnotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── orchestrator (ADR 0051) ──────────────────────────────────────
#
# The Bun + Hono orchestrator: per-user authz + a native task model in
# FRONT of the Rust coordinator. INERT by default (`enabled: false`) —
# this chart can deploy it with NO production traffic (the web still
# points at the coordinator directly until a later drip). When enabled it
# runs as its own Deployment + Service (+ optional Ingress) and talks to
# the coordinator over gRPC/HTTP in-cluster.
#
# Env contract (orchestrator/src/config.ts). The orchestrator FAILS CLOSED
# without the three REQUIRED vars, all sourced from a K8s Secret:
#   ORCHESTRATOR_DATABASE_URL  — its OWN Postgres (a SEPARATE database from
#                                the coordinator's; see databaseSecret below)
#   CONTROL_PLANE_BEARER       — the coordinator app-gRPC bearer token
#   BETTER_AUTH_SECRET         — better-auth cookie/token signing key
orchestrator:
  enabled: false

  replicaCount: 2

  image:
    repository: ghcr.io/cortexapps/engram-orchestrator
    tag: ""           # falls back to .Chart.AppVersion when unset
    pullPolicy: IfNotPresent

  # ORCHESTRATOR_PORT — the Bun server binds 0.0.0.0:containerPort. The
  # orchestrator Service maps its `port` to this. Default mirrors config.ts.
  containerPort: 8787

  # ORCHESTRATOR_PUBLIC_URL — the externally-reachable base URL. Used by
  # better-auth as `baseURL` (the session-cookie domain + the OIDC redirect
  # callback `${publicUrl}/api/auth/oauth2/callback/<provider>`). MUST be the
  # public https URL in any OIDC deploy, or the IdP redirect lands nowhere.
  publicUrl: ""

  # TRUSTED_ORIGINS — comma-joined here from this list; better-auth CORS /
  # CSRF origin allowlist (the browser origins that may call the API).
  trustedOrigins: []
  # - https://orchestrator.example.com

  # CONTROL_PLANE_{GRPC,HTTP}_URL — where the orchestrator dials the Rust
  # coordinator. Default to the in-cluster coord Service; override only for an
  # out-of-cluster control plane. Leave empty to auto-derive from the coord
  # component's Service (grpc → service.port, http → service.port).
  controlPlane:
    grpcUrl: ""    # e.g. http://<release>-coordinator:8080
    httpUrl: ""    # e.g. http://<release>-coordinator:8080

  # The three REQUIRED env vars come from ONE Secret (keys below). The chart
  # never inlines them. `databaseSecret.url` MUST point at a SEPARATE database
  # (`engram_orchestrator`), NOT the coordinator's DB — the orchestrator owns
  # its own schema (drizzle migrations under orchestrator/drizzle/).
  databaseSecret:
    existingSecret: engram-orchestrator-secrets
    urlKey: ORCHESTRATOR_DATABASE_URL
    bearerKey: CONTROL_PLANE_BEARER
    authSecretKey: BETTER_AUTH_SECRET

  # ADR 0051: the orchestrator KEK-envelope-seals `user_session_secrets` at rest
  # (the user's harness tokens, e.g. CLAUDE_CODE_OAUTH_TOKEN) using the SAME
  # 32-byte key + envelope format as the coordinator's `kek.provider: env-var`
  # path — ENGRAM_KEK_MASTER_KEY (base64). It seals IN-PROCESS, so it needs the
  # RAW key (env-var), not gcp-kms. config.ts makes it REQUIRED — the orchestrator
  # refuses to start without it.
  #   - Default (existingSecret: "") sources the key from the COORDINATOR's secret
  #     (.Values.database.existingSecret) — the shared engrams key; correct for
  #     `kek.provider: env-var` deployments (key in a k8s Secret / Secret Manager).
  #   - For a `gcp-kms` coordinator (no raw key in a Secret), point this at a
  #     Secret holding a raw 32-byte base64 key for the orchestrator.
  kekSecret:
    existingSecret: ""          # "" -> falls back to .Values.database.existingSecret
    key: ENGRAM_KEK_MASTER_KEY

  # Drizzle migrations (orchestrator/drizzle/) MUST be applied to the
  # orchestrator's database before/at deploy. We run them as a pre-install /
  # pre-upgrade Helm Job (mirrors chart conventions: hooks, weights) that
  # invokes `bunx drizzle-kit migrate` with ORCHESTRATOR_DATABASE_URL wired
  # from the same Secret. Disable if you apply migrations out-of-band.
  migrations:
    enabled: true
    # Job backoff before it's marked Failed (and the install/upgrade aborts).
    backoffLimit: 3

  # Human auth mode is DEPLOY-SELECTABLE, mirroring the old coordinator
  # `auth.mode` / `oidc.*` knobs. The orchestrator supports three doors and
  # the modes COMPOSE (config.ts): email+password is always on unless you put
  # IAP in front; IAP and OIDC each activate only when their block is set.
  # Env entries are emitted ONLY when the corresponding value is non-empty, so
  # an unset block leaves that auth path fully inert.
  #
  #   email+password  → set NOTHING here (dev / simple deploys)
  #   IAP             → set auth.iap.audience (GCP IAP in front of the Ingress)
  #   OIDC            → set auth.oidc.{issuer,clientId,clientSecret} ("Sign in
  #                     with your IdP"; yields real user names via the `profile`
  #                     scope, which stock GCP IAP can't supply)
  auth:
    # IAP — GCP Identity-Aware Proxy bridge. Set `audience` to enable; the
    # bridge is fully inert (zero header reads) when empty.
    iap:
      audience: ""    # /projects/<PROJECT_NUMBER>/apps/<APP_ID> (or backendServices form)
      # Override the IAP JWKS endpoint (default in config.ts points at gstatic).
      # Leave empty in prod.
      jwksUrl: ""
    # OIDC — env-driven generic OIDC provider (better-auth genericOAuth).
    # Setting `issuer` enables it; clientId + clientSecret then become REQUIRED
    # (partial config is a hard boot error in config.ts). The client secret
    # comes from a Secret, never inlined.
    oidc:
      issuer: ""
      clientId: ""
      clientSecret:
        existingSecret: ""
        secretKey: ORCHESTRATOR_OIDC_CLIENT_SECRET
      # Stable provider id used in the sign-in call + the callback path
      # (`${publicUrl}/api/auth/oauth2/callback/<providerId>`). Default "sso".
      providerId: ""
      # Requested scopes; `profile` pulls the display name. Default in config.ts
      # is "openid email profile". Join with spaces here.
      scopes: ""    # e.g. "openid email profile"

    # Bootstrap-admin allowlist — ORCHESTRATOR_ADMIN_EMAILS. Restores the
    # pre-ADR-0051 `auth.bootstrapAdmins` value: each email here is created
    # with role 'admin' on first login (any door — IAP / OIDC / email+password)
    # and an existing matching user is promoted to admin on next sign-in. This
    # is how a fresh deploy gets a designated root/admin account without manual
    # SQL. Comma-joined into the env; empty list -> the env is omitted and the
    # promotion hooks are fully inert.
    adminEmails: []
    # - root@example.com
    # - ops@example.com

  service:
    type: ClusterIP
    port: 80
    annotations: {}

  ingress:
    # Optional public surface for the orchestrator (the browser-native HTTP/WS
    # legs + the auth callback). Off by default — the inert deploy needs no
    # public reach. On GCP this provisions a Google HTTPS LB; pair with a
    # managed cert + (for IAP) a BackendConfig pointer on `service.annotations`.
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    # - host: orchestrator.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  podLabels: {}
  podAnnotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
