apiVersion: v2
name: engram
description: |
  Engram — coordinator (stateless HTTP+WS service scheduling sessions
  across a fleet of Firecracker host-agents) plus an optional nginx
  web frontend serving the React dashboard and reverse-proxying API
  calls into the in-cluster coord. Cloud-agnostic; cloud-specific
  bindings (Workload Identity, secret providers, LB annotations) live
  in `values-*.yaml.example` overlays.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - engram
  - firecracker
  - microvm
sources:
  - https://github.com/cortexapps/engrams
maintainers:
  - name: Cortex
