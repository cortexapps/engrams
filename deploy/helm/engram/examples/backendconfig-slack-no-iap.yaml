# No-IAP BackendConfig for the orchestrator's narrowly public endpoints.
#
# Apply this alongside the Helm release (same namespace), then point the
# orchestrator Service at it with the annotation in values-iap.yaml.example:
#
#   kubectl apply -n <release-namespace> -f backendconfig-slack-no-iap.yaml
#
# Why this exists
# ---------------
# IAP is enabled per GCP *backend service*, not per path. The web Ingress
# routes "/" to a single backend (the web nginx Service) with IAP ON
# (BackendConfig `engram-web-iap`). To expose a path WITHOUT IAP you must
# route it to a *different* backend service whose BackendConfig has IAP off.
#
# values-iap.yaml.example enables a dedicated webhook Service
# (`<release>-orchestrator-webhooks`, fronting the same orchestrator pods) and
# retargets a set of paths at it: the provider webhook Exact matches (e.g.
#   /api/v1/integrations/slack/events
#   /api/v1/integrations/slack/interactivity
# ), and the /api/v1/sessions/ + /api/v1/specs/ prefixes that carry the
# product's WebSockets. Annotating the webhook Service with
# `cloud.google.com/backend-config: {"default":"engram-slack-no-iap"}`
# binds ITS GCP backend service to THIS config, so those URLs skip IAP
# while everything else — including the primary orchestrator Service — stays
# IAP-capable.
#
# Safe to expose without IAP: webhook handlers verify provider signatures,
# ADR 0109 exposes only exact read-only Google OIDC discovery and JWKS paths,
# and the session/spec prefixes are gated by the orchestrator's own
# better-auth seams (an anonymous caller gets 401, or a 4401 socket close).
#
# WebSockets REQUIRE this backend. IAP does not carry a WebSocket upgrade —
# the load balancer answers 502 — so a socket routed at the IAP'd web backend
# can never connect, no matter how the app behaves.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: engram-slack-no-iap
spec:
  iap:
    enabled: false
  # A GCP backend-service timeout is the ceiling on a WebSocket's LIFETIME,
  # not just on time-to-first-byte, so the 30s default would tear down the
  # shell, the IDE, and the spec-document socket every 30 seconds. One hour
  # matches the nginx `proxy_read_timeout` in web-configmap.yaml; clients
  # reconnect, so this bounds a leaked socket without interrupting a session.
  timeoutSec: 3600
  # Health check is otherwise inferred from the orchestrator's readinessProbe
  # (GET /healthz → 200 when the DB is reachable; orchestrator-deployment.yaml).
  # Pinned explicitly here so the no-IAP backend's health is unambiguous and
  # independent of any future probe change.
  healthCheck:
    type: HTTP
    requestPath: /healthz
    # The orchestrator's serving port (containerPort / Service targetPort).
    port: 8787
