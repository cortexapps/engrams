{{- if .Values.nodePrep.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hostfleet.nodePrep.fullname" . }}
  labels:
    {{- include "hostfleet.nodePrep.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hostfleet.nodePrep.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hostfleet.nodePrep.selectorLabels" . | nindent 8 }}
    spec:
      # Node-OS prep the Packer image used to bake: load the nbd module
      # and set the (non-namespaced) sysctls. Idempotent + best-effort
      # per step so a node that already has them doesn't crash-loop.
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: true
      containers:
        - name: node-prep
          image: "{{ .Values.nodePrep.image.repository }}:{{ .Values.nodePrep.image.tag }}"
          imagePullPolicy: {{ .Values.nodePrep.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # ADR 0049: nbds_max only takes effect on a FRESH module
              # load. If the module is already loaded with a different
              # value (e.g. rolling 64 -> 4096), reload it — rmmod
              # succeeds on a fresh/idle node and fails harmlessly while
              # devices are in use (a reboot/drain then picks up the new
              # value). A `0` disables NBD (skip the load entirely).
              WANT_NBDS_MAX={{ .Values.nbd.nbdsMax }}
              if [ "$WANT_NBDS_MAX" = "0" ]; then
                echo "[node-prep] nbd disabled (nbdsMax=0); skipping modprobe"
              else
                CUR_NBDS_MAX=$(cat /sys/module/nbd/parameters/nbds_max 2>/dev/null || echo "")
                if [ -n "$CUR_NBDS_MAX" ] && [ "$CUR_NBDS_MAX" != "$WANT_NBDS_MAX" ]; then
                  echo "[node-prep] nbd loaded with nbds_max=$CUR_NBDS_MAX, want $WANT_NBDS_MAX; reloading"
                  rmmod nbd 2>&1 || echo "[node-prep] rmmod nbd failed (devices in use); reboot/drain to change nbds_max"
                fi
                echo "[node-prep] modprobe nbd nbds_max=$WANT_NBDS_MAX"
                modprobe nbd nbds_max=$WANT_NBDS_MAX 2>&1 || echo "[node-prep] nbd modprobe skipped (already loaded or unavailable)"
              fi
              {{- range $k, $v := .Values.nodePrep.sysctls }}
              # {{ $k }} — non-namespaced sysctls (vm.*) take effect node-wide;
              # namespaced ones (net.*) only bind this pod's netns and are
              # re-applied by the host-agent in its own netns.
              echo "[node-prep] sysctl {{ $k }}={{ $v }}"
              ( echo {{ $v | quote }} > /proc/sys/{{ $k | replace "." "/" }} ) 2>&1 || echo "[node-prep] {{ $k }} skipped"
              {{- end }}
              {{- with .Values.storage.dedicatedDevice }}
              # ADR 0070: format (only if unformatted) + mount the dedicated
              # volume at workDirHostPath, moving the chunk cache /
              # snapshots / memfiles off the node boot disk (the budget in
              # ChunkCacheConfig is the real disk-headroom mechanism; this
              # is defense-in-depth accounting, not bytes). Idempotent
              # across pod restarts: `blkid` detects an existing filesystem
              # (never reformats a device with live data — that would
              # destroy a prior life's chunk cache on every pod restart),
              # `mountpoint -q` skips a redundant mount. Runs BEFORE the
              # base-shm tmpfs step below so, when both are set, the tmpfs
              # mounts INSIDE this filesystem's tree (uffdBaseDir normally
              # lives under workDirHostPath). Same nsenter-into-host-mount-ns
              # shape as the tmpfs step: `mkfs.ext4`/`blkid`/`mount` resolve
              # from the HOST's PATH, not this busybox image's.
              echo "[node-prep] dedicated volume {{ . }} -> {{ $.Values.storage.workDirHostPath }}"
              nsenter -t 1 -m -- sh -c \
                'set -e; \
                 mkdir -p {{ $.Values.storage.workDirHostPath }}; \
                 if ! blkid {{ . }} >/dev/null 2>&1; then \
                   echo "[node-prep] {{ . }} has no filesystem; mkfs.ext4"; \
                   mkfs.ext4 -F {{ . }}; \
                 fi; \
                 mountpoint -q {{ $.Values.storage.workDirHostPath }} || mount {{ . }} {{ $.Values.storage.workDirHostPath }}' \
                2>&1 || echo "[node-prep] dedicated volume mount FAILED (host-agent will refuse to start: ENGRAM_WORK_DIR_REQUIRE_MOUNTPOINT=true)"
              {{- end }}
              {{- with .Values.firecracker.uffdBaseDir }}
              # ADR 0045 D3: tmpfs for the per-template base shm files
              # (UFFD MINOR faults are shmem-only). Mounted in the HOST
              # mount namespace via nsenter (hostPID:true gives us pid 1;
              # busybox ships nsenter) so the host-agent's hostPath volume
              # sees it. Idempotent across pod restarts; never unmounted —
              # live VMs map files inside it.
              echo "[node-prep] tmpfs {{ . }} (size={{ $.Values.firecracker.uffdBaseTmpfsSize }})"
              nsenter -t 1 -m -- sh -c \
                'mkdir -p {{ . }} && { mountpoint -q {{ . }} || mount -t tmpfs -o size={{ $.Values.firecracker.uffdBaseTmpfsSize }} engram-base-shm {{ . }}; }' \
                2>&1 || echo "[node-prep] base-shm tmpfs mount FAILED (substrate restores will fail loudly)"
              {{- end }}
              echo "[node-prep] done; holding"
              exec sleep infinity
          volumeMounts:
            - {name: lib-modules, mountPath: /lib/modules, readOnly: true}
          resources:
            requests: {cpu: "10m", memory: 32Mi}
            limits: {cpu: "100m", memory: 64Mi}
      volumes:
        - {name: lib-modules, hostPath: {path: /lib/modules, type: Directory}}
{{- end }}
