apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hostfleet.hostAgent.fullname" . }}
  labels:
    {{- include "hostfleet.hostAgent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hostfleet.hostAgent.selectorLabels" . | nindent 6 }}
  # OnDelete: the host-agent holds live microVM state, so K8s must not
  # roll pods out from under it. The ADR 0044 K3 operator drives
  # drain-gated, node-by-node replacement instead.
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  template:
    metadata:
      labels:
        {{- include "hostfleet.hostAgent.selectorLabels" . | nindent 8 }}
    spec:
      # ADR 0044 K2 (VM-detach): the FC microVMs (and any uffd-handler)
      # must SURVIVE a host-agent pod restart so the successor pod can
      # pidfd-reattach them — a routine DaemonSet upgrade then drops zero
      # sessions. hostPID puts those processes in the NODE's PID
      # namespace, so deleting this pod doesn't tear down their PID
      # namespace and kill them. The host-agent spawns FC without
      # kill_on_drop and never checkpoints on SIGTERM; it just detaches.
      hostPID: true
      # ADR 0044 K2: hostPID alone keeps the FC *process* alive across a pod
      # restart, but the VM's network plumbing — the veth host-side and the
      # MASQUERADE/SNAT iptables — lives in the host-agent's network namespace.
      # In a pod-scoped netns that's torn down on delete, so the successor pod
      # can't reattach ("net slot reserve failed: netns gone"). hostNetwork
      # puts the host-agent (and everything it plumbs) in the NODE root netns,
      # so the veth + iptables + the host->VM dial all persist across the roll.
      # The kvm nodes are dedicated (no port contention) and the node IP is a
      # stabler advertise addr than an ephemeral pod IP. ClusterFirstWithHostNet
      # keeps the in-cluster coordinator Service resolvable under hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "hostfleet.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # terminationGracePeriod is generous: the K3 operator drains via
      # the coordinator before deleting a pod, but a bare `kubectl
      # delete` should still let in-flight captures finish.
      terminationGracePeriodSeconds: 120
      initContainers:
        {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
        # ADR 0019 / telemetry restoration (#526): OTel Collector as a k8s
        # NATIVE sidecar (init container with restartPolicy: Always), mirroring
        # the coord chart's pattern exactly. Starts before host-agent and runs
        # for the pod's lifetime, receiving OTLP on localhost:4317 (and, under
        # hostNetwork, node-wide 0.0.0.0:4317 — reachable by the uffd-handler
        # and, once the guest firewall pinhole lands, the in-guest agentd) and
        # forwarding to Cloud Trace. Crucially it has NO readinessProbe, so —
        # same guardrail as the coord sidecar — a crashing collector can never
        # pull the host-agent out of Ready (the 2026-05-27 coord incident this
        # pattern exists to prevent). Config from an existing ConfigMap (key
        # config.yaml), created from deploy/otel/collector-gcp.yaml.
        - name: otel-collector
          image: {{ .Values.otel.collector.image | quote }}
          restartPolicy: Always
          args: ["--config", "/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.otel.collector.resources | nindent 12 }}
        {{- end }}
        # ADR 0044 K2 / GAP 2: stage firecracker + the guest kernel out of
        # the node-assets image into a shared emptyDir. Stock K8s nodes have
        # neither (the GCE/Packer node image baked them in); this is the K8s
        # equivalent, and being per-pod means a reattached FC keeps its own
        # running binary — no swap under a live VM. Runs before the
        # host-agent and before the emptyDir is read, so there's no
        # fail-before-init race a `type: File` hostPath mount would have.
        - name: stage-node-assets
          image: "{{ .Values.nodeAssets.image.repository }}:{{ .Values.nodeAssets.image.tag }}"
          imagePullPolicy: {{ .Values.nodeAssets.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if .Values.storage.dedicatedDevices }}
              # The dedicated work-dir fs must be mounted BEFORE we stage
              # into it — but we cannot WAIT for it in-process: this
              # container's /var/lib/engram is a hostPath bind frozen at
              # container start (no mount propagation), so a mount landing
              # later on the host is invisible here, and our writes would
              # land on the boot-disk dir the mount then shadows (prod
              # 2026-07-15: fresh-NVMe nodes came up with the bundle stamp
              # shadowed, twice — an earlier in-process wait on
              # /proc/mounts was vacuous because the bind itself matches).
              # Instead: node-prep touches a marker INSIDE the dedicated
              # fs right after mounting; if this bind can't see it, EXIT
              # NON-ZERO so the kubelet restarts this init with backoff —
              # each restart re-binds and re-checks current truth (the
              # same crash-until-ready contract the main container's
              # ENGRAM_WORK_DIR_REQUIRE_MOUNTPOINT gate provides).
              if [ ! -e /var/lib/engram/.engram-node-prep-mounted ]; then
                echo "[stage-node-assets] dedicated work-dir not mounted yet (no node-prep marker); exiting for kubelet retry" >&2
                exit 1
              fi
              {{- end }}
              cp /assets/firecracker /opt/engram/firecracker
              cp /assets/vmlinux     /opt/engram/vmlinux
              chmod 0755 /opt/engram/firecracker
              echo "[stage-node-assets] firecracker + vmlinux -> /opt/engram"
              # ADR 0027: stage the RO session bundles + stamp to the
              # fleet-canonical /var/lib/engram/shared (inside the `work`
              # hostPath the host-agent reads). The host-agent resolves aux RO
              # drives ([git] -> skills, [browser] -> browser) against
              # current.json there. Graceful if a node-assets image predates
              # bundles: the host still serves non-bundle sessions (bundle
              # images fail loudly at capture, the same signal as before).
              if ls /assets/bundles/*.squashfs >/dev/null 2>&1; then
                mkdir -p /var/lib/engram/shared
                cp /assets/bundles/*.squashfs   /var/lib/engram/shared/
                cp /assets/bundles/current.json /var/lib/engram/shared/current.json
                echo "[stage-node-assets] bundles + stamp -> /var/lib/engram/shared"
              else
                echo "[stage-node-assets] WARNING: node-assets image carries no bundles; aux-RO-drive images will fail to capture" >&2
              fi
          volumeMounts:
            - {name: engram-assets, mountPath: /opt/engram}
            # ADR 0027: bundles land in /var/lib/engram/shared, inside the
            # `work` hostPath the host-agent reads.
            - {name: work, mountPath: /var/lib/engram}
      containers:
        - name: host-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # Spike (ADR 0044) ran fully privileged; production should
            # tighten to a KVM device plugin + scoped caps (K-hardening).
            privileged: true
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "SYS_ADMIN", "IPC_LOCK"]
          envFrom:
            - configMapRef:
                name: {{ include "hostfleet.hostAgent.fullname" . }}
          env:
            # The coord dials this back for gRPC (ADR 0013). Under hostNetwork
            # (above), status.podIP resolves to the NODE's primary IP — a
            # stable, in-cluster-routable advertise addr that outlives any pod.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # ADR 0044 K2 (GAP 1): the host-agent seeds a STABLE HostId
            # from the node name (persisted to the work_dir hostPath), so a
            # DaemonSet pod restart keeps its identity and the coordinator's
            # session->host binding survives while detach+reattach re-adopts
            # the node's still-live microVMs.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ENGRAM_GRPC_ADVERTISE_ADDR
              value: "http://$(POD_IP):{{ .Values.hostAgent.grpcPort }}"
            # ADR 0044 K2 / GAP 2: firecracker lives in the staged emptyDir,
            # not on PATH (ENGRAM_KERNEL_IMAGE_PATH=/opt/engram/vmlinux is set
            # in the configmap, and matches the emptyDir layout).
            - name: ENGRAM_FIRECRACKER_BIN
              value: /opt/engram/firecracker
            {{- if .Values.coordinator.tokenSecretName }}
            - name: ENGRAM_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coordinator.tokenSecretName }}
                  key: {{ .Values.coordinator.tokenSecretKey }}
            {{- end }}
            {{- if eq .Values.egress.caSource "env" }}
            # Egress CA via env (same delivery as ENGRAM_COORDINATOR_TOKEN
            # above): the host-agent is hostNetwork, so it CANNOT read Secret
            # Manager directly (it bypasses Workload Identity → the node SA,
            # whose token lacks the cloud-platform scope → 403). The CA is
            # mirrored from Secret Manager into a K8s secret and injected here.
            # The PEMs land in ENGRAM_EGRESS_CA_{CERT,KEY}_PEM — the var names
            # the host-agent's `env` CA source reads by default.
            - name: ENGRAM_EGRESS_CA_CERT_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ required "egress.caEnvSecret is required when egress.caSource == env" .Values.egress.caEnvSecret }}
                  key: {{ .Values.egress.caEnvCertKey }}
            - name: ENGRAM_EGRESS_CA_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.egress.caEnvSecret }}
                  key: {{ .Values.egress.caEnvKeyKey }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            # ADR 0019 / telemetry restoration (#526): export host-agent spans
            # (chunk.fetch, host.restore_base_for_session, restore.*, ...) to
            # the in-pod otelcol sidecar (which forwards to Cloud Trace).
            # engram-telemetry is a no-op if unset. The uffd-handler, spawned
            # by this container without env_clear, inherits this too.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            {{- if and .Values.otel.enabled .Values.otel.guestEndpoint }}
            # #526 phase 2: in-guest agentd OTLP export. Rides the FC
            # kernel cmdline (`engram_otel=`) into COLD boots (capture
            # VMs); the host-agent opens the matching guest->collector
            # tcp pinhole in the INPUT chain (net.rs) so the dial to
            # the slot-0 gateway (10.200.0.1) reaches the hostNetwork
            # collector instead of the VM-pool DROP.
            - name: ENGRAM_GUEST_OTEL_ENDPOINT
              value: {{ .Values.otel.guestEndpoint | quote }}
            {{- end }}
            {{- with .Values.hostAgent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: grpc, containerPort: {{ .Values.hostAgent.grpcPort }}, protocol: TCP}
            - {name: metrics, containerPort: {{ .Values.hostAgent.metricsPort }}, protocol: TCP}
          resources:
            {{- toYaml .Values.hostAgent.resources | nindent 12 }}
          volumeMounts:
            - {name: dev, mountPath: /dev}
            # firecracker + vmlinux, staged by the init container (GAP 2)
            - {name: engram-assets, mountPath: /opt/engram}
            # ADR 0045 D3: node-prep mounts the base-shm tmpfs at
            # /var/lib/engram/shm in the HOST mount namespace *after* this
            # container may have started. Without HostToContainer
            # propagation, that mount never appears in the host-agent's
            # view — it sees plain ext4 at /shm and FC's shmem-only UFFD
            # MINOR-fault restore fails to register ("System error").
            # Long-lived nodes hid this (the agent restarted after the
            # mount existed); a freshly-booted node loses the race.
            - {name: work, mountPath: /var/lib/engram, mountPropagation: HostToContainer}
            - {name: cgroup, mountPath: /sys/fs/cgroup}
            {{- if .Values.storage.dedicatedDevices }}
            # ADR 0070 finding 1: read-only reference for the mountpoint
            # gate (ENGRAM_HOST_ROOT_REF_PATH, set in the configmap) —
            # the container's OWN `/` is its ephemeral image overlayfs,
            # always a distinct device from any hostPath mount, so the
            # gate needs the NODE's actual `/` to compare against.
            - {name: host-root, mountPath: /mnt/host-root, readOnly: true}
            {{- end }}
      volumes:
        - {name: dev, hostPath: {path: /dev, type: Directory}}
        # ADR 0044 K2 / GAP 2: firecracker + the guest kernel land here from
        # the node-assets init container — replaces the hostPath `type: File`
        # mounts, which fail-before-init when the node lacks the files.
        - {name: engram-assets, emptyDir: {}}
        - {name: work, hostPath: {path: {{ .Values.storage.workDirHostPath | quote }}, type: DirectoryOrCreate}}
        - {name: cgroup, hostPath: {path: /sys/fs/cgroup, type: Directory}}
        {{- if and .Values.otel.enabled .Values.otel.collector.enabled }}
        - name: otel-config
          configMap:
            name: {{ required "otel.collector.configMap is required when the otel collector is enabled" .Values.otel.collector.configMap }}
        {{- end }}
        {{- if .Values.storage.dedicatedDevices }}
        - {name: host-root, hostPath: {path: /, type: Directory}}
        {{- end }}
