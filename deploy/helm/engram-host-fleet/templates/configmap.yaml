apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hostfleet.hostAgent.fullname" . }}
  labels:
    {{- include "hostfleet.hostAgent.labels" . | nindent 4 }}
data:
  # Non-secret host-agent env (the token comes from a Secret, the
  # advertise addr from the Downward API — both set on the DaemonSet).
  ENGRAM_SANDBOX_BACKEND: "firecracker"
  ENGRAM_SANDBOX_WORK_DIR: "/var/lib/engram/sandboxes"
  ENGRAM_KERNEL_IMAGE_PATH: "/opt/engram/vmlinux"
  ENGRAM_GRPC_LISTEN_ADDR: "0.0.0.0:{{ .Values.hostAgent.grpcPort }}"
  ENGRAM_HOST_METRICS_ADDR: "0.0.0.0:{{ .Values.hostAgent.metricsPort }}"
  ENGRAM_BLOB_BACKEND: {{ .Values.blob.backend | quote }}
  {{- if .Values.coordinator.endpoint }}
  ENGRAM_COORDINATOR_ENDPOINT: {{ .Values.coordinator.endpoint | quote }}
  {{- end }}
  {{- if eq .Values.blob.backend "gcs" }}
  ENGRAM_GCS_BUCKET: {{ .Values.blob.gcsBucket | quote }}
  {{- else if eq .Values.blob.backend "s3" }}
  ENGRAM_S3_BUCKET: {{ .Values.blob.s3Bucket | quote }}
  {{- with .Values.blob.s3EndpointUrl }}
  ENGRAM_S3_ENDPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.blob.s3Region }}
  ENGRAM_S3_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.nbd.nbdsMax }}
  # ADR 0049: cap the host-agent's slot universe at the same value the
  # module was loaded with, and keep `warmSlots` pre-validated slots warm.
  ENGRAM_NBD_MAX_SLOTS: {{ .Values.nbd.nbdsMax | quote }}
  ENGRAM_NBD_WARM_SLOTS: {{ .Values.nbd.warmSlots | default 64 | quote }}
  {{- end }}
  {{- with .Values.firecracker.restoreMode }}
  ENGRAM_FC_RESTORE_MODE: {{ . | quote }}
  {{- end }}
  {{- with .Values.firecracker.uffdBaseDir }}
  # ADR 0045 D3: the unified memory substrate. Node-prep mounts the tmpfs;
  # the host-agent derives everything else from this one switch.
  ENGRAM_FC_UFFD_BASE_DIR: {{ . | quote }}
  {{- end }}
  {{- with .Values.firecracker.vmCgroupParent }}
  # ADR 0044 K2: node-level cgroup-v2 dir the host-agent moves each VM's
  # FC + uffd-handler into, so they survive this pod's cgroup teardown on
  # a restart (hostPID alone keeps the PID namespace, not the cgroup).
  ENGRAM_FC_VM_CGROUP_PARENT: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.chunkCacheBudgetBytes }}
  ENGRAM_CHUNK_CACHE_BUDGET_BYTES: {{ . | quote }}
  {{- end }}
  # ADR 0006 + issue #240: the egress proxy is MANDATORY. host-agent
  # always binds it and FAILS TO START if it can't (CA unloadable /
  # port unbindable). The K8s migration (ADR 0044 K5) dropped these
  # when the GCE MIG was retired, leaving prod hosts with the binary
  # default and unfiltered guest egress. `ENGRAM_EGRESS_PROXY_PORT`
  # exists only to avoid a bind collision — there is no "0 = off".
  ENGRAM_EGRESS_PROXY_PORT: {{ .Values.egress.port | default 8443 | quote }}
  ENGRAM_EGRESS_CA_SOURCE: {{ .Values.egress.caSource | quote }}
  {{- if eq .Values.egress.caSource "gcp-secret-manager" }}
  {{- if not .Values.egress.caGcpCertSecret }}
  {{- fail "egress.caGcpCertSecret is required when egress.caSource == gcp-secret-manager (issue #240)" }}
  {{- end }}
  {{- if not .Values.egress.caGcpKeySecret }}
  {{- fail "egress.caGcpKeySecret is required when egress.caSource == gcp-secret-manager (issue #240)" }}
  {{- end }}
  # Secret Manager RESOURCE PATHS (not the secret values) — read at boot.
  # NOTE: this path needs a cloud-platform-scoped token; a hostNetwork
  # host-agent bypasses Workload Identity and runs as the scope-limited node
  # SA, so it 403s. Prefer caSource: env on GKE hostNetwork fleets.
  ENGRAM_EGRESS_CA_GCP_CERT_SECRET: {{ .Values.egress.caGcpCertSecret | quote }}
  ENGRAM_EGRESS_CA_GCP_KEY_SECRET: {{ .Values.egress.caGcpKeySecret | quote }}
  {{- else if eq .Values.egress.caSource "env" }}
  {{- if not .Values.egress.caEnvSecret }}
  {{- fail "egress.caEnvSecret is required when egress.caSource == env (the K8s secret holding the CA PEMs, injected as ENGRAM_EGRESS_CA_{CERT,KEY}_PEM by the DaemonSet)" }}
  {{- end }}
  {{- end }}
