# Default (cloud-agnostic) values for the engram host fleet.
# ADR 0044. Cloud-specific overlays (Workload Identity, secret
# providers) live in values-*.yaml.example, mirroring the engram chart.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/cortexapps/engrams/host-agent
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}    # e.g. GKE Workload Identity / EKS IRSA binding

# Only schedule the host-agent + node-prep onto KVM / nested-virt
# nodes. Label them: `kubectl label node <n> engram.io/kvm=true`.
# (On managed K8s the node pool must have nested virt enabled — Intel
# only today, see ADR 0044.)
nodeSelector:
  engram.io/kvm: "true"
tolerations: []

coordinator:
  # ws:// or http:// endpoint the host-agent dials. Empty => the
  # host-agent runs but does not register (useful for a bring-up
  # smoke test). In-cluster: ws://<coord-release>-coordinator:8080
  endpoint: ""
  # Bearer token (ADR 0031). Sourced from an existing Secret to avoid
  # baking it into values; key `coordinator-token`.
  tokenSecretName: ""
  tokenSecretKey: coordinator-token

blob:
  backend: gcs        # local | gcs | s3 (s3 lands in ADR 0044 K5)
  gcsBucket: ""
  s3Bucket: ""
  s3EndpointUrl: ""   # MinIO / R2 / Spaces
  s3Region: ""

nodeAssets:
  # ADR 0044 K2 / GAP 2: firecracker + the engram guest kernel, staged into
  # each host-agent pod by an init container into a shared emptyDir (stock
  # K8s nodes don't carry them; the GCE/Packer node image did). Built by
  # docker/node-assets.Dockerfile — docker/node-assets-fetch.sh stages the
  # build context (pinned FC release + the engram guest-kernel GH asset).
  # Pin to a digest in prod and roll it via the K3 operator's node sequence.
  image:
    repository: ghcr.io/cortexapps/engrams/node-assets
    tag: main
    pullPolicy: IfNotPresent

firecracker:
  # firecracker + the guest kernel are staged into the pod emptyDir at
  # /opt/engram by the node-assets init container (see nodeAssets); the
  # host-agent reads them from there (ENGRAM_FIRECRACKER_BIN + the configmap
  # ENGRAM_KERNEL_IMAGE_PATH). No node hostPath for them anymore.
  restoreMode: ""     # "" (binary default) | file | uffd
  # ADR 0045 D3 (the unified memory substrate, v2b): a tmpfs directory for
  # per-template base shm files. When set: node-prep mounts a tmpfs there,
  # Uffd restores back guest memory MAP_PRIVATE on the shared base
  # (canonical pages CONTINUE-shared across same-template VMs), and
  # fresh-creates flip from File mode to the substrate (parity-gated:
  # density 35%==35%, restore median 61ms vs 56ms). "" = off (File-mode
  # fresh-creates + anonymous-Uffd resumes, today's behavior). Requires
  # the v2 forked firecracker (engrams#164+). Under workDirHostPath so it
  # survives pod restarts (K2 reattach).
  uffdBaseDir: ""     # e.g. /var/lib/engram/shm
  # tmpfs size cap for uffdBaseDir (one base per enabled template; each
  # file is guest-RAM-sized but populated lazily + hole-punchable).
  uffdBaseTmpfsSize: 32g
  # ADR 0044 K2 (VM-detach): a node-level cgroup-v2 dir the host-agent
  # moves each VM's FC + uffd-handler into, so they survive THIS pod's
  # cgroup teardown on a restart (hostPID keeps the PID namespace, but
  # the pod-scope `cgroup.kill` would still reap them). Must be on the
  # host cgroup tree (the chart mounts /sys/fs/cgroup rw). Set "" to
  # disable (then a pod restart kills the node's VMs).
  vmCgroupParent: /sys/fs/cgroup/engram-vms

egress:
  # ADR 0006 + issue #240: the per-session egress proxy is MANDATORY.
  # Every host-agent binds it (TCP/443 SNI allow-listing + DNS
  # filtering); a host that can't stand it up refuses to start. There
  # is no "off" — `port` exists only to dodge a bind collision. The
  # K8s migration (ADR 0044 K5) dropped these env vars when the GCE MIG
  # was retired, silently leaving prod with unfiltered guest egress;
  # this section re-wires them.
  port: 8443
  # Where the CA material loads from. One of:
  #   env                 — read the PEMs from ENGRAM_EGRESS_CA_{CERT,KEY}_PEM,
  #                         injected by the DaemonSet from caEnvSecret (the
  #                         coord-token delivery pattern). RECOMMENDED on GKE:
  #                         host-agents are hostNetwork and bypass Workload
  #                         Identity, so the direct gcp-secret-manager read 403s
  #                         (node SA token lacks the cloud-platform scope). A
  #                         cluster component with proper WI (ESO) syncs the CA
  #                         from Secret Manager into the K8s secret instead.
  #   gcp-secret-manager  — host-agent reads Secret Manager directly via WI.
  #                         Only works where WI is honoured (NOT hostNetwork).
  #   local-disk          — auto-generate a per-host self-signed CA. NOT for a
  #                         migrating fleet: a session teleported to another host
  #                         would no longer trust that host's distinct CA.
  caSource: gcp-secret-manager
  # caSource == env: the K8s secret holding the CA PEMs (mirrored from Secret
  # Manager by a properly-scoped component), and the keys within it. The
  # DaemonSet injects them as ENGRAM_EGRESS_CA_CERT_PEM / _KEY_PEM.
  caEnvSecret: ""
  caEnvCertKey: ENGRAM_EGRESS_CA_CERT_PEM
  caEnvKeyKey: ENGRAM_EGRESS_CA_KEY_PEM
  # caSource == gcp-secret-manager: fully-qualified Secret Manager resource
  # paths (projects/<p>/secrets/<name>/versions/latest).
  caGcpCertSecret: ""
  caGcpKeySecret: ""

storage:
  # Local NVMe for the chunk cache + per-sandbox work dir.
  workDirHostPath: /var/lib/engram
  # "" => host-agent's disk-derived default (ADR 0070): min(60% of the
  # disk backing workDirHostPath, 80% — the same margin the free-space
  # floor holds below the kubelet eviction line). Set to override the
  # ceiling as an absolute byte count.
  chunkCacheBudgetBytes: ""
  # ADR 0070: override the 0.60 disk-fraction the default budget derives
  # from (see chunkCacheBudgetBytes). "" => host-agent default (0.60).
  chunkCacheDiskFraction: ""
  # ADR 0070: the kubelet's ephemeral-storage hard-eviction threshold, as
  # a percent of the filesystem backing workDirHostPath — the line
  # engram_host_disk_headroom_to_kubelet_bytes measures distance to.
  #
  # TODO: 10 (GKE's documented nodefs.available < 10% default) is a
  # PLACEHOLDER pending confirmation against the actual nodepool/kubelet
  # config in the engrams-internal deploy repo — this OSS chart has not
  # verified it against a real cluster's kubelet flags
  # (--eviction-hard/--system-reserved can override the GKE default).
  # Confirm and adjust here before treating the headroom gauge's alarm
  # threshold as trustworthy.
  kubeletEvictPct: 10
  # ADR 0070: mount workDirHostPath on its own block device instead of
  # sharing the node boot disk. "" (default) = today's behavior — a
  # hostPath directory on the root filesystem. When set to a device path
  # (e.g. /dev/nvme1n1, a GKE local-SSD raw-block device), node-prep
  # formats it (idempotent — only if unformatted) and mounts it at
  # workDirHostPath, and the host-agent DaemonSet gets
  # ENGRAM_WORK_DIR_REQUIRE_MOUNTPOINT=true + a read-only hostPath mount
  # of the NODE's `/` at /mnt/host-root (ENGRAM_HOST_ROOT_REF_PATH) —
  # refuses to start unless workDirHostPath is actually a distinct
  # filesystem from the NODE's boot disk (comparing against the
  # container's OWN `/`, its ephemeral overlayfs, would always differ
  # from any hostPath mount and never catch a missing mount — hence the
  # separate host-root reference mount). Guards against a rolled pod
  # starting before the mount is visible and silently shadow-writing the
  # boot disk. This moves ACCOUNTING, not
  # bytes: the dedicated disk still fills, and the budget above (not
  # this) is the mechanism that keeps the fleet off the kubelet's
  # eviction line. Nodepool provisioning of the device itself (e.g. a
  # Terraform local-SSD flag) is out of scope for this chart.
  dedicatedDevice: ""

nbd:
  # ADR 0049: warm-pool slot allocator. node-prep loads the nbd module
  # with `nbdsMax` devices (`modprobe nbd nbds_max=<N>`); the host-agent
  # sizes its slot pool from the kernel's nbds_max (capped at this same
  # value) and keeps `warmSlots` pre-validated slots ready for an O(1)
  # `acquire()`. Total is overridable per deployment — a dense fleet
  # (engrams-internal) runs nbdsMax: 4096. Set nbdsMax: 0 to disable NBD
  # (materialize-to-file fallback).
  nbdsMax: 64
  warmSlots: 64

nodePrep:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  # sysctls node-prep sets (idempotent). The host-agent runs root so
  # unprivileged_userfaultfd isn't strictly required, but we set it so
  # a future non-root handler works, plus ip_forward for guest egress.
  sysctls:
    vm.unprivileged_userfaultfd: "1"
    net.ipv4.ip_forward: "1"

hostAgent:
  grpcPort: 9101
  metricsPort: 9100
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "16"
      memory: 32Gi
  extraEnv: []        # [{name, value}] escape hatch for any ENGRAM_* knob

# Distributed tracing (ADR 0019 / telemetry restoration #526). The K8s host
# fleet (ADR 0044) never got a collector or an OTLP endpoint when the GCE/
# packer fleet (which carried an otelcol systemd unit — see
# deploy/otel/collector-gcp.yaml) was replaced, so host-side spans
# (chunk.fetch, host.restore_base_for_session, restore.*, ...) have
# exported nowhere since the migration. Mirrors the engram chart's `otel`
# block: an in-pod otelcol NATIVE SIDECAR (no readinessProbe — a crashing
# collector must never gate the workload; this is the standing guardrail
# from the coord collector incident). Because the pod is hostNetwork, the
# sidecar binds node-wide 0.0.0.0:4317/4318, so it also serves the
# uffd-handler (inherits the host-agent container's env at spawn — no
# env_clear at the FC spawn site) for free. Cloud-agnostic + inert by
# default; the engrams-internal overlay flips `enabled: true` + supplies
# `collector.configMap` (rendered from deploy/otel/collector-gcp.yaml) +
# grants roles/cloudtrace.agent to the NODE SA (hostNetwork bypasses
# Workload Identity, same gotcha as the egress CA — see `egress` above).
otel:
  enabled: false
  # OTLP/gRPC endpoint the host-agent container exports to. Default = the
  # in-pod sidecar.
  endpoint: "http://localhost:4317"
  collector:
    enabled: true
    # otelcol-contrib (the `googlecloud` exporter is contrib-only). Pinned
    # to the same VERIFIED-good tag as the coord chart — 0.116.0's image
    # ships a dynamically-linked binary on a distroless base missing the
    # glibc loader (`exec: no such file or directory`); 0.111.0 runs.
    # Re-verify `--version` on bump.
    image: "otel/opentelemetry-collector-contrib:0.111.0"
    # Name of an existing ConfigMap with key `config.yaml`, created from
    # deploy/otel/collector-gcp.yaml. Required when collector.enabled.
    configMap: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi
  # In-guest agentd OTLP export (#526 phase 2). When non-empty (and
  # `otel.enabled`), sets ENGRAM_GUEST_OTEL_ENDPOINT on the host-agent:
  # the endpoint rides the FC kernel cmdline (`engram_otel=`) into the
  # guest on COLD boots (capture VMs — restores reuse the snapshot's
  # embedded cmdline), and the host-agent opens a matching tcp pinhole
  # in the host INPUT chain so the guest's dial survives the VM-pool
  # DROP. The guest-reachable collector address is the VM's default
  # gateway — the slot-0 TAP at 10.200.0.1 — and the otelcol sidecar
  # binds 0.0.0.0 under hostNetwork, so the canonical value is
  # "http://10.200.0.1:4317". Empty (default) = no env, no pinhole.
  guestEndpoint: ""

# Metrics scraping. Mirrors the engram chart's `metrics.podMonitoring`:
# on GKE, Google Managed Prometheus scrapes via a `PodMonitoring` CRD
# (samples land in Cloud Monitoring / Monarch on every scrape, so a
# host-agent pod churning — routine on this fleet, ADR 0044 K2/K3 rolls —
# doesn't reset the fleet-wide percentile the way an in-cluster
# Prometheus's per-pod counter would). Operators on self-hosted
# Prometheus should leave this false and scrape the `metrics` named port
# (9100) directly.
metrics:
  podMonitoring:
    enabled: false
    interval: "30s"

# Strategy note: forkd uses `Recreate`-equivalent because the daemon
# holds VM state. We default the DaemonSet to OnDelete so the K3
# operator (ADR 0044) drives drain-gated, node-by-node rollouts rather
# than K8s rolling pods out from under live microVMs.
updateStrategy: OnDelete

operator:
  # ADR 0044 K3: the drain-gated rollout operator. OFF by default until the
  # operator image is published + a coordinatorUrl is set; with it off, the
  # OnDelete DaemonSet must be rolled by hand (drain each host first).
  enabled: false
  image:
    repository: ghcr.io/cortexapps/engrams/host-operator
    tag: main
    pullPolicy: IfNotPresent
  logLevel: info
  # ADR 0048: the operator's OWN ServiceAccount annotations — the Workload
  # Identity binding for `scaler: gke` (a GSA with nodePool/instanceGroupManager
  # perms). Distinct from the top-level `serviceAccount` (the host-agent's
  # engram-fc-host). Empty for noop/dev.
  serviceAccount:
    annotations: {}
    # e.g.: iam.gke.io/gcp-service-account: engram-host-operator@<project>.iam.gserviceaccount.com
  # ADR 0044 K4: node-pool scaler. `noop` logs the desired size only; `gke`
  # resizes a GKE pool via the Container API + Workload Identity (the operator
  # GSA needs container.nodePools.update + compute.instanceGroupManagers.update).
  scaler: noop          # noop | gke
  # Render a HostFleet CR for this release's host-agent DaemonSet (the common
  # case). Set false to manage the CR out-of-band.
  createHostFleet: true
  # Coordinator base URL the operator drives admin endpoints on (REQUIRED when
  # enabled). In-cluster: http://<coord-release>-coordinator:8080
  coordinatorUrl: ""
  # Never drain a node if it would drop the fleet below this many Ready hosts.
  capacityFloor: 1
  # Abort a roll if a drained host still has running sandboxes after this long.
  drainTimeoutSeconds: 600
  resources:
    requests: {cpu: "10m", memory: 64Mi}
    limits: {cpu: "250m", memory: 128Mi}
  # The operator only needs the K8s API + coordinator; keep it off the tainted
  # kvm nodes (default: schedule anywhere untainted).
  nodeSelector: {}

  # ADR 0044 K4 + ADR 0048: node-pool autoscaling. The operator reads
  # coordinator demand and sizes the host node pool — scale-UP via set_size
  # (2D + queue-aware, one-shot), scale-DOWN via the teleport-packed wave
  # (drain the least-loaded nodes onto peers, then remove them). The default
  # scaler (ENGRAM_NODE_POOL_SCALER unset) is a NOOP that only LOGS decisions;
  # set it to "gke" (operator.scaler below) to actuate a real GKE pool.
  autoscaling:
    enabled: false
    nodePool: ""           # the cloud node pool the scaler resizes
    minHosts: 1            # set >= 1 (an empty fleet has no demand signal)
    maxHosts: 10
    targetFreeMib: 16384   # keep ~16 GiB of free guest-RAM headroom
    # ADR 0048 scale-DOWN. off (default) = scale-up only. idleOnly sheds only
    # fully-idle hosts; aggressive teleport-packs live sessions off the
    # least-loaded hosts. The wave is bounded by the two caps below.
    scaleDown: "off"
    scaleDownHysteresisTicks: 3  # enter scale-down only after N agreeing ticks
    maxShedPerWave: 1            # most victim nodes per wave
    maxConcurrentDrains: 1       # most victims drained at once within a tick
