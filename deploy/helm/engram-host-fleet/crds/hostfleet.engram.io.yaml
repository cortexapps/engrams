{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "hostfleets.engram.io"
  },
  "spec": {
    "group": "engram.io",
    "names": {
      "kind": "HostFleet",
      "plural": "hostfleets",
      "shortNames": [
        "hf"
      ],
      "singular": "hostfleet"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.image",
            "name": "Image",
            "type": "string"
          },
          {
            "jsonPath": ".spec.capacityFloor",
            "name": "Floor",
            "type": "integer"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for HostFleetSpec via `CustomResource`",
            "properties": {
              "spec": {
                "properties": {
                  "autoscaling": {
                    "description": "ADR 0044 K4: optional node-pool autoscaling. When set, the operator\npolls the coordinator's fleet demand and resizes the host node pool to\nhold `targetFreeMib` of headroom (scale-up only in v1; drain-gated\nscale-down is a follow-up). With the default noop scaler the operator\nonly *logs* the desired size.",
                    "nullable": true,
                    "properties": {
                      "maxConcurrentDrains": {
                        "default": 1,
                        "description": "ADR 0048: the most victims to DRAIN concurrently within one reconcile.\n1 is the safe default — the coordinator's R8 gate already serialises\nper-host live migrations, so concurrent drains mostly help when many\nvictims are idle (nothing to teleport).",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "maxHosts": {
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "maxShedPerWave": {
                        "default": 1,
                        "description": "ADR 0048: the most victim nodes a single scale-down WAVE may target.\nSmall waves are observable + bound the blast radius; the cost-optimal\ntarget may be much lower, but we approach it a few nodes at a time.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "minHosts": {
                        "description": "Never size the pool below this (set ≥ 1 — an empty fleet has no\ndemand signal to grow from).",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "nodePool": {
                        "description": "The cloud node pool the scaler resizes (actuator-specific identifier,\ne.g. a GKE node-pool name).",
                        "type": "string"
                      },
                      "scaleDown": {
                        "default": "off",
                        "description": "ADR 0045 Phase E: whether the pool may shrink, and how aggressively.\n`off` (default) is K4's scale-up-only behavior. `idleOnly` sheds only a\nfully-idle host; `aggressive` sheds the least-loaded host (sessions\nevacuate). The scale-down *decision* is computed + logged today; live\nnode removal is the follow-up actuator (safe node-specific removal).",
                        "enum": [
                          "off",
                          "idleOnly",
                          "aggressive"
                        ],
                        "type": "string"
                      },
                      "scaleDownHysteresisTicks": {
                        "default": 3,
                        "description": "ADR 0045 Phase E: shed only after the scale-down decision holds for\nthis many minute-sized ticks (anti-flap hysteresis — scale up fast,\nscale down slow). The time-sized tick keeps this stable when the\nscale-up reconcile interval changes.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "targetFreeMib": {
                        "description": "Keep at least this much free guest-RAM (MiB) across the fleet.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "type": "integer"
                      }
                    },
                    "required": [
                      "maxHosts",
                      "minHosts",
                      "nodePool",
                      "targetFreeMib"
                    ],
                    "type": "object"
                  },
                  "capacityFloor": {
                    "default": 0,
                    "description": "Never drain a node if doing so would drop the fleet below this many\nschedulable (Ready) hosts. Draining evacuates live sessions onto\npeers, so there must always be receiving capacity.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "coordinatorUrl": {
                    "description": "Base URL of the coordinator (e.g. `http://engram-coordinator:8080`).\nThe operator drives cordon/drain on `/api/admin/...` and polls the\ndrain gate on `/api/hosts/:id`.",
                    "type": "string"
                  },
                  "daemonSet": {
                    "description": "Namespace + name of the host-agent DaemonSet this fleet manages.",
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "namespace": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "name",
                      "namespace"
                    ],
                    "type": "object"
                  },
                  "drainTimeoutSeconds": {
                    "default": 600,
                    "description": "Seconds to wait for a drained host's `running_sandboxes` to reach 0\nbefore aborting the roll (leaving the pod in place).",
                    "format": "uint64",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "enableWorkTimeoutSeconds": {
                    "default": 5400,
                    "description": "ADR 0088: seconds the image roll waits (post-cordon, pre-pod-delete)\nfor the host's in-flight enable work — a live materialize or a\nbase-snapshot capture — to finish before killing the host-agent pod.\nThe cordon stops NEW work arriving, so this waits out at most the\ntail of what is already running (a dev-brain materialize ~55-90 min;\na capture = its warm timeout + freeze). On timeout the roll proceeds\nLOUDLY (the enable's durable-job retry remains the backstop — the\npre-0088 behavior, demoted to rare fallback). `0` disables the gate.",
                    "format": "uint64",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "image": {
                    "description": "Target host-agent container image (digest-pinned in prod). A change\nhere is what the operator rolls — never a registry-tag move.",
                    "type": "string"
                  },
                  "nodeAssetsImage": {
                    "description": "Target node-assets image (the `stage-node-assets` init container,\nADR 0044 GAP 2). Rolled together with `image`: both ride the pod\n(per-pod emptyDir), so there's no swap under a live VM.",
                    "type": "string"
                  }
                },
                "required": [
                  "coordinatorUrl",
                  "daemonSet",
                  "image",
                  "nodeAssetsImage"
                ],
                "type": "object"
              },
              "status": {
                "description": "Reported progress. v1 leaves this for `kubectl` visibility; the operator\nlogs decisions and (future) writes the roll state here for a status-driven\nstate machine.",
                "nullable": true,
                "properties": {
                  "message": {
                    "description": "Last action / blocker, human-readable.",
                    "type": "string"
                  },
                  "rolledNodes": {
                    "description": "Pods already on the target images.",
                    "format": "int32",
                    "type": "integer"
                  },
                  "rollingNode": {
                    "description": "The node currently being rolled, if any.",
                    "nullable": true,
                    "type": "string"
                  },
                  "totalNodes": {
                    "description": "Total host-agent pods observed.",
                    "format": "int32",
                    "type": "integer"
                  }
                },
                "required": [
                  "message",
                  "rolledNodes",
                  "totalNodes"
                ],
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "HostFleet",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
