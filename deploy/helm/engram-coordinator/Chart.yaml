apiVersion: v2
name: engram-coordinator
description: |
  Engram coordinator — stateless HTTP+WS service that schedules sessions
  across a fleet of Firecracker host-agents. Designed to deploy
  cloud-agnostic; cloud-specific bindings (Workload Identity, secret
  providers, LB annotations) live in `values-*.yaml.example` overlays.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - engram
  - firecracker
  - microvm
sources:
  - https://github.com/cortexapps/engrams
maintainers:
  - name: Cortex
