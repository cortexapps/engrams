name = "dev-engrams"
description = "Dogfooding image (ADR 0023): the Claude harness + the toolchain to build/test engrams' product plane + the built-in create-pull-request skill. A session of this image builds engrams itself and opens a PR via the in-session forge seam — credentials are brokered by the platform, never baked in."

# Built-in Claude harness (ADR 0021). Must match the version published by
# .github/workflows/bake-harness-claude.yml; the baker pulls exactly this tag.
[harness]
builtin = "claude"
version = "v0.1.0"

# ADR 0023: in-session git forge. The credential is a GitHub App
# installation token for the `cortexapps` org — it works across *all*
# repos the installation can access (not pinned to one repo); the agent
# picks the PR target per request. No GITHUB_TOKEN is baked into the
# image. The coordinator must run with `--git-forge=github` + the App key.
[git]
provider = "github"
owner = "cortexapps"

# Default-deny egress; allow exactly what an engrams build + the git
# handoff need. github.com / codeload / *.githubusercontent.com for
# clone+push; crates.io mirrors for `cargo`; anthropic for the harness.
[network]
default = "deny"
allow_hosts = [
    "github.com",
    "api.github.com",
    "codeload.github.com",
    "objects.githubusercontent.com",
    "crates.io",
    "static.crates.io",
    "index.crates.io",
    "api.anthropic.com",
    "statsig.anthropic.com",
]
allow_host_patterns = ["*.githubusercontent.com"]
