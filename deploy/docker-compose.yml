services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports:
      # Host-side port shifted off the default 5432 so it doesn't
      # collide with a system Postgres a developer may already run.
      # Container-internal port stays at 5432.
      - "5435:5432"
    volumes:
      - engram-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local OCI registry for dev. Anonymous pull/push over plaintext HTTP.
  # Engram's OCI client allows HTTP only when the registry host is a
  # loopback address, so this is safe-by-construction for dev only.
  # `engram image build --push localhost:5000/cortex/api` lands here;
  # `engram session create --image localhost:5000/cortex/api:warm-X`
  # pulls from here on the host-agent side.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - engram-registry-data:/var/lib/registry

  coordinator:
    build:
      context: ..
      dockerfile: docker/coordinator.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-to-container DB hop stays on Postgres' default port.
      DATABASE_URL: postgres://engram:engram@postgres:5432/engram
      # Coordinator listens on 8090 inside its container; the host-side
      # mapping below exposes it on 8090 too, matching `just dev`.
      ENGRAM_BIND_ADDR: 0.0.0.0:8090
      ENGRAM_MODE: all
      ENGRAM_CLOUD_BACKEND: static
      ENGRAM_STORAGE_BACKEND: local
      ENGRAM_STORAGE_LOCAL_PATH: /var/engram/snapshots
      # KEK for envelope-encrypted registry credentials. The host's
      # `.env` (loaded by `just bootstrap`) provides the value; we
      # forward it into the container. Hard-fails at startup if
      # missing — encrypting against a missing key has worse failure
      # modes than refusing to start.
      ENGRAM_KEK_MASTER_KEY: ${ENGRAM_KEK_MASTER_KEY:?run `just bootstrap` first to generate a KEK}
      RUST_LOG: info,engram=debug
    ports:
      - "8090:8090"
    volumes:
      - engram-snap-data:/var/engram/snapshots

volumes:
  engram-pg-data:
  engram-snap-data:
  engram-registry-data:
