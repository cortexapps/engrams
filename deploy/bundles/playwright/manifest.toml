# ADR 0027/0055: pinned versions for the `playwright` RO bundle. build.sh reads
# NODE_VERSION / PLAYWRIGHT_CLI_VERSION from the environment, defaulting to
# these. Bump here + in build.sh's defaults together; a bundle roll (new
# content-addressed squashfs staged on the fleet) ships fleet-wide via an
# FC-host re-bake — no session-image re-bake.
#
# ADR 0055: this is a profile-selected skill, not a per-image attachment. At
# session create the coordinator resolves the "playwright" name to its staged
# content sha, assigns it a reserved slot, and `patch_drive`s it into a dynamic
# mount (`/opt/engram/dyn/<i>`). The in-squashfs `mount.json` (not this file)
# declares the `show-your-work` skill + the `playwright-cli` wrapper bin that
# agentd symlinks onto PATH; the guest mount path is dynamic, not fixed here.
name = "playwright"
description = "chromium-headless-shell + @playwright/cli + Node, glibc-linked, self-contained."

[versions]
node = "20.18.1"
playwright_cli = "0.1.13"
# chromium-headless-shell revision is pinned transitively by @playwright/cli's
# bundled playwright-core — `playwright-cli install-browser chromium-headless-shell`
# resolves it deterministically for the pinned CLI version.
