# ADR 0027: pinned versions for the `playwright` RO bundle. build.sh reads
# NODE_VERSION / PLAYWRIGHT_CLI_VERSION from the environment, defaulting to
# these. Bump here + in build.sh's defaults together; a bundle roll (new
# squashfs at the fleet-canonical path) ships fleet-wide via an FC-host
# re-bake — no session-image re-bake.
name = "playwright"
description = "chromium-headless-shell + @playwright/cli + Node, glibc-linked, self-contained."

[versions]
node = "20.18.1"
playwright_cli = "0.1.13"
# chromium-headless-shell revision is pinned transitively by @playwright/cli's
# bundled playwright-core — `playwright-cli install-browser chromium-headless-shell`
# resolves it deterministically for the pinned CLI version.

[guest]
mount = "/opt/engram/browser"
# The agent drives the browser via the `playwright-cli` wrapper (symlinked
# onto PATH by agentd); it bakes in the headless-shell config + runtime env.
wrapper = "/opt/engram/browser/bin/playwright-cli"
config = "/opt/engram/browser/cli.config.json"
