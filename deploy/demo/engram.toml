name = "demo"
description = "Canonical workspace image: debian:bookworm-slim + git + ttyd. ADR 0062: the image bakes NO harness — the harness is a per-session selection (the built-in `claude` rides the fleet stamp; custom harnesses are uploaded via RegisterHarness), so a session selects `harness = \"claude\"` to run the Claude agent, or `dev_vm` mode for a shell-only / dev-VM workload. This image is just the workspace + egress allow-list."

# Image-level secret declarations are for things the *workspace* needs
# (e.g. NPM_TOKEN for `npm install`, GITHUB_TOKEN for `git push`).
# Harness credentials (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY) are NOT
# declared here — they ride one layer above (the harness descriptor's
# auth slots) and are injected per session.
#
# Add entries like the example below when your project actually
# needs them; the demo image declares none.
#
# [secrets.GITHUB_TOKEN]
# required = false
# allow_hosts = ["github.com", "api.github.com"]
# description = "Personal access token for git push / GitHub API"

# Egress hints. Today these are advisory (broker mode isn't wired);
# the demo allows the npm registry so a project's `npm install`
# can run during the agent's workflow if the workspace wants it.
[network]
default = "deny"
allow_hosts = [
    "registry.npmjs.org",
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "statsig.anthropic.com",
]

# ADR 0048: an enabled image must declare its vCPU count — placement
# reserves it against the host's CPU budget so packing has a CPU bound.
[resources]
suggested_vcpus = 4
