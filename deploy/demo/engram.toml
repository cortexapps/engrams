name = "demo"
description = "Harness-neutral starter image: debian:bookworm-slim + git + ttyd. Sessions of this image have no agent driving them (ADR 0021 P1.3: no `[harness]` block → `resolve_harness` returns None → coord passes an empty-argv AgentSpec → agentd hits its readiness-probe branch and never execs a harness child). Useful as a base for custom-harness authors who bring their own binary, and for shell-only / dev-VM workloads. For the default Claude-backed session see `deploy/demo-claude/` (same OS + tooling plus a baked [harness] = claude block)."

# Image-level secret declarations are for things the *workspace* needs
# (e.g. NPM_TOKEN for `npm install`, GITHUB_TOKEN for `git push`).
# This image has no `[harness]` block, so there are no harness-level
# secrets to declare here. When you bring your own harness, do it in
# a sibling source dir (copy this one, add the binary + a `[harness]`
# block in your `engram.toml`, point your bake at it).
#
# Add entries like the example below when your project actually
# needs them; the demo image declares none.
#
# [secrets.GITHUB_TOKEN]
# required = false
# allow_hosts = ["github.com", "api.github.com"]
# description = "Personal access token for git push / GitHub API"

# Egress hints. Today these are advisory (broker mode isn't wired);
# the demo allows the npm registry so a project's `npm install`
# can run during the agent's workflow if the workspace wants it.
[network]
default = "deny"
allow_hosts = [
    "registry.npmjs.org",
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "statsig.anthropic.com",
]

# ADR 0048: an enabled image must declare its vCPU count — placement
# reserves it against the host's CPU budget so packing has a CPU bound.
[resources]
vcpus = 2
