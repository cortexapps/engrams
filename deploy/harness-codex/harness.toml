name = "codex"
label = "Codex"
description = "OpenAI Codex coding agent. Human runs use a managed ChatGPT connection; programmatic runs use an organization API key."
exec = "harness"

# Hosts the harness itself must reach (ADR 0063 addendum): api.openai.com for
# API-key runs, chatgpt.com for ChatGPT-token runs.
[egress]
allow_hosts = ["api.openai.com", "chatgpt.com"]

[auth]
org_env = "CODEX_API_KEY"
org_env_hint = "An admin sets an org secret named CODEX_API_KEY (an OpenAI API key). It authenticates service-account, cron, and API-triggered sessions. Human-owned Slack tasks use that user's connection."
user_env_hint = "Connect your ChatGPT account in Settings → Credentials. Personal and managed workspaces are supported; Enterprise admins must enable device-code login."

[auth.user_oauth]
provider = "openai-codex"
delivery = "opaque_bundle"

# Picker-visible catalog returned by the pinned Codex app-server's `model/list`.
# Keep this snapshot in lockstep with the CLI pin in fetch-codex.sh.
[[models]]
id = "gpt-5.6-sol"
label = "GPT-5.6 Sol"
default = true
env = { ENGRAM_CODEX_MODEL = "gpt-5.6-sol" }

[[models]]
id = "gpt-5.6-terra"
label = "GPT-5.6 Terra"
env = { ENGRAM_CODEX_MODEL = "gpt-5.6-terra" }

[[models]]
id = "gpt-5.6-luna"
label = "GPT-5.6 Luna"
env = { ENGRAM_CODEX_MODEL = "gpt-5.6-luna" }

[[models]]
id = "gpt-5.5"
label = "GPT-5.5"
env = { ENGRAM_CODEX_MODEL = "gpt-5.5" }

[[models]]
id = "gpt-5.4"
label = "GPT-5.4"
env = { ENGRAM_CODEX_MODEL = "gpt-5.4" }

[[models]]
id = "gpt-5.4-mini"
label = "GPT-5.4 Mini"
env = { ENGRAM_CODEX_MODEL = "gpt-5.4-mini" }

[[models]]
id = "gpt-5.3-codex-spark"
label = "GPT-5.3 Codex Spark"
env = { ENGRAM_CODEX_MODEL = "gpt-5.3-codex-spark" }

[[effort]]
id = "medium"
label = "Medium"
default = true
env = { ENGRAM_CODEX_EFFORT = "medium" }

[[effort]]
id = "low"
label = "Low"
env = { ENGRAM_CODEX_EFFORT = "low" }

[[effort]]
id = "high"
label = "High"
env = { ENGRAM_CODEX_EFFORT = "high" }

[[effort]]
id = "xhigh"
label = "Extra High"
env = { ENGRAM_CODEX_EFFORT = "xhigh" }
