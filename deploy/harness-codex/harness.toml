name = "codex"
label = "Codex"
description = "OpenAI Codex coding agent. Human runs use a ChatGPT-backed access token; programmatic runs use an organization API key."
exec = "harness"

# Hosts the harness itself must reach (ADR 0063 addendum): api.openai.com for
# API-key runs, chatgpt.com for ChatGPT-token runs.
[egress]
allow_hosts = ["api.openai.com", "chatgpt.com"]

[auth]
org_env = "CODEX_API_KEY"
org_env_hint = "An admin sets an org secret named CODEX_API_KEY (an OpenAI API key). It authenticates programmatic runs — Slack, cron, and API-triggered sessions."
user_env = "CODEX_ACCESS_TOKEN"
# Setup instructions shown on the settings + create surfaces.
user_env_hint = "Sign in with `codex login`, then paste the access token from ~/.codex/auth.json. It's required before you can start an interactive Codex session."

[[models]]
id = "gpt-5.6"
label = "GPT-5.6"
default = true
env = { ENGRAM_CODEX_MODEL = "gpt-5.6" }

[[models]]
id = "gpt-5.6-terra"
label = "GPT-5.6 Terra"
env = { ENGRAM_CODEX_MODEL = "gpt-5.6-terra" }

[[models]]
id = "gpt-5.6-luna"
label = "GPT-5.6 Luna"
env = { ENGRAM_CODEX_MODEL = "gpt-5.6-luna" }

[[effort]]
id = "medium"
label = "Medium"
default = true
env = { ENGRAM_CODEX_EFFORT = "medium" }

[[effort]]
id = "low"
label = "Low"
env = { ENGRAM_CODEX_EFFORT = "low" }

[[effort]]
id = "high"
label = "High"
env = { ENGRAM_CODEX_EFFORT = "high" }

[[effort]]
id = "xhigh"
label = "Extra High"
env = { ENGRAM_CODEX_EFFORT = "xhigh" }
