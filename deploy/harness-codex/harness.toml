name = "codex"
label = "Codex"
description = "OpenAI Codex coding agent. Human runs use a managed ChatGPT connection; programmatic runs use an organization API key."
exec = "harness"
router_protocols = ["openai_responses"]

# Native OpenAI hosts (ADR 0117): api.openai.com for
# API-key runs, chatgpt.com for ChatGPT-token runs, and auth.openai.com so a
# ChatGPT access token can be REFRESHED in the guest. Codex refreshes at
# auth.openai.com/oauth/token and rewrites its auth cache; the harness watcher
# then pushes the new bundle back (ForgeOp::UpdateOAuthCredential). Without this
# host the refresh cannot complete, so the stored bundle rots and every turn
# fails with 401 token_expired once the access token expires. There is no
# server-side repair: the refresh scanner covers connector subjects only, so
# this in-guest loop is the ONLY refresh path a user credential has.
[native_egress]
allow_hosts = ["api.openai.com", "auth.openai.com", "chatgpt.com"]

[auth]
org_env = "CODEX_API_KEY"
org_env_hint = "An admin sets an org secret named CODEX_API_KEY (an OpenAI API key). It authenticates service-account, cron, and API-triggered sessions. Human-owned Slack tasks use that user's connection."
user_env_hint = "Connect your ChatGPT account in Settings → Credentials. Personal and managed workspaces are supported; Enterprise admins must enable device-code login."

[auth.user_oauth]
provider = "openai-codex"
delivery = "opaque_bundle"

# Model options are model families (Sol, Astra, Luna), not pinned model ids.
# Codex has no family alias, so each option maps its family to the current
# model id in the pinned CLI's catalog (fetch-codex.sh). When a new model of a
# family ships, change only its ENGRAM_CODEX_MODEL value; the option ids do
# not change, so stored selections stay valid. ENGRAM_CODEX_MODEL must stay an
# exact model id: the harness reports it as the generation's model.
[[models]]
id = "sol"
label = "GPT Sol"
default = true
env = { ENGRAM_CODEX_MODEL = "gpt-6.1-sol" }

[[models]]
id = "astra"
label = "GPT Astra"
env = { ENGRAM_CODEX_MODEL = "gpt-6-astra" }

[[models]]
id = "luna"
label = "GPT Luna"
env = { ENGRAM_CODEX_MODEL = "gpt-6-luna" }

# Session modes (ADR 0107). Pure declaration: mode selection rides prompts
# (harness_mode) and the harness maps `plan` to a read-only turn sandbox plus
# the injected exit_plan_mode tool.
[[modes]]
id      = "default"
label   = "Build"
default = true

[[modes]]
id    = "plan"
label = "Plan"

[[effort]]
id = "medium"
label = "Medium"
default = true
env = { ENGRAM_CODEX_EFFORT = "medium" }

[[effort]]
id = "low"
label = "Low"
env = { ENGRAM_CODEX_EFFORT = "low" }

[[effort]]
id = "high"
label = "High"
env = { ENGRAM_CODEX_EFFORT = "high" }

[[effort]]
id = "xhigh"
label = "Extra High"
env = { ENGRAM_CODEX_EFFORT = "xhigh" }
