# Attestation for the pinned claude CLI (ADR 0052, 2026-08-20 update).
#
# CI asserts `version` here matches the CLAUDE_VERSION pin in ci.yml /
# bake-images.yml (and the justfile keeps lockstep by convention), so a
# pin bump that skips the re-probe fails the build. A version's binary
# is immutable, so behavior drift can only enter at a bump — this file
# is the loud gate the 2.1.187 AskUserQuestion removal (engrams#431)
# never had.
#
# To bump the pin:
#   1. python3 scripts/claude-steer-probe.py <new binary>  → must STEER
#   2. re-verify the ADR 0107 deferred-tool spine on the dev stack
#      (defer parks the turn, --resume re-fires id-stable, the MCP
#      bridge serves the stash)
#   3. update the four CLAUDE_VERSION pin sites + this file, same PR

version = "2.1.228"
probed_on = "2026-08-20"

# scripts/claude-steer-probe.py verdict: a user message injected while
# a tool call is in flight is attended at the next step boundary INSIDE
# the running turn (exit 0, STEER). Also verified on 2.1.237.
steering = "steer"

# The 2026-06-16 measurement that still holds: a message injected
# mid-GENERATION (no tool step boundary remaining) runs as the next
# turn at the boundary. Write-through steering is step-boundary
# steering; the harness's turn accounting must handle both shapes.
mid_generation = "buffer"
