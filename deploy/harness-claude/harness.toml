# ADR 0062/0063: the built-in Claude harness descriptor.
#
# Two homes (per-harness-bundle model): (a) embedded in the coordinator binary as
# the built-in `claude` descriptor (`builtin_harness.rs`), and (b) shipped at the
# root of the harness-claude squashfs (baked into the FC-host image via
# node-assets, alongside the `harness` entry binary + the bundled `claude` CLI). A
# session that selects `claude` mounts that squashfs on dyn_0 and execs
# /opt/engram/dyn/0/harness. Replaces the old artifact.toml.

name  = "claude"
label = "Claude Code"
description = "Anthropic's Claude Code agent. Needs an ANTHROPIC_API_KEY org secret for programmatic runs; human runs use a per-user Claude token."
router_protocols = ["anthropic_messages"]

# Launch contract (coordinator-internal): the entry binary at the root of this
# harness's squashfs. argv[0] = /opt/engram/dyn/0/harness; the SDK dial flags
# (--vsock-host / --connect, --session-id) are appended by the coordinator.
exec = "harness"

# Hosts the harness must always reach (ADR 0117). Native Anthropic model egress
# is separate so routed launches do not receive it.
[egress]
allow_hosts = ["statsig.anthropic.com"]

[native_egress]
allow_hosts = ["api.anthropic.com"]

[auth]
# Programmatic / org credential (Slack triggers, cron, API) — resolved host-side
# from an org secret named ANTHROPIC_API_KEY (ADR 0063 §4).
org_env  = "ANTHROPIC_API_KEY"
org_env_hint = "An admin sets an org secret named ANTHROPIC_API_KEY (an Anthropic API key). It authenticates programmatic runs — Slack, cron, and API-triggered sessions."
# Human / interactive credential — the per-user Claude Code OAuth token.
user_env = "CLAUDE_CODE_OAUTH_TOKEN"
# Setup instructions shown on the settings + create surfaces.
user_env_hint = "Run `claude setup-token` on your machine and paste the token it prints. It's required before you can start an interactive Claude session."

# Model options are Claude Code family aliases, not pinned ids. The bundled
# `claude` CLI resolves each alias to the latest model of that family, so a
# CLI bump moves every option forward and the option ids never change. The
# generation events still report the resolved model id.
[[models]]
id      = "opus"
label   = "Claude Opus"
default = true
env     = { ANTHROPIC_MODEL = "opus" }

[[models]]
id    = "fable"
label = "Claude Fable"
env   = { ANTHROPIC_MODEL = "fable" }

[[models]]
id    = "sonnet"
label = "Claude Sonnet"
env   = { ANTHROPIC_MODEL = "sonnet" }

[[models]]
id    = "haiku"
label = "Claude Haiku"
env   = { ANTHROPIC_MODEL = "haiku" }

# Session modes (ADR 0107). Pure declaration: mode selection rides prompts
# (harness_mode) and the harness maps `plan` to `--permission-mode plan`.
[[modes]]
id      = "default"
label   = "Build"
default = true

[[modes]]
id    = "plan"
label = "Plan"

# Effort maps to Claude Code's own thinking-budget knob (MAX_THINKING_TOKENS) —
# an opaque-to-the-API harness env, which is exactly what the descriptor exists
# to abstract.
[[effort]]
id      = "medium"
label   = "Medium"
default = true
env     = { MAX_THINKING_TOKENS = "16000" }

[[effort]]
id    = "high"
label = "High"
env   = { MAX_THINKING_TOKENS = "32000" }

[[effort]]
id    = "low"
label = "Low"
env   = { MAX_THINKING_TOKENS = "4000" }
