###############################################################################
# Local-dev infrastructure: Postgres + the OCI registry.
#
# This file is the dev-loop's source of truth — Tilt's `docker_compose()`
# pulls these services in and the coordinator runs locally via `cargo
# run` for fast iteration. Production deploys go through a Helm chart
# (not this file); deliberately splitting the two paths so the dev
# compose file stays small and obvious.
#
# Direct usage (without Tilt):
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml down
###############################################################################

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports:
      # Host-side port shifted off the default 5432 so it doesn't
      # collide with a system Postgres a developer may already run.
      # Container-internal port stays at 5432.
      - "5435:5432"
    volumes:
      - engram-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local OCI registry for dev. Anonymous pull/push over plaintext HTTP.
  # Engram's OCI client allows HTTP only when the registry host is a
  # loopback address, so this is safe-by-construction for dev only.
  # `engram image build --push localhost:5001/cortex/api` lands here;
  # `engram session create --image localhost:5001/cortex/api:warm-X`
  # pulls from here on the host-agent side.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      # Host-side port shifted off 5000 because macOS's AirPlay
      # Receiver (System Settings → AirDrop & Handoff) squats on
      # 5000 by default — the resulting bind error is one of the
      # most common dev-onboarding hiccups. Container-internal port
      # stays at 5000 since registry:2's defaults expect it.
      - "5001:5000"
    volumes:
      - engram-registry-data:/var/lib/registry

  # GCS emulator for cold-tier blob durability (ADR 0005 / Stage 4).
  # `fake-gcs-server` speaks the GCS JSON API over plaintext HTTP on
  # port 4443; the Rust SDK rewrites endpoints to it whenever
  # `STORAGE_EMULATOR_HOST=http://localhost:4443` is in scope. Used by
  # `just dev` so the cold-tier flush primitive (Stage 5) can be
  # exercised end-to-end without GCP credentials.
  #
  # `-public-host` makes pre-signed URLs / metadata point at the
  # host-side address rather than the container hostname, which the
  # SDK can't reach.
  #
  # This base definition uses bridge networking with a published port
  # so it works on macOS (Docker Desktop runs containers inside a
  # Linux VM; `network_mode: host` would bind 4443 inside *that* VM
  # and leave it unreachable from the Mac host — `just dev` would
  # then fail at `seed-buckets` with "fake-gcs-server not reachable").
  #
  # On the Linux dev-vm the host-agent writes iptables rules that can
  # collide with docker's port-publishing DNAT; there,
  # `docker-compose.linux.yml` overrides this service back to
  # `network_mode: host`. See that file for the full rationale.
  # Profile-gated (`local-gcs`) so the Tiltfile can opt out of starting
  # its own emulator. The Tiltfile probes STORAGE_EMULATOR_HOST at parse
  # time: if an external fake-gcs-server is already up (e.g. shared from
  # another env), it leaves this profile inactive — starting a second
  # emulator would only collide on :4443 and cascade the whole stack to
  # failure. With no external one found, it activates the profile and
  # this service comes up as usual.
  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.54.0
    profiles: ["local-gcs"]
    restart: unless-stopped
    ports:
      - "4443:4443"
    volumes:
      - engram-fake-gcs-data:/data
    command: >
      -scheme http
      -host 0.0.0.0
      -port 4443
      -public-host localhost:4443
      -data /data

  # Jaeger all-in-one — OTLP trace collector + UI for ADR 0019 cold-boot
  # tracing. The engram binaries export here when
  # `OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317` is set
  # (engram-telemetry uses OTLP/gRPC); inert otherwise. `just dev`
  # wires that env for you.
  #
  # Bridge-mode published ports work identically on macOS (Docker
  # Desktop) and the Linux dev-vm, so this is the one OS-agnostic shape.
  # On Linux there's the same ordering caveat as postgres/registry: this
  # must come up BEFORE engram-host-agent writes its iptables rules, or
  # docker's DNAT for the published ports collides with the host-agent's
  # FORWARD/PREROUTING entries (see the fake-gcs-server note above).
  # `just dev` satisfies this: compose services come up (Tilt resource
  # deps) before the host-agent writes its iptables rules.
  #
  # Trace storage is in-memory (no volume) — fine for dev; a restart
  # drops collected traces, which is what we want between runs.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      # all-in-one >=1.35 gates the OTLP receivers behind this flag.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # web UI → http://localhost:16686
      - "4317:4317"     # OTLP gRPC — engram-telemetry's exporter target
      - "4318:4318"     # OTLP HTTP — for any other OTLP tooling

volumes:
  engram-pg-data:
  engram-registry-data:
  engram-fake-gcs-data:
