name = "demo-claude"
description = "Canonical workspace image (ADR 0062: harness-free). The Claude harness is no longer baked into the image — it's chosen per session from the harness catalog (RegisterHarness) and mounted on dyn_0. This image is just the workspace + egress allow-list; a session selects `harness = \"claude\"` to run the Claude agent."

# ADR 0062: NO [harness] block. The harness is a per-session selection resolved
# from the coordinator's harness catalog, not baked into the rootfs. Register a
# harness (e.g. the published harness-claude OCI artifact) via RegisterHarness,
# then create a session with `harness = "claude"`.
#
# Image-level secrets the *workspace* needs (e.g. NPM_TOKEN for npm install,
# GITHUB_TOKEN for git push) still live here. Harness credentials
# (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY) ride one layer above and the web
# form asks for them at session-create time.

[network]
default = "deny"
allow_hosts = [
    "registry.npmjs.org",
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "statsig.anthropic.com",
]

# ADR 0048: an enabled image must declare its vCPU count — placement
# reserves it against the host's CPU budget so packing has a CPU bound.
[resources]
suggested_vcpus = 2
