# Engram OpenTelemetry Collector config — GCP (ADR 0019).
#
# One config, deployed two ways (both K8s-native NATIVE SIDECARS — no
# readinessProbe, so a crashing collector never gates the workload it
# rides with; that's a standing guardrail from a 2026-05-27 incident
# where a probed sidecar 502'd prod coord):
#   • Coordinator (GKE Deployment): an `otelcol` sidecar in the coord pod
#     (deploy/helm/engram/templates/deployment.yaml, mounted from a
#     ConfigMap rendered from this file).
#   • FC host fleet (GKE DaemonSet, ADR 0044): an `otelcol` sidecar in the
#     host-agent pod (deploy/helm/engram-host-fleet/templates/
#     host-agent.daemonset.yaml, same ConfigMap shape). Because the pod is
#     hostNetwork, the `0.0.0.0:4317` bind below also serves the
#     uffd-handler (inherits the host-agent container's env at spawn) and,
#     once the guest->collector firewall pinhole lands (deferred,
#     prototype-first), the in-guest agentd.
#
# The GCE/packer-baked FC-host image (a systemd `otelcol` unit installed by
# a provisioner script) predates the ADR 0044 K8s host-fleet migration and
# no longer exists in this tree — telemetry restoration (#526) replaced it
# with the DaemonSet sidecar above rather than reintroducing packer.
#
# Receives OTLP from the local emitters and exports traces to Google Cloud
# Trace via the `googlecloud` exporter (otelcol-contrib). The only
# provider-specific piece is the exporter — an AWS variant swaps in
# `awsxray` (deploy/otel/collector-aws.yaml, future).
#
# Auth: the `googlecloud` exporter uses ADC. The coord sidecar gets it via
# the pod's Workload-Identity SA. The host-fleet sidecar does NOT — the
# host-agent pod is hostNetwork, which bypasses Workload Identity, so ADC
# resolves to the underlying NODE SA instead (the same failure mode
# documented for the egress CA delivery, `engram-host-fleet/values.yaml`'s
# `egress.caSource` block); the node SA must be granted
# roles/cloudtrace.agent directly (engrams-internal follow-up). The GCP
# project is auto-detected from ADC in both cases.

receivers:
  otlp:
    protocols:
      grpc:
        # 0.0.0.0 so the in-guest agentd can reach the host's collector at
        # its TAP gateway IP (`<gateway>:4317`), and host-agent at localhost.
        # In the coord sidecar this is pod-local. NOTE: on FC hosts this is
        # reachable by the (untrusted) guest, which could forge/spam spans —
        # acceptable for the canary; revisit with a per-sandbox restriction
        # or a guest auth token before broad rollout.
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound collector memory so a fleet-wide cold-boot span storm can't OOM a
  # host alongside Firecracker. Drops/refuses over the soft limit.
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  googlecloud:
    # project + creds via ADC (instance SA / WI SA). Default endpoint is
    # cloudtrace.googleapis.com.
    trace: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [googlecloud]
  telemetry:
    logs:
      level: warn
