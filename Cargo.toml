[workspace]
resolver = "2"
members = [
    "crates/engram-core",
    "crates/engram-protocol",
    "crates/engram-coordinator",
    "crates/engram-host-agent",
    "crates/engram-host-operator",
    "crates/engram-chunk-store",
    "crates/engram-image-builder",
    "crates/engram-publish-builtin-harness",
    "crates/engram-cli",
    "crates/engram-agentd",
    "crates/engram-uffd-handler",
    "crates/engram-telemetry",
    "crates/engram-sandbox-firecracker",
    "crates/engram-sandbox-process",
    "crates/engram-sandbox-vz",
    "crates/engram-session-bundles",
    "crates/engram-mount-manifest",
    "crates/engram-cloud-gcp",
    "crates/engram-cloud-static",
    "crates/engram-cloud-mock",
    "crates/engram-harness-claude",
    "crates/engram-harness-noop",
    "crates/engram-harness-proto",
    "crates/engram-migrate-proto",
    "crates/engram-transport",
    "crates/engram-secrets-dev",
    "crates/engram-secrets-gcp",
    "crates/engram-git-dev",
    "crates/engram-git-github",
    "crates/engram-postgres",
    "crates/engram-egress-proxy",
    "crates/engram-crypto",
    "crates/engram-oci",
    "crates/engram-oci-auth",
    "crates/engram-storage-local",
    "crates/engram-storage-s3",
    "crates/engram-storage-gcs",
    "workspace-hack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cortex/engram"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# kubernetes — ADR 0044 K3 host-fleet rollout operator (engram-host-operator).
# rustls (not openssl) to match reqwest's TLS choice; "latest" k8s-openapi
# feature since the operator is the sole consumer.
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
# ADR 0045 C2: peer page-channel payload compression. Pure Rust on
# purpose — the uffd-handler's musl build must not grow a C dep.
lz4_flex = "0.11"
# v4: blake3 for the page-channel wire integrity — cryptographic at
# ~1-2 GB/s WITHOUT hardware support (the fleet has no SHA-NI; soft
# sha256 of the payload was ~1.2 ms per serve, the dominant encode leg).
blake3 = "1"
# schemars is required by kube's CustomResource derive (CRD schema gen).
schemars = "0.8"
# internal
engram-core = { path = "crates/engram-core" }
engram-protocol = { path = "crates/engram-protocol" }
engram-postgres = { path = "crates/engram-postgres" }
engram-sandbox-firecracker = { path = "crates/engram-sandbox-firecracker" }
engram-sandbox-vz = { path = "crates/engram-sandbox-vz" }
engram-cloud-gcp = { path = "crates/engram-cloud-gcp" }
engram-cloud-static = { path = "crates/engram-cloud-static" }
engram-cloud-mock = { path = "crates/engram-cloud-mock" }
engram-harness-noop = { path = "crates/engram-harness-noop" }
engram-harness-proto = { path = "crates/engram-harness-proto" }
engram-migrate-proto = { path = "crates/engram-migrate-proto" }
engram-transport = { path = "crates/engram-transport" }
engram-host-agent = { path = "crates/engram-host-agent" }
engram-sandbox-process = { path = "crates/engram-sandbox-process" }
engram-session-bundles = { path = "crates/engram-session-bundles" }
engram-mount-manifest = { path = "crates/engram-mount-manifest" }
engram-secrets-dev = { path = "crates/engram-secrets-dev" }
engram-secrets-gcp = { path = "crates/engram-secrets-gcp" }
engram-git-dev = { path = "crates/engram-git-dev" }
engram-git-github = { path = "crates/engram-git-github" }
engram-image-builder = { path = "crates/engram-image-builder" }
engram-agentd = { path = "crates/engram-agentd" }
engram-uffd-handler = { path = "crates/engram-uffd-handler" }
engram-egress-proxy = { path = "crates/engram-egress-proxy" }
engram-crypto = { path = "crates/engram-crypto" }
engram-oci = { path = "crates/engram-oci" }
engram-oci-auth = { path = "crates/engram-oci-auth" }
engram-storage-local = { path = "crates/engram-storage-local" }
engram-storage-s3 = { path = "crates/engram-storage-s3" }
engram-storage-gcs = { path = "crates/engram-storage-gcs" }
engram-chunk-store = { path = "crates/engram-chunk-store" }
engram-telemetry = { path = "crates/engram-telemetry" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
# Lever 3 (ADR 0045 C2 restore tail): netlink-first netns provisioning —
# the ~14 ip/iptables subprocess spawns were ~90-95ms of every sandbox
# boot AND the teleport dest pipeline.
rtnetlink = "0.21"
bytes = "1"
pin-project-lite = "0.2"
base64 = "0.22"
# guest clock discipline — agentd steps CLOCK_REALTIME to the host KVM PTP
# clock (/dev/ptp0) after snapshot/restore. The clock layer behind ntpd-rs.
clock-steering = "0.2.1"

# wire codecs
bincode = "1.3"

# http / api
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
http = "1"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
# JWT / JWKS verification for the auth seam (ADR 0031): OIDC ID-token
# validation and the forward-auth signed-assertion (GCP IAP etc.) path.
jsonwebtoken = "9"

# grpc
tonic = "0.12"
tonic-build = "0.12"
# gRPC server reflection for the coordinator's network-private app-gRPC
# surface (grpcurl introspection). v0.12 matches the tonic 0.12 line.
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# cloud sdks (optional / per-crate)
# (Phase 4 retired the storage SDKs when durability moved to git;
#  ADR 0005 / Phase 6 reintroduces them — wired in Stage 4 of the
#  hot+cold snapshot pivot. The S3/GCS impl crates carry the SDK
#  deps directly so this section stays scoped to genuinely shared
#  pins.)

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
# OpenTelemetry distributed tracing (ADR 0019). Opt-in at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT; deps are compiled in but inert when unset.
# The 0.28 / tracing-opentelemetry 0.29 set is a known-compatible pairing
# and uses tonic 0.12 (matching our gRPC stack).
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.29"

# cli
clap = { version = "4", features = ["derive", "env"] }

# misc
tar = "0.4"
flate2 = "1"
# ADR 0055 P2: read user-uploaded .zip skill archives. Lean: deflate + store
# only (no bzip2/zstd/aes), and extraction is budgeted against zip bombs.
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
url = "2"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sha2 = "0.10"

# tls + cert mint (host-side egress proxy)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls-pemfile = "2"
tls-parser = "0.12"
nom = "7"
socket2 = "0.6"
# GraphQL request-body parsing for egress gating (ADR 0059). Strict,
# all-or-nothing parser (a clean typed AST or a hard error) — deliberately
# NOT an error-resilient parser, since a partial parse at a security gate is a
# smuggling vector. Used only by engram-egress-proxy.
async-graphql-parser = "7"

# DNS wire-format parsing (used by the egress proxy's udp/53 + tcp/53
# listeners to enforce allow_hosts on resolution, not just on
# connection). Just the proto layer — no server framework, no
# resolver.
hickory-proto = { version = "0.24", default-features = false, features = ["tokio-runtime"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Trim third-party debug info to line tables only. Our own crates keep
# full debug info (jump-to-def in IDEs, locals in lldb) — workspace
# members hit `[profile.dev]` directly, not this `package."*"`
# override. The win is on macOS link, where dsymutil chews through
# DWARF for serde/tokio/tonic/rustls/etc.; smaller `.o` files and a
# much faster link step on every incremental rebuild. On Linux it
# trims the embedded debug section but is a smaller relative win.
[profile.dev.package."*"]
debug = "line-tables-only"
