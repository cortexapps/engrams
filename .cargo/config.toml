# Cross-compile linkers for the musl-static targets baked into our
# microVM rootfs images. Both targets are built on macOS hosts via
# the `vz-bake-*` and `fc-bake-*` justfile recipes — without
# explicit linker mapping, cargo falls back to Apple's `cc` and
# trips on Linux ld flags (--as-needed, -Bstatic, etc.).
#
# Install the toolchains via:
#   brew install messense/macos-cross-toolchains/x86_64-unknown-linux-musl
#   brew install messense/macos-cross-toolchains/aarch64-unknown-linux-musl
#   # OR (formula `musl-cross` covers both with renaming):
#   brew install FiloSottile/musl-cross/musl-cross --with-aarch64
#
# The bare formula `musl-cross` installs `x86_64-linux-musl-gcc` and
# `aarch64-linux-musl-gcc` under /opt/homebrew/bin which is what
# this config expects.

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
# Force a fully static binary (no PT_INTERP). Rust's musl target
# defaults to PIE which embeds a dynamic-linker reference at
# `/lib/ld-musl-x86_64.so.1`; that path doesn't exist in our test
# rootfs (debian-slim ships glibc, not musl), so the kernel fails
# the exec with "not found" before init even starts.
# `relocation-model=static` drops the interpreter; combined with
# `crt-static` (the target's default since Rust 1.57) it produces a
# binary that runs in a vanilla rootfs. See rust-lang/rust#72703.
rustflags = ["-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "relocation-model=static"]

# Native Linux linker (mold) is NOT wired here — it's exported by
# `flake.nix` as `CARGO_TARGET_*_UNKNOWN_LINUX_GNU_{LINKER,RUSTFLAGS}`
# only when you're inside `nix develop` (or the dev-vm, which uses
# the same shell). Wiring it project-wide would break CI runners and
# out-of-Nix dev boxes that don't have mold/clang on PATH.
